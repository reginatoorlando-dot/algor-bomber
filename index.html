}

function HistoryRow({ m }) {
  const C = useContext(Ctx);
  const d = mDate(m);
  const cancelled = m.status === 'cancelled';
  const hasRes = !cancelled && Engine.hasResult(m);
  const mv = C.stats.mvps[m.id];
  const sA = hasRes ? scorersText(m, C, 'a').goals : '';
  const sB = hasRes ? scorersText(m, C, 'b').goals : '';
  const sub = cancelled ? 'Annullata' : [
    mv && mv.winners.length ? 'MVP ' + joinNames(mv.winners.map((id) => nameFor(id, m, C))) : mv && !mv.closed ? 'MVP: votazione in corso' : '',
    m.final && m.final.pred ? 'previsto ' + m.final.pred.balance + '%' : '',
  ].filter(Boolean).join(' · ');
  return html`<button class=${'hist' + (cancelled ? ' cancelled' : '')} onClick=${() => C.go({ t: 'match', id: m.id })}>
    <span class="hist-d"><b class="num">${d.getDate()}</b><span>${MON[d.getMonth()]}</span></span>
    <span class="row-main">
      <span class="row-t"><span class="ell">${(m.field || 'Campo da definire').replace(/^(Centro Sportivo|Campo) /, '')}</span><span class="m-fmt">a ${m.format}</span></span>
      ${(sA || sB) && html`<span class="row-s ell" style="display:block">${[sA, sB].filter(Boolean).join(' / ')}</span>`}
      <span class="row-s ell" style="display:block">${sub}</span>
    </span>
    ${hasRes ? html`<span class="hist-s num"><span class="ta-c">${m.result.a}</span><span class="x">–</span><span class="tb-c">${m.result.b}</span></span>`
      : html`<span class="chip ${cancelled ? 'bad' : 'warn'}">${cancelled ? 'Annullata' : 'Senza risultato'}</span>`}
  </button>`;
}

const METRICS = [
  { k: 'g', l: 'Gol', one: 'gol', many: 'gol' },
  { k: 'a', l: 'Assist', one: 'assist', many: 'assist' },
  { k: 'mvp', l: 'MVP', one: 'MVP', many: 'MVP' },
  { k: 'pres', l: 'Presenze', one: 'presenza', many: 'presenze' },
  { k: 'og', l: 'Autogol', one: 'autogol', many: 'autogol' },
];

function Leaderboard() {
  const C = useContext(Ctx);
  const [k, setK] = useState('g');
  const met = METRICS.find((x) => x.k === k);
  const rows = C.players
    .map((p) => ({ p, s: C.stats.byPlayer[p.id] }))
    .filter((x) => x.s && x.s[k] > 0)
    .sort((x, y) => y.s[k] - x.s[k] || x.s.pres - y.s.pres || dispName(x.p).localeCompare(dispName(y.p), 'it'));
  /* a pari merito stessa posizione */
  const posOf = [];
  let pos = 0, prev = null;
  rows.forEach((x, i) => { if (x.s[k] !== prev) { pos = i + 1; prev = x.s[k]; } posOf.push(pos); });
  const subOf = (x) => (k === 'pres'
    ? `vinte ${x.s.w}, pari ${x.s.d}, perse ${x.s.l}`
    : `in ${plural(x.s.pres, 'presenza', 'presenze')}${(k === 'g' || k === 'a') && x.s.pres ? ' · ' + f1(x.s[k] / x.s.pres) + ' a partita' : ''}`);
  /* podio: secondo, primo, terzo; il colore segue la posizione, l'altezza il gradino */
  const podium = rows.slice(0, 3).map((x, i) => ({ x, pos: posOf[i], slot: i }));
  const podOrder = podium.length === 3 ? [podium[1], podium[0], podium[2]] : podium.length === 2 ? [podium[1], podium[0]] : podium;
  const MEDAL = { 1: 'gold', 2: 'silver', 3: 'bronze' };
  return html`<div class="stack">
    <div class="seg-scroll"><${Seg} value=${k} onChange=${setK} options=${METRICS.map((x) => ({ v: x.k, l: x.l }))} /></div>
    ${rows.length ? html`<div class="card pad0">
      <div class=${'podium n' + podOrder.length}>${podOrder.map(({ x, pos: ps, slot }) => html`<button key=${x.p.id} type="button" class=${'pod s' + slot + ' ' + (MEDAL[ps] || 'bronze')} onClick=${() => C.go({ t: 'player', id: x.p.id })} aria-label=${ps + '° ' + dispName(x.p) + ', ' + plural(x.s[k], met.one, met.many)}>
        ${slot === 0 && html`<span class="pod-crown" aria-hidden="true">👑</span>`}
        <span class="pod-av"><${Avatar} p=${x.p} size=${slot === 0 ? 66 : 54} /></span>
        <span class="pod-n"><span class="ell">${dispName(x.p)}</span>${x.p.id === C.uid && html`<span class="chip ok">Tu</span>`}</span>
        <span class="pod-v num">${x.s[k]}<small>${x.s[k] === 1 ? met.one : met.many}</small></span>
        <span class="pod-b num">${ps}</span>
      </button>`)}</div>
      ${rows.slice(3).map((x, j) => {
        const i = j + 3, ps = posOf[i];
        return html`<button key=${x.p.id} class="lead" onClick=${() => C.go({ t: 'player', id: x.p.id })}>
          <span class=${'lead-pos' + (ps <= 3 ? ' p' + ps : '')}>${ps}</span>
          <${Avatar} p=${x.p} size=${36} />
          <span class="row-main"><span class="row-t"><span class="ell">${dispName(x.p)}</span><${InjuryMark} inj=${x.p.injury} s="14" />${x.p.id === C.uid && html`<span class="chip ok">Tu</span>`}</span><span class="row-s">${subOf(x)}</span></span>
          <span class="lead-v num">${x.s[k]}</span>
        </button>`;
      })}
    </div>` : html`<div class="card empty small">${k === 'og' ? 'Nessun autogol, per ora. Bravi.' : 'Ancora niente da mettere in classifica: servono partite chiuse con il risultato.'}</div>`}
    <div class="tiny faint">Contano le partite chiuse. Gol, assist e autogol solo dove sono stati inseriti; l'MVP quando la votazione è chiusa.</div>
  </div>`;
}

function StoricoScreen() {
  const C = useContext(Ctx);
  const [tab, setTab] = useState('list');
  const past = C.matches
    .filter((m) => { const p = phaseOf(m); return m.date && (p === 'played' || p === 'cancelled'); })

function MatchFormSheet({ editId, onClose }) {
  const C = useContext(Ctx);
  const ex = editId ? C.matchesById[editId] : null;
  const recent = C.matches.slice().sort((a, b) => numOr(b.created, 0) - numOr(a.created, 0));
  const lastM = recent[0];
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  const [date, setDate] = useState(ex ? ex.date : toYmd(tomorrow));
  const [time, setTime] = useState(ex ? ex.time : (lastM && lastM.time) || '21:00');
  const [field, setField] = useState(ex ? ex.field || '' : (lastM && lastM.field) || '');
  const [fid, setFid] = useState(ex ? ex.fid || '' : (lastM && lastM.fid) || '');
  const [adding, setAdding] = useState(false);
  const [nf, setNf] = useState({ name: '', zone: 'La Spezia', address: '', phone: '' });
  const [format, setFormat] = useState(ex ? ex.format : (lastM && lastM.format) || 7);
  const [note, setNote] = useState(ex ? ex.note || '' : '');
  const [join, setJoin] = useState(true);
  const [when, setWhen] = useState('date');
  const [days, setDays] = useState([]);
  const [teamMode, setTeamMode] = useState(ex ? ex.teamMode || null : 'auto');
  const [busy, setBusy] = useState(false);
  const poll = !ex && when === 'poll';
  const known = new Set(C.allFields.map((f) => f.name.toLowerCase()));
  const fields = [...new Set(recent.map((m) => m.field).filter((n) => n && !known.has(n.toLowerCase())))].slice(0, 4);
  const zones = [...FIELD_ZONES, ...new Set(C.allFields.map((f) => f.zone).filter((z) => z && !FIELD_ZONES.includes(z)))].filter((z) => C.allFields.some((f) => f.zone === z));
  const valid = poll ? days.length >= 2 : !!(date && time);
  const pick = (f) => { setField(f.name); setFid(f.id); };
  const addField = async () => {
    if (!nf.name.trim() || busy) return;
    const id = 'f_' + uid8();
    const rec = { name: nf.name.trim().slice(0, 60), zone: (nf.zone || '').trim().slice(0, 30) || 'Altro', area: '', address: nf.address.trim().slice(0, 100), phone: nf.phone.trim().slice(0, 25), by: C.uid, created: Date.now() };
    if (await C.act.saveField(id, rec)) { setField(rec.name); setFid(id); setAdding(false); setNf({ name: '', zone: nf.zone, address: '', phone: '' }); C.flash('Campo aggiunto per tutto il gruppo'); }
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!valid || busy) return;
    setBusy(true);
    if (ex) {
      const ok = await C.act.updateMatch(ex.id, Object.assign({ date, time, field: field.trim(), fid: fid || '', format, note: note.trim() }, teamMode ? { teamMode } : {}, teamMode && !ex.colors ? { colors: DEFAULT_COLORS } : {}));
      setBusy(false);
      if (ok) { C.flash('Partita aggiornata'); onClose(); }
    } else if (poll) {
      const mid = 'm_' + uid8();
      const doc = {
        status: 'poll', format, time: time || '', field: field.trim(), ...(fid ? { fid } : {}), note: note.trim(), by: C.uid, created: Date.now(),
        teamMode: teamMode || 'auto', colors: DEFAULT_COLORS,
        poll: { days: days.slice().sort(), need: FORMATS[format].cap, votes: {} },
        rsvp: {}, guests: {}, teams: { a: [], b: [], roles: {} },
      };
      const ok = await C.act.createMatch(doc, mid);
      setBusy(false);
      if (ok) { onClose(); C.go({ t: 'match', id: mid }); C.flash('Sondaggio creato: segna anche tu i giorni in cui sei libero'); }
    } else {
      const mid = 'm_' + uid8();
      const doc = {
        date, time, field: field.trim(), ...(fid ? { fid } : {}), format, note: note.trim(), status: 'open', by: C.uid, created: Date.now(),
        teamMode: teamMode || 'auto', colors: DEFAULT_COLORS,
        rsvp: join && C.me ? { [C.uid]: { s: 'in', t: Date.now() } } : {}, guests: {}, teams: { a: [], b: [], roles: {} },
      };
      const ok = await C.act.createMatch(doc, mid);
      setBusy(false);
      if (ok) { onClose(); C.go({ t: 'match', id: mid }); C.flash('Partita creata'); }
    }
  };

  const formatField = html`<div class="field">
        <span class="label">Formato</span>
        <${Seg} value=${format} onChange=${setFormat} options=${[{ v: 5, l: 'Calcio a 5' }, { v: 7, l: 'Calcio a 7' }, { v: 8, l: 'Calcio a 8' }]} />
        <div class="tiny faint">${FORMATS[format].cap} giocatori: ${format} contro ${format}. Moduli: ${Engine.MODULES[format].map((x) => Engine.moduleLabel(x)).join(', ')}. Gli iscritti oltre il numero finiscono in lista d'attesa.</div>
      </div>`;
  return html`<${Sheet} title=${ex ? 'Modifica partita' : poll ? 'Nuovo sondaggio' : 'Nuova partita'} onClose=${onClose}>
    <form class="stack" onSubmit=${submit}>
      ${!ex && formatField}
      ${!ex && html`<div class="field">
        <span class="label">Quando</span>
        <${Seg} value=${when} onChange=${setWhen} options=${[{ v: 'date', l: 'Giorno fisso' }, { v: 'poll', l: 'Sondaggio sul giorno' }]} />
      </div>`}
      ${poll ? html`<div class="field">
        <span class="label">Giorni possibili <span class="faint">(almeno 2)</span></span>
        <${PollDaysPicker} days=${days} setDays=${setDays} />
        <div class="tiny faint">Tutti i membri del gruppo segnano i giorni in cui sono liberi. Si gioca il primo giorno che arriva a ${FORMATS[format].cap}: la partita nasce da sola, con chi l'ha votato.</div>
      </div>
      <div class="field"><label class="label" for="mf-time">Ora <span class="faint">(facoltativa: puoi deciderla dopo)</span></label><input id="mf-time" class="input" type="time" value=${time} onInput=${(e) => setTime(e.target.value)} /></div>`
      : html`<div class="grid2 keep">
        <div class="field"><label class="label" for="mf-date">Giorno</label><input id="mf-date" class="input" type="date" value=${date} onInput=${(e) => setDate(e.target.value)} /></div>
        <div class="field"><label class="label" for="mf-time">Ora</label><input id="mf-time" class="input" type="time" value=${time} onInput=${(e) => setTime(e.target.value)} /></div>
      </div>`}
      <div class="field">
        <label class="label" for="mf-field">Campo${poll ? html` <span class="faint">(facoltativo)</span>` : ''}</label>
        <input id="mf-field" class="input" value=${field} maxlength="60" placeholder="Scegli un campo o scrivi il nome" onInput=${(e) => { setField(e.target.value); setFid(''); }} />
        ${zones.map((z) => html`<div key=${z} class="fz"><div class="tiny faint fz-t">${z}</div><div class="hs wrap">${C.allFields.filter((f) => f.zone === z).map((f) => html`<button key=${f.id} type="button" class=${'chip' + (f.id === fid ? ' ok' : '')} style="border:0;cursor:pointer" onClick=${() => pick(f)}>${f.name.replace(/^(Centro Sportivo|Campo) /, '')}</button>`)}</div></div>`)}
        ${fields.length > 0 && html`<div class="fz-t tiny faint" style="margin-top:4px">USATI DI RECENTE</div><div class="hs wrap">${fields.map((f) => html`<button key=${f} type="button" class=${'chip' + (f === field && !fid ? ' ok' : '')} style="border:0;cursor:pointer" onClick=${() => { setField(f); setFid(''); }}>${f}</button>`)}</div>`}
        <button type="button" class="link" style="align-self:flex-start" onClick=${() => setAdding(!adding)}>${adding ? 'Annulla' : '+ Aggiungi un campo alla lista'}</button>
        ${adding && html`<div class="card stack-8">
          <input class="input" id="nf-name" aria-label="Nome del campo" placeholder="Nome del campo" maxlength="60" value=${nf.name} onInput=${(e) => setNf({ ...nf, name: e.target.value })} />
          <input class="input" id="nf-zone" aria-label="Zona" list="zone-list" placeholder="Zona (es. La Spezia, Sarzana)" maxlength="30" value=${nf.zone} onInput=${(e) => setNf({ ...nf, zone: e.target.value })} />
          <datalist id="zone-list">${zones.map((z) => html`<option key=${z} value=${z}></option>`)}</datalist>
          <input class="input" id="nf-address" aria-label="Indirizzo" placeholder="Indirizzo (facoltativo)" maxlength="100" value=${nf.address} onInput=${(e) => setNf({ ...nf, address: e.target.value })} />
          <input class="input" id="nf-phone" aria-label="Telefono" type="tel" placeholder="Telefono (facoltativo)" maxlength="25" value=${nf.phone} onInput=${(e) => setNf({ ...nf, phone: e.target.value })} />
          <button type="button" class="btn accent sm" disabled=${!nf.name.trim()} onClick=${addField}>Salva campo per tutti</button>
        </div>`}
      </div>
      ${ex && formatField}
      <div class="field">
        <span class="label">Squadre</span>
        <${Seg} value=${teamMode} onChange=${setTeamMode} options=${[{ v: 'auto', l: 'Automatiche' }, { v: 'pick', l: 'Scelte dai giocatori' }]} />
        <div class="tiny faint">${teamMode === 'pick' ? 'Ognuno, quando si iscrive, sceglie in quale squadra giocare (Bianchi o Neri: i colori si cambiano dopo). L\'app mostra la forza delle squadre e propone i ruoli.' : teamMode === 'auto' ? 'L\'app fa le squadre appena la partita è piena e le rifà da sola se qualcuno entra o esce, finché qualcuno non le cambia a mano.' : 'Scegli come fare le squadre.'}</div>
      </div>
      <div class="field"><label class="label" for="mf-note">Nota <span class="faint">(facoltativa)</span></label><textarea id="mf-note" class="input" rows="2" maxlength="200" placeholder="Es. portate maglia chiara e scura" value=${note} onInput=${(e) => setNote(e.target.value)}></textarea></div>
      ${!ex && !poll && C.me && html`<label class="hs" style="gap:10px;cursor:pointer"><input id="mf-join" type="checkbox" checked=${join} onChange=${(e) => setJoin(e.target.checked)} style="width:18px;height:18px;accent-color:var(--accent)" /><span>Ci sono anch'io</span></label>`}
      <button class="btn primary block" type="submit" disabled=${!valid || busy}>${busy ? 'Salvo…' : ex ? 'Salva modifiche' : poll ? 'Crea il sondaggio' : 'Crea partita'}</button>
      ${poll && days.length < 2 && html`<div class="tiny faint" style="text-align:center">Scegli almeno 2 giorni.</div>`}
    </form>
  <//>`;
}

  return html`<${Sheet} title=${x.name} onClose=${onClose}>
    <div class="hs-12"><${Avatar} p=${x.guest ? { name: x.name } : x.p} guest=${x.guest} size=${52} />
      <div class="grow"><div class="row-t"><span class="ell">${x.full}</span><${InjuryMark} inj=${x.inj} /></div>

      <${Ovr} v=${x.ovr} /></div>

    <${InjuryCard} inj=${x.inj} />

      <${Seg} value=${x.side || null} onChange=${(sd) => (x.guest ? C.act.setGuestSide(mid, id, sd) : C.act.setSide(mid, id, sd))} options=${[{ v: 'a', l: teamName(m, 'a') }, { v: 'b', l: teamName(m, 'b') }]} /></div>`}
    ${!x.guest && canAct && html`<div class="field"><span class="label">Presenza</span>
      <${Seg} cls="rsvp" value=${x.s} onChange=${(s) => C.act.setRsvp(mid, id, s)} options=${[{ v: 'in', l: 'Ci sono', cls: 'in' }, { v: 'maybe', l: 'Forse', cls: 'maybe' }, { v: 'out', l: 'Non viene', cls: 'out' }]} /></div>`}
    ${!x.guest && html`<button class="btn block" onClick=${() => { onClose(); C.go({ t: 'player', id }); }}>Vedi scheda giocatore</button>`}

function ConfirmSheet({ sheet, onClose }) {

function MatchMenuSheet({ id, onClose }) {
  const C = useContext(Ctx);
  const m = C.matchesById[id];
  if (!m) return null;
  const phase = phaseOf(m);
  const editPlayed = phase === 'played' && canEditPlayed(m, C);
  const item = (icon, label, fn, cls) => html`<button class=${'btn block ' + (cls || '')} style="justify-content:flex-start" onClick=${fn}><${Icon} n=${icon} s="16" /> ${label}</button>`;
  return html`<${Sheet} title="Partita" onClose=${onClose}>
    <div class="stack-8">
      ${(phase === 'upcoming' || phase === 'toclose') && item('edit', 'Modifica giorno, ora e campo', () => C.openSheet({ k: 'editMatch', id }))}
      ${(phase === 'upcoming' || phase === 'toclose') && item('x', 'Annulla la partita', () => C.openSheet({ k: 'confirm', title: 'Annullare la partita?', text: 'Resterà nello storico come annullata e nessuno potrà più rispondere.', label: 'Annulla partita', danger: true, onYes: () => C.act.setStatus(id, 'cancelled') }), 'danger')}
      ${phase === 'cancelled' && item('check', 'Riapri la partita', () => { C.act.setStatus(id, 'open'); onClose(); })}

      ${editPlayed && item('clock', 'Riapri la partita (annulla la chiusura)', () => C.openSheet({ k: 'confirm', title: 'Riaprire la partita?', text: 'Risultato e voti MVP restano salvati ma non contano finché non la chiudi di nuovo. Alla nuova chiusura il voto MVP riparte per 24 ore.', label: 'Riapri', onYes: () => C.act.setStatus(id, 'open') }))}
      ${phase === 'played' && !editPlayed && html`<div class="note"><${Icon} n="lock" s="16" /><span>La partita successiva è già iniziata: le correzioni le fanno solo gli amministratori.</span></div>`}
      ${C.isAdmin && item('x', 'Elimina la partita (amministrazione)', () => C.openSheet({ k: 'confirm', title: 'Eliminare la partita?', danger: true, label: 'Elimina per sempre', text: 'La partita sparisce per tutti, con risultato, marcatori e voti MVP. Le classifiche si aggiornano.', onYes: async () => { if (await C.act.deleteMatch(id)) { C.flash('Partita eliminata'); C.goTab('matches'); } } }), 'danger')}

function RatingDetailSheet({ pid, voter, self, onClose }) {
  const C = useContext(Ctx);
  const p = C.playersById[pid], vp = C.playersById[voter];
  const r = C.rated[pid];
  let v = null, t = 0;
  if (self) { v = r && r.self; t = numOr(p && p.selfAt, 0); }
  else { const e = ((C.ratings.find((x) => x.id === voter) || {}).r || {})[pid]; v = e && Engine.cleanVoci(e.v); t = numOr(e && e.t, 0); }
  if (!p || !v) return null;
  const areas = Engine.areasOf(v);
  /* voci arrivate dopo questo voto: nei conti valgono la media delle voci da cui nascono */
  const late = Engine.LATE_VOCI.filter((x) => !Engine.okv(v[x.k]) && areas[x.area] != null);
  return html`<${Sheet} title=${self ? 'Autovalutazione di ' + dispName(p) : (vp ? dispName(vp) : 'Ex giocatore') + ' su ' + dispName(p)} onClose=${onClose}>
    <div class="small muted">${t ? 'Del ' + fmtTs(t) + '. ' : ''}${self ? 'Conta come una valutazione qualsiasi nella media.' : 'Le valutazioni sono pubbliche.'}</div>
    <div class="card pad0 divided">
      ${AREAS.map((a) => html`<div key=${a.k} class="area-d" style="padding:12px 14px">
        <div class="area-dh"><span class="area-n">${a.name}</span><span class="grow"></span>${areas[a.k] == null ? html`<span class="small faint">non valutata</span>` : html`<${Ovr} v=${areas[a.k]} size="sm" />`}</div>
        ${areas[a.k] != null && a.voci.map((x) => html`<div key=${x.k} class="vb"><span class="vb-n">${x.name}</span><span class="vb-bar"><i style=${'width:' + (v[x.k] || 0) + '%'}></i></span><span class="vb-v num">${Engine.okv(v[x.k]) ? v[x.k] : '–'}</span></div>`)}
      </div>`)}
    </div>
    ${late.length > 0 && html`<div class="tiny faint">${late.map((x) => x.name + ' è arrivata dopo questo voto: nei conti vale la media di ' + joinE(vociNames(x.from)) + '.').join(' ')}</div>`}
  <//>`;
}

function HelpSheet({ onClose }) {
  return html`<${Sheet} title="Come funziona" onClose=${onClose}>
    <div class="stack">
      <div><h3 class="h3">Le stats</h3><p class="muted">Ogni giocatore ha ${VOCI.length} voci da 1 a 99, divise in ${AREAS.length} aree: ${joinE(AREAS.map((a) => a.name + ' (' + a.voci.map((x) => x.name.toLowerCase()).join(', ') + ')'))}. Riferimenti: ${SCALE_HINT}.</p></div>
      <div><h3 class="h3">Da dove vengono i numeri</h3><p class="muted">Ogni voce è la media di tutte le valutazioni ricevute, autovalutazione compresa: la tua conta come quella di chiunque altro. Ogni area è la media delle sue voci. L'autovalutazione si fa una volta sola, all'iscrizione; le valutazioni agli altri invece le dai e le cambi quando vuoi, e conta l'ultima. Se un'area non la sai giudicare, la salti.</p></div>
      <div><h3 class="h3">Il punteggio</h3><p class="muted">Per chi gioca fuori dai pali è la media di Attacco, Centrocampo, Difesa e Generale: la Porta non conta. Per i portieri conta solo la Porta. Il colore della card segue il punteggio: bronzo sotto 65, argento da 65 a 74, oro da 75.</p></div>
      <div><h3 class="h3">Squadre e ruoli</h3><p class="muted">I ruoli li assegna l'app, insieme alle squadre. Prova tutte le divisioni possibili e per ogni squadra sceglie il modulo che le va meglio (a 5: 1-1-2-1, 1-2-1-1, 1-2-2; a 7: 1-2-3-1, 1-3-1-2, 1-3-2-1, dove 1-2-1-2-1 conta come 1-2-3-1; a 8: 1-3-3-1, 1-2-3-2, 1-3-2-2, 1-2-4-1). Nel tuo ruolo o nel secondo vali il tuo punteggio. In un ruolo vicino (difesa e centrocampo, centrocampo e attacco) vali ${CFG.MALUS_NEAR} punti in meno, in un ruolo lontano (difesa e attacco) ${CFG.MALUS_FAR} in meno. Se vai in porta senza essere portiere conta la tua Porta; un portiere fuori dai pali vale la media delle sue aree di movimento. Con il cerotto conti ${CFG.INJ_LIGHT} punti in meno, con la croce rossa ${CFG.INJ_BAD}. L'app cerca le squadre più vicine nel valore medio e area per area, tenendo fuori ruolo meno gente possibile. Puoi sempre cambiare ruoli e giocatori a mano.</p></div>
      <div><h3 class="h3">Sondaggio sul giorno</h3><p class="muted">Se il giorno non è fissato, chi crea la partita propone qualche giorno e ognuno segna, col cerchio, tutti quelli in cui è libero. Il primo giorno che arriva al numero per due squadre piene fa nascere la partita da sola, con chi l'ha votato. Toccando un giorno vedi chi l'ha votato, in ordine di voto e con l'ora; quando la partita è fissata, nei suoi Dettagli resta «Com'è andato il sondaggio».</p></div>
      <div><h3 class="h3">Dopo la partita</h3><p class="muted">Chiunque può scrivere il risultato; marcatori, assist e autogol sono facoltativi. Tutti possono correggere fino all'inizio della partita successiva, poi solo gli amministratori del gruppo e dell'app. Chi ha giocato vota l'MVP: un voto, per chiunque tranne sé stesso, entro 24 ore. Il premio non tocca le stats. Poi l'app ti propone di aggiornare le valutazioni dei compagni, anche più tardi.</p></div>
      <div><h3 class="h3">Gruppi e stats generali</h3><p class="muted">Partite, storico, messaggi e valutazioni sono di ogni gruppo. Puoi stare in più gruppi: cambi gruppo toccando il suo nome in alto. Nella scheda Giocatori vedi i membri del gruppo oppure tutti gli iscritti all'app. Le stats nel gruppo sono la media delle valutazioni date in quel gruppo; le stats generali sono la media di tutte le valutazioni ricevute in tutti i gruppi, autovalutazione compresa.</p></div>
      <div><h3 class="h3">Affinità</h3><p class="muted">Più partite due giocatori vincono (o pareggiano) nella stessa squadra, più cresce la loro affinità, piano piano: una vittoria vale 1, un pareggio mezzo, le sconfitte non tolgono niente. Si arriva a circa 28 dopo 10 partite positive insieme, 57 dopo 25, 81 dopo 50 (massimo 100). Una squadra di compagni affiatati prende fino a +${Engine.AFF_BONUS} punti sul valore medio, e l'app ne tiene conto quando fa le squadre.</p></div>
      <div><h3 class="h3">Traguardi e card</h3><p class="muted">Giocando si sbloccano gli stemmi (prima tripletta, 10 presenze, primo MVP, porta inviolata…), uno per ogni traguardo. Nel profilo di ciascuno si vedono i nuovi e i più importanti; con "Vedi tutti" ci sono tutti, divisi per tipo. Nella vista "Nel gruppo" contano le partite del gruppo; in "Generali", e per chi non è nel tuo gruppo, tutte le partite in tutti i gruppi. Toccando il numero grande della card si apre la card a tutto schermo; toccandola si gira e mostra le ${VOCI.length} voci. La tua la puoi condividere come immagine.</p></div>
      <div><h3 class="h3">Locandina e risultato</h3><p class="muted">Nella scheda Campo di una partita c'è la locandina da mandare nel gruppo: giorno, campo e formazioni con i colori delle maglie. Dopo la partita, dai Dettagli si condivide il risultato con marcatori e MVP. Ci sono solo i soprannomi, senza foto.</p></div>
      <div><h3 class="h3">Numero di maglia</h3><p class="muted">Lo scegli in Modifica profilo, da 1 a 99: si vede sulla card, sul campo e nelle squadre.</p></div>
      <div><h3 class="h3">Addobbi delle feste</h3><p class="muted">Nei giorni di festa l'app si addobba: Halloween, la neve dall'8 dicembre al 6 gennaio, Natale, Capodanno, Befana, Carnevale, San Valentino, Pasqua e Pasquetta, Ferragosto. Il disegno accanto al titolo, se lo tocchi, rifà l'effetto. Si spengono in Impostazioni.</p></div>
      <div><h3 class="h3">Messaggi</h3><p class="muted">Nella scheda Messaggi ci sono la chat di ogni tuo gruppo e le chat private con i compagni di gruppo e gli amici: le private le leggete solo voi due. Puoi mandare foto, GIF e sticker, emoji e vocali (tieni premuto il microfono; scorri a sinistra per annullare, in su per continuare senza tenere). Tieni premuto un messaggio per reagire, rispondere, copiarlo, inoltrarlo in un'altra chat, modificarlo nei primi 15 minuti o eliminarlo; trascinalo verso destra per rispondere al volo. Con @ chiami qualcuno del gruppo. Una spunta: inviato; due grigie: arrivato; due blu: letto da tutti (tenendo premuto un tuo messaggio, Info dice chi l'ha letto). Le notifiche si attivano da Impostazioni; una chat si silenzia toccando il suo nome in alto.</p></div>
      <div><h3 class="h3">Amici</h3><p class="muted">Chiedi l'amicizia dalla scheda di un giocatore: diventate amici quando l'altro accetta. Gli amici compaiono per primi nelle ricerche e puoi invitarli alle partite del tuo gruppo.</p></div>
      <div><h3 class="h3">Voti pubblici</h3><p class="muted">Dentro il gruppo valutazioni e voti MVP non sono anonimi: i membri vedono chi ha votato cosa. I voti MVP si vedono quando la votazione si chiude. Nelle stats generali, invece, non si vede chi ha dato i voti.</p></div>
    </div>
  <//>`;
}

const GLOBAL_COLS = ['players', 'groups', 'members', 'fields', 'help', 'friends'];
const GROUP_COLS = ['matches', 'ratings', 'mvp'];
const EMPTY_GLOBAL = { players: null, groups: null, members: null, fields: [], help: [], friends: [] };
const EMPTY_GROUP = { matches: null, ratings: null, mvp: null };

function App() {
  const [real, setReal] = useState({ status: 'loading', be: null });
  const [demoBe, setDemoBe] = useState(null);
  const [deniedBe, setDeniedBe] = useState(null);
  const [gdata, setGdata] = useState(EMPTY_GLOBAL);
  const [data, setData] = useState(EMPTY_GROUP);
  const [gid, setGid] = useState(null);
  const [tab, setTab] = useState('matches');
  const [stack, setStack] = useState([]);
  const scrollMem = useRef([]);
  const restoreY = useRef(null);
  preactHooks.useLayoutEffect(() => {
    if (restoreY.current == null) return;
    const y = restoreY.current;
    restoreY.current = null;
    window.scrollTo(0, y);
  }, [stack]);
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState(null);
  const [tick, setTick] = useState(0);
  const [theme, setThemeS] = useState(() => readLS('sc-theme', 'auto'));
  const [readMark, setReadMark] = useState(0);
  const [inbox, setInbox] = useState(null);
  const inboxSeq = useRef(0);
  const [gvotes, setGvotes] = useState(null);
  const gvotesAt = useRef(0);
  const dataRef = useRef(data);
  dataRef.current = data;
  const gidRef = useRef(gid);
  gidRef.current = gid;
  const toastT = useRef(0);

  const flash = (text, kind) => {
    setToast({ text, kind });
    clearTimeout(toastT.current);
    toastT.current = setTimeout(() => setToast(null), 3200);
  };

  const be = demoBe || real.be;
  const status = demoBe ? 'ready' : real.status;
  useEffect(() => { applyTheme(theme); }, [theme]);
  const setTheme = (t) => { setThemeS(t); writeLS('sc-theme', t === 'auto' ? null : t); };
  /* addobbi delle feste: si spengono in Impostazioni (vale per questo telefono) */
  const [feste, setFesteS] = useState(() => readLS('sc-feste', 'on'));
  const setFeste = (v) => { setFesteS(v); writeLS('sc-feste', v === 'off' ? 'off' : null); };
  const festa = feste === 'off' ? null : Feste.on(new Date());

  /* ogni minuto: chiusura dei voti MVP e scadenze senza bisogno di ricaricare */
  useEffect(() => {
    const t = setInterval(() => setTick((x) => x + 1), 60000);
    return () => clearInterval(t);
  }, []);

  /* ---- avvio: db condiviso + identità + amministratore ---- */
  useEffect(() => {
    let dead = false;
    (async () => {
      try {
        if (!(window.claude && typeof window.claude.use === 'function')) { setReal({ status: 'nodb', be: null }); return; }
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (dead) return;
        if (!db) { setReal({ status: 'nodb', be: null }); return; }
        const realId = user ? await user.id() : null;
        const cw = user ? await user.can('data.write') : null;
        let owner = false;
        try { owner = user && typeof user.isOwner === 'function' ? !!(await user.isOwner()) : false; } catch (e) { owner = false; }
        if (dead) return;
        /* senza id dalla piattaforma (alcuni ospiti) si usa un'identità salvata in questo browser */
        const uid = realId || localIdentity();
        setReal({ status: 'ready', be: { db, uid, canWrite: cw !== false, demo: false, local: !realId, admin: owner } });
      } catch (e) {
        if (!dead) setReal({ status: 'nodb', be: null });
      }
    })();
    return () => { dead = true; };
  }, []);

  const subscribe = (key, cpath, set, opts) => be.db.collection(cpath, opts).onSnapshot(
    (snap) => set((d) => ({ ...d, [key]: snap.docs.map((x) => Object.assign({ id: x.id }, x.data())) })),
    (err) => {
      if (err && err.code === 'revoked') setReal({ status: 'revoked', be: null });
      else flash('Collegamento ai dati interrotto. Ricarica la pagina.', 'err');
      set((d) => (d[key] ? d : { ...d, [key]: [] }));
    }
  );

  /* ---- dati di tutti: profili, gruppi, iscrizioni ai gruppi, campi, help ---- */
  useEffect(() => {
    if (!be) return;
    setGdata(EMPTY_GLOBAL);
    setGvotes(null);
    gvotesAt.current = 0;
    setGid(be.demo ? Demo.GID : readLS('sc-group-' + be.uid, null));
    const unsubs = [];
    GLOBAL_COLS.forEach((key) => {
      try { unsubs.push(subscribe(key, key, setGdata)); } catch (e) { setGdata((d) => ({ ...d, [key]: [] })); }
    });
    return () => unsubs.forEach((u) => { try { u(); } catch (e) { /* già chiusa */ } });
  }, [be]);

  const uid = be ? be.uid : null;
  const members = (gdata.members || []).map((m) => Object.assign({ gid: m.gid || m.id.split('~')[0], uid: m.uid || m.id.split('~')[1] }, m));
  const memberById = useMemo(() => Object.fromEntries(members.map((m) => [m.id, m])), [gdata.members]);
  const groupsById = useMemo(() => Object.fromEntries((gdata.groups || []).map((g) => [g.id, g])), [gdata.groups]);
  const myGroups = members.filter((m) => m.uid === uid && m.status === 'active' && groupsById[m.gid]).map((m) => groupsById[m.gid])
    .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'it'));
  const globalsLoaded = !!(gdata.players && gdata.groups && gdata.members);
  const validGid = gid && myGroups.some((g) => g.id === gid) ? gid : null;

  /* se il gruppo scelto non è più tra i miei, passo al primo disponibile */
  useEffect(() => {
    if (!be || !globalsLoaded) return;
    if (!validGid && myGroups.length) setGid(myGroups[0].id);
  }, [be, globalsLoaded, validGid, myGroups.length]);
  useEffect(() => { if (be && !be.demo && validGid) writeLS('sc-group-' + be.uid, validGid); }, [be, validGid]);

  /* ---- dati del gruppo attuale: partite, valutazioni, voti MVP, chat ---- */
  useEffect(() => {
    if (!be || !validGid) { setData(EMPTY_GROUP); return; }
    setData(EMPTY_GROUP);
    const unsubs = [];
    GROUP_COLS.forEach((key) => {
      try { unsubs.push(subscribe(key, 'g/' + validGid + '/' + key, setData)); }
      catch (e) { setData((d) => ({ ...d, [key]: [] })); }
    });
    return () => unsubs.forEach((u) => { try { u(); } catch (e) { /* già chiusa */ } });
  }, [be, validGid]);

  const act = useMemo(() => (be ? makeActions(be, flash, dataRef, () => setDeniedBe(be), gidRef) : null), [be]);
  const canWrite = !!(be && be.canWrite) && deniedBe !== be;
  const groupLoaded = !validGid || !!(data.matches && data.ratings && data.mvp);
  const loaded = globalsLoaded && groupLoaded;
  const allPlayers = gdata.players || [];
  const inGroup = useMemo(() => new Set(members.filter((m) => m.gid === validGid && m.status === 'active').map((m) => m.uid)), [gdata.members, validGid]);
  const players = useMemo(() => allPlayers.filter((p) => inGroup.has(p.id)), [gdata.players, inGroup]);
  const allFields = useMemo(() => FIELDS_SEED.concat((gdata.fields || []).filter((f) => f && f.name).map((f) => Object.assign({ custom: true }, f))), [gdata.fields]);
  const matches = data.matches || [];
  const playersById = useMemo(() => Object.fromEntries(allPlayers.map((p) => [p.id, p])), [gdata.players]);
  const matchesById = useMemo(() => Object.fromEntries(matches.map((m) => [m.id, m])), [data.matches]);
  const rated = useMemo(() => Engine.computeRatings(allPlayers, data.ratings || []), [gdata.players, data.ratings]);

  /* stats generali: i voti di tutti i gruppi, senza chi li ha dati (finché non arrivano, quelli del gruppo attuale) */
  const loadGlobal = async (force) => {
    if (!be || !be.db || typeof be.db.rpc !== 'function') return;
    if (!force && Date.now() - gvotesAt.current < 20000) return;
    gvotesAt.current = Date.now();
    const db0 = be.db;
    try {
      const rows = await db0.rpc('global_votes');
      if (be && be.db === db0) setGvotes(Array.isArray(rows) ? rows : []);
    } catch (e) { /* funzione non ancora nel database: restano le stats del gruppo */ }
  };
  useEffect(() => { if (be && globalsLoaded) loadGlobal(true); }, [be, globalsLoaded, data.ratings]);
  const globalDocs = useMemo(() => (gvotes ? gvotes.map((x, i) => ({ id: '~' + i, r: { [x.target]: x.vote } })) : (data.ratings || [])), [gvotes, data.ratings]);
  const ratedAll = useMemo(() => Engine.computeRatings(allPlayers, globalDocs), [gdata.players, globalDocs]);
  const stats = useMemo(() => Engine.matchStats(players, matches, data.mvp || [], Date.now()), [players, data.matches, data.mvp, tick]);
  /* affinità tra compagni: dalle partite giocate in questo gruppo */
  const aff = useMemo(() => Engine.affinityFrom(matches), [data.matches]);
  /* amicizie: le vedono solo i due interessati */
  const friendOf = useMemo(() => friendsIndex(gdata.friends, uid), [gdata.friends, be]);
  const friendReqs = Object.keys(friendOf).filter((id) => friendOf[id] === 'received' && playersById[id]).length;
  const me = uid ? playersById[uid] : null;
  const group = validGid ? groupsById[validGid] : null;
  const myMember = validGid ? memberById[validGid + '~' + uid] : null;
  const isAdmin = !!(be && be.admin);
  const isGroupAdmin = !!(myMember && myMember.status === 'active' && myMember.role === 'admin');

  /* chat: i gruppi e le chat private, con l'ultimo messaggio e i non letti (dal database, per tutte le chat) */
  const loadInbox = async () => {
    if (!be || !be.db || typeof be.db.rpc !== 'function') return;
    const db0 = be.db, my = ++inboxSeq.current;
    try {
      const rows = await db0.rpc('chat_inbox');
      if (!be || be.db !== db0 || my !== inboxSeq.current) return;
      const list = Array.isArray(rows) ? rows : [];
      setInbox(list);
      /* arrivati sul telefono: le due spunte grigie per chi li ha mandati */
      const marks = list.filter((x) => x.last && x.last.by !== uid && !x.last.del && numOr(x.last.t, 0) > Math.max(numOr(x.d, 0), numOr(x.r, 0))).map((x) => ({ c: x.chat, d: numOr(x.last.t, 0) }));
      /* una volta sola: le letture che questo telefono teneva per conto suo */
      const mk = 'sc-read-moved-' + uid;
      if (!readLS(mk, '')) {
        list.forEach((x) => { if (!isDm(x.chat) && !numOr(x.r, 0)) { const old = Number(readLS('sc-read-' + uid + '-' + x.chat, 0)) || 0; if (old) marks.push({ c: x.chat, r: old, d: old }); } });
        writeLS(mk, '1');
      }
      if (marks.length) db0.rpc('chat_seen', { p_marks: marks }).then(() => { if (marks.some((x) => x.r)) loadInbox(); }, () => {});
    } catch (e) {
      if (my === inboxSeq.current) setInbox(e && e.code === 'unavailable' && /database/i.test((e && e.message) || '') ? false : (x) => (x === null ? [] : x));
    }
  };
  const inboxT = useRef(0);
  const refreshInbox = () => { clearTimeout(inboxT.current); inboxT.current = setTimeout(loadInbox, 700); };
  useEffect(() => {
    if (!be || !globalsLoaded) return;
    loadInbox();
    let off = () => {};
    try { if (be.db.feed) off = be.db.feed('chat', refreshInbox); } catch (e) { /* senza tempo reale: si aggiorna aprendo l'app */ }
    const vis = () => { if (document.visibilityState === 'visible') refreshInbox(); };
    document.addEventListener('visibilitychange', vis);
    Push.sync(be);
    return () => { off(); document.removeEventListener('visibilitychange', vis); clearTimeout(inboxT.current); };
  }, [be, globalsLoaded]);
  const chatReady = inbox === null ? null : inbox !== false;
  const markChatRead = (id) => setInbox((l) => (Array.isArray(l) && l.some((x) => x.chat === id && x.unread) ? l.map((x) => (x.chat === id ? Object.assign({}, x, { unread: 0 }) : x)) : l));
  const chatRows = useMemo(() => {
    const ib = new Map((Array.isArray(inbox) ? inbox : []).map((x) => [x.chat, x]));
    const rows = myGroups.map((g) => {
      const x = ib.get(g.id);
      return { id: g.id, dm: false, g, last: x ? x.last : null, unread: x ? numOr(x.unread, 0) : 0, mute: !!(x && x.mute), lt: x && x.lt, r: x ? numOr(x.r, 0) : 0, t: x && x.last ? numOr(x.last.t, 0) : numOr(g.created, 0) };
    });
    ib.forEach((x) => {
      if (!isDm(x.chat) || !x.last) return;
      const o = dmOther(x.chat, uid);
      rows.push({ id: x.chat, dm: true, other: o, p: playersById[o] || null, last: x.last, unread: numOr(x.unread, 0), mute: !!x.mute, lt: x.lt, r: numOr(x.r, 0), t: numOr(x.last.t, 0) });
    });
    return rows.sort((a, b) => b.t - a.t);
  }, [inbox, gdata.groups, gdata.members, gdata.players, uid]);
  const unread = chatRows.filter((r) => !r.mute).reduce((n, r) => n + r.unread, 0);
  /* il numerino sull'icona dell'app; il service worker lo aumenta a ogni notifica ad app chiusa */
  useEffect(() => {
    if (inbox === null) return;
    try { if (navigator.setAppBadge) { if (unread) navigator.setAppBadge(unread); else navigator.clearAppBadge(); } } catch (e) { /* non supportato */ }
    try { if (window.caches) caches.open('ab-state').then((c) => c.put(new URL('__badge', location.href).href, new Response(String(unread)))).catch(() => {}); } catch (e) { /* non supportato */ }
  }, [unread, inbox === null]);
  /* scrivere in privato: ai compagni di uno stesso gruppo e agli amici */
  const sharedGroup = (pid) => members.some((m) => m.uid === pid && m.status === 'active' && myGroups.some((g) => g.id === m.gid));
  const canDm = (pid) => !!pid && pid !== uid && !!playersById[pid] && (friendOf[pid] === 'friend' || sharedGroup(pid));
  const dmPeople = () => allPlayers.filter((p) => canDm(p.id)).sort((a, b) => (friendOf[b.id] === 'friend') - (friendOf[a.id] === 'friend') || dispName(a).localeCompare(dispName(b), 'it'));
  const openChat = (id) => {
    if (!id) return;
    scrollMem.current[stack.length] = window.scrollY;
    setStack((st) => { const top0 = st[st.length - 1]; if (top0 && top0.t === 'chat' && top0.id === id) return st; return [...st.filter((x) => !(x.t === 'chat' && x.id === id) && x.t !== 'chatInfo'), { t: 'chat', id }]; });
  };
  const help = gdata.help || [];
  const helpSeenKey = 'sc-help-' + (uid || '');
  const helpSeen = useMemo(() => Number(readLS(helpSeenKey, 0)) || 0, [helpSeenKey, readMark]);
  const lastReplyT = (h) => (Array.isArray(h.replies) && h.replies.length ? h.replies[h.replies.length - 1].t : 0);
  const helpReplies = help.filter((h) => h.by === uid && lastReplyT(h) > helpSeen).length;
  const markHelpSeen = () => { const t = Math.max(0, ...help.filter((h) => h.by === uid).map(lastReplyT)); if (t > helpSeen) { writeLS(helpSeenKey, String(t)); setReadMark((x) => x + 1); } };
  const requests = (isGroupAdmin || isAdmin) ? members.filter((m) => m.gid === validGid && m.status === 'pending').length : 0;
  const helpOpen = isAdmin ? help.filter((h) => h.status !== 'done').length : 0;
  const badges = { chat: unread, requests, helpReplies, helpOpen, friends: friendReqs, menu: requests + helpReplies + helpOpen + friendReqs };
  const lastTick = (row) => row.lt || 'sent';
  const chatReadOf = (id) => { const x = (Array.isArray(inbox) ? inbox : []).find((y) => y.chat === id); return x ? numOr(x.r, 0) : 0; };

  /* tornando indietro si riparte dal punto in cui si era nella pagina di prima */
  const go = (s) => { scrollMem.current[stack.length] = window.scrollY; setStack((st) => [...st, s]); window.scrollTo(0, 0); };
  const back = () => { restoreY.current = scrollMem.current[Math.max(0, stack.length - 1)] || 0; setStack((st) => st.slice(0, -1)); };
  const goTab = (t) => { setTab(t); setStack([]); window.scrollTo(0, 0); };
  const switchGroup = (id, home) => { setGid(id); if (home !== false) { setTab('matches'); setStack([]); window.scrollTo(0, 0); } };
  const startDemo = () => { setDemoBe({ db: Demo.createSeeded(), uid: Demo.ME, canWrite: true, demo: true, admin: true }); setTab('matches'); setStack([]); setSheet(null); };
  const exitDemo = () => { setDemoBe(null); setTab('matches'); setStack([]); setSheet(null); };

  const ctx = {
    uid, me, canWrite, isAdmin, isGroupAdmin, demo: !!(be && be.demo), act,
    players, allPlayers, playersById, rated, ratedAll, loadGlobal, isInGroup: (id) => inGroup.has(id), stats, aff,
    friendOf, friendStatus: (id) => friendOf[id] || null, isFriend: (id) => friendOf[id] === 'friend',
    matches, matchesById, allFields, fieldOf: (m) => fieldOfMatch(m, allFields), ratings: data.ratings || [], mvp: data.mvp || [],
    gid: validGid, group, groups: gdata.groups || [], groupsById, members, memberById, myGroups, switchGroup,
    be, inbox, chatRows, chatReady, refreshInbox, markChatRead, chatReadOf, lastTick, canDm, dmPeople, openChat,
    help, markHelpSeen, badges, theme, setTheme, feste, setFeste, festa,
    go, back, goTab, openSheet: setSheet, closeSheet: () => setSheet(null), flash, startDemo, exitDemo,
  };

  /* il giorno di una festa: una volta al giorno su questo telefono, gli auguri e un effetto breve */
  const festaKey = festa ? festa.k + toYmd(new Date()) : '';
  useEffect(() => {
    if (!festa || status !== 'ready' || !loaded) return;
    const today = toYmd(new Date());
    if (readLS('sc-festa-seen', '') === today) return;
    const t = setTimeout(() => { writeLS('sc-festa-seen', today); if (festa.hi) flash(festa.hi); festaFx(festa.fx); }, 900);
    return () => clearTimeout(t);
  }, [festaKey, status, loaded]);

  const autoTried = useRef(new Set());
  useEffect(() => {
    if (!be || !canWrite || !validGid || !loaded || !act) return;
    let todo = [];
    try { todo = autoTeamsTodo(ctx); } catch (e) { todo = []; }
    todo.forEach((t) => {
      const key = t.mid + '|' + t.sig;
      if (autoTried.current.has(key)) return;
      autoTried.current.add(key);
      act.saveTeams(t.mid, t.a, t.b, t.roles, { auto: true, manual: false, sig: t.sig });
    });
  }, [data.matches, gdata.players, data.ratings, validGid, canWrite, loaded]);

  const needsProfile = status === 'ready' && loaded && ctx.canWrite && !me;
  /* chi era iscritto col vecchio sistema rifà l'autovalutazione una volta, nel nuovo formato */
  const needsSelf = status === 'ready' && loaded && ctx.canWrite && !!me && !Engine.hasNewSelf(me);
  /* voce aggiunta dopo (la Scivolata): chi è già iscritto la dà una volta, prima di tutto il resto */
  const needsLate = status === 'ready' && loaded && ctx.canWrite && !!me && !needsSelf && Engine.missingSelfVoci(me).length > 0;
  const noGroup = status === 'ready' && loaded && !validGid;
  const top = stack[stack.length - 1];
  /* notifica toccata: si apre la chat giusta (?chat=… all'apertura, o messaggio dal service worker) */
  const openFromLink = (id) => { if (id && /^[gd]_[A-Za-z0-9_-]+$/.test(id)) { setSheet(null); setTab('chat'); setStack([{ t: 'chat', id }]); } };
  const linkDone = useRef(false);
  useEffect(() => {
    if (linkDone.current || status !== 'ready' || !loaded || needsProfile) return;
    linkDone.current = true;
    let id = null;
    try { id = new URLSearchParams(location.search).get('chat'); } catch (e) { id = null; }
    if (id !== null) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* resta nell'indirizzo */ } openFromLink(id); }
  }, [status, loaded, needsProfile]);
  useEffect(() => {
    if (!navigator.serviceWorker) return;
    const on = (e) => { const d = (e && e.data) || {}; if (d.type === 'open' && d.url) { try { openFromLink(new URL(d.url, location.href).searchParams.get('chat')); } catch (x) { /* indirizzo strano */ } } };
    navigator.serviceWorker.addEventListener('message', on);
    return () => navigator.serviceWorker.removeEventListener('message', on);
  }, []);
  let view;
  if (status === 'loading') view = html`<${Skeleton} />`;
  else if (status !== 'ready') view = html`<${Gate} status=${status} startDemo=${startDemo} />`;
  else if (!loaded) view = html`<${Skeleton} />`;
  else if (needsProfile) view = html`<${Welcome} />`;
  else if (needsSelf) view = html`<${SelfRateScreen} key="forced" forced />`;
  else if (needsLate) view = html`<${NewVociScreen} key="late" />`;
  else if (top && top.t === 'groups') view = html`<${GroupsScreen} key="groups" />`;
  else if (top && top.t === 'settings') view = html`<${SettingsScreen} key="settings" />`;
  else if (top && top.t === 'help') view = html`<${HelpScreen} key="help" />`;
  else if (top && top.t === 'devs') view = html`<${DevelopersScreen} key="devs" />`;
  else if (top && top.t === 'friends') view = html`<${FriendsScreen} key="friends" />`;
  else if (top && top.t === 'admin') view = html`<${AdminScreen} key="admin" />`;
  else if (top && top.t === 'player') view = html`<${PlayerScreen} key=${'p' + top.id + (top.scope || '')} id=${top.id} scope=${top.scope} />`;
  else if (top && top.t === 'self') view = html`<${SelfRateScreen} key="self" />`;
  else if (top && top.t === 'badges') view = html`<${BadgesScreen} key=${'b' + top.id + (top.scope || '')} id=${top.id} scope=${top.scope} />`;
  else if (top && top.t === 'chat') view = html`<${ChatScreen} key=${'ch' + top.id} id=${top.id} />`;
  else if (top && top.t === 'chatInfo') view = html`<${ChatInfoScreen} key=${'ci' + top.id} id=${top.id} />`;
  /* le schermate dei gruppi si aprono solo dentro un gruppo */
  else if (!noGroup && top && top.t === 'group') view = html`<${GroupScreen} key="group" />`;
  else if (!noGroup && top && top.t === 'addMembers') view = html`<${AddMembersScreen} key="addm" />`;
  else if (!noGroup && top && top.t === 'match') view = html`<${MatchScreen} key=${'m' + top.id} id=${top.id} />`;
  else if (!noGroup && top && top.t === 'mvp') view = html`<${MvpScreen} key=${'v' + top.id} id=${top.id} />`;
  else if (!noGroup && top && top.t === 'result') view = html`<${ResultScreen} key=${'r' + top.id} id=${top.id} />`;
  else if (!noGroup && top && top.t === 'rateMatch') view = html`<${MatchRateScreen} key=${'rm' + top.id} id=${top.id} />`;
  else if (!noGroup && top && top.t === 'rate') view = html`<${RateScreen} key=${'rt' + top.id} id=${top.id} />`;
  else if (tab === 'players') view = html`<${PlayersScreen} key=${'pl' + (validGid || '')} />`;
  else if (tab === 'me') view = html`<${MeScreen} key=${'me' + (validGid || '')} />`;
  else if (tab === 'chat') view = html`<${ChatListScreen} key="chats" />`;
  else if (noGroup) view = html`<${NoGroupScreen} key=${'ng' + tab} tab=${tab} />`;
  else if (tab === 'history') view = html`<${StoricoScreen} />`;
  else view = html`<${HomeScreen} />`;

  const showNav = status === 'ready' && loaded && !needsProfile && !needsSelf && !needsLate && !(top && top.t === 'chat');
  const showFab = showNav && !noGroup && tab === 'matches' && stack.length === 0 && ctx.canWrite && ctx.me;
  const NAV = [
    { t: 'matches', i: 'calendar', l: 'Partite' },
    { t: 'history', i: 'history', l: 'Storico' },
    { t: 'chat', i: 'chat', l: 'Messaggi', badge: unread },
    { t: 'players', i: 'users', l: 'Giocatori' },
    { t: 'me', i: 'user', l: 'Profilo', badge: friendReqs },
  ];

  return html`<${Ctx.Provider} value=${ctx}>
    <div class="shell">
      ${be && be.demo && html`<div class="banner"><${Icon} n="info" s="16" /><span class="grow">Demo: dati di esempio, non vengono salvati. Sei Luca "Lucky", amministratore dell'app e del gruppo.</span><button class="btn sm" onClick=${exitDemo}>Esci</button></div>`}
      ${be && !be.demo && !canWrite && html`<div class="banner"><${Icon} n="info" s="16" /><span class="grow">Hai accesso in sola lettura: puoi guardare, ma non rispondere alle partite né votare. Chiedi a chi ha creato l'app di darti il permesso di modificare.</span></div>`}
      ${view}
    </div>
    ${showNav && html`<nav class="nav" aria-label="Sezioni"><div class="nav-in">
      ${NAV.map((n) => html`<button key=${n.t} class=${'nav-btn' + (tab === n.t ? ' on' : '')} aria-current=${tab === n.t ? 'page' : null} onClick=${() => goTab(n.t)}>
        <span class="nav-ic"><${Icon} n=${n.i} />${n.badge > 0 && html`<span class="count-badge nav-badge">${n.badge > 99 ? '99+' : n.badge}</span>`}</span>${n.l}
      </button>`)}
    </div></nav>`}
    ${showFab && html`<button class="fab" onClick=${() => setSheet({ k: 'newMatch' })}><${Icon} n="plus" /> Nuova partita</button>`}
    <${SheetHost} sheet=${sheet} onClose=${() => setSheet(null)} />
    ${toast && html`<div class=${'toast' + (toast.kind === 'err' ? ' err' : '') + (showFab && !sheet ? ' over-fab' : '')} role="status">${toast.text}</div>`}
  <//>`;
}


/* ============================================================
   VERSIONE AUTONOMA: accesso con email e password + database Supabase
   Espone la stessa interfaccia "db" usata dall'app (doc/collection/onSnapshot),
   con i percorsi dei gruppi (g/{gruppo}/partite/...) e le funzioni del database (rpc).
   ============================================================ */
function scErr(e) {
  const c = e && e.code, m = (e && e.message) || '';
  /* funzione del database non ancora installata (manca un aggiornamento SQL) */
  if (c === 'PGRST202' || /could not find the function/i.test(m)) return { code: 'unavailable', message: 'Questa funzione non è ancora attiva: va aggiornato il database su Supabase.', raw: m };
  const denied = c === '42501' || c === 'P0002' || c === 'PGRST116' || /row-level security|non trovato|not found/i.test(m);
  /* i messaggi in italiano scritti dalle funzioni del database arrivano così come sono */
  const mine = c === '42501' || c === '22023';
  return { code: denied ? 'invalid_argument' : 'unavailable', message: mine ? m : '', raw: m };
}

/* "players/abc" -> cartella "players"; "g/g_x/matches/m1" -> cartella "g/g_x/matches", tipo "matches", gruppo "g_x" */
function parsePath(path) {
  const segs = String(path).split('/');
  const id = segs[segs.length - 1];
  return { id, cpath: segs.slice(0, -1).join('/'), col: segs[segs.length - 2], gid: segs[0] === 'g' ? segs[1] : null };
}

/* funzioni che leggono soltanto: dopo non serve ricaricare niente */
const READ_ONLY_FN = new Set(['is_app_admin', 'global_votes', 'player_career',
  /* chat: i cambiamenti arrivano col tempo reale, non serve ricaricare tutto */
  'chat_inbox', 'chat_react', 'chat_edit', 'chat_delete', 'chat_seen', 'chat_mute', 'push_register', 'push_unregister', 'push_devices']);

/* errori dello spazio dei file della chat */
function storageErr(status, text) {
  const m = String(text || '');
  if (/bucket not found/i.test(m) || status === 404) return { code: 'unavailable', message: 'Per mandare foto e vocali va aggiornato il database su Supabase (aggiornamento-chat.sql).' };
  if (status === 403 || /row-level security|unauthorized/i.test(m)) return { code: 'invalid_argument', message: 'Non puoi mandare file in questa chat.' };
  if (status === 413 || /too large|maximum allowed size/i.test(m)) return { code: 'invalid_argument', message: 'File troppo grande.' };
  if (/mime type/i.test(m)) return { code: 'invalid_argument', message: 'Questo tipo di file non si può mandare.' };
  return { code: 'unavailable', message: 'Invio non riuscito: controlla la connessione e riprova.' };
}

function makeSupaDb(sb, cfg) {
  const cols = new Map();
  const base = String((cfg && cfg.url) || '').replace(/\/+$/, '');
  const token = async () => { const { data } = await sb.auth.getSession(); return (data && data.session && data.session.access_token) || ''; };
  const snap = (st) => {
    const docs = Array.from(st.docs, ([id, d]) => ({ id, exists: true, data: () => d })).sort((x, y) => (x.id < y.id ? -1 : 1));
    return { docs, size: docs.length, empty: docs.length === 0, floor: st.floor || 0 };
  };
  const emit = (st) => { const s = snap(st); st.subs.forEach((x) => { try { x.next(s); } catch (e) { /* errore dell'interfaccia */ } }); };

  function ensure(cpath, opts) {
    if (cols.has(cpath)) return cols.get(cpath);
    const st = { docs: new Map(), subs: new Set(), loaded: false, last: (opts && opts.last) || 0, order: (opts && opts.order) || '', floor: 0 };
    cols.set(cpath, st);
    const tOf = (d) => numOr(d && d.t, 0);
    st.load = async () => {
      let q = sb.from('docs').select('id,data').eq('cpath', cpath);
      /* chat: gli ultimi messaggi per ora (data->>t); gli altri documenti: gli ultimi aggiornati */
      if (st.last) q = st.order === 't' ? q.order('data->>t', { ascending: false }).limit(st.last) : q.order('updated_at', { ascending: false }).limit(st.last);
      const { data, error } = await q;
      if (error) { st.subs.forEach((x) => x.error && x.error(scErr(error))); return; }
      const fresh = new Map(data.map((r) => [r.id, r.data]));
      if (st.order === 't') {
        let floor = data.length < st.last ? 0 : Math.min(...data.map((r) => tOf(r.data)));
        /* i messaggi più vecchi già caricati scorrendo restano */
        if (st.loaded && st.floor < floor) {
          for (const [id, d] of st.docs) if (!fresh.has(id) && tOf(d) < floor && tOf(d) >= st.floor) fresh.set(id, d);
          floor = st.floor;
        }
        st.floor = floor;
      }
      st.docs = fresh;
      st.loaded = true;
      emit(st);
    };
    st.chan = sb.channel('c-' + cpath)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'cpath=eq.' + cpath }, (p) => {
        if (p.eventType === 'DELETE') { const id = (p.old && p.old.id) || (p.old && p.old.path && parsePath(p.old.path).id); if (id) { st.docs.delete(id); emit(st); } else st.load(); }
        else if (p.new && p.new.data) { st.docs.set(p.new.id, p.new.data); emit(st); }
        else st.load();
      })
      .subscribe();
    st.load();
    return st;
  }
  const refresh = () => Promise.all(Array.from(cols.values(), (st) => st.load().catch(() => {})));
  /* i messaggi prima di quelli caricati (scorrendo la chat verso l'alto) */
  const older = async (cpath, before, n) => {
    const { data, error } = await sb.from('docs').select('id,data').eq('cpath', cpath)
      .lt('data->>t', String(Math.floor(before))).order('data->>t', { ascending: false }).limit(n);
    if (error) throw scErr(error);
    const st = cols.get(cpath);
    if (st) {
      data.forEach((r) => { if (!st.docs.has(r.id)) st.docs.set(r.id, r.data); });
      st.floor = data.length < n ? 0 : Math.min(st.floor || Infinity, ...data.map((r) => numOr(r.data && r.data.t, 0)));
      emit(st);
    }
    return data.length;
  };
  /* un tipo di documento in tutte le cartelle (le chat): serve all'elenco delle chat */
  const feed = (col, cb) => {
    const fire = (p) => { try { cb(p); } catch (e) { /* schermata chiusa */ } };
    const ch = sb.channel('feed-' + col + '-' + Math.random().toString(36).slice(2, 8))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'docs', filter: 'col=eq.' + col }, fire)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'docs', filter: 'col=eq.' + col }, fire)
      .subscribe();
    return () => { try { sb.removeChannel(ch); } catch (e) { /* già chiuso */ } };
  };
  /* canale privato per "sta scrivendo…" (regole in realtime.messages) */
  const channel = (topic) => {
    const handlers = {};
    const ch = sb.channel(topic, { config: { private: true, broadcast: { self: false, ack: false } } });
    ['typing', 'stop'].forEach((ev) => ch.on('broadcast', { event: ev }, (m) => { const f = handlers[ev]; if (f) f(m && m.payload); }));
    let ok = false;
    ch.subscribe((stt) => { ok = stt === 'SUBSCRIBED'; });
    return {
      on: (ev, f) => { handlers[ev] = f; },
      send: (ev, payload) => { if (!ok) return; try { const r = ch.send({ type: 'broadcast', event: ev, payload }); if (r && r.catch) r.catch(() => {}); } catch (e) { /* niente */ } },
      close: () => { try { sb.removeChannel(ch); } catch (e) { /* già chiuso */ } },
    };
  };
  /* foto e vocali della chat: spazio privato "chat" su Supabase */
  const storage = {
    async upload(path, blob, o) {
      const tk = await token();
      return new Promise((res, rej) => {
        const x = new XMLHttpRequest();
        x.open('POST', base + '/storage/v1/object/chat/' + path.split('/').map(encodeURIComponent).join('/'));
        x.setRequestHeader('Authorization', 'Bearer ' + tk);
        x.setRequestHeader('apikey', (cfg && cfg.anonKey) || '');
        x.setRequestHeader('x-upsert', 'false');
        x.setRequestHeader('cache-control', 'max-age=31536000');
        x.setRequestHeader('Content-Type', (o && o.contentType) || blob.type || 'application/octet-stream');
        x.upload.onprogress = (e) => { if (e.lengthComputable && o && o.onProgress) o.onProgress(e.loaded / Math.max(1, e.total)); };
        x.onload = () => (x.status >= 200 && x.status < 300 ? res(true) : rej(storageErr(x.status, x.responseText)));
        x.onerror = () => rej({ code: 'unavailable', message: 'Connessione assente: il file non è partito.' });
        x.send(blob);
      });
    },
    async download(path) {
      const { data, error } = await sb.storage.from('chat').download(path);
      if (error || !data) throw storageErr(error && error.status, error && error.message);
      return data;
    },
    async remove(paths) { const { error } = await sb.storage.from('chat').remove(paths); if (error) throw storageErr(error.status, error.message); },
    async copy(from, to) { const { error } = await sb.storage.from('chat').copy(from, to); if (error) throw storageErr(error.status, error.message); },
    async list(prefix) {
      const { data, error } = await sb.storage.from('chat').list(prefix, { limit: 1000 });
      if (error) throw storageErr(error.status, error.message);
      return data || [];
    },
  };
  /* funzioni su Supabase (notify: prova delle notifiche) */
  const fn = async (name, body) => {
    const res = await fetch(base + '/functions/v1/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (await token()), apikey: (cfg && cfg.anonKey) || '' }, body: JSON.stringify(body || {}) });
    if (!res.ok) throw { code: 'unavailable', status: res.status };
    return res.json();
  };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
  window.addEventListener('online', refresh);

  async function afterWrite(path) {
    const { cpath, id } = parsePath(path);
    const st = cols.get(cpath);
    if (!st) return;
    const { data } = await sb.from('docs').select('data').eq('path', path).maybeSingle();
    if (data) { st.docs.set(id, data.data); emit(st); }
  }
  const docRef = (path) => {
    const { id, col, cpath } = parsePath(path);
    return {
      id, path,
      get: async () => {
        const { data, error } = await sb.from('docs').select('data').eq('path', path).maybeSingle();
        if (error) throw scErr(error);
        return { id, exists: !!data, data: () => (data ? data.data : undefined) };
      },
      set: async (d) => {
        const { error } = await sb.from('docs').upsert({ path, col, id, data: d, updated_at: new Date().toISOString() });
        if (error) throw scErr(error);
        await afterWrite(path);
      },
      update: async (patch) => {
        const { error } = await sb.rpc('update_doc', { p_path: path, p_patch: patch });
        if (error) throw scErr(error);
        await afterWrite(path);
      },
      delete: async () => {
        const { data, error } = await sb.from('docs').delete().eq('path', path).select('path');
        if (error) throw scErr(error);
        if (!data || !data.length) throw { code: 'invalid_argument', message: 'Non hai il permesso di eliminarlo.' };
        const st = cols.get(cpath); if (st) { st.docs.delete(id); emit(st); }
      },
    };
  };
  return {
    doc: docRef,
    older, feed, channel, storage, fn,
    refreshDoc: (path) => afterWrite(path).catch(() => {}),
    collection(cpath, opts) {
      return {
        path: cpath,
        doc: (id) => docRef(cpath + '/' + (id || Math.random().toString(36).slice(2, 12))),
        onSnapshot(next, error) {
          const st = ensure(cpath, opts);
          const sub = { next, error };
          st.subs.add(sub);
          if (st.loaded) setTimeout(() => next(snap(st)), 0);
          return () => {
            st.subs.delete(sub);
            /* nessuno la guarda più (per esempio dopo il cambio di gruppo): chiudo il canale */
            if (!st.subs.size && cols.get(cpath) === st) { cols.delete(cpath); try { sb.removeChannel(st.chan); } catch (e) { /* già chiuso */ } }
          };
        },
      };
    },
    /* funzioni del database: gruppi, richieste, eliminazioni */
    rpc: async (fn, args) => {
      const { data, error } = await sb.rpc(fn, args || {});
      if (error) throw scErr(error);
      /* le funzioni cambiano gruppi, iscrizioni e profili: ricarico subito senza aspettare il tempo reale */
      if (!READ_ONLY_FN.has(fn)) await refresh();
      return data;
    },
  };
}

/* amministratori dell'app: la tabella app_admins del database (funzione is_app_admin); se manca, le email di config.js */
function isAdminEmail(email) {
  const list = ((window.SC_CONFIG && window.SC_CONFIG.admins) || []).map((x) => String(x).trim().toLowerCase());
  return !!email && list.includes(String(email).trim().toLowerCase());
}
const __admin = {};
function adminCheck(sb, email) {
  const k = String(email || '').toLowerCase();
  if (!__admin[k]) __admin[k] = sb.rpc('is_app_admin').then(({ data, error }) => (error ? isAdminEmail(email) : !!data), () => isAdminEmail(email));
  return __admin[k];
}

/* ---------- schermate di accesso ---------- */
function AuthShell({ children }) {
  return html`<div class="shell"><div class="page">
    <div class="hello">
      <div class="brand"><span class="brand-mark"><${Icon} n="pitch" /></span><span class="eyebrow">Algor Bomber</span></div>
      <h1 class="h1">Organizza il calcetto con gli amici.</h1>
    </div>
    ${children}
  </div></div>`;
}

function AuthForm({ sb }) {
  const [mode, setMode] = useState('in');
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const ok = /.+@.+\..+/.test(email.trim()) && (mode === 'reset' || pw.length >= 6);
  const nice = (e) => {
    const m = (e && e.message) || '';
    if (/invalid login/i.test(m)) return 'Email o password sbagliate.';
    if (/already registered|already been registered/i.test(m)) return 'Questa email è già iscritta: accedi con la password.';
    if (/password/i.test(m) && /6|short|weak/i.test(m)) return 'La password deve avere almeno 6 caratteri.';
    if (/rate limit|too many/i.test(m)) return 'Troppi tentativi, riprova tra qualche minuto.';
    if (/fetch|network/i.test(m)) return 'Connessione assente, riprova.';
    return 'Non riesco a completare l\'operazione. Riprova.';
  };
  const submit = async (e) => {
    e.preventDefault();
    if (!ok || busy) return;
    setBusy(true); setMsg(null);
    try {
      const em = email.trim();
      if (mode === 'in') {
        const { error } = await sb.auth.signInWithPassword({ email: em, password: pw });
        if (error) throw error;
      } else if (mode === 'up') {
        const { data, error } = await sb.auth.signUp({ email: em, password: pw });
        if (error) throw error;
        if (!data.session) setMsg({ k: 'ok', t: 'Ti abbiamo scritto una mail: aprila e conferma, poi accedi.' });
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
        if (error) throw error;
        setMsg({ k: 'ok', t: 'Se l\'email è iscritta, ti arriva un link per scegliere una nuova password.' });
      }
    } catch (err) { setMsg({ k: 'err', t: nice(err) }); }
    setBusy(false);
  };
  const title = mode === 'in' ? 'Accedi' : mode === 'up' ? 'Crea il tuo accesso' : 'Recupera la password';
  return html`<${AuthShell}>
    <form class="stack" onSubmit=${submit}>
      <h2 class="h2">${title}</h2>
      <div class="field"><label class="label" for="au-email">Email</label><input id="au-email" class="input" type="email" autocomplete="email" inputmode="email" value=${email} onInput=${(e) => setEmail(e.target.value)} /></div>
      ${mode !== 'reset' && html`<div class="field"><label class="label" for="au-pw">Password</label><input id="au-pw" class="input" type="password" autocomplete=${mode === 'in' ? 'current-password' : 'new-password'} value=${pw} onInput=${(e) => setPw(e.target.value)} />${mode === 'up' && html`<div class="tiny faint">Almeno 6 caratteri.</div>`}</div>`}
      ${msg && html`<div class=${'note ' + (msg.k === 'ok' ? 'ok' : 'bad')}><span>${msg.t}</span></div>`}
      <button class="btn primary block" type="submit" disabled=${!ok || busy}>${busy ? 'Un attimo…' : mode === 'in' ? 'Accedi' : mode === 'up' ? 'Crea accesso' : 'Invia il link'}</button>
      <div class="hs wrap" style="justify-content:center;gap:16px">
        ${mode !== 'in' && html`<button type="button" class="link" onClick=${() => { setMode('in'); setMsg(null); }}>Ho già un accesso</button>`}
        ${mode !== 'up' && html`<button type="button" class="link" onClick=${() => { setMode('up'); setMsg(null); }}>Prima volta? Iscriviti</button>`}
        ${mode === 'in' && html`<button type="button" class="link" style="color:var(--ink-2)" onClick=${() => { setMode('reset'); setMsg(null); }}>Password dimenticata</button>`}
      </div>
    </form>
  <//>`;
}

function NewPassword({ sb, done }) {
  const [pw, setPw] = useState('');
  const [msg, setMsg] = useState(null);
  const submit = async (e) => {
    e.preventDefault();
    if (pw.length < 6) return;
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) setMsg('Non riesco a cambiare la password. Riprova dal link nella mail.'); else done();
  };
  return html`<${AuthShell}><form class="stack" onSubmit=${submit}>
    <h2 class="h2">Scegli una nuova password</h2>
    <div class="field"><label class="label" for="np-pw">Nuova password</label><input id="np-pw" class="input" type="password" autocomplete="new-password" value=${pw} onInput=${(e) => setPw(e.target.value)} /></div>
    ${msg && html`<div class="note bad"><span>${msg}</span></div>`}
    <button class="btn primary block" type="submit" disabled=${pw.length < 6}>Salva password</button>
  </form><//>`;
}


function Root() {
  const cfg = window.SC_CONFIG || {};
  const sb = useMemo(() => (cfg.url && cfg.anonKey && window.supabase ? window.supabase.createClient(cfg.url, cfg.anonKey) : null), []);
  const [st, setSt] = useState({ ready: false, session: null, recovery: false });
  useEffect(() => {
    if (!sb) return;
    let dead = false;
    sb.auth.getSession().then(({ data }) => { if (!dead) setSt((s) => ({ ...s, ready: true, session: data.session })); });
    const { data: l } = sb.auth.onAuthStateChange((ev, session) => {
      if (ev === 'PASSWORD_RECOVERY') setSt({ ready: true, session, recovery: true });
      else setSt((s) => ({ ...s, ready: true, session }));
    });
    return () => { dead = true; l.subscription.unsubscribe(); };
  }, []);
  const uid = st.session && st.session.user && st.session.user.id;
  const db = useMemo(() => (sb && uid ? makeSupaDb(sb, cfg) : null), [uid]);
  if (!sb) return html`<${AuthShell}><div class="note bad"><span>Manca la configurazione: compila il file config.js con i dati di Supabase (vedi la guida).</span></div><//>`;
  if (!st.ready) return html`<${Skeleton} />`;
  if (st.recovery) return html`<${NewPassword} sb=${sb} done=${() => setSt((s) => ({ ...s, recovery: false }))} />`;
  if (!uid) return html`<${AuthForm} sb=${sb} />`;
  window.SC_SIGNOUT = () => sb.auth.signOut();
  window.SC_EMAIL = st.session.user.email;
  const email = st.session.user.email;
  window.claude = { use: async (n) => (n === 'db' ? db : n === 'user' ? { id: async () => uid, can: async () => true, isOwner: () => adminCheck(sb, email), canEdit: () => adminCheck(sb, email) } : null) };
  return html`<${App} key=${uid} />`;
}

render(html`<${typeof Root === 'function' ? Root : App} />`, document.getElementById('app'));

</script>

window.addEventListener('load', function () {
  setTimeout(function () {
    var s = document.getElementById('splash');
    if (s) { s.classList.add('out'); setTimeout(function () { s.remove(); }, 450); }
  }, 900);
});
if ('serviceWorker' in navigator) {
  var had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(function () {});
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (had) location.reload(); });
}
</script>
