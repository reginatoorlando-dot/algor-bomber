<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algor Bomber</title>
<meta name="theme-color" content="#087f5b">
<meta name="description" content="Organizza il calcetto con gli amici: presenze, lista d'attesa e squadre equilibrate.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Algor Bomber">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&display=swap">
<style>
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:spin .5s ease both}
.sp-in img{border-radius:24px;box-shadow:var(--shadow)}
.sp-name{font:700 34px/1.1 var(--f-display);letter-spacing:-.02em;color:var(--ink);margin-top:10px}
.sp-sub{font:500 14px var(--f-body);color:var(--ink-3)}
@keyframes spin{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: una colonna stretta da app, barra in basso, schede e fogli a scomparsa.
   Neutri verdastri, un solo verde "campo" per le azioni positive, blu e arancio solo per le due squadre. */
:root {
  --bg: #f2f5f1;
  --surface: #ffffff;
  --surface-2: #e8eee7;
  --ink: #0f1812;
  --ink-2: #4b574f;
  --ink-3: #647069;
  --line: #dce3db;
  --accent: #087f5b;
  --accent-soft: #daf1e6;
  --on-accent: #ffffff;
  --ta: #2459d8;
  --ta-soft: #e3ebfd;
  --tb: #c24a08;
  --tb-soft: #fde8da;
  --warn: #86500a;
  --warn-soft: #fbefd0;
  --bad: #b02323;
  --bad-soft: #fde5e3;
  --scrim: rgba(9, 16, 11, 0.5);
  --shadow: 0 10px 30px rgba(9, 22, 14, 0.14);
  --av-s: 38%;
  --av-l: 87%;
  --f-body: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --f-display: 'Bricolage Grotesque', 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0a0f0c;
    --surface: #121a15;
    --surface-2: #1b261f;
    --ink: #edf3ee;
    --ink-2: #aab6ad;
    --ink-3: #85928a;
    --line: #25312a;
    --accent: #3ddc97;
    --accent-soft: #11382a;
    --on-accent: #04170e;
    --ta: #7aa5ff;
    --ta-soft: #17284a;
    --tb: #ff9457;
    --tb-soft: #40220f;
    --warn: #f2bd5c;
    --warn-soft: #3a2a0c;
    --bad: #ff8d86;
    --bad-soft: #421a18;
    --scrim: rgba(0, 0, 0, 0.62);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    --av-s: 22%;
    --av-l: 27%;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0a0f0c;
  --surface: #121a15;
  --surface-2: #1b261f;
  --ink: #edf3ee;
  --ink-2: #aab6ad;
  --ink-3: #85928a;
  --line: #25312a;
  --accent: #3ddc97;
  --accent-soft: #11382a;
  --on-accent: #04170e;
  --ta: #7aa5ff;
  --ta-soft: #17284a;
  --tb: #ff9457;
  --tb-soft: #40220f;
  --warn: #f2bd5c;
  --warn-soft: #3a2a0c;
  --bad: #ff8d86;
  --bad-soft: #421a18;
  --scrim: rgba(0, 0, 0, 0.62);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  --av-s: 22%;
  --av-l: 27%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.45 var(--f-body);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- struttura ---------- */
.shell { max-width: 640px; margin: 0 auto; padding-block: 6px 112px; min-height: 100dvh; }
.page { display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; align-items: center; gap: 12px; padding-top: 14px; min-width: 0; }
.page-head .ttl { min-width: 0; flex: 1; }
.h1 { font: 700 30px/1.05 var(--f-display); letter-spacing: -0.025em; }
.h2 { font: 700 22px/1.1 var(--f-display); letter-spacing: -0.02em; }
.h3 { font: 700 17px/1.2 var(--f-display); letter-spacing: -0.01em; }
.sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.eyebrow { font: 600 11.5px/1 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-8 { display: flex; flex-direction: column; gap: 8px; }
.hs { display: flex; align-items: center; gap: 8px; }
.hs-12 { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.card.todo { background: var(--accent-soft); border-color: transparent; }
.card.pad0 { padding: 0; overflow: hidden; }
.divided > * + * { border-top: 1px solid var(--line); }

.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; background: var(--surface-2); color: var(--ink-2); }
.note svg { flex: none; margin-top: 1px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.ok { background: var(--accent-soft); color: var(--accent); }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-top: 10px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.banner .grow { line-height: 1.35; }

.empty { text-align: center; padding: 28px 16px; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty .h3 { color: var(--ink); }

/* ---------- icone, avatar ---------- */
.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.s16 { width: 16px; height: 16px; }
.ic.s14 { width: 14px; height: 14px; }
.ic.fill { fill: currentColor; stroke: none; }
.av {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  border-radius: 50%; overflow: hidden; line-height: 1; font-family: var(--f-body); font-weight: 600; color: var(--ink);
  background: hsl(var(--h, 150) var(--av-s) var(--av-l));
}
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av.guest { border: 1.5px dashed var(--ink-3); background: transparent; color: var(--ink-2); font-size: 0.8em; }

/* ---------- bottoni e controlli ---------- */
.btn {
  appearance: none; border: 1px solid transparent; border-radius: 12px; padding: 11px 16px;
  font: 600 14.5px/1.2 var(--f-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface-2); color: var(--ink); text-align: center;
}
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.accent { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn:active:not([disabled]) { transform: translateY(1px); }
.icon-btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  width: 38px; height: 38px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0;
}
.link { appearance: none; border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 13.5px; }

.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button {
  flex: 1; min-width: 0; border: 0; background: transparent; border-radius: 9px; padding: 9px 6px;
  font: 600 13.5px/1.1 var(--f-body); color: var(--ink-2);
}
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); }
.seg.rsvp button.on.in { background: var(--accent); color: var(--on-accent); }
.seg.rsvp button.on.maybe { background: var(--warn-soft); color: var(--warn); }
.seg.rsvp button.on.out { background: var(--bad-soft); color: var(--bad); }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  font: 600 12px/1.3 var(--f-body); background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ta { background: var(--ta-soft); color: var(--ta); }
.chip.tb { background: var(--tb-soft); color: var(--tb); }
.role {
  font: 700 10.5px/1 var(--f-body); letter-spacing: 0.06em; padding: 4px 6px; border-radius: 6px;
  background: var(--surface-2); color: var(--ink-2); flex: none;
}
.role.POR { background: var(--warn-soft); color: var(--warn); }

.field { display: flex; flex-direction: column; gap: 6px; }
.label { font: 600 12.5px/1.2 var(--f-body); color: var(--ink-2); }
.input {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px;
  font-size: 16px; color: var(--ink); min-width: 0;
}
.input::placeholder { color: var(--ink-3); }
textarea.input { resize: vertical; min-height: 64px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > * { min-width: 0; }
@media (max-width: 380px) { .grid2.keep { grid-template-columns: 1fr; } }

.pills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pill {
  appearance: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink-2); font: 600 11.5px/1.15 var(--f-body); min-width: 0; letter-spacing: -0.01em;
}
.pill b { font: 700 13px/1 var(--f-body); letter-spacing: 0.05em; color: var(--ink); }
.pill.on { border-color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); }
.pill.on.POR { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.pills.sm .pill { padding: 8px 2px; }

.emojis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.emojis button { appearance: none; border: 1.5px solid transparent; background: var(--surface-2); border-radius: 10px; aspect-ratio: 1; font-size: 20px; line-height: 1; padding: 0; }
.emojis button.on { border-color: var(--ink); background: var(--surface); }

/* slider */
.sl { display: flex; flex-direction: column; gap: 2px; }
.sl-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sl-name { font-weight: 600; font-size: 14.5px; }
.sl-hint { color: var(--ink-3); font-size: 12.5px; margin-left: 6px; font-weight: 400; }
.sl-val { font: 700 22px/1 var(--f-display); letter-spacing: -0.02em; min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }
.sl-val.unset { color: var(--ink-3); }
input[type='range'] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0; padding: 0; touch-action: pan-y; }
input[type='range']::-webkit-slider-runnable-track {
  height: 6px; border-radius: 6px;
  background: linear-gradient(to right, var(--fill, var(--ink)) var(--p, 50%), var(--surface-2) var(--p, 50%));
}
input[type='range']::-moz-range-track { height: 6px; border-radius: 6px; background: var(--surface-2); }
input[type='range']::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--fill, var(--ink)); }
input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 26px; height: 26px; border-radius: 50%; margin-top: -10px;
  background: var(--surface); border: 2.5px solid var(--fill, var(--ink)); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
}
input[type='range']::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--fill, var(--ink)); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25); }
input[type='range'].acc { --fill: var(--accent); }
input[type='range'].unset { --fill: var(--ink-3); opacity: 0.85; }

/* ---------- barra in basso ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.nav-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.nav-btn { appearance: none; border: 0; background: none; color: var(--ink-3); padding: 7px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 600 11.5px/1 var(--f-body); border-radius: 12px; }
.nav-btn.on { color: var(--ink); }
.nav-btn .ic { width: 23px; height: 23px; }
.nav-btn.on .ic { stroke-width: 2.2; }
.fab {
  position: fixed; z-index: 25; right: calc(max(16px, env(safe-area-inset-right, 0px)) + max(0px, (100vw - 640px) / 2));
  bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  border: 0; border-radius: 16px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow);
  display: inline-flex; align-items: center; gap: 8px; padding: 14px 18px 14px 14px; font: 600 14.5px/1 var(--f-body);
}

/* ---------- fogli ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade 0.18s ease; }
.sheet {
  background: var(--surface); width: 100%; max-width: 560px; max-height: 92dvh; display: flex; flex-direction: column;
  border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow: var(--shadow);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px max(18px, env(safe-area-inset-right, 0px)) 8px max(18px, env(safe-area-inset-left, 0px)); }
.sheet-body { overflow-y: auto; padding: 4px max(18px, env(safe-area-inset-right, 0px)) 22px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
.sheet-body > *:not(.emg) { flex-shrink: 0; }
@media (min-width: 720px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 22px; } }
.toast {
  position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 13.5px; font-weight: 500;
  max-width: min(92vw, 420px); box-shadow: var(--shadow); animation: up 0.2s ease; text-align: center;
}
.toast.err { background: var(--bad); color: #fff; }
.toast.over-fab { bottom: calc(132px + env(safe-area-inset-bottom, 0px)); }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.sk { background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sk 1.3s linear infinite; border-radius: 14px; }

/* ---------- liste e righe ---------- */
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-width: 0; width: 100%; background: none; border: 0; text-align: left; color: inherit; }
.row.tap { cursor: pointer; }
.row-main { flex: 1; min-width: 0; }
.row-t { font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
.row-s { color: var(--ink-2); font-size: 13px; }
.lvl { font: 700 18px/1 var(--f-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; min-width: 2.1em; text-align: right; }
.list > .row { padding-left: 14px; padding-right: 14px; }
.pos { font: 700 13px/1 var(--f-display); color: var(--ink-3); width: 20px; text-align: center; flex: none; }

/* ---------- partite ---------- */
.match { display: block; width: 100%; text-align: left; padding: 14px; color: inherit; }
.m-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.m-when { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.m-day { font: 700 21px/1.1 var(--f-display); letter-spacing: -0.02em; }
.m-time { font: 600 15px/1 var(--f-body); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.m-fmt { font: 600 12px/1 var(--f-body); color: var(--ink-2); background: var(--surface-2); padding: 5px 8px; border-radius: 8px; white-space: nowrap; }
.m-field { display: flex; align-items: center; gap: 6px; color: var(--ink-2); margin-top: 6px; font-size: 13.5px; min-width: 0; }
.meter { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.meter .bar { flex: 1; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.meter .cnt { font: 600 13px/1 var(--f-body); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.m-foot { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.cards { display: flex; flex-direction: column; gap: 10px; }
.cancelled .m-day { text-decoration: line-through; color: var(--ink-3); }

.rsvp-role { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

/* ---------- squadre ---------- */
.bal { display: flex; flex-direction: column; gap: 14px; }
.bal-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.bal-num { font: 700 52px/0.9 var(--f-display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.bal-num small { font-size: 24px; letter-spacing: 0; margin-left: 2px; color: var(--ink-3); }
.bal-lab { font: 600 14px/1.2 var(--f-body); text-align: right; }
.tug { display: flex; flex-direction: column; gap: 9px; }
.tug-row { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; gap: 8px; }
.tug-row .tl { grid-column: 1 / -1; display: flex; justify-content: center; font: 600 11px/1 var(--f-body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: -3px; }
.tug-v { font: 700 13.5px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tug-v.a { color: var(--ta); text-align: left; }
.tug-v.b { color: var(--tb); text-align: right; }
.tug-bar { position: relative; height: 8px; border-radius: 8px; background: var(--tb); overflow: hidden; }
.tug-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ta); }
.tug-bar::after { content: ''; position: absolute; left: 50%; top: -1px; bottom: -1px; width: 2px; margin-left: -1px; background: var(--surface); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools .seg { flex: 1 1 200px; }
.tools .seg button { padding: 8px 4px; font-size: 12.5px; }
.sug { display: flex; flex-direction: column; gap: 10px; background: var(--accent-soft); color: var(--ink); border-radius: 14px; padding: 12px; }
.sug .swp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.teams { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.team { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.team-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
.team.a .team-h { background: var(--ta-soft); color: var(--ta); }
.team.b .team-h { background: var(--tb-soft); color: var(--tb); }
.team-h h4 { font: 700 16px/1 var(--f-display); letter-spacing: -0.01em; }
.team-h .cnt { margin-left: auto; font: 700 13px/1 var(--f-display); font-variant-numeric: tabular-nums; opacity: 0.9; }
.team-roles { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 4px; }
.prow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin: 2px 6px; border-radius: 12px; min-width: 0; cursor: pointer; border: 1.5px solid transparent; background: transparent; width: calc(100% - 12px); text-align: left; color: inherit; }
.prow.sel { border-color: var(--ink); background: var(--surface-2); }
.prow.cand:hover { background: var(--surface-2); }
.prow .swp-ic { color: var(--ink-3); }
.drop { margin: 6px 10px 10px; padding: 10px; border: 1.5px dashed var(--line); border-radius: 12px; text-align: center; color: var(--ink-2); font-weight: 600; font-size: 13px; background: none; width: calc(100% - 20px); }
.drop.hot { border-color: var(--ink); color: var(--ink); }
.team.over { box-shadow: inset 0 0 0 2px var(--ink); }
.tray { border: 1.5px dashed var(--line); border-radius: 16px; padding: 6px 0 8px; }
.tray .eyebrow { padding: 8px 14px 4px; display: block; }
.pad-b { padding-bottom: 6px; }

/* ---------- giocatore ---------- */
.hero { display: flex; align-items: center; gap: 16px; }
.hero .big { font: 700 44px/0.9 var(--f-display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat b { font: 700 20px/1 var(--f-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-2); line-height: 1.2; }
.radar { width: 100%; max-width: 280px; margin: 0 auto; display: block; }
.rd-grid { fill: none; stroke: var(--line); stroke-width: 1; }
.rd-axis { stroke: var(--line); stroke-width: 1; }
.rd-self { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; }
.rd-now { fill: var(--accent-soft); fill-opacity: 0.85; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; }
.rd-dot { fill: var(--accent); }
.rd-t { fill: var(--ink-2); font: 600 10.5px var(--f-body); letter-spacing: 0.06em; }
.rd-v { fill: var(--ink); font: 700 14px var(--f-display); }
.legend { display: flex; justify-content: center; gap: 16px; color: var(--ink-2); font-size: 12.5px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 6px; }
.legend i.d { border-top: 2px dashed var(--ink-3); }
.mini { display: flex; gap: 4px; }
.mini span { display: inline-flex; flex-direction: column; align-items: center; min-width: 30px; background: var(--surface-2); border-radius: 8px; padding: 3px 4px; font: 700 13px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.mini span em { font: 600 8.5px/1 var(--f-body); letter-spacing: 0.06em; color: var(--ink-3); margin-top: 3px; font-style: normal; }
.vote-row { display: flex; flex-direction: column; gap: 0; padding: 12px 14px; }
.vote-row + .vote-row { border-top: 1px solid var(--line); }
.sticky-act { position: sticky; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 5; padding: 10px 0 2px; background: linear-gradient(to top, var(--bg) 70%, transparent); }

/* ---------- benvenuto ---------- */
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 40px; height: 40px; border-radius: 12px; background: var(--ink); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; }
.brand-mark .ic { width: 24px; height: 24px; }
.hello { padding-top: 22px; display: flex; flex-direction: column; gap: 14px; }
.hello .h1 { font-size: 36px; }
.steps { display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); font-size: 14px; }
.steps div { display: flex; gap: 10px; align-items: flex-start; }
.steps svg { color: var(--accent); margin-top: 2px; }
.avatar-edit { display: flex; align-items: center; gap: 14px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}
.fz { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.fz-t { text-transform: uppercase; letter-spacing: 0.06em; }
a.btn { text-decoration: none; }
.hs.wrap { flex-wrap: wrap; }


/* ============================================================
   AGGIUNTE: card del giocatore, valutazioni, risultato, storico
   Colori delle card: bronzo, argento, oro come su FIFA ma spenti; l'MVP su fondo verde scuro.
   ============================================================ */
:root {
  --br-bg: #f3e9de; --br-ink: #7a4a24; --br-line: #e0c9b0;
  --ag-bg: #edf0f2; --ag-ink: #47535e; --ag-line: #d2d9df;
  --or-bg: #f5eed6; --or-ink: #6b530d; --or-line: #e2d097;
  --mvp-bg: #15241b; --mvp-ink: #eedca6; --mvp-line: #2f4636; --mvp-sub: #b8c6bc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --br-bg: #2a1f17; --br-ink: #e3b88f; --br-line: #4a3627;
    --ag-bg: #1e2429; --ag-ink: #c9d2da; --ag-line: #364049;
    --or-bg: #29230f; --or-ink: #e8cf7e; --or-line: #4c4221;
    --mvp-bg: #1b2c21; --mvp-ink: #f0dc9e; --mvp-line: #5d6c43; --mvp-sub: #a9b8ad;
  }
}
:root[data-theme='dark'] {
  --br-bg: #2a1f17; --br-ink: #e3b88f; --br-line: #4a3627;
  --ag-bg: #1e2429; --ag-ink: #c9d2da; --ag-line: #364049;
  --or-bg: #29230f; --or-ink: #e8cf7e; --or-line: #4c4221;
  --mvp-bg: #1b2c21; --mvp-ink: #f0dc9e; --mvp-line: #5d6c43; --mvp-sub: #a9b8ad;
}

.nav-in { grid-template-columns: repeat(4, 1fr); }
.ic.s12 { width: 12px; height: 12px; }
.ic.s18 { width: 18px; height: 18px; }
.ic.s22 { width: 22px; height: 22px; }
.plain { appearance: none; border: 0; background: none; padding: 0; margin: 0; width: 100%; text-align: left; color: inherit; cursor: pointer; display: block; border-radius: 20px; }

/* punteggio a colori */
.ovr {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  min-width: 40px; height: 30px; padding: 0 7px; border-radius: 9px; border: 1px solid transparent;
  font: 700 17px/1 var(--f-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
}
.ovr.sm { min-width: 32px; height: 24px; padding: 0 5px; font-size: 14px; border-radius: 7px; }
.ovr.bronze, .pcard.bronze { background: var(--br-bg); color: var(--br-ink); border-color: var(--br-line); }
.ovr.silver, .pcard.silver { background: var(--ag-bg); color: var(--ag-ink); border-color: var(--ag-line); }
.ovr.gold, .pcard.gold { background: var(--or-bg); color: var(--or-ink); border-color: var(--or-line); }
.pcard.mvp { background: var(--mvp-bg); color: var(--mvp-ink); border-color: var(--mvp-line); }
.pcard.mvp .pc-sub { color: var(--mvp-sub); opacity: 1; }

/* card del giocatore */
.pcard { border: 1px solid; border-radius: 20px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pc-top { display: flex; align-items: flex-start; gap: 12px; }
.pc-ovr { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.pc-ovr b { font: 800 58px/0.82 var(--f-display); letter-spacing: -0.045em; }
.pc-ovr span { font: 700 12px/1 var(--f-body); letter-spacing: 0.08em; opacity: 0.85; }
.pc-badge { display: inline-flex; align-items: center; gap: 5px; font: 700 11.5px/1 var(--f-body); letter-spacing: 0.08em; padding: 6px 8px; border-radius: 8px; border: 1px solid currentColor; align-self: flex-start; }
.pcard .av { box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent); }
.pc-avw { position: relative; flex: none; display: inline-flex; }
.pc-num { position: absolute; right: -7px; bottom: -5px; min-width: 26px; height: 22px; padding: 0 5px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); color: inherit; border: 1.5px solid color-mix(in srgb, currentColor 35%, transparent); font: 800 12.5px/1 var(--f-display); letter-spacing: -0.01em; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12); }
.vs-num { position: absolute; left: -5px; bottom: -3px; min-width: 19px; height: 17px; padding: 0 4px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; background: var(--ink); color: var(--surface); font: 800 10.5px/1 var(--f-display); box-shadow: 0 0 0 2px var(--surface); }
.fifa-no { font-style: normal; font: 800 clamp(12px, 3.8vw, 15px)/1 var(--f-display); margin-top: 9px; padding: 4px 7px 3px; border-radius: 8px; border: 1.5px solid var(--line); letter-spacing: 0.02em; }
.fifa-no::before { content: 'N°'; font-size: 0.7em; opacity: 0.7; margin-right: 2px; }
.pc-name { display: flex; align-items: center; gap: 8px; font: 700 22px/1.1 var(--f-display); letter-spacing: -0.02em; margin-top: 8px; min-width: 0; }
.pc-sub { font-size: 13px; opacity: 0.8; }
.pc-areas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
.pc-a { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.pc-a b { font: 700 20px/1 var(--f-display); letter-spacing: -0.02em; }
.pc-a span { font: 600 10.5px/1 var(--f-body); letter-spacing: 0.07em; opacity: 0.8; }
.pc-a.dim { opacity: 0.42; }

/* ruoli e infortuni */
.roles { display: inline-flex; gap: 4px; flex: none; }
.role.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); }
.inj { display: inline-flex; align-items: center; justify-content: center; flex: none; }
.inj.lieve { color: var(--warn); }
.inj.grave { color: var(--bad); }
.inj.ok-dot { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.admin-ic { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.pills.five { grid-template-columns: repeat(4, 1fr); }

/* slider 1–99 */
.rs { display: flex; flex-direction: column; gap: 2px; }
.rs-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.rs-name { font-weight: 600; font-size: 14.5px; min-width: 0; }
.rs-hint { display: block; color: var(--ink-3); font-size: 12.5px; font-weight: 400; }
.rs-val { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.rs-val b { font: 700 24px/1 var(--f-display); letter-spacing: -0.02em; }
.rs-val span { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.rs-row { display: flex; align-items: center; gap: 8px; }
.rs-row input { flex: 1; min-width: 0; }
.step {
  appearance: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0;
}
.step[disabled] { opacity: 0.35; cursor: not-allowed; }
.step:active:not([disabled]) { transform: translateY(1px); }
.area-card { display: flex; flex-direction: column; gap: 14px; }
.area-h { display: flex; align-items: flex-start; gap: 10px; }
.area-card.off { background: var(--surface-2); border-color: transparent; }

/* dettaglio stats */
.area-d { padding: 12px 0; display: flex; flex-direction: column; gap: 8px; }
.area-dh { display: flex; align-items: center; gap: 8px; min-width: 0; }
.area-n { font: 700 15px/1.2 var(--f-display); }
.vb { display: grid; grid-template-columns: minmax(0, 9.5em) 1fr 2.2em; align-items: center; gap: 10px; font-size: 13.5px; }
.vb-n { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vb-bar { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.vb-bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.vb-v { font: 700 14px/1 var(--f-display); text-align: right; }
.stats.six { grid-template-columns: repeat(3, 1fr); }
.mini span { min-width: 28px; }
.res-chip { width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font: 700 13px/1 var(--f-display); background: var(--surface-2); color: var(--ink-2); flex: none; }
.res-chip.ok { background: var(--accent-soft); color: var(--accent); }
.res-chip.bad { background: var(--bad-soft); color: var(--bad); }

/* partite e risultato */
.m-score { font: 800 24px/1 var(--f-display); letter-spacing: -0.02em; white-space: nowrap; }
.m-score .x, .hist-s .x { color: var(--ink-3); font-weight: 600; margin: 0 3px; }
.ta-c { color: var(--ta); }
.tb-c { color: var(--tb); }
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.score-side { display: flex; align-items: center; gap: 10px; min-width: 0; }
.score-side.a { justify-content: flex-end; }
.score-side.a .score-n { color: var(--ta); }
.score-side.b .score-n { color: var(--tb); }
.score-n { font: 800 48px/0.9 var(--f-display); letter-spacing: -0.04em; }
.score-dash { font: 700 28px/1 var(--f-display); color: var(--ink-3); }
.scorers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; font-size: 13.5px; }
.scorers > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.scorers > div:first-child { text-align: right; }
.score-in { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
.score-in .side { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.score-in .big { font: 800 52px/1 var(--f-display); letter-spacing: -0.04em; }
.res-row { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; }
.res-row + .res-row { border-top: 1px solid var(--line); }
.res-ctrs { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.ctr { display: inline-flex; align-items: center; gap: 6px; }
.ctr-l { font-size: 12.5px; color: var(--ink-2); font-weight: 600; min-width: 3.9em; }
.ctr-v { font: 700 17px/1 var(--f-display); min-width: 1.4em; text-align: center; }
.ctr-v.zero { color: var(--ink-3); }
.ctr .step { width: 30px; height: 30px; border-radius: 9px; }
.mini-seg { flex: none; padding: 2px; }
.mini-seg button { flex: none; width: 36px; padding: 7px 0; }
.seg .on.ta-on { background: var(--ta); color: #fff; }
.seg .on.tb-on { background: var(--tb); color: #fff; }
.ga { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.pred { display: flex; align-items: center; gap: 14px; }
.pred-n { font: 800 34px/0.9 var(--f-display); letter-spacing: -0.03em; }
.pred-n small { font-size: 18px; color: var(--ink-3); margin-left: 1px; }

/* squadre con ruoli */
.team-h .mod { font: 700 12px/1 var(--f-body); letter-spacing: 0.04em; padding: 4px 7px; border-radius: 7px; background: var(--surface); opacity: 0.9; }
.team-warn { margin: 8px 10px 0; padding: 6px 10px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); font-size: 12.5px; font-weight: 600; }
.malus { font: 700 11px/1 var(--f-body); color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 4px 5px; flex: none; }
.selbar { border-color: var(--ink); }

/* MVP */
.pick { display: flex; align-items: center; gap: 12px; padding: 10px 14px; width: 100%; background: none; border: 0; text-align: left; color: inherit; cursor: pointer; }
.pick + .pick { border-top: 1px solid var(--line); }
.pick .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: inline-flex; align-items: center; justify-content: center; }
.pick.on { background: var(--accent-soft); }
.pick.on .dot { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.pick[disabled] { cursor: default; opacity: 0.75; }

/* storico e classifiche */
.hist { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; width: 100%; text-align: left; background: none; border: 0; color: inherit; cursor: pointer; }
.hist + .hist { border-top: 1px solid var(--line); }
.hist .row-t .m-fmt { padding: 3px 6px; font-size: 11px; }
.hist.cancelled .hist-d b { text-decoration: line-through; color: var(--ink-3); }
.hist-d { display: flex; flex-direction: column; align-items: center; width: 40px; }
.hist-d b { font: 700 22px/1 var(--f-display); }
.hist-d span { font: 600 11px/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin-top: 4px; }
.hist-s { font: 800 24px/1 var(--f-display); letter-spacing: -0.02em; white-space: nowrap; }
.lead { display: grid; grid-template-columns: 24px auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; width: 100%; background: none; border: 0; text-align: left; color: inherit; cursor: pointer; }
.lead + .lead { border-top: 1px solid var(--line); }
.lead-pos { font: 700 15px/1 var(--f-display); color: var(--ink-3); text-align: center; }
.lead-pos.p1 { color: var(--or-ink); }
.lead-pos.p2 { color: var(--ag-ink); }
.lead-pos.p3 { color: var(--br-ink); }
.lead-v { font: 800 24px/1 var(--f-display); letter-spacing: -0.02em; }
/* podio delle classifiche */
.podium { display: grid; grid-template-columns: 1fr 1.18fr 1fr; align-items: end; gap: 8px; padding: 28px 12px 0; border-bottom: 1px solid var(--line); }
.podium.n1 { grid-template-columns: minmax(0, 200px); justify-content: center; }
.podium.n2 { grid-template-columns: 1fr 1.18fr; padding-right: 25%; }
.pod { appearance: none; border: 0; background: none; color: inherit; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; min-width: 0; padding: 0; position: relative; --m1: var(--or-line); --mb: var(--or-bg); --mi: var(--or-ink); }
.pod.silver { --m1: var(--ag-line); --mb: var(--ag-bg); --mi: var(--ag-ink); }
.pod.bronze { --m1: var(--br-line); --mb: var(--br-bg); --mi: var(--br-ink); }
.pod-av .av { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--m1); }
.pod-crown { position: absolute; top: -16px; font-size: 22px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2)); }
.pod-n { display: flex; align-items: center; gap: 5px; justify-content: center; max-width: 100%; font: 700 14px/1.15 var(--f-display); margin-top: 4px; }
.pod-n .chip { flex: none; }
.pod-v { display: inline-flex; align-items: baseline; gap: 4px; font: 800 24px/1 var(--f-display); letter-spacing: -0.02em; }
.pod-v small { font: 600 11px/1 var(--f-body); color: var(--ink-3); letter-spacing: 0; }
.pod-b { width: 100%; border-radius: 12px 12px 0 0; border: 1px solid var(--m1); border-bottom: 0; background: var(--mb); color: var(--mi); display: flex; justify-content: center; padding-top: 9px; font: 800 22px/1 var(--f-display); margin-top: 4px; }
.pod.s0 .pod-b { height: 66px; font-size: 26px; }
.pod.s1 .pod-b { height: 46px; }
.pod.s2 .pod-b { height: 32px; padding-top: 6px; font-size: 19px; }
.seg-scroll { overflow-x: auto; margin: 0 -2px; padding: 0 2px; }
.seg-scroll .seg { min-width: 360px; }
.acc { display: flex; align-items: center; gap: 14px; }
.acc-big { font: 800 46px/0.9 var(--f-display); letter-spacing: -0.04em; }
.acc-bar { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.acc-bar i { display: block; height: 100%; background: var(--accent); border-radius: 8px; }
@media (max-width: 380px) {
  .pc-ovr b { font-size: 50px; }
  .score-n { font-size: 40px; }
  .vb { grid-template-columns: minmax(0, 7.5em) 1fr 2.2em; }
}
.av-btn { appearance: none; border: 0; background: none; padding: 0; border-radius: 50%; cursor: zoom-in; flex: none; }
.photo-big { display: flex; justify-content: center; }

/* ---------- gruppi, menu, messaggi ---------- */
.nav-in { grid-template-columns: repeat(5, 1fr); }
.nav-btn { font-size: 11px; }
.nav-ic { position: relative; display: inline-flex; }
.count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; font: 700 11.5px/1 var(--f-body); font-variant-numeric: tabular-nums; }
.nav-badge { position: absolute; top: -6px; right: -12px; min-width: 18px; height: 18px; padding: 0 5px; font-size: 10.5px; box-shadow: 0 0 0 2px var(--bg); }
.page-head .icon-btn { position: relative; }
.dot-badge { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--surface); }
.group-chip { appearance: none; border: 0; background: var(--surface-2); color: var(--ink-2); border-radius: 999px; padding: 5px 10px 5px 12px; margin-top: 6px; font: 600 13px/1.2 var(--f-body); display: inline-flex; align-items: center; gap: 6px; max-width: 100%; cursor: pointer; }

.menu-item { appearance: none; border: 0; background: var(--surface-2); color: var(--ink); border-radius: 14px; padding: 13px 14px; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: 600 15px/1.25 var(--f-body); cursor: pointer; }
.menu-item .ic:last-child { color: var(--ink-3); }

.req-row { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; }
.reply { background: var(--surface-2); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; }
.dev-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dev-mail { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.sel { user-select: all; -webkit-user-select: all; }
select.input { appearance: auto; }

.icon-btn.flat { border-color: transparent; background: transparent; }

.spin { display: inline-block; width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--accent); animation: rot 0.8s linear infinite; }
.spin.sm { width: 16px; height: 16px; border-width: 2px; }
.spin.light { border-color: rgba(255, 255, 255, 0.35); border-top-color: #fff; }
@keyframes rot { to { transform: rotate(360deg); } }
body.in-chat { overflow: hidden; overscroll-behavior: none; }

/* elenco delle chat */
.chats-page { gap: 14px; }
.search-in { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 0 12px; color: var(--ink-3); }
.search-in .input { border: 0; background: transparent; padding-left: 0; }
.clist { display: flex; flex-direction: column; margin: 0 -8px; }
.crow { appearance: none; border: 0; background: none; color: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 14px; width: 100%; min-width: 0; }
.crow:active { background: var(--surface-2); }

.crow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 2px 0 10px; border-bottom: 1px solid var(--line); }
.crow:last-child .crow-main { border-bottom: 0; }
.crow-top, .crow-bot { display: flex; align-items: center; gap: 8px; min-width: 0; }
.crow-t { flex: 1; font: 600 16px/1.25 var(--f-body); }
.crow-time { flex: none; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.crow-time.on { color: var(--ch-send); font-weight: 600; }
.crow-s { flex: 1; min-width: 0; color: var(--ink-2); font-size: 14px; line-height: 1.35; display: flex; align-items: center; gap: 3px; }
.crow-s .tk { flex: none; }
.cbadge { flex: none; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 999px; background: var(--ch-send); color: #fff; font: 700 12px/21px var(--f-body); text-align: center; font-variant-numeric: tabular-nums; }
.cbadge.muted { background: var(--ink-3); }
.mute-ic { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--ink-3); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gav { display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: 50%; color: #fff; font: 700 16px/1 var(--f-display); letter-spacing: -0.02em;
  background: linear-gradient(135deg, hsl(var(--h, 150) 55% 42%), hsl(calc(var(--h, 150) + 40) 60% 32%)); }
.push-card { padding: 12px; gap: 10px; }
.push-ic { width: 36px; height: 36px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex: none; }

/* la chat a tutto schermo */
.cv { position: fixed; left: 0; right: 0; top: var(--vvt, 0px); height: var(--vvh, 100dvh); z-index: 40; background: var(--ch-bg); color: var(--ch-ink); }
.cv-in { position: relative; max-width: 820px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
.cv-head { flex: none; display: flex; align-items: center; gap: 4px; padding: calc(6px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 6px max(4px, env(safe-area-inset-left, 0px));
  background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--line); z-index: 3; min-height: 58px; }
.cv-who { appearance: none; border: 0; background: none; color: inherit; flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 12px; text-align: left; }
.cv-ttl { min-width: 0; display: flex; flex-direction: column; }
.cv-name { font: 700 16.5px/1.2 var(--f-body); }
.cv-sub { font-size: 12.5px; color: var(--ink-3); }
.cv-sub.typing { color: var(--ch-send); font-weight: 600; }
.cv-search { flex: 1; padding: 9px 12px; }
.cv-list { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; position: relative;
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px));
  background-color: var(--ch-bg); background-image: var(--ch-doodle); background-size: 260px 260px; display: flex; flex-direction: column; }
.cv-load { display: flex; justify-content: center; padding: 40px 0; }
.cv-more { display: flex; justify-content: center; padding: 10px 0; }
.cv-start { align-self: center; max-width: 340px; margin: 8px 0 12px; padding: 7px 12px; border-radius: 10px; background: #fff5c4; color: #54656f; font-size: 12.5px; text-align: center; line-height: 1.4; box-shadow: var(--ch-shadow); }
:root[data-theme='dark'] .cv-start { background: #182229; color: #ffd279; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .cv-start { background: #182229; color: #ffd279; } }
.cv-start .ic { vertical-align: -2px; }
.cv-items { flex: none; display: flex; flex-direction: column; min-height: 100%; justify-content: flex-end; }
.day { align-self: center; margin: 10px 0 6px; pointer-events: none; }

.day span { display: inline-block; padding: 5px 12px; border-radius: 8px; background: var(--ch-chip); color: var(--ch-chip-ink); font: 500 12.5px/1.2 var(--f-body); box-shadow: var(--ch-shadow); }
.unread-sep { align-self: stretch; text-align: center; margin: 10px -10px 6px; padding: 5px 0; background: rgba(255, 255, 255, 0.35); }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .unread-sep { background: rgba(255, 255, 255, 0.06); } }

.mv-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, 0.35); color: #fff; display: none; align-items: center; justify-content: center; }
.mv-nav.l { left: 10px; } .mv-nav.r { right: 10px; }
@media (hover: hover) and (pointer: fine) { .mv-nav { display: inline-flex; } }
.mv-cap { padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, rgba(0, 0, 0, 0.6) 30%); font-size: 15px; line-height: 1.4; text-align: center; white-space: pre-wrap; }
.mv-cap a, .mv-cap .mention { color: #8fd8ff; }

/* pressione lunga */
.mm-wrap { position: fixed; inset: 0; z-index: 55; background: rgba(11, 20, 26, 0.45); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fade 0.15s ease; }
.mm { position: absolute; left: 12px; right: 12px; max-width: 340px; display: flex; flex-direction: column; gap: 8px; margin: 0 auto; animation: pop 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
@media (min-width: 720px) { .mm { left: 50%; right: auto; width: 340px; transform: translateX(-50%); } }
@keyframes pop { from { transform: scale(0.92); opacity: 0; } }
.mm-rx { display: flex; align-items: center; justify-content: space-between; gap: 2px; padding: 6px 8px; border-radius: 999px; background: var(--ch-pill); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); }
.mm-rx button { appearance: none; border: 0; background: none; width: 40px; height: 40px; border-radius: 50%; font-size: 26px; line-height: 1; padding: 0; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.12s ease; }
.mm-rx button:active { transform: scale(1.25); }
.mm-rx button.on { background: var(--ch-q); }
.mm-rx button.plus { color: var(--ch-meta); background: var(--ch-q); width: 34px; height: 34px; }
.mm-prev { flex: none; max-height: 30vh; overflow: hidden; padding: 8px 10px; border-radius: 10px; font-size: 15px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--ch-shadow); color: var(--ch-ink); }
.mm-prev.in { background: var(--ch-in); align-self: flex-start; max-width: 100%; }
.mm-prev.out { background: var(--ch-out); align-self: flex-end; max-width: 100%; }
.mm-acts { border-radius: 14px; overflow: hidden; background: var(--ch-pill); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); }
.mm-it { appearance: none; border: 0; background: none; color: var(--ch-ink); display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 13px 16px; font: 500 15.5px/1.2 var(--f-body); text-align: left; }
.mm-it + .mm-it { border-top: 1px solid var(--line); }
.mm-it.bad { color: var(--bad); }
.mm-it:active { background: var(--ch-q); }
.rx-tabs { display: flex; gap: 6px; overflow-x: auto; }
.rx-tabs button { appearance: none; border: 0; padding: 7px 12px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font: 600 13.5px/1 var(--f-body); white-space: nowrap; }
.rx-tabs button.on { background: var(--accent-soft); color: var(--accent); }
.rx-big { font-size: 24px; }

/* info della chat */
.ci-top { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 4px 0; }
.ci-media { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.ci-media .mimg { border-radius: 8px; }
.fwd-l { display: flex; align-items: center; gap: 4px; margin: 0 0 2px; font: italic 400 12.5px/1.3 var(--f-body); color: var(--ch-meta); }
.bub.media .fwd-l { padding: 2px 4px 0; }
.fwd-ck { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: inline-flex; align-items: center; justify-content: center; color: var(--on-accent); }
.fwd-ck.on { background: var(--accent); border-color: var(--accent); }
.sheet-cta { position: sticky; bottom: -22px; z-index: 2; margin: 0 -2px -22px; padding: 10px 2px 22px; background: linear-gradient(to top, var(--surface) 75%, transparent); }
.space-bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.space-bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.space-bar i.hi { background: var(--warn); }

/* ---- comuni, età, filtri, infortuni ---- */
.place-val { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 7px 8px 7px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
.place-val > .ic { color: var(--accent); flex: none; }
.place-list { max-height: 320px; overflow-y: auto; }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 10px; }
.pmeta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: -4px; font-size: 13.5px; color: var(--ink-2); }
.meta-i { display: inline-flex; align-items: center; gap: 5px; }
.meta-i .ic { color: var(--ink-3); }
.meta-i em { font-style: normal; color: var(--ink-3); margin-left: 6px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pick-chip { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 7px 12px; font: 600 13px/1.2 var(--f-body); cursor: pointer; }
.pick-chip.on { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.range2 { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
.range2 > span { color: var(--ink-3); }
.range2 .input { padding: 10px 8px; text-align: center; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: var(--ink); cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.filters { gap: 14px; }
.row-s.inj-t { color: var(--warn); }
.bad-t { color: var(--bad); }

/* ---- partita: schede, squadre con i colori, confronto, campo ---- */
.seg.mtabs button { padding: 10px 6px; font-weight: 700; }
.team-tag { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font: 700 13.5px/1.2 var(--f-body); color: var(--ink); }
.team-tag.big { flex-direction: column; gap: 4px; font-size: 15px; text-align: center; }
.team-tag .ic { flex: none; }
.shirt { flex: none; display: block; }
.side-dot { flex: none; width: 22px; display: inline-flex; align-items: center; justify-content: center; font: 700 12px/1 var(--f-body); color: var(--warn); }
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.swatch { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 11px/1.1 var(--f-body); color: var(--ink-2); cursor: pointer; min-width: 0; }
.swatch span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swatch.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); }
.vs { display: flex; flex-direction: column; gap: 14px; }
.vs-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.vs-head .team-tag.big { justify-self: center; }
.vs-x { font: 800 15px/1 var(--f-display); color: var(--ink-3); letter-spacing: 0.06em; }
.duel { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; }
.duel-v { font: 800 20px/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: center; }
.duel-bar { position: relative; height: 12px; border-radius: 12px; background: var(--surface-2); overflow: hidden; }
.duel-bar i { position: absolute; top: 0; bottom: 0; }
.duel-bar i.l { right: 50%; background: var(--ta); border-radius: 12px 0 0 12px; }
.duel-bar i.r { left: 50%; background: var(--tb); border-radius: 0 12px 12px 0; }
.duel-bar::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--surface); }
.vs-sub { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.vs-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vs-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.vs-ch { display: flex; justify-content: space-between; font: 600 12px/1 var(--f-body); color: var(--ink-3); padding: 0 4px; }
.vs-p { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 8px 9px; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "av av" "n n" "r r" "bar v"; justify-items: center; align-items: center; gap: 3px 6px; text-align: center; color: var(--ink); cursor: pointer; min-width: 0; }
.vs-av { grid-area: av; position: relative; }
.vs-inj { position: absolute; right: -4px; bottom: -2px; background: var(--surface); border-radius: 50%; padding: 1px; }
.vs-n { grid-area: n; font: 700 13.5px/1.2 var(--f-body); max-width: 100%; }
.vs-r { grid-area: r; font-size: 12px; color: var(--ink-2); }
.vs-r em { font-style: normal; color: var(--warn); font-weight: 700; }
.vs-bar { grid-area: bar; justify-self: stretch; height: 5px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.vs-bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.vs-v { grid-area: v; font: 800 14px/1 var(--f-display); color: var(--accent); }
.pitch-wrap { border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); max-width: 460px; width: 100%; margin: 0 auto; }
.pitch { display: block; width: 100%; height: auto; }
.pt-bg { fill: #2c8a4b; }
.pt-stripe { fill: #349a57; }
.pt-goal { stroke: rgba(255, 255, 255, 0.9); stroke-width: 0.35; }
.pt-l { fill: none; stroke: rgba(255, 255, 255, 0.88); stroke-width: 0.55; stroke-linejoin: round; }
.pt-dot { fill: rgba(255, 255, 255, 0.9); }
.pd { cursor: pointer; }
.pd-shirt { stroke: rgba(0, 0, 0, 0.42); stroke-width: 0.9; stroke-linejoin: round; filter: drop-shadow(0 0.6px 0.6px rgba(0, 0, 0, 0.35)); }
.pd-i { font: 700 3.7px/1 var(--f-body); }
.pd-big { font: 800 5.6px/1 var(--f-display); letter-spacing: -0.02em; }
.pd-e { font-size: 4.6px; }
.pd-nb { stroke: rgba(0, 0, 0, 0.25); stroke-width: 0.25; }
.pd-no { font: 800 2.7px/1 var(--f-display); }
.pd-n { font: 700 3.5px/1 var(--f-body); fill: #fff; paint-order: stroke; stroke: rgba(0, 0, 0, 0.6); stroke-width: 0.85px; stroke-linejoin: round; }
.pd.me .pd-n { fill: #ffe27a; }
.pitch-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 460px; width: 100%; margin: 0 auto; }
.pick-side { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 11px 14px; display: flex; align-items: center; gap: 12px; color: var(--ink); cursor: pointer; width: 100%; }
.pick-side.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.pick-side[disabled] { opacity: 0.5; cursor: not-allowed; }

/* ---- sondaggio sul giorno ---- */
.card.poll { border-style: dashed; }
.poll-mini { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
.pm-row { display: grid; grid-template-columns: 86px 1fr auto; align-items: center; gap: 10px; }
.pm-d { font: 600 13px/1.2 var(--f-body); color: var(--ink); white-space: nowrap; }
.pm-row .bar, .poll-day .bar, .poll-res .bar { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.pm-row .bar i, .poll-day .bar i, .poll-res .bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.pm-row .cnt { font: 600 12.5px/1 var(--f-body); color: var(--ink-2); }
.poll-day { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.poll-day.past { opacity: 0.5; }
.pd-main { appearance: none; border: 0; background: none; padding: 0; margin: 0; flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.pd-main > .grow { min-width: 0; display: flex; flex-direction: column; }
.pd-main .ic { color: var(--ink-3); flex: none; }
.pd-main .bar { display: block; }
.poll-res .bar { display: block; }
.poll-res.on { background: var(--accent-soft); }
.pv-pos { flex: none; min-width: 26px; font: 600 13px/1 var(--f-body); color: var(--ink-3); text-align: right; }
.poll-day.on { background: var(--accent-soft); }
.pd-check { appearance: none; flex: none; width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); background: var(--surface); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.poll-day.on .pd-check { background: var(--accent); border-color: var(--accent); }
.pd-check[disabled] { cursor: not-allowed; }
.stack-4 { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.daygrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dayc { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); cursor: pointer; min-width: 0; }
.dayc .dw, .dayc .dm { font: 600 10px/1 var(--f-body); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
.dayc b { font: 800 16px/1.1 var(--f-display); }
.dayc.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dayc.on .dw, .dayc.on .dm { color: var(--on-accent); opacity: 0.85; }

/* ---- amici e affinità ---- */
.chip.friend { background: #fde8ec; color: #c0264a; }
:root[data-theme="dark"] .chip.friend { background: #4a1724; color: #ff9fb3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.friend { background: #4a1724; color: #ff9fb3; } }
.chip.friend .ic { width: 12px; height: 12px; }
.aff-me { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 10px; }
.aff-me .tiny { grid-column: 1 / -1; }
.aff-bar { flex: 1; min-width: 50px; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; display: block; }
.aff-bar i { display: block; height: 100%; background: #e0486b; border-radius: 6px; }
.row .aff-bar { flex: 0 0 70px; }
.aff-v { min-width: 22px; text-align: right; }
.duel-aff { display: grid; grid-template-columns: 1fr 1fr; color: #c0264a; font-weight: 600; margin-top: -8px; }
.duel-aff span:first-child { text-align: left; padding-left: 4px; }
.duel-aff span:last-child { text-align: right; padding-right: 4px; }
.row-link { appearance: none; border: 0; background: none; padding: 0; margin: 0; display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; }

/* ---- card a tutto schermo in stile FIFA ---- */
button.pc-ovr { appearance: none; border: 0; background: none; padding: 0; margin: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; position: relative; align-items: flex-start; }
.pc-exp { position: absolute; left: 0; top: -14px; opacity: 0.55; letter-spacing: 0; }
.pc-exp .ic { width: 13px; height: 13px; }
.fifa-ov { position: fixed; inset: 0; z-index: 80; background: rgba(6, 10, 8, 0.86); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; animation: fifa-in 0.25s ease-out; }
@keyframes fifa-in { from { opacity: 0; } to { opacity: 1; } }
.fifa-x { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, 0.14); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.fifa-hint { color: rgba(255, 255, 255, 0.7); font-size: 12.5px; text-align: center; }
.fifa-flip { position: relative; width: min(84vw, 340px, 56vh); aspect-ratio: 2 / 3; perspective: 1400px; cursor: pointer; animation: fifa-pop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
@keyframes fifa-pop { from { transform: scale(0.8) rotate(-3deg); opacity: 0; } to { transform: none; opacity: 1; } }
.fifa-flip .fifa { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform 0.6s cubic-bezier(0.3, 0.7, 0.2, 1); }
.fifa-flip .back { transform: rotateY(180deg); }
.fifa-flip.on .front { transform: rotateY(-180deg); }
.fifa-flip.on .back { transform: rotateY(0deg); }
.fifa { --ink: #2c2008; --line: rgba(44, 32, 8, 0.32);
  color: var(--ink); display: flex; flex-direction: column; align-items: center; padding: 15% 11.5% 20%; }
.fifa.back { padding: 13% 11% 20%; }
.fifa.silver { --ink: #1c2125; --line: rgba(28, 33, 37, 0.3); }
.fifa.bronze { --ink: #2e1c0d; --line: rgba(46, 28, 13, 0.32); }
.fifa.mvpc { --ink: #f0dca0; --line: rgba(240, 220, 160, 0.35); }
.fifa > * { position: relative; z-index: 1; }
/* il retro non deve trasparire: anche i figli nascondono il lato girato (servono per ombre e animazioni) */
.fifa-flip .fifa > *, .fifa-flip .fifa::after { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.fifa > .fifa-frame { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; overflow: visible; filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.42)); }
.fifa-sh { animation: fifa-sh 2.4s ease-in-out 0.35s 1 both; }
@keyframes fifa-sh { to { transform: translateX(440px); } }
.fifa-top { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 4%; width: 100%; align-items: start; }
.fifa-ovr { display: flex; flex-direction: column; align-items: center; padding-top: 3%; }
.fifa-ovr b { font: 800 clamp(44px, 15vw, 64px)/0.9 var(--f-display); letter-spacing: -0.04em; }
.fifa-ovr span { font: 800 clamp(13px, 4.2vw, 17px)/1.1 var(--f-body); letter-spacing: 0.08em; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.fifa-ovr em { font-style: normal; font-size: 0.72em; opacity: 0.7; }
.fifa-ph { aspect-ratio: 1; width: 100%; max-width: 190px; justify-self: end; border-radius: 50% 50% 12% 12%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.22); box-shadow: inset 0 0 0 2px var(--line); }
.fifa-ph img { width: 100%; height: 100%; object-fit: cover; }
.fifa-ic { font-size: clamp(54px, 20vw, 92px); line-height: 1; font-weight: 800; }
.fifa-name { position: relative; margin-top: 5%; font: 800 clamp(20px, 7vw, 30px)/1.05 var(--f-display); letter-spacing: 0.04em; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fifa-full { position: relative; font-size: 12px; opacity: 0.75; margin-top: 2px; }
.fifa-stats { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; width: 100%; margin-top: 6%; padding-top: 5%; border-top: 1.5px solid var(--line); }
.fifa-stats .fs { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
.fifa-stats .fs b { font: 800 clamp(18px, 6vw, 24px)/1 var(--f-display); }
.fifa-stats .fs span { font: 700 12px/1 var(--f-body); letter-spacing: 0.06em; opacity: 0.8; }
.fifa-stats .fs.dim { opacity: 0.5; }
.fifa-foot { position: relative; margin-top: auto; font-size: 10.5px; font-weight: 600; opacity: 0.75; text-align: center; max-width: 72%; line-height: 1.25; }
.fifa-bh { position: relative; display: flex; align-items: baseline; gap: 10px; width: 100%; justify-content: center; padding-bottom: 4%; border-bottom: 1.5px solid var(--line); }
.fifa-bh b { font: 800 30px/1 var(--f-display); }
.fifa-bh span { font: 800 16px/1 var(--f-display); letter-spacing: 0.05em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fifa-voci { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 3% 8%; width: 100%; margin-top: 4%; font-size: clamp(10.5px, 3.1vw, 12.5px); }
.fv-h { display: flex; justify-content: space-between; gap: 6px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--line); padding-bottom: 2px; margin-bottom: 2px; }
.fv-r { display: flex; justify-content: space-between; gap: 6px; line-height: 1.45; }
.fv-r span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fv.dim { opacity: 0.55; }

/* ---- card: entrata (gira e si posa, poi una luce si diffonde e compaiono le stats), raggi nei momenti speciali ---- */
.fifa-ov { overflow: hidden; }
.fifa-ov.enter { perspective: 1100px; }
.fifa-mvp { position: absolute; top: 2.6%; left: 0; right: 0; margin: 0 auto; width: max-content; display: inline-flex; align-items: center; gap: 4px; font: 800 10.5px/1 var(--f-body); letter-spacing: 0.12em; padding: 5px 9px; border-radius: 999px; background: rgba(240, 220, 160, 0.14); border: 1px solid var(--line); }
.fifa > .fifa-mvp { position: absolute; }
.fifa-rays { position: absolute; left: 50%; top: 45%; width: 180vmax; height: 180vmax; margin: -90vmax 0 0 -90vmax; pointer-events: none; animation: rays-life 2.2s ease-out both; --ray: 240, 200, 90; }
.fifa-rays.silver { --ray: 215, 228, 242; }
.fifa-rays.bronze { --ray: 232, 166, 112; }
.fifa-rays.mvpc { --ray: 241, 194, 47; }
.fifa-rays i { position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg, rgba(var(--ray), 0) 0deg 8deg, rgba(var(--ray), 0.22) 8deg 15deg); -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0.55) 22%, transparent 46%); mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0.55) 22%, transparent 46%); animation: rays-spin 30s linear infinite; }
@keyframes rays-life { 0% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: none; } 100% { opacity: 0.45; transform: none; } }
@keyframes rays-spin { to { transform: rotate(360deg); } }
.fifa-rays.skip { animation: none; opacity: 0.45; }
.fifa-flash { --fl: 255, 255, 255; position: absolute; left: 50%; top: 45%; width: 72vmin; height: 72vmin; margin: -36vmin 0 0 -36vmin; border-radius: 50%; background: radial-gradient(circle, rgba(var(--fl), 0.8), rgba(var(--fl), 0) 65%); pointer-events: none; animation: fifa-flash 1.6s ease-out both; }
.fifa-flash.gold { --fl: 255, 236, 186; }
.fifa-flash.silver { --fl: 236, 243, 250; }
.fifa-flash.bronze { --fl: 255, 224, 196; }
.fifa-flash.mvpc { --fl: 255, 232, 170; }
@keyframes fifa-flash { 0%, 50% { opacity: 0; transform: scale(0.25); } 64% { opacity: 0.9; } 100% { opacity: 0; transform: scale(2.3); } }
.fifa-flip.enter { transform-style: preserve-3d; animation: fifa-enter 1.05s cubic-bezier(0.2, 0.75, 0.25, 1) both; }
@keyframes fifa-enter {
  0% { opacity: 0; transform: translateY(26vh) scale(0.42) rotateY(-540deg); }
  12% { opacity: 1; }
  72% { transform: translateY(-1.5vh) scale(1.05) rotateY(0deg); }
  100% { opacity: 1; transform: none; }
}
/* "backwards": finita l'animazione non resta niente sui figli, così il retro non traspare quando si gira */
.fifa-flip.enter .rv { animation: fifa-reveal 0.6s ease-out backwards; animation-delay: var(--d, 1s); }
@keyframes fifa-reveal { from { opacity: 0; filter: blur(9px); transform: scale(1.06); } to { opacity: 1; filter: none; transform: none; } }
.fifa-flip.enter .fifa.front::after { content: ''; position: absolute; inset: 6% 8% 16%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0)); opacity: 0; pointer-events: none; z-index: 2; animation: face-glow 1.15s ease-out 0.72s backwards; }
@keyframes face-glow { 0% { opacity: 0; transform: scale(0.4); } 32% { opacity: 1; } 100% { opacity: 0; transform: scale(1.5); } }
.fifa-flip.enter .fifa-sh { animation-delay: 1.45s; }
.fifa-flip.enter.skip, .fifa-flip.enter.skip .rv, .fifa-flip.enter.skip .fifa-sh { animation: none; }
.fifa-flip.enter.skip .fifa.front::after { animation: none; opacity: 0; }
.fifa-tag { position: relative; color: #fff; font: 800 14.5px/1 var(--f-display); letter-spacing: 0.03em; padding: 9px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.26); animation: tag-in 0.45s ease-out both; }
.fifa-tag.late { animation-delay: 1.45s; }
@keyframes tag-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.fifa-share { position: relative; appearance: none; border: 0; display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 999px; background: #fff; color: #0f1812; font: 700 14.5px/1 var(--f-body); cursor: pointer; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3); }
.fifa-hint { position: relative; }
.share-prev { display: block; width: auto; max-width: 100%; max-height: 52vh; margin: 0 auto; border-radius: 14px; box-shadow: var(--shadow); }
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 200; }
/* addobbi delle feste: accanto al titolo (toccandolo riparte l'effetto) e sul campo */
:root { --festa-snow: #4f8fd6; }
:root[data-theme='dark'] { --festa-snow: #cfe6ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --festa-snow: #cfe6ff; } }
.ttl-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.festa-st { appearance: none; border: 0; background: none; padding: 0; margin: -4px 0; width: 34px; height: 34px; flex: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.festa-st svg { display: block; width: 100%; height: 100%; overflow: visible; }
@media (prefers-reduced-motion: no-preference) {
  .festa-st svg { transform-origin: 50% 85%; animation: festa-sway 4s ease-in-out infinite; }
  .festa-st:active svg { animation: none; transform: scale(.88); }
}
@keyframes festa-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@media (prefers-reduced-motion: reduce) {
  .fifa-ov, .fifa-flip, .fifa-flip.enter, .fifa-flip .rv, .fifa-sh, .fifa-rays, .fifa-rays i, .fifa-flash, .fifa-tag, .fifa-flip.enter .fifa.front::after { animation: none !important; }
}

/* ---- traguardi ---- */
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 6px; }
.badge { appearance: none; border: 0; background: none; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--ink); cursor: pointer; min-width: 0; position: relative; }
.bd-n { font: 600 11.5px/1.2 var(--f-body); text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.badge:not(.done) .bd-n { color: var(--ink-3); }
.bd-new { position: absolute; top: 0; right: 6px; background: var(--accent); color: var(--on-accent); font: 700 9.5px/1 var(--f-body); padding: 3px 5px; border-radius: 6px; }
.bd-p { width: 60%; height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bd-p i { display: block; height: 100%; background: var(--ink-3); }
.emblem { --es: 52px; --r1: #e8b46a; --r2: #9a5f2c; width: var(--es); height: calc(var(--es) * 1.12); display: inline-flex; background: linear-gradient(160deg, var(--r1), var(--r2)); clip-path: polygon(50% 0, 100% 14%, 100% 58%, 50% 100%, 0 58%, 0 14%); padding: calc(var(--es) * 0.07); }
.emblem.silver { --r1: #f1f4f6; --r2: #8d979e; }
.emblem.gold { --r1: #ffe38a; --r2: #b98a1e; }
.em-in { flex: 1; display: flex; align-items: center; justify-content: center; clip-path: polygon(50% 0, 100% 14%, 100% 58%, 50% 100%, 0 58%, 0 14%); background: radial-gradient(circle at 50% 35%, var(--surface), var(--surface-2)); }
.em-e { font-size: calc(var(--es) * 0.46); line-height: 1; margin-top: -8%; }
.emblem.off { --r1: var(--surface-2); --r2: var(--line); }
.emblem.off .em-e { filter: grayscale(1); opacity: 0.35; }
.bd-big { display: flex; justify-content: center; padding: 6px 0 4px; }
.stack-12 { display: flex; flex-direction: column; gap: 12px; }
.bd-sum { display: flex; align-items: center; gap: 12px; }
.bd-sum .small { white-space: nowrap; }
.bd-sum .small b { font-size: 15px; }
.bd-p.wide { width: auto; flex: 1; height: 6px; }
.bd-p.wide i { background: var(--accent); }
.bd-tiers { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.bd-tier { display: inline-flex; align-items: center; gap: 6px; font: 700 14px/1 var(--f-body); }
.bd-tier .emblem { padding: 2px; }

/* ---- meteo ---- */
.wx { display: inline-flex; align-items: center; gap: 3px; font: 600 12.5px/1 var(--f-body); color: var(--ink-2); white-space: nowrap; }
.wx-i { font-size: 15px; line-height: 1; }
.wx-p { color: #2f6fc0; font-size: 11.5px; }
.wx-l { color: var(--ink-2); font-weight: 500; }

</style>
</head>
