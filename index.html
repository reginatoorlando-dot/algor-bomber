/* ---------- notifiche sul telefono ---------- */
const Push = (() => {
  const b64u = (s) => { let t = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; const b = atob(t); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = () => { try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };
  const supported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const reg = () => (navigator.serviceWorker && navigator.serviceWorker.ready) || Promise.reject(new Error('sw'));
  /* la chiave pubblica delle notifiche: la crea la funzione "notify" la prima volta, poi sta nel database */
  const NOFN = { code: 'nofn', message: 'Le notifiche non sono ancora pronte: un amministratore deve pubblicare la funzione "notify" su Supabase.' };
  const getKey = async (be) => {
    const db = be && be.db;
    let k = '';
    try { if (db && db.rpc) k = await db.rpc('push_public_key'); } catch (e) { k = ''; }
    if (!k && db && db.fn) { try { const r = await db.fn('notify', { key: true }); k = r && r.pub; } catch (e) { k = ''; } }
    if (!k || typeof k !== 'string') throw NOFN;
    return k;
  };
  /* il telefono è iscritto con la chiave di adesso? (se le chiavi cambiano va iscritto di nuovo) */
  const sameKey = (s, k) => {
    try {
      const a = s.options && s.options.applicationServerKey;
      if (!a) return true;
      const x = new Uint8Array(a), y = b64u(k);
      return x.length === y.length && x.every((v, i) => v === y[i]);
    } catch (e) { return true; }
  };
  const register = async (be, sub) => {
    const j = sub.toJSON();
    await be.db.rpc('push_register', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent.slice(0, 200) });
  };
  return {
    isIOS, standalone,
    /* 'on', 'off', 'denied', 'ios-home' (iPhone: serve l'app nella schermata Home), 'unsupported' */
    async state() {
      if (!supported()) return isIOS() && !standalone() ? 'ios-home' : 'unsupported';
      if (Notification.permission === 'denied') return 'denied';
      try { const r = await reg(); const s = await r.pushManager.getSubscription(); return s && Notification.permission === 'granted' ? 'on' : 'off'; } catch (e) { return 'unsupported'; }
    },
    async enable(be) {
      /* il permesso si chiede subito, finché vale il tocco sul pulsante */
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') return perm === 'denied' ? 'denied' : 'off';
      const k = await getKey(be);
      const r = await reg();
      let s = await r.pushManager.getSubscription();
      if (s && !sameKey(s, k)) { await s.unsubscribe().catch(() => {}); s = null; }
      if (!s) s = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(k) });
      await register(be, s);
      writeLS('sc-push-on', '1');
      return 'on';
    },
    async disable(be) {
      writeLS('sc-push-on', null);
      try {
        const r = await reg(); const s = await r.pushManager.getSubscription();
        if (s) { const ep = s.endpoint; await s.unsubscribe().catch(() => {}); if (be.db.rpc) await be.db.rpc('push_unregister', { p_endpoint: ep }).catch(() => {}); }
      } catch (e) { /* niente da togliere */ }
      return 'off';
    },
    /* a ogni apertura: il database sa sempre a quale telefono mandare (e con quale chiave) */
    async sync(be) {
      try {
        if (!supported() || Notification.permission !== 'granted' || !be || !be.db || !be.db.rpc) return;
        const r = await reg();
        let s = await r.pushManager.getSubscription();
        if (!s && readLS('sc-push-on', '') !== '1') return;
        const k = await getKey(be);
        if (s && !sameKey(s, k)) { await s.unsubscribe().catch(() => {}); s = null; }
        if (!s) s = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(k) });
        await register(be, s);
      } catch (e) { /* riprova alla prossima apertura */ }
    },
  };
})();

/* ---------- dati di una chat: messaggi (gli ultimi, poi i precedenti a richiesta) e letture ---------- */
function useChatData(chat) {
  const C = useContext(Ctx);
  const [st, setSt] = useState({ msgs: null, floor: 0 });
  const [reads, setReads] = useState([]);
  const [hasMore, setHasMore] = useState(true);
  const busy = useRef(false);
  useEffect(() => {
    setSt({ msgs: null, floor: 0 }); setReads([]); setHasMore(true);
    const db = C.be.db;
    let u1 = () => {}, u2 = () => {};
    try {
      u1 = db.collection(chatPath(chat), { last: 150, order: 't' }).onSnapshot(
        (s) => setSt({ msgs: s.docs.map((x) => Object.assign({ id: x.id }, x.data())), floor: numOr(s.floor, 0) }),
        () => setSt((x) => (x.msgs ? x : { msgs: [], floor: 0 })));
    } catch (e) { setSt({ msgs: [], floor: 0 }); }
    try { u2 = db.collection(readsPath(chat)).onSnapshot((s) => setReads(s.docs.map((x) => Object.assign({ id: x.id }, x.data()))), () => {}); } catch (e) { /* senza letture */ }
    return () => { try { u1(); } catch (e) { /* già chiusa */ } try { u2(); } catch (e) { /* già chiusa */ } };
  }, [chat]);
  const more = async () => {
    const db = C.be.db;
    if (busy.current || !hasMore || !db.older || !st.msgs) return 0;
    if (!st.floor) { setHasMore(false); return 0; }
    busy.current = true;
    try { const n = await db.older(chatPath(chat), st.floor, 100); if (n < 100) setHasMore(false); return n; }
    catch (e) { return 0; }
    finally { busy.current = false; }
  };
  return { msgs: st.msgs, floor: st.floor, reads, hasMore: hasMore && !!st.floor, more };
}

/* "sta scrivendo…": un canale privato per chat, dentro il tempo reale */
function useTyping(chat, uid) {
  const C = useContext(Ctx);
  const [who, setWho] = useState({});
  const ch = useRef(null), last = useRef(0);
  useEffect(() => {
    setWho({});
    const db = C.be.db;
    if (!db.channel) return;
    let c = null;
    try { c = db.channel('chat:' + chat); } catch (e) { return; }
    ch.current = c;
    c.on('typing', (p) => { if (p && p.u && p.u !== uid) setWho((w) => Object.assign({}, w, { [p.u]: Date.now() + 6000 })); });
    c.on('stop', (p) => { if (p && p.u) setWho((w) => { if (!w[p.u]) return w; const n = Object.assign({}, w); delete n[p.u]; return n; }); });
    const t = setInterval(() => setWho((w) => { const now = Date.now(), k = Object.keys(w); const live = k.filter((u) => w[u] > now); return live.length === k.length ? w : Object.fromEntries(live.map((u) => [u, w[u]])); }), 1500);
    return () => { clearInterval(t); try { c.close(); } catch (e) { /* già chiuso */ } ch.current = null; };
  }, [chat]);
  return {
    who: Object.keys(who),
    ping() { const n = Date.now(); if (n - last.current < 2500 || !ch.current) return; last.current = n; ch.current.send('typing', { u: uid }); },
    stop() { if (!last.current || !ch.current) return; last.current = 0; ch.current.send('stop', { u: uid }); },
    gone(u) { setWho((w) => { if (!w[u]) return w; const n = Object.assign({}, w); delete n[u]; return n; }); },
  };
}
function typingText(C, ids, dm) {
  if (!ids.length) return '';
  if (dm) return 'sta scrivendo…';
  const names = ids.map((u) => dispName(C.playersById[u]));
  if (names.length === 1) return names[0] + ' sta scrivendo…';
  if (names.length === 2) return names[0] + ' e ' + names[1] + ' stanno scrivendo…';
  return names.length + ' persone stanno scrivendo…';
}

/* la chat occupa lo schermo visibile anche con la tastiera aperta */
function useChatViewport() {
  useEffect(() => {
    const vv = window.visualViewport, root = document.documentElement;
    const upd = () => { if (!vv) return; root.style.setProperty('--vvh', Math.round(vv.height) + 'px'); root.style.setProperty('--vvt', Math.round(vv.offsetTop) + 'px'); };
    upd();
    if (vv) { vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd); }
    document.body.classList.add('in-chat');
    return () => {
      if (vv) { vv.removeEventListener('resize', upd); vv.removeEventListener('scroll', upd); }
      root.style.removeProperty('--vvh'); root.style.removeProperty('--vvt');
      document.body.classList.remove('in-chat');
    };
  }, []);
}

  if (st === 'failed') return html`<svg class="tk fail" viewBox="0 0 16 16" aria-label="Non inviato"><circle cx="8" cy="8" r="7" /><path d="M8 4.5v4.3M8 11.3h.01" /></svg>`;

}

}

/* ---------- una chat ---------- */
const dayKey = (t) => { const d = new Date(t); return d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate(); };

function ChatScreen({ id }) {
  const C = useContext(Ctx);
  useChatViewport();
  const dm = isDm(id);
  const other = dm ? dmOther(id, C.uid) : null;
  const op = other ? C.playersById[other] : null;
  const group = dm ? null : C.groupsById[id];
  const mem = useMemo(() => (dm ? dmUsers(id).map((u) => ({ uid: u, t: 0 })) : C.members.filter((m) => m.gid === id && m.status === 'active').map((m) => ({ uid: m.uid, t: numOr(m.t, 0), admin: m.role === 'admin' }))), [C.members, id]);
  const memberIds = mem.map((m) => m.uid);
  const amMember = memberIds.includes(C.uid);
  const amGroupAdmin = !dm && mem.some((m) => m.uid === C.uid && m.admin);
  const canWrite = C.canWrite && !!C.me && (dm ? C.canDm(other) : amMember);
  const A = useMemo(() => chatActions(C), [C.be, C.uid]);
  const { msgs, floor, reads, hasMore, more } = useChatData(id);
  const out = useOutbox(id);
  const [hideTick, setHideTick] = useState(0);
  const hidden = useMemo(() => hiddenOf(C.uid, id), [id, hideTick]);
  const typing = useTyping(id, C.uid);
  const [reply, setReply] = useState(null);
  const [edit, setEdit] = useState(null);
  const [menu, setMenu] = useState(null);
  const [sheet, setSheet] = useState(null);
  const [viewer, setViewer] = useState(null);
  const [search, setSearch] = useState(null);
  const [hl, setHl] = useState(null);
  const [newBelow, setNewBelow] = useState(0);
  const [showDown, setShowDown] = useState(false);
  const listRef = useRef(null);
  const atBottom = useRef(true);
  const firstDone = useRef(false);
  const lastSeenId = useRef(null);
  const keepFrom = useRef(null);
  const initRead = useRef(null);
  if (initRead.current == null) initRead.current = C.chatReadOf(id);

  /* messaggi del database + quelli che sto mandando */
  const all = useMemo(() => {
    const by = new Map();
    for (const m of msgs || []) if (m && m.by && numOr(m.t, 0) >= floor) by.set(m.id, m);
    for (const o of out) if (!by.has(o.id)) by.set(o.id, Object.assign({}, o.msg, { _st: o.status, _p: o.progress }));
    return Array.from(by.values()).filter((m) => !hidden.has(m.id)).sort((a, b) => numOr(a.t, 0) - numOr(b.t, 0) || (a.id < b.id ? -1 : 1));
  }, [msgs, out, hidden, floor]);
  const byId = useMemo(() => new Map(all.map((m) => [m.id, m])), [all]);
  const readsBy = useMemo(() => Object.fromEntries(reads.map((r) => [r.id, r])), [reads]);
  const since = useMemo(() => Object.fromEntries(mem.map((m) => [m.uid, m.t])), [mem]);

  /* chi deve ricevere un mio messaggio: gli altri della chat, entrati prima del messaggio */
  const recipients = (m) => memberIds.filter((u) => u !== m.by && numOr(since[u], 0) <= numOr(m.t, 0) + 60000);
  const tickOf = (m) => {
    if (m._st === 'sending' || m._st === 'sent') return m._st === 'sent' ? 'sent' : 'pending';
    if (m._st === 'failed') return 'failed';
    const rec = recipients(m);
    if (!rec.length) return 'sent';
    let read = true, deliv = true;
    for (const u of rec) {
      const r = readsBy[u], rr = r ? numOr(r.r, 0) : 0, dd = r ? Math.max(numOr(r.d, 0), rr) : 0;
      if (rr < m.t) read = false;
      if (dd < m.t) deliv = false;
    }
    return read ? 'read' : deliv ? 'delivered' : 'sent';
  };

  /* il primo non letto, deciso all'apertura */
  const firstUnread = useMemo(() => {
    const r0 = numOr(initRead.current, 0);
    if (!r0 && !dm && !amMember) return null;
    const x = all.find((m) => m.by !== C.uid && !m.local && numOr(m.t, 0) > r0 && numOr(m.t, 0) > numOr(since[C.uid], 0));
    return x ? x.id : null;
  }, [msgs === null]);
  const unreadCount = useMemo(() => (firstUnread ? all.filter((m) => m.by !== C.uid && numOr(m.t, 0) >= numOr((byId.get(firstUnread) || {}).t, 0)).length : 0), [firstUnread]);

  /* letto: quando la chat è aperta e si vede */
  useEffect(() => {
    if (!msgs) return;
    const mark = () => {
      if (document.visibilityState !== 'visible') return;
      const t = Math.max(0, ...msgs.filter((m) => m.by !== C.uid).map((m) => numOr(m.t, 0)));
      const mine = readsBy[C.uid];
      if (t && (!mine || numOr(mine.r, 0) < t)) { A.seen([{ c: id, r: t, d: t }]).then(() => C.refreshInbox()); C.markChatRead(id); }
      else C.markChatRead(id);
      try { if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then((r) => (r.getNotifications ? r.getNotifications({ tag: 'chat-' + id }) : [])).then((ns) => ns.forEach((n) => n.close())).catch(() => {}); } catch (e) { /* niente da chiudere */ }
    };
    const tm = setTimeout(mark, 350);
    document.addEventListener('visibilitychange', mark);
    return () => { clearTimeout(tm); document.removeEventListener('visibilitychange', mark); };
  }, [msgs, reads]);

  /* scorrimento: all'apertura sul primo non letto (o in fondo), poi resta in fondo se ci si era */
  preactHooks.useLayoutEffect(() => {
    const el = listRef.current;
    if (!el || msgs === null) return;
    const last = all[all.length - 1];
    if (!firstDone.current) {
      firstDone.current = true;
      lastSeenId.current = last ? last.id : null;
      const sep = el.querySelector('.unread-sep');
      if (sep) el.scrollTop = Math.max(0, sep.offsetTop - el.clientHeight * 0.25);
      else el.scrollTop = el.scrollHeight;
      return;
    }
    if (keepFrom.current != null) { el.scrollTop = el.scrollHeight - keepFrom.current; keepFrom.current = null; return; }
    if (!last || last.id === lastSeenId.current) return;
    const idx = all.findIndex((m) => m.id === lastSeenId.current);
    const added = idx >= 0 ? all.slice(idx + 1) : [last];
    lastSeenId.current = last.id;
    added.forEach((m) => { if (m.by !== C.uid) typing.gone(m.by); });
    if (atBottom.current || added.some((m) => m.by === C.uid)) { el.scrollTop = el.scrollHeight; setNewBelow(0); }
    else setNewBelow((n) => n + added.filter((m) => m.by !== C.uid).length);
  }, [all]);
  /* tastiera, pannello, reazioni o foto che cambiano l'altezza: se ero in fondo resto in fondo */
  const itemsRef = useRef(null);
  useEffect(() => {
    const el = listRef.current;
    if (!el || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => { if (atBottom.current && keepFrom.current == null) el.scrollTop = el.scrollHeight; });
    ro.observe(el);
    if (itemsRef.current) ro.observe(itemsRef.current);
    return () => ro.disconnect();
  }, [msgs === null]);
  /* la data in alto mentre si scorre, come su WhatsApp */
  const [floatDay, setFloatDay] = useState(null);
  const floatT = useRef(0);
  const onScroll = async (e) => {
    const el = e.currentTarget;
    const gap = el.scrollHeight - el.scrollTop - el.clientHeight;
    atBottom.current = gap < 80;
    let lab = null, near = false;
    for (const d of el.querySelectorAll('.day')) {
      if (d.offsetTop <= el.scrollTop + 8) lab = d.textContent;
      else { near = d.offsetTop - el.scrollTop < 52; break; }
    }
    if (lab && !near) { setFloatDay(lab); clearTimeout(floatT.current); floatT.current = setTimeout(() => setFloatDay(null), 1300); }
    else if (near) setFloatDay(null);
    setShowDown(gap > 400);
    if (atBottom.current && newBelow) setNewBelow(0);
    if (el.scrollTop < 300 && hasMore) { keepFrom.current = el.scrollHeight - el.scrollTop; const n = await more(); if (!n) keepFrom.current = null; }
  };
  const toBottom = () => { const el = listRef.current; if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }); setNewBelow(0); };

  /* vai al messaggio citato (carica i precedenti se serve) */
  const jump = async (mid) => {
    for (let i = 0; i < 6; i++) {
      const node = listRef.current && listRef.current.querySelector('[data-mid="' + CSS.escape(mid) + '"]');
      if (node) { node.scrollIntoView({ block: 'center', behavior: 'smooth' }); setHl(mid); setTimeout(() => setHl((x) => (x === mid ? null : x)), 1600); return; }
      if (!hasMore) break;
      const n = await more();
      if (!n) break;
      await new Promise((r) => setTimeout(r, 60));
    }
    C.flash('Il messaggio non c\'è più');
  };

  const pathOf = (m) => chatPath(id) + '/' + m.id;
  /* finché il database non è aggiornato si scrive solo testo (con emoji, risposte e menzioni) */
  const full = C.chatReady !== false;
  const canDelAll = (m) => full && !m.del && !m.local && (m.by === C.uid || (!dm && (amGroupAdmin || C.isAdmin)));
  const canEdit = (m) => full && !m.del && !m.local && m.by === C.uid && canWrite && Date.now() - numOr(m.t, 0) < EDIT_MS && !m.voice && !m.gif && (m.text || (m.media && m.media.length));
  const startReply = (m) => { if (!canWrite || m.del || m.local) return; setEdit(null); setReply(m); vibrate(8); };
  const toggleRx = async (m, e) => {
    if (!canWrite || m.del || m.local) return;
    const cur = m.rx && m.rx[C.uid];
    await A.react(pathOf(m), cur === e ? '' : e);
  };
  const openViewer = (m, i) => {
    const items = [];
    let at = 0;
    all.forEach((x) => { if (x.del || !x.media) return; x.media.forEach((it, j) => { if (x.id === m.id && j === i) at = items.length; items.push({ it, m: x }); }); });
    setViewer({ items, at });
  };
  const ctx = {
    chat: id, dm, C, canWrite, full, tickOf, reply: startReply, jump, openViewer,
    menu: (m, el) => { if (m.local && m._st !== 'failed') return; vibrate(10); setMenu({ m, rect: el ? el.getBoundingClientRect() : null }); },
    rx: (m) => setSheet({ k: 'rx', m }), toggleRx,
    retry: (m) => A.retry(id, m.id),
    player: (u) => C.go({ t: 'player', id: u }),
  };

  /* intestazione */
  const typingLine = typingText(C, typing.who.filter((u) => u !== C.uid), dm);
  const subLine = typingLine || (dm ? (op ? 'tocca qui per le info' : '') : (() => {
    const names = memberIds.filter((u) => u !== C.uid).map((u) => dispName(C.playersById[u]));
    return (amMember ? ['Tu'] : []).concat(names).slice(0, 8).join(', ') + (names.length > 7 ? '…' : '');
  })());
  const title = dm ? (op ? dispName(op) : 'Ex giocatore') : (group ? group.name : 'Gruppo');
  const row = dm ? { dm: true, other, p: op } : { dm: false, g: group || { id, name: title } };
  const q = search ? search.q.trim().toLowerCase() : '';
  const hits = q ? all.filter((m) => !m.del && String(m.text || '').toLowerCase().includes(q)).map((m) => m.id) : [];

  let lastDay = 0;
  return html`<div class="cv" role="region" aria-label=${'Chat: ' + title}>
    <div class="cv-in">
      ${search ? html`<div class="cv-head">
        <button class="icon-btn flat" aria-label="Chiudi la ricerca" onClick=${() => setSearch(null)}><${Icon} n="back" /></button>
        <input class="input cv-search" autoFocus type="search" placeholder="Cerca nei messaggi" value=${search.q} onInput=${(e) => setSearch({ q: e.target.value, i: 0 })}
          onKeyDown=${(e) => { if (e.key === 'Enter' && hits.length) { const i = (search.i + 1) % hits.length; setSearch({ q: search.q, i }); jump(hits[hits.length - 1 - i]); } }} />
        <span class="tiny faint num">${q ? (hits.length ? Math.min(search.i + 1, hits.length) + '/' + hits.length : '0') : ''}</span>
        <button class="icon-btn flat" aria-label="Precedente" disabled=${!hits.length} onClick=${() => { const i = (search.i + 1) % hits.length; setSearch({ q: search.q, i }); jump(hits[hits.length - 1 - i]); }}><${Icon} n="chevup" /></button>
      </div>` : html`<div class="cv-head">
        <button class="icon-btn flat" aria-label="Indietro" onClick=${C.back}><${Icon} n="back" /></button>
        <button class="cv-who" onClick=${() => C.go({ t: 'chatInfo', id })}>
          <${ChatAvatar} row=${row} size=${40} />
          <span class="cv-ttl"><span class="cv-name ell">${title}</span><span class=${'cv-sub ell' + (typingLine ? ' typing' : '')}>${subLine}</span></span>
        </button>
        <button class="icon-btn flat" aria-label="Cerca nei messaggi" onClick=${() => setSearch({ q: '', i: 0 })}><${Icon} n="search" /></button>
      </div>`}
      ${floatDay && html`<div class="day-float" aria-hidden="true"><span>${floatDay}</span></div>`}
      <div class="cv-list" ref=${listRef} onScroll=${onScroll}>
        ${msgs === null ? html`<div class="cv-load"><span class="spin"></span></div>` : html`<div class="cv-items" ref=${itemsRef}>
          ${hasMore ? html`<div class="cv-more"><span class="spin sm"></span></div>` : html`<div class="cv-start">${dm
            ? html`<${Icon} n="lock" s="14" /> I messaggi di questa chat li leggete solo tu e ${title}.`
            : html`<${Icon} n="users" s="14" /> La chat di ${title}: la leggono tutti i membri del gruppo.`}</div>`}
          ${all.map((m, i) => {
            const prev = all[i - 1], next = all[i + 1];
            const dk = dayKey(numOr(m.t, 0));
            const sep = dk !== lastDay ? (lastDay = dk, html`<div class="day" key=${'d' + dk}><span>${fmtDay(numOr(m.t, 0))}</span></div>`) : null;
            const unread = m.id === firstUnread ? html`<div class="unread-sep" key="unread"><span>${unreadCount === 1 ? '1 messaggio non letto' : unreadCount + ' messaggi non letti'}</span></div>` : null;
            const first = !prev || prev.by !== m.by || dayKey(numOr(prev.t, 0)) !== dk || m.id === firstUnread;
            const lastOfRun = !next || next.by !== m.by || dayKey(numOr(next.t, 0)) !== dk || next.id === firstUnread;
            return html`${sep}${unread}<${MsgRow} key=${m.id} m=${m} first=${first} lastRun=${lastOfRun} ctx=${ctx} hl=${hl === m.id || (q && hits[hits.length - 1 - (search.i % Math.max(1, hits.length))] === m.id)} q=${q} />`;
          })}
          ${typing.who.length > 0 && html`<div class=${'msg in first typing-row' + (dm ? '' : ' grp')}>${!dm && html`<span class="msg-av"><${Avatar} p=${C.playersById[typing.who[0]] || { id: typing.who[0] }} size=${28} /></span>`}<div class="bub-wrap"><div class="bub tail"><span class="dots"><i></i><i></i><i></i></span></div></div></div>`}
        </div>`}
      </div>
      ${(showDown || newBelow > 0) && html`<button class="cv-down" aria-label="Vai in fondo" onClick=${toBottom}>${newBelow > 0 && html`<span class="cbadge">${newBelow}</span>`}<${Icon} n="chevdown" /></button>`}
      <div class="cv-foot">
        ${canWrite ? html`<${Composer} key=${id} chat=${id} dm=${dm} A=${A} members=${memberIds} reply=${reply} setReply=${setReply} edit=${edit} setEdit=${setEdit} typing=${typing} onSent=${() => { atBottom.current = true; }} />`
          : html`<div class="cv-ro">${!C.canWrite || !C.me ? 'Hai accesso in sola lettura.' : dm ? 'Potete scrivervi solo se siete amici o state in uno stesso gruppo.' : 'Puoi leggere questa chat, ma scrive solo chi è nel gruppo.'}</div>`}
      </div>
    </div>
    ${menu && html`<${MsgMenu} m=${menu.m} rect=${menu.rect} ctx=${ctx} canEdit=${canEdit(menu.m)} canDel=${canDelAll(menu.m)} onClose=${() => setMenu(null)}
      onReply=${() => { const m = menu.m; setMenu(null); startReply(m); }}
      onEdit=${() => { const m = menu.m; setMenu(null); setReply(null); setEdit(m); }}
      onInfo=${() => { const m = menu.m; setMenu(null); setSheet({ k: 'info', m }); }}
      onDelete=${() => { const m = menu.m; setMenu(null); if (m._st === 'failed') { A.discard(id, m.id); return; } setSheet({ k: 'del', m }); }}
      onMore=${() => { const m = menu.m; setMenu(null); setSheet({ k: 'rxPick', m }); }}
      onForward=${() => { const m = menu.m; setMenu(null); setSheet({ k: 'fwd', m }); }} />`}
    ${sheet && sheet.k === 'fwd' && html`<${ForwardSheet} m=${sheet.m} from=${id} A=${A} onClose=${() => setSheet(null)} />`}
    ${sheet && sheet.k === 'rx' && html`<${ReactionsSheet} m=${byId.get(sheet.m.id) || sheet.m} onClose=${() => setSheet(null)} onRemove=${async (m) => { await A.react(pathOf(m), ''); setSheet(null); }} />`}
    ${sheet && sheet.k === 'rxPick' && html`<${Sheet} title="Reagisci" onClose=${() => setSheet(null)}><${EmojiGrid} onPick=${(e) => { const m = sheet.m; setSheet(null); pushRecentEmoji(e); toggleRx(m, e); }} /><//>`}
    ${sheet && sheet.k === 'info' && html`<${MsgInfoSheet} m=${byId.get(sheet.m.id) || sheet.m} dm=${dm} recipients=${recipients(sheet.m)} readsBy=${readsBy} onClose=${() => setSheet(null)} />`}
    ${sheet && sheet.k === 'del' && html`<${Sheet} title="Eliminare il messaggio?" onClose=${() => setSheet(null)}>
      <div class="stack-8">
        ${canDelAll(sheet.m) && html`<button class="btn danger block" onClick=${async () => { const m = sheet.m; setSheet(null); if (await A.delAll(pathOf(m))) C.flash('Messaggio eliminato per tutti'); }}>Elimina per tutti</button>`}
        <button class="btn block" onClick=${() => { const m = sheet.m; setSheet(null); hideForMe(C.uid, id, m.id); setHideTick((x) => x + 1); C.flash('Messaggio eliminato per te'); }}>Elimina per me</button>
        <button class="btn ghost block" onClick=${() => setSheet(null)}>Annulla</button>
        ${canDelAll(sheet.m) && sheet.m.by !== C.uid && html`<div class="tiny faint">Sei amministratore: puoi eliminare per tutti anche i messaggi degli altri.</div>`}
      </div>
    <//>`}
    ${viewer && html`<${MediaViewer} items=${viewer.items} at=${viewer.at} onClose=${() => setViewer(null)} onReply=${canWrite ? (m) => { setViewer(null); startReply(m); } : null} />`}
  </div>`;
}

/* ---------- un messaggio ---------- */
function usePress(onLong) {
  const st = useRef(null);
  const clear = () => { if (st.current && st.current.tm) clearTimeout(st.current.tm); };
  return {
    onPointerDown: (e) => {
      if (e.button === 2) return;
      const el = e.currentTarget;
      clear();
      st.current = { x: e.clientX, y: e.clientY, long: false, tm: setTimeout(() => { if (st.current) { st.current.long = true; st.current.at = Date.now(); } onLong(el); }, 430) };
    },
    onPointerMove: (e) => { const s = st.current; if (s && !s.long && (Math.abs(e.clientX - s.x) > 9 || Math.abs(e.clientY - s.y) > 9)) { clear(); st.current = null; } },
    onPointerUp: () => clear(),
    onPointerCancel: () => { clear(); st.current = null; },
    onContextMenu: (e) => {
      e.preventDefault();
      /* su Android dopo la pressione lunga arriva anche il menu del browser: non lo apro due volte */
      if (st.current && st.current.long && Date.now() - (st.current.at || 0) < 900) return;
      clear(); st.current = { long: true, at: Date.now() }; onLong(e.currentTarget);
    },
    /* dopo una pressione lunga il tocco non apre niente */
    wasLong: () => !!(st.current && st.current.long),
  };
}

function MsgRow({ m, first, lastRun, ctx, hl, q }) {
  const C = ctx.C;
  const mine = m.by === C.uid;
  const p = C.playersById[m.by];
  const kind = kindOf(m);
  const bubRef = useRef(null);
  const press = usePress(() => ctx.menu(m, bubRef.current));
  /* trascinare verso destra per rispondere */
  const sw = useRef(null);
  const [dx, setDx] = useState(0);
  const onDown = (e) => { press.onPointerDown(e); if (e.pointerType !== 'mouse' && ctx.canWrite && !m.del && !m.local) sw.current = { x: e.clientX, y: e.clientY, on: false }; };
  const onMove = (e) => {
    press.onPointerMove(e);
    const s = sw.current;
    if (!s) return;
    const ddx = e.clientX - s.x, ddy = e.clientY - s.y;
    if (!s.on) { if (Math.abs(ddy) > 12) { sw.current = null; return; } if (ddx > 14 && ddx > Math.abs(ddy) * 1.6) s.on = true; else return; }
    const v = Math.max(0, Math.min(90, ddx - 14));
    if (v >= 60 && !s.buzz) { s.buzz = true; vibrate(8); }
    setDx(v);
  };
  const onUp = (e) => { press.onPointerUp(e); const s = sw.current; sw.current = null; if (s && s.on && dx >= 60) ctx.reply(m); if (dx) setDx(0); };
  const jumbo = kind === 'text' && !m.re ? jumboCount(m.text) : 0;
  const naked = kind === 'stk' || jumbo;
  const media = kind === 'img' ? m.media : null;
  const onlyMedia = media && !m.text;
  const showName = !ctx.dm && !mine && first && !naked;
  const tick = mine && kind !== 'del' ? ctx.tickOf(m) : null;
  const metaW = (m.edit ? 66 : 0) + (mine ? 58 : 40);
  const meta = html`<span class=${'meta' + (onlyMedia || kind === 'gif' ? ' over' : '') + (naked ? ' naked' : '')}>${m.edit && html`<span class="ed">modificato</span>`}<span class="num">${fmtClock(numOr(m.t, 0))}</span>${tick && html`<${Ticks} st=${tick} />`}</span>`;
  const rxs = m.rx && !m.del ? Object.entries(m.rx).filter(([, e]) => e) : [];
  const counts = {};
  rxs.forEach(([, e]) => { counts[e] = (counts[e] || 0) + 1; });
  const top3 = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 3);
  const tap = (fn) => (e) => { if (press.wasLong()) { e.preventDefault(); return; } fn(e); };
  return html`<div class=${'msg ' + (mine ? 'out' : 'in') + (first ? ' first' : '') + (lastRun ? ' lastrun' : '') + (hl ? ' hl' : '') + (rxs.length ? ' has-rx' : '') + (!ctx.dm && !mine ? ' grp' : '')} data-mid=${m.id}>
    ${!ctx.dm && !mine && html`<span class="msg-av">${first && html`<button type="button" class="av-btn" aria-label=${'Scheda di ' + dispName(p)} onClick=${() => p && ctx.player(m.by)}><${Avatar} p=${p || { id: m.by }} size=${28} /></button>`}</span>`}
    ${dx > 0 && html`<span class="swipe-ic" style=${'opacity:' + Math.min(1, dx / 60)}><${Icon} n="reply" s="16" /></span>`}
    <div class="bub-wrap" style=${dx ? 'transform:translateX(' + dx + 'px)' : ''}>
      <div ref=${bubRef} class=${'bub' + (first && !naked ? ' tail' : '') + (naked ? ' naked' : '') + (media ? ' media' : '') + (kind === 'gif' ? ' gifb' : '') + (kind === 'voice' ? ' voiceb' : '') + (m._st === 'failed' ? ' failed' : '')}
        onPointerDown=${onDown} onPointerMove=${onMove} onPointerUp=${onUp} onPointerCancel=${(e) => { press.onPointerCancel(e); sw.current = null; setDx(0); }} onContextMenu=${press.onContextMenu}>
        ${showName && html`<button type="button" class="msg-name" style=${'--nh:' + nameHue(m.by)} onClick=${tap(() => p && ctx.player(m.by))}>${p ? dispName(p) : 'Ex giocatore'}</button>`}
        ${m.fwd && !m.del && html`<span class="fwd-l"><${Icon} n="fwd" s="14" /> Inoltrato</span>`}
        ${m.re && !m.del && html`<${Quote} re=${m.re} C=${C} onClick=${tap(() => ctx.jump(m.re.id))} />`}
        ${kind === 'del' && html`<span class="del-t"><${Icon} n="ban" s="14" /> ${mine ? 'Hai eliminato questo messaggio' : 'Questo messaggio è stato eliminato'}</span>`}
        ${media && html`<${MediaGrid} media=${media} m=${m} onOpen=${(i) => (e) => { if (press.wasLong()) return; if (m.local) return; ctx.openViewer(m, i); }} />`}
        ${kind === 'gif' || kind === 'stk' ? html`<${GifMsg} g=${m.gif} />` : null}
        ${kind === 'voice' && html`<${VoiceMsg} v=${m.voice} m=${m} mine=${mine} />`}
        ${m.text && kind !== 'del' && html`<div class=${'msg-text' + (jumbo ? ' jumbo j' + jumbo : '')}>${richText(m.text, m.ment, C, (u) => ctx.player(u))}${!jumbo && html`<span class="sp" style=${'width:' + metaW + 'px'}></span>`}</div>`}
        ${kind === 'del' && html`<span class="sp" style=${'width:' + metaW + 'px'}></span>`}
        ${meta}
        ${m._st === 'sending' && (media || kind === 'voice') && html`<span class="up-prog" style=${'--p:' + Math.round((m._p || 0) * 100)}></span>`}
        <button type="button" class="bub-more" aria-label="Opzioni del messaggio" onClick=${(e) => { e.stopPropagation(); ctx.menu(m, bubRef.current); }}><${Icon} n="chevdown" s="16" /></button>
      </div>
      ${top3.length > 0 && html`<button type="button" class="rx-pill" onClick=${() => ctx.rx(m)} aria-label=${'Reazioni: ' + rxs.length}>${top3.join('')}${rxs.length > 1 && html`<span class="num">${rxs.length}</span>`}</button>`}
      ${m._st === 'failed' && html`<button type="button" class="link retry" onClick=${() => ctx.retry(m)}><${Icon} n="warn" s="14" /> Non inviato · tocca per riprovare</button>`}
    </div>
  </div>`;
}

function Quote({ re, C, onClick }) {
  const p = C.playersById[re.by];
  const name = re.by === C.uid ? 'Tu' : p ? dispName(p) : 'Ex giocatore';
  const ic = { img: '📷 ', voice: '🎤 ', gif: '', stk: '🏷️ ', del: '🚫 ' }[re.k] || '';
  const label = re.text || { img: 'Foto', voice: 'Messaggio vocale', gif: 'GIF', stk: 'Sticker', del: 'Messaggio eliminato' }[re.k] || '';
  return html`<button type="button" class="quote" style=${'--nh:' + nameHue(re.by)} onClick=${onClick}>
    <span class="q-main"><span class="q-name">${name}</span><span class="q-text">${ic}${label}</span></span>
    ${re.b && html`<span class="q-thumb" style=${'background-image:url("' + re.b + '")'}></span>`}
  </button>`;
}
/* la copia del messaggio citato: resta anche se l'originale non è più caricato */
function quoteOf(m) {
  const k = kindOf(m);
  const q = { id: m.id, by: m.by, k };
  const t = String(m.text || '').replace(/\s+/g, ' ').trim();
  if (t) q.text = t.slice(0, 140);
  if (k === 'voice') q.text = 'Messaggio vocale (' + fmtDur(m.voice && m.voice.d) + ')';
  if (k === 'img' && m.media[0] && m.media[0].b) q.b = m.media[0].b;
  return q;
}

function MediaGrid({ media, m, onOpen }) {
  const n = media.length;
  if (n === 1) {
    const it = media[0];
    const ar = Math.max(0.62, Math.min(1.9, numOr(it.w, 1) / Math.max(1, numOr(it.h, 1))));
    return html`<div class="mgrid one"><${ChatImg} it=${it} style=${'aspect-ratio:' + ar.toFixed(3)} onClick=${onOpen(0)} pending=${m._st === 'sending'} /></div>`;
  }
  const show = media.slice(0, 4);
  return html`<div class=${'mgrid n' + Math.min(4, n)}>${show.map((it, i) => html`<${ChatImg} key=${i} it=${it} onClick=${onOpen(i)} pending=${m._st === 'sending'} more=${i === 3 && n > 4 ? n - 4 : 0} />`)}</div>`;
}
function ChatImg({ it, style, onClick, more, pending }) {
  const ref = useRef(null);
  const near = useNearScreen(ref);
  const { url, err } = useMediaUrl(near ? it.p : null, it.local);
  return html`<button type="button" ref=${ref} class=${'mimg' + (url ? ' ok' : '')} style=${(style || '') + (it.b ? ';background-image:url("' + it.b + '")' : '')} onClick=${onClick} aria-label=${it.k === 'gif' ? 'GIF' : 'Foto'}>
    ${url && html`<img src=${url} alt="" decoding="async" draggable="false" />`}
    ${err && !url && html`<span class="m-err"><${Icon} n="warn" s="16" /> Foto non disponibile</span>`}
    ${it.k === 'gif' && html`<span class="gif-tag">GIF</span>`}
    ${more > 0 && html`<span class="m-more">+${more}</span>`}
    ${pending && html`<span class="m-pend"><span class="spin light"></span></span>`}
  </button>`;
}

function GifMsg({ g }) {
  const ref = useRef(null);
  const near = useNearScreen(ref);
  const vref = useRef(null);
  const stk = !!g && g.k === 'stk';
  const ar = g ? Math.max(0.5, Math.min(2.2, numOr(g.w, 1) / Math.max(1, numOr(g.h, 1)))) : 1;
  useEffect(() => {
    const v = vref.current;
    if (!v || typeof IntersectionObserver === 'undefined') return;
    const io = new IntersectionObserver((es) => es.forEach((e) => { try { if (e.isIntersecting) v.play().catch(() => {}); else v.pause(); } catch (x) { /* niente */ } }));
    io.observe(v);
    return () => io.disconnect();
  }, [near]);
  if (!g) return null;
  return html`<div ref=${ref} class=${'mgif' + (stk ? ' stk' : '')} style=${'aspect-ratio:' + ar.toFixed(3)}>
    ${near && (g.v && !stk
      ? html`<video ref=${vref} src=${g.v} autoplay loop muted playsinline preload="auto" aria-label="GIF" disablepictureinpicture></video>`
      : html`<img src=${g.u} alt=${stk ? 'Sticker' : 'GIF'} decoding="async" draggable="false" />`)}
    ${!stk && html`<span class="gif-tag">GIF</span>`}
  </div>`;
}

/* vocale: play, onda che si colora, durata e velocità */
const VoiceNow = { a: null, stop: null };
function fakeWave(seed) { let x = hueOf(seed) + 7; return Array.from({ length: 40 }, () => { x = (x * 9301 + 49297) % 233280; return 6 + Math.round((x / 233280) * 22); }); }
function VoiceMsg({ v, m, mine }) {
  const C = useContext(Ctx);
  const [st, setSt] = useState({ on: false, pos: 0, load: false, err: false, rate: 1 });
  const a = useRef(null), raf = useRef(0);
  const dur = Math.max(1, numOr(v && v.d, 0));
  const bars = v && Array.isArray(v.w) && v.w.length ? v.w : fakeWave(m.id);
  useEffect(() => () => { cancelAnimationFrame(raf.current); if (a.current) { a.current.pause(); if (VoiceNow.a === a.current) VoiceNow.a = null; } }, []);
  const tickPos = () => { const el = a.current; if (!el) return; setSt((s) => Object.assign({}, s, { pos: el.currentTime * 1000 })); if (!el.paused) raf.current = requestAnimationFrame(tickPos); };
  const ensure = async () => {
    if (a.current) return a.current;
    const url = v.local || await MediaCache.url(C.be.db, v.p);
    const el = new Audio();
    el.preload = 'auto';
    el.src = url;
    el.onended = () => { cancelAnimationFrame(raf.current); setSt((s) => Object.assign({}, s, { on: false, pos: 0 })); };
    el.onpause = () => { cancelAnimationFrame(raf.current); setSt((s) => Object.assign({}, s, { on: false })); };
    el.onplay = () => { setSt((s) => Object.assign({}, s, { on: true })); raf.current = requestAnimationFrame(tickPos); };
    el.onerror = () => setSt((s) => Object.assign({}, s, { err: true, on: false, load: false }));
    a.current = el;
    return el;
  };
  const toggle = async (e) => {
    e.stopPropagation();
    if (m.local || st.err) return;
    if (st.on && a.current) { a.current.pause(); return; }
    setSt((s) => Object.assign({}, s, { load: true }));
    try {
      const el = await ensure();
      if (VoiceNow.a && VoiceNow.a !== el) VoiceNow.a.pause();
      VoiceNow.a = el;
      el.playbackRate = st.rate;
      await el.play();
      setSt((s) => Object.assign({}, s, { load: false }));
    } catch (x) { setSt((s) => Object.assign({}, s, { load: false, err: true })); }
  };
  const seek = (e) => {
    e.stopPropagation();
    const r = e.currentTarget.getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    if (a.current) { const d = isFinite(a.current.duration) && a.current.duration > 0 ? a.current.duration : dur / 1000; a.current.currentTime = f * d; setSt((s) => Object.assign({}, s, { pos: f * d * 1000 })); }
  };
  const rate = (e) => { e.stopPropagation(); const r = st.rate === 1 ? 1.5 : st.rate === 1.5 ? 2 : 1; if (a.current) a.current.playbackRate = r; setSt((s) => Object.assign({}, s, { rate: r })); };
  const f = Math.min(1, st.pos / dur);
  const p = C.playersById[m.by];
  return html`<div class="voice">
    ${!mine && html`<span class="v-av"><${Avatar} p=${p || { id: m.by }} size=${38} /><span class="v-mic"><${Icon} n="mic" s="12" /></span></span>`}
    <button type="button" class="v-play" aria-label=${st.on ? 'Pausa' : 'Ascolta'} onClick=${toggle} disabled=${!!m.local}>
      ${st.load || m._st === 'sending' ? html`<span class="spin sm"></span>` : st.err ? html`<${Icon} n="warn" s="18" /> ` : html`<${Icon} n=${st.on ? 'pause' : 'play'} fill />`}
    </button>
    <span class="v-mid">
      <button type="button" class="v-wave" aria-label="Sposta" onClick=${seek} onPointerDown=${(e) => e.stopPropagation()}>
        ${bars.map((b, i) => html`<i key=${i} class=${i / bars.length < f ? 'on' : ''} style=${'height:' + Math.max(3, Math.min(28, b)) + 'px'}></i>`)}
      </button>
      <span class="v-info"><span class="num">${st.err ? 'Non riesco a riprodurlo' : fmtDur(st.on || st.pos ? st.pos : dur)}</span>${(st.on || st.rate !== 1) && html`<button type="button" class="v-rate" onClick=${rate}>${String(st.rate).replace('.', ',')}×</button>`}</span>
    </span>
  </div>`;
}

/* ---------- scrivere: testo, emoji, GIF e sticker, foto, vocali, @menzioni ---------- */
const draftKey = (uid, chat) => 'sc-draft-' + uid + '-' + chat;
function autoGrow(el) { if (!el) return; el.style.height = 'auto'; el.style.height = Math.min(140, el.scrollHeight) + 'px'; }
const MIC_TYPES = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];

function waveOf(levels, n) {
  if (!levels.length) return Array.from({ length: n }, () => 4);
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = Math.floor((i * levels.length) / n), b = Math.max(a + 1, Math.floor(((i + 1) * levels.length) / n));
    let mx = 0;
    for (let j = a; j < b; j++) mx = Math.max(mx, levels[j] || 0);
    out.push(mx);
  }
  const top = Math.max(0.02, ...out);
  return out.map((v) => Math.max(3, Math.round(4 + (v / top) * 24)));
}

/* registratore dei vocali */
function useRecorder() {
  const st = useRef(null);
  const cleanup = (s) => {
    clearTimeout(s.tm);
    try { s.stream.getTracks().forEach((t) => t.stop()); } catch (e) { /* già fermo */ }
    try { if (s.ac) s.ac.close(); } catch (e) { /* già chiuso */ }
  };
  return {
    supported: () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof MediaRecorder !== 'undefined'),
    async start(onLevel) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      const mime = MIC_TYPES.find((t) => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } }) || '';
      let rec;
      try { rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 }); }
      catch (e) { rec = new MediaRecorder(stream); }
      const s = { stream, rec, chunks: [], levels: [], t0: performance.now(), mime: rec.mimeType || mime, ac: null, an: null, tm: 0 };
      rec.ondataavailable = (e) => { if (e.data && e.data.size) s.chunks.push(e.data); };
      try {
        s.ac = new (window.AudioContext || window.webkitAudioContext)();
        const src = s.ac.createMediaStreamSource(stream);
        s.an = s.ac.createAnalyser(); s.an.fftSize = 512; src.connect(s.an);
      } catch (e) { s.an = null; }
      const buf = s.an ? new Uint8Array(s.an.fftSize) : null;
      const sample = () => {
        let v = 0;
        if (s.an) { s.an.getByteTimeDomainData(buf); let sum = 0; for (let i = 0; i < buf.length; i++) { const x = (buf[i] - 128) / 128; sum += x * x; } v = Math.sqrt(sum / buf.length); }
        s.levels.push(v);
        if (onLevel) onLevel(v, performance.now() - s.t0);
        s.tm = setTimeout(sample, 70);
      };
      rec.start(250);
      sample();
      st.current = s;
    },
    stop() {
      return new Promise((res) => {
        const s = st.current;
        st.current = null;
        if (!s) { res(null); return; }
        const d = performance.now() - s.t0;
        s.rec.onstop = () => {
          cleanup(s);
          const type = String(s.mime || 'audio/webm').split(';')[0] || 'audio/webm';
          const blob = new Blob(s.chunks, { type });
          res({ blob, d, wave: waveOf(s.levels, 40), mime: type, ext: type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm', url: URL.createObjectURL(blob) });
        };
        try { s.rec.stop(); } catch (e) { cleanup(s); res(null); }
      });
    },
    cancel() { const s = st.current; st.current = null; if (!s) return; s.rec.onstop = null; try { s.rec.stop(); } catch (e) { /* già fermo */ } cleanup(s); },
    active: () => !!st.current,
  };
}

function Composer({ chat, dm, A, members, reply, setReply, edit, setEdit, typing, onSent }) {
  const C = useContext(Ctx);
  const [text, setText] = useState(() => readLS(draftKey(C.uid, chat), '') || '');
  const [panel, setPanel] = useState(null);
  const [attach, setAttach] = useState(false);
  const [photos, setPhotos] = useState(null);
  const [ment, setMent] = useState({});
  const [mq, setMq] = useState(null);
  const [rec, setRec] = useState(null);
  const ta = useRef(null), gal = useRef(null), cam = useRef(null);
  const R = useRecorder();
  const recSt = useRef(null);
  const saveT = useRef(0);
  const coarse = touchUI();

  useEffect(() => { autoGrow(ta.current); }, []);
  useEffect(() => () => { R.cancel(); }, []);
  /* modifica: il testo del messaggio nel campo */
  useEffect(() => {
    if (!edit) return;
    setText(edit.text || ''); setPanel(null);
    requestAnimationFrame(() => { const el = ta.current; if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); autoGrow(el); } });
  }, [edit && edit.id]);
  useEffect(() => { if (reply && ta.current && !coarse) ta.current.focus(); if (reply && coarse && !panel && ta.current) ta.current.focus(); }, [reply && reply.id]);
  const save = (v) => { clearTimeout(saveT.current); saveT.current = setTimeout(() => writeLS(draftKey(C.uid, chat), v ? v.slice(0, 4000) : null), 400); };
  const setT = (v) => { setText(v); if (!edit) save(v); };

  const candidates = useMemo(() => {
    if (!mq || dm) return [];
    const q = mq.q;
    return members.filter((u) => u !== C.uid && C.playersById[u]).map((u) => C.playersById[u])
      .filter((p) => !q || dispName(p).toLowerCase().startsWith(q) || (p.first || '').toLowerCase().startsWith(q) || (p.last || '').toLowerCase().startsWith(q))
      .sort((a, b) => dispName(a).localeCompare(dispName(b), 'it')).slice(0, 6);
  }, [mq, members]);

  const onInput = (e) => {
    const el = e.target, v = el.value;
    setT(v); autoGrow(el);
    if (v.trim()) typing.ping(); else typing.stop();
    if (!dm) {
      const before = v.slice(0, el.selectionStart);
      const mm = before.match(/(^|\s)@([^\s@]{0,20})$/u);
      setMq(mm ? { q: mm[2].toLowerCase(), start: el.selectionStart - mm[2].length - 1 } : null);
    }
  };
  const pickMention = (p) => {
    const el = ta.current, name = dispName(p);
    const caret = el ? el.selectionStart : text.length;
    const nv = text.slice(0, mq.start) + '@' + name + ' ' + text.slice(caret);
    const pos = mq.start + name.length + 2;
    setT(nv); setMent((m) => Object.assign({}, m, { [p.id]: name })); setMq(null);
    requestAnimationFrame(() => { if (el) { el.focus(); el.setSelectionRange(pos, pos); autoGrow(el); } });
  };
  const insert = (s) => {
    const el = ta.current;
    const a = el ? el.selectionStart : text.length, b = el ? el.selectionEnd : text.length;
    const nv = text.slice(0, a) + s + text.slice(b);
    setT(nv);
    pushRecentEmoji(s);
    requestAnimationFrame(() => { if (el) { el.setSelectionRange(a + s.length, a + s.length); autoGrow(el); } });
  };
  const send = async () => {
    const t = text.trim();
    if (edit) {
      if (!t && !(edit.media && edit.media.length)) return;
      if (t === (edit.text || '').trim()) { setEdit(null); setT(readLS(draftKey(C.uid, chat), '') || ''); return; }
      const ok = await A.edit(chatPath(chat) + '/' + edit.id, t);
      if (ok) { setEdit(null); setText(readLS(draftKey(C.uid, chat), '') || ''); requestAnimationFrame(() => autoGrow(ta.current)); }
      return;
    }
    if (!t) return;
    const mentions = Object.keys(ment).filter((u) => t.includes('@' + ment[u]));
    const re = reply ? quoteOf(reply) : null;
    clearTimeout(saveT.current); setText(''); writeLS(draftKey(C.uid, chat), null); setMent({}); setMq(null); setReply(null);
    typing.stop(); onSent();
    requestAnimationFrame(() => autoGrow(ta.current));
    A.send(chat, { text: t, re, ment: mentions });
  };
  const sendGif = (item, kind, q) => {
    const re = reply ? quoteOf(reply) : null;
    setReply(null); onSent();
    A.send(chat, { gif: { k: kind === 'stickers' ? 'stk' : 'gif', id: item.id, u: item.u, v: item.v || undefined, w: item.w, h: item.h, src: 'klipy' }, re });
    Klipy.share(kind, item.id, q);
  };
  const sendPhotos = (prepped, caption) => {
    const re = reply ? quoteOf(reply) : null;
    setReply(null); onSent();
    A.send(chat, { photos: prepped, text: caption, re });
  };
  const onFiles = (list) => {
    const files = Array.from(list || []).filter((f) => f && /^image\//.test(f.type));
    if (!files.length) { if (list && list.length) C.flash('Si possono mandare foto e GIF', 'err'); return; }
    if (files.length > MAX_PHOTOS) C.flash('Al massimo ' + MAX_PHOTOS + ' foto alla volta');
    setAttach(false); setPanel(null);
    setPhotos(files.slice(0, MAX_PHOTOS));
  };
  const onPaste = (e) => {
    const fs = Array.from((e.clipboardData && e.clipboardData.files) || []).filter((f) => /^image\//.test(f.type));
    if (fs.length && full) { e.preventDefault(); onFiles(fs); }
  };
  const togglePanel = (k) => {
    setAttach(false);
    if (panel === k) { setPanel(null); requestAnimationFrame(() => ta.current && ta.current.focus()); return; }
    if (ta.current) ta.current.blur();
    setPanel(k);
  };

  /* vocali: tieni premuto per registrare, scorri a sinistra per annullare, in su per bloccare */
  const micDown = async (e) => {
    if (e.button === 2) return;
    e.preventDefault();
    if (!R.supported()) { C.flash('Questo telefono non registra i vocali dall\'app', 'err'); return; }
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) { /* niente */ }
    const s = { x: e.clientX, y: e.clientY, up: false, lock: false, ready: false, t0: Date.now() };
    recSt.current = s;
    setRec({ on: true, lock: false, ms: 0, lv: [], cancel: false, dx: 0 });
    vibrate(12);
    try {
      await R.start((v, ms) => setRec((r) => (r ? Object.assign({}, r, { ms, lv: r.lv.concat(v).slice(-34) }) : r)));
      s.ready = true;
      if (s.up && !s.lock) {
        /* dita già alzate (per esempio dopo il permesso del microfono) */
        R.cancel(); setRec(null); recSt.current = null;
        if (Date.now() - s.t0 > 1500) C.flash('Ora tieni premuto il microfono per registrare');
      }
    } catch (x) {
      setRec(null); recSt.current = null;
      C.flash(x && x.name === 'NotAllowedError' ? 'Serve il permesso del microfono: si dà dalle impostazioni del telefono' : 'Non riesco a usare il microfono', 'err');
    }
  };
  const micMove = (e) => {
    const s = recSt.current;
    if (!s || s.lock || s.up) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (dx < -110) { s.up = true; R.cancel(); recSt.current = null; setRec(null); vibrate(20); return; }
    if (dy < -70) { s.lock = true; vibrate(10); setRec((r) => (r ? Object.assign({}, r, { lock: true, dx: 0 }) : r)); return; }
    setRec((r) => (r ? Object.assign({}, r, { dx: Math.min(0, dx) }) : r));
  };
  const finish = async () => {
    const s = recSt.current;
    recSt.current = null;
    const v = await R.stop();
    setRec(null);
    if (!v || v.d < 800 || !v.blob.size) { if (s && !s.lock) C.flash('Tieni premuto per registrare, rilascia per inviare'); return; }
    if (v.blob.size > 9 * 1024 * 1024) { C.flash('Vocale troppo lungo', 'err'); return; }
    const re = reply ? quoteOf(reply) : null;
    setReply(null); onSent();
    A.send(chat, { voice: v, re });
  };
  const micUp = () => {
    const s = recSt.current;
    if (!s) return;
    s.up = true;
    if (s.lock) return;
    if (!s.ready) return;
    finish();
  };
  useEffect(() => { if (rec && rec.ms >= VOICE_MAX_MS) finish(); }, [rec && rec.ms >= VOICE_MAX_MS]);
  const recCancel = () => { R.cancel(); recSt.current = null; setRec(null); };

  const has = !!text.trim();
  const full = C.chatReady !== false;
  const keyIc = html`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5" /><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7 14h10" /></svg>`;
  return html`<div class="cmp">
    ${candidates.length > 0 && html`<div class="ment-list" role="listbox">${candidates.map((p) => html`<button key=${p.id} class="ment-it" onMouseDown=${(e) => e.preventDefault()} onClick=${() => pickMention(p)}><${Avatar} p=${p} size=${28} /><span class="ell">${dispName(p)}</span><span class="tiny faint ell">${fullName(p)}</span></button>`)}</div>`}
    ${attach && html`<div class="att-menu" role="menu">
      <button class="att-it" onClick=${() => { setAttach(false); gal.current && gal.current.click(); }}><span class="att-ic" style="--c:#7f66ff"><${Icon} n="image" /></span>Galleria</button>
      <button class="att-it" onClick=${() => { setAttach(false); cam.current && cam.current.click(); }}><span class="att-ic" style="--c:#ff2e74"><${Icon} n="camera" /></span>Fotocamera</button>
      <button class="att-it" onClick=${() => togglePanel('gif')}><span class="att-ic" style="--c:#0795dc"><b class="gif-ic">GIF</b></span>GIF</button>
      <button class="att-it" onClick=${() => togglePanel('stk')}><span class="att-ic" style="--c:#02a698"><${Icon} n="sticker" /></span>Sticker</button>
    </div>`}
    <div class="cmp-row">
      <div class=${'cmp-pill' + (rec ? ' recording' : '')}>
        ${(reply || edit) && !rec && html`<div class="cmp-ctx">
          ${edit ? html`<div class="quote edit"><span class="q-main"><span class="q-name"><${Icon} n="edit" s="14" /> Modifica messaggio</span><span class="q-text">${msgPreview(edit)}</span></span></div>`
            : html`<${Quote} re=${quoteOf(reply)} C=${C} onClick=${() => {}} />`}
          <button class="icon-btn sm flat" aria-label="Annulla" onClick=${() => { if (edit) { setEdit(null); setText(readLS(draftKey(C.uid, chat), '') || ''); } else setReply(null); }}><${Icon} n="x" s="16" /></button>
        </div>`}
        ${rec ? html`<div class="rec-bar">
          ${rec.lock ? html`<button class="icon-btn flat rec-del" aria-label="Elimina il vocale" onClick=${recCancel}><${Icon} n="trash" /></button>` : html`<span class="rec-dot"></span>`}
          <span class="rec-time num">${fmtDur(rec.ms)}</span>
          ${rec.lock ? html`<span class="rec-lv">${rec.lv.map((v, i) => html`<i key=${i} style=${'height:' + Math.max(3, Math.min(24, 3 + v * 90)) + 'px'}></i>`)}</span>`
            : html`<span class="rec-hint" style=${'transform:translateX(' + Math.max(-60, rec.dx / 2) + 'px)'}><${Icon} n="back" s="14" /> Scorri per annullare</span>`}
        </div>` : html`<div class="cmp-line">
          <button class="icon-btn flat cmp-ic" aria-label=${panel === 'emoji' ? 'Tastiera' : 'Emoji'} onClick=${() => togglePanel('emoji')}>${panel === 'emoji' ? keyIc : html`<${Icon} n="smile" />`}</button>
          <textarea ref=${ta} class="cmp-ta" rows="1" maxlength="4000" placeholder=${edit ? 'Modifica il messaggio' : 'Messaggio'} value=${text} aria-label="Messaggio"
            onInput=${onInput} onPaste=${onPaste} onFocus=${() => { setPanel(null); setAttach(false); }} onBlur=${() => setTimeout(() => setMq(null), 150)}
            onKeyDown=${(e) => { if (e.key === 'Enter' && !e.shiftKey && !coarse) { e.preventDefault(); send(); } if (e.key === 'Escape') { setReply(null); if (edit) setEdit(null); } }}></textarea>
          ${!edit && full && html`<button class="icon-btn flat cmp-ic" aria-label="Allega" aria-expanded=${attach} onClick=${() => { setAttach((x) => !x); }}><${Icon} n="clip" /></button>`}
          ${!edit && !has && full && html`<button class="icon-btn flat cmp-ic" aria-label="Fotocamera" onClick=${() => cam.current && cam.current.click()}><${Icon} n="camera" /></button>`}
        </div>`}
      </div>
      ${rec && rec.lock ? html`<button class="cmp-send" aria-label="Invia il vocale" onClick=${finish}><${Icon} n="send" /></button>`
        : has || edit || !full ? html`<button class="cmp-send" aria-label=${edit ? 'Salva la modifica' : 'Invia'} onMouseDown=${(e) => e.preventDefault()} onClick=${send}><${Icon} n=${edit ? 'check' : 'send'} /></button>`
        : html`<button class=${'cmp-send mic' + (rec ? ' on' : '')} aria-label="Tieni premuto per registrare un vocale" onPointerDown=${micDown} onPointerMove=${micMove} onPointerUp=${micUp} onPointerCancel=${micUp} onContextMenu=${(e) => e.preventDefault()}>
            ${rec && !rec.lock && html`<span class="rec-lock" style=${'opacity:' + 1}><${Icon} n="lock" s="16" /><${Icon} n="chevup" s="14" /></span>`}
            <${Icon} n="mic" /></button>`}
    </div>
    ${panel && html`<div class="cmp-panel">
      <div class="cp-body">

/* ---------- emoji ---------- */
const fold = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function EmojiGrid({ onPick }) {
  const [data, setData] = useState(EMOJI_DATA);
  const [err, setErr] = useState(false);
  const [q, setQ] = useState('');
  const [cat, setCat] = useState(null);
  const box = useRef(null);
  useEffect(() => { if (!data) loadEmoji().then(setData, () => setErr(true)); }, []);
  const recent = recentEmoji();
  const t = fold(q.trim());
  const found = useMemo(() => {
    if (!data || !t) return null;
    const out = [];
    for (const c of data) for (const e of c.e) if (fold(e[1] + ' ' + e[2]).includes(t)) { out.push(e); if (out.length >= 120) return out; }
    return out;
  }, [data, t]);
  const pick = (e) => { const b = e.target.closest('button[data-e]'); if (b) onPick(b.getAttribute('data-e')); };
  const go = (k) => { setCat(k); const el = box.current && box.current.querySelector('[data-cat="' + k + '"]'); if (el && box.current) box.current.scrollTop = el.offsetTop - 4; };
  const cell = (e) => html`<button type="button" class="em" data-e=${e[0]} title=${e[1]} aria-label=${e[1]}>${e[0]}</button>`;
  return html`<div class="emg">
    <div class="emg-top"><${Icon} n="search" s="16" /><input class="emg-q" type="search" placeholder="Cerca emoji" value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="Cerca emoji" /></div>
    ${!t && data && html`<div class="emg-cats">
      ${recent.length > 0 && html`<button class=${cat === 'recent' ? 'on' : ''} onClick=${() => go('recent')} aria-label="Recenti"><${Icon} n="clock" s="18" /></button>`}
      ${data.map((c) => html`<button key=${c.k} class=${cat === c.k ? 'on' : ''} onClick=${() => go(c.k)} aria-label=${c.n}>${c.i}</button>`)}
    </div>`}
    <div class="emg-box" ref=${box} onClick=${pick}>
      ${err ? html`<div class="small muted" style="padding:16px;text-align:center">Emoji non disponibili ora: usa quelle della tastiera.</div>`
        : !data ? html`<div class="cv-load"><span class="spin"></span></div>`
        : found ? (found.length ? html`<div class="emg-grid">${found.map(cell)}</div>` : html`<div class="small muted" style="padding:16px;text-align:center">Nessuna emoji per "${q}".</div>`)
        : html`
          ${recent.length > 0 && html`<div class="emg-sec" data-cat="recent"><div class="emg-h">Recenti</div><div class="emg-grid">${recent.map((e) => cell([e, e]))}</div></div>`}
          ${data.map((c) => html`<div key=${c.k} class="emg-sec" data-cat=${c.k}><div class="emg-h">${c.n}</div><div class="emg-grid">${c.e.map(cell)}</div></div>`)}`}
    </div>
  </div>`;
}

/* ---------- GIF e sticker ---------- */
function GifPanel({ kind, onPick }) {
  const C = useContext(Ctx);
  const [q, setQ] = useState('');
  const [st, setSt] = useState({ items: [], load: true, err: null, more: false, page: 1 });
  const box = useRef(null), seq = useRef(0);
  const run = async (page) => {
    const my = ++seq.current;
    setSt((s) => Object.assign({}, s, { load: true, err: null }, page === 1 ? { items: [] } : {}));
    try {
      const r = await Klipy.list(kind, q.trim(), page);
      if (my !== seq.current) return;
      setSt((s) => ({ items: page === 1 ? r.items : s.items.concat(r.items), load: false, err: null, more: r.more, page }));
    } catch (e) { if (my === seq.current) setSt((s) => Object.assign({}, s, { load: false, err: (e && e.code) || 'err' })); }
  };
  useEffect(() => { const tm = setTimeout(() => run(1), q ? 380 : 0); return () => clearTimeout(tm); }, [q, kind]);
  if (!Klipy.on()) {
    return html`<div class="gifp-empty small muted">${C.isAdmin ? html`Per cercare GIF e sticker serve la chiave gratuita di KLIPY: va messa in <b>config.js</b> (klipyKey). Intanto si possono mandare le GIF salvate nel telefono dalla Galleria.` : 'GIF e sticker arrivano a breve. Intanto puoi mandare le GIF salvate nel telefono dalla Galleria.'}</div>`;
  }
  const cols = [[], []], hs = [0, 0];
  st.items.forEach((it) => { const c = hs[0] <= hs[1] ? 0 : 1; cols[c].push(it); hs[c] += it.ph / Math.max(1, it.pw); });
  const onScroll = (e) => { const el = e.currentTarget; if (!st.load && st.more && el.scrollTop + el.clientHeight > el.scrollHeight - 300) run(st.page + 1); };
  return html`<div class="gifp">
    <div class="emg-top"><${Icon} n="search" s="16" /><input class="emg-q" type="search" placeholder=${kind === 'stickers' ? 'Cerca sticker su KLIPY' : 'Cerca GIF su KLIPY'} value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="Cerca" /></div>
    <div class="gifp-box" ref=${box} onScroll=${onScroll}>
      ${st.err && !st.items.length ? html`<div class="gifp-empty small muted">Non riesco a caricare le ${kind === 'stickers' ? 'sticker' : 'GIF'}. <button class="link" onClick=${() => run(1)}>Riprova</button></div>`
        : !st.load && !st.items.length ? html`<div class="gifp-empty small muted">Niente per "${q}".</div>`
        : html`<div class=${'gifp-cols' + (kind === 'stickers' ? ' stk' : '')}>${cols.map((col, ci) => html`<div key=${ci} class="gifp-col">${col.map((it) => html`<button key=${it.id} class="gifp-it" style=${'aspect-ratio:' + (it.pw / Math.max(1, it.ph)).toFixed(3)} onClick=${() => onPick(it, q.trim())} aria-label=${it.title || 'GIF'}><img src=${it.prev} alt="" loading="lazy" decoding="async" /></button>`)}</div>`)}</div>`}
      ${st.load && html`<div class="cv-load"><span class="spin"></span></div>`}
      <div class="klipy-by">Powered by KLIPY</div>
    </div>
  </div>`;
}

/* ---------- foto: anteprima con didascalia prima dell'invio ---------- */
function PhotoSend({ files, chat, onClose, onSend }) {
  const C = useContext(Ctx);
  const [list, setList] = useState(() => files.map((f, i) => ({ k: i + '-' + f.name + f.size, f, url: URL.createObjectURL(f), prep: null, err: false })));
  const [at, setAt] = useState(0);
  const [cap, setCap] = useState('');
  const [busy, setBusy] = useState(false);
  const more = useRef(null);
  useEffect(() => {
    list.forEach((x) => { if (!x.prep && !x.err && !x.started) { x.started = true; prepImage(x.f).then((p) => setList((l) => l.map((y) => (y.k === x.k ? Object.assign({}, y, { prep: p }) : y))), () => setList((l) => l.map((y) => (y.k === x.k ? Object.assign({}, y, { err: true }) : y)))); } });
  }, [list.length]);
  useEffect(() => { const k = (e) => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  const ok = list.filter((x) => !x.err);
  const ready = ok.length > 0 && ok.every((x) => x.prep);
  const cur = list[Math.min(at, list.length - 1)];
  const go = () => {
    if (!ready || busy) return;
    setBusy(true);
    onSend(ok.map((x) => Object.assign({ url: x.url }, x.prep)), cap.trim());
  };
  const add = (fs) => {
    const extra = Array.from(fs || []).filter((f) => /^image\//.test(f.type)).slice(0, MAX_PHOTOS - list.length);
    if (extra.length) setList((l) => l.concat(extra.map((f, i) => ({ k: Date.now() + '-' + i + f.name, f, url: URL.createObjectURL(f), prep: null, err: false }))));
  };
  const title = isDm(chat) ? dispName(C.playersById[dmOther(chat, C.uid)]) : (C.groupsById[chat] || {}).name;
  return html`<div class="ps" role="dialog" aria-modal="true" aria-label="Manda le foto">
    <div class="ps-head">
      <button class="icon-btn ghostw" aria-label="Annulla" onClick=${onClose}><${Icon} n="x" /></button>
      <span class="ps-t ell">Manda a ${title || 'chat'}</span>
    </div>
    <div class="ps-main">${cur && (cur.err ? html`<div class="ps-err">Questa foto non si può aprire.</div>` : html`<img src=${cur.url} alt="Anteprima" />`)}</div>
    <div class="ps-foot">
      <div class="ps-strip">
        ${list.map((x, i) => html`<span key=${x.k} class=${'ps-th' + (i === at ? ' on' : '')}><button aria-label=${'Foto ' + (i + 1)} onClick=${() => setAt(i)} style=${'background-image:url("' + x.url + '")'}></button>
          ${list.length > 1 && html`<button class="ps-rm" aria-label="Togli" onClick=${() => { setList((l) => l.filter((y) => y.k !== x.k)); setAt(0); }}><${Icon} n="x" s="12" /></button>`}</span>`)}
        ${list.length < MAX_PHOTOS && html`<button class="ps-add" aria-label="Aggiungi foto" onClick=${() => more.current && more.current.click()}><${Icon} n="plus" /></button>`}
      </div>
      <div class="ps-row">
        <input class="ps-cap" placeholder="Aggiungi una didascalia…" value=${cap} maxlength="2000" onInput=${(e) => setCap(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } }} />
        <button class="cmp-send" aria-label="Invia" disabled=${!ready || busy} onClick=${go}>${ready ? html`<${Icon} n="send" />` : html`<span class="spin light sm"></span>`}</button>
      </div>
    </div>
    <input ref=${more} type="file" accept="image/*" multiple hidden onChange=${(e) => { add(e.target.files); e.target.value = ''; }} />
  </div>`;
}

/* ---------- foto a tutto schermo: scorri tra le foto, pizzica per ingrandire, giù per chiudere ---------- */
function MediaViewer({ items, at, onClose, onReply }) {
  const C = useContext(Ctx);
  const [i, setI] = useState(at);
  const [z, setZ] = useState({ s: 1, x: 0, y: 0 });
  const [drag, setDrag] = useState({ x: 0, y: 0 });
  const pts = useRef(new Map()), g = useRef(null), lastTap = useRef(0);
  const cur = items[i] || items[0];
  const { url } = useMediaUrl(cur && cur.it.p, cur && cur.it.local);
  useEffect(() => {
    const k = (e) => { if (e.key === 'Escape') onClose(); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, [i]);
  const step = (d) => { const n = i + d; if (n < 0 || n >= items.length) return; setI(n); setZ({ s: 1, x: 0, y: 0 }); };
  const down = (e) => {
    e.currentTarget.setPointerCapture(e.pointerId);
    pts.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = Array.from(pts.current.values());
    if (p.length === 2) g.current = { pinch: true, d0: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), s0: z.s, x0: z.x, y0: z.y };
    else g.current = { pinch: false, sx: e.clientX, sy: e.clientY, x0: z.x, y0: z.y, t: Date.now() };
  };
  const move = (e) => {
    if (!pts.current.has(e.pointerId)) return;
    pts.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const s = g.current;
    if (!s) return;
    const p = Array.from(pts.current.values());
    if (s.pinch && p.length === 2) { const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); setZ({ s: Math.max(1, Math.min(5, s.s0 * d / Math.max(1, s.d0))), x: s.x0, y: s.y0 }); return; }
    if (s.pinch) return;
    const dx = e.clientX - s.sx, dy = e.clientY - s.sy;
    if (z.s > 1.01) setZ({ s: z.s, x: s.x0 + dx, y: s.y0 + dy });
    else setDrag({ x: Math.abs(dx) > Math.abs(dy) ? dx : 0, y: Math.abs(dy) > Math.abs(dx) && dy > 0 ? dy : 0 });
  };
  const up = (e) => {
    pts.current.delete(e.pointerId);
    const s = g.current;
    if (pts.current.size) return;
    g.current = null;
    if (!s) return;
    if (s.pinch) { if (z.s < 1.05) setZ({ s: 1, x: 0, y: 0 }); return; }
    const dx = e.clientX - s.sx, dy = e.clientY - s.sy;
    if (z.s <= 1.01) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {
        const now = Date.now();
        if (now - lastTap.current < 300) { setZ({ s: 2.5, x: 0, y: 0 }); lastTap.current = 0; } else lastTap.current = now;
      } else if (dy > 110 && Math.abs(dy) > Math.abs(dx)) { onClose(); return; }
      else if (dx < -60) step(1);
      else if (dx > 60) step(-1);
    } else if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {
      const now = Date.now();
      if (now - lastTap.current < 300) { setZ({ s: 1, x: 0, y: 0 }); lastTap.current = 0; } else lastTap.current = now;
    }
    setDrag({ x: 0, y: 0 });
  };
  const share = async () => {
    try {
      const blob = await (await fetch(url)).blob();
      const ext = blob.type === 'image/gif' ? 'gif' : 'jpg';
      const file = new File([blob], 'algor-bomber-' + Date.now() + '.' + ext, { type: blob.type || 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
      const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { /* annullato */ }
  };
  if (!cur) return null;
  const p = C.playersById[cur.m.by];
  const dim = drag.y ? Math.max(0.35, 1 - drag.y / 500) : 1;
  return html`<div class="mv" role="dialog" aria-modal="true" aria-label="Foto" style=${'background:rgba(0,0,0,' + dim + ')'}>
    <div class="mv-head">
      <button class="icon-btn ghostw" aria-label="Chiudi" onClick=${onClose}><${Icon} n="back" /></button>
      <span class="mv-who"><span class="ell">${cur.m.by === C.uid ? 'Tu' : p ? dispName(p) : 'Ex giocatore'}</span><span class="tiny">${fmtDay(numOr(cur.m.t, 0))}, ${fmtClock(numOr(cur.m.t, 0))}${items.length > 1 ? ' · ' + (i + 1) + ' di ' + items.length : ''}</span></span>
      ${onReply && html`<button class="icon-btn ghostw" aria-label="Rispondi" onClick=${() => onReply(cur.m)}><${Icon} n="reply" /></button>`}
      <button class="icon-btn ghostw" aria-label="Condividi o salva" onClick=${share} disabled=${!url}><${Icon} n="share" /></button>
    </div>
    <div class="mv-stage" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}>
      ${url ? html`<img src=${url} alt="" draggable="false" style=${'transform:translate(' + (z.x + drag.x) + 'px,' + (z.y + drag.y) + 'px) scale(' + z.s + ')' + (g.current ? '' : ';transition:transform .2s ease')} />`
        : html`<span class="spin light"></span>`}
      ${i > 0 && html`<button class="mv-nav l" aria-label="Foto precedente" onClick=${() => step(-1)}><${Icon} n="back" /></button>`}
      ${i < items.length - 1 && html`<button class="mv-nav r" aria-label="Foto successiva" onClick=${() => step(1)}><${Icon} n="chev" /></button>`}
    </div>
    ${cur.m.text && html`<div class="mv-cap">${richText(cur.m.text, cur.m.ment, C)}</div>`}
  </div>`;
}

/* inoltra: si scelgono fino a 5 chat (gruppi e persone) */

function ReactionsSheet({ m, onClose, onRemove }) {

/* ---------- mandare in chat un'immagine fatta dall'app (card, locandina, risultato) ---------- */
function ChatPickSheet({ blob, title, onClose }) {
  const C = useContext(Ctx);
  const [busy, setBusy] = useState(null);
  const A = useMemo(() => chatActions(C), [C.be, C.uid]);
  const rows = C.chatRows.filter((r) => (r.dm ? C.canDm(r.other) : true));

/* ---------- impostazioni: notifiche sul telefono ---------- */
function PushSettings() {
  const C = useContext(Ctx);
  const [st, setSt] = useState(null);
  const [n, setN] = useState(null);
  const [busy, setBusy] = useState(false);
  const load = async () => {
    setSt(await Push.state());
    if (C.be.db.rpc && C.chatReady) { try { setN(await C.be.db.rpc('push_devices')); } catch (e) { setN(null); } }
  };
  useEffect(() => { load(); }, []);
  const on = async () => { setBusy(true); try { const s = await Push.enable(C.be); if (s === 'on') C.flash('Notifiche attive su questo telefono'); if (s === 'denied') C.flash('Notifiche bloccate: si riattivano dalle impostazioni del telefono', 'err'); } catch (e) { C.flash((e && e.message) || 'Non sono riuscito ad attivarle', 'err'); } await load(); setBusy(false); };
  const off = async () => { setBusy(true); await Push.disable(C.be); C.flash('Notifiche spente su questo telefono'); await load(); setBusy(false); };
  const test = async () => {
    setBusy(true);
    try { const r = await C.be.db.fn('notify', { test: true }); C.flash(r && r.sent ? 'Notifica di prova mandata' : 'Nessun telefono da avvisare', r && r.sent ? undefined : 'err'); }
    catch (e) { C.flash('La funzione delle notifiche non risponde: va pubblicata su Supabase', 'err'); }
    setBusy(false);
  };
  const text = {
    on: 'Attive su questo telefono: ti avvisiamo quando ti scrivono, anche ad app chiusa.',
    off: 'Spente su questo telefono.',
    denied: 'Bloccate dalle impostazioni del telefono (o del browser): si riattivano da lì, alla voce Notifiche di questo sito o app.',
    'ios-home': 'Su iPhone le notifiche funzionano solo con l\'app nella schermata Home: in Safari tocca Condividi → Aggiungi alla schermata Home, poi apri l\'app da lì e torna qui.',
    unsupported: 'Questo browser non riceve notifiche. Su Android usa Chrome; su iPhone aggiungi l\'app alla schermata Home.',
  }[st] || 'Controllo…';
  return html`<section class="sec"><h2 class="h3">Notifiche</h2>
    <div class="card stack-8">
      <div class="hs-12"><span class="push-ic"><${Icon} n="bell" /></span><span class="small grow">${text}</span></div>
      ${n != null && n > 0 && html`<div class="tiny faint">${n === 1 ? 'Ricevi le notifiche su 1 telefono.' : 'Ricevi le notifiche su ' + n + ' telefoni.'}</div>`}
      ${C.demo ? html`<div class="tiny faint">Nella demo le notifiche non partono.</div>` : html`<div class="hs" style="gap:8px">
        ${st === 'off' && html`<button class="btn sm accent" disabled=${busy || !C.chatReady} onClick=${on}><${Icon} n="bell" s="16" /> Attiva</button>`}
        ${st === 'on' && html`<button class="btn sm" disabled=${busy} onClick=${test}>Manda una prova</button>`}
        ${st === 'on' && html`<button class="btn sm ghost" disabled=${busy} onClick=${off}>Spegni</button>`}
      </div>`}
      <div class="tiny faint">Per una chat sola: apri la chat, tocca il nome in alto e scegli Silenzia.</div>
    </div>
  </section>`;
}

  const delGroup = (g) => C.openSheet({ k: 'confirm', title: 'Eliminare ' + g.name + '?', danger: true, label: 'Elimina per sempre', text: 'Vengono cancellati per sempre partite, chat (con foto e vocali), valutazioni e membri del gruppo. I profili restano.', onYes: async () => { await dropFiles(g.id); if ((await C.act.rpc('delete_group', { p_gid: g.id })).ok) C.flash('Gruppo eliminato'); } });

      </button>`)}</div>

/* spazio usato da foto e vocali della chat (piano gratuito di Supabase: 1 GB) */
function ChatSpaceCard() {
  const C = useContext(Ctx);
  const [sp, setSp] = useState(null);
  useEffect(() => {
    let dead = false;
    (async () => { try { const r = await C.be.db.rpc('chat_space'); if (!dead) setSp(r || null); } catch (e) { if (!dead) setSp(null); } })();
    return () => { dead = true; };
  }, []);
  if (!sp) return null;
  const mb = numOr(sp.bytes, 0) / 1048576;
  const pct = Math.min(100, (mb / 1024) * 100);
  const txt = mb < 10 ? mb.toFixed(1).replace('.', ',') : String(Math.round(mb));
  return html`<div class="card stack-8">
    <div class="row-t">Spazio di foto e vocali della chat</div>
    <div class="small muted">${txt} MB su 1 GB gratuito · ${plural(numOr(sp.files, 0), 'file', 'file')}</div>
    <div class="space-bar" role="img" aria-label=${Math.round(pct) + '% usato'}><i style=${'width:' + Math.max(1, pct).toFixed(1) + '%'} class=${pct > 80 ? 'hi' : ''}></i></div>
    <div class="tiny faint">Si libera spazio eliminando per tutti i messaggi con foto o vocali, o eliminando un gruppo.</div>
  </div>`;
}

function AccuracyCard() {

  const acc = Engine.accuracy(C.matches);
  if (!acc) {
    return html`<div class="card stack-8">
      <div class="h3">Quanto ci prende il bilanciamento</div>
      <div class="small muted">Quando chiudete le partite e scrivete i risultati, qui confrontiamo l'equilibrio previsto dall'app con come sono finite davvero.</div>
    </div>`;
  }
  return html`<div class="card stack">
    <div class="h3">Quanto ci prende il bilanciamento</div>
    <div class="acc">
      <div class="acc-big num">${f1(acc.avgDiff)}</div>
      <div class="small"><b>gol di scarto in media</b><div class="muted">su ${plural(acc.n, 'partita', 'partite')} con risultato · equilibrio previsto medio ${r0(acc.avgBal)}%</div></div>
    </div>
    <div class="acc-bar" aria-hidden="true"><i style=${'width:' + (100 * acc.close) / acc.n + '%'}></i></div>
    <div class="small"><b class="num">${acc.close} su ${acc.n}</b> finite con al massimo 2 gol di scarto.</div>
    ${acc.favN > 0 && html`<div class="small muted">Quando una squadra era favorita di almeno un punto ha vinto ${acc.favW} ${acc.favW === 1 ? 'volta' : 'volte'} su ${acc.favN}${acc.favD ? ', ' + plural(acc.favD, 'pareggio', 'pareggi') : ''}.</div>`}
