/* ============================================================
   APP: effetti (coriandoli per MVP e traguardi, entrata lunga della card)
   Con "Riduci movimento" attivo sul telefono non parte niente.
   ============================================================ */
const reducedMotion = () => { try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; } };

/* coriandoli su tutto lo schermo, poi spariscono da soli */
function fireConfetti(opts) {
  if (reducedMotion() || typeof document === 'undefined') return;
  const o = opts || {};
  const cv = document.createElement('canvas');
  cv.className = 'confetti';
  cv.setAttribute('aria-hidden', 'true');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  if (!ctx) { cv.remove(); return; }
  ctx.scale(dpr, dpr);
  const colors = o.colors || ['#f1c22f', '#3ddc97', '#ff6b6b', '#4dabf7', '#ffffff', '#b197fc', '#ffa94d'];
  const N = o.n || 150;
  const parts = [];
  for (let i = 0; i < N; i++) {
    /* due getti dagli angoli in basso, verso il centro */
    const left = i % 2 === 0;
    const a = 0.25 + Math.random() * 0.55; /* inclinazione rispetto alla verticale */
    const sp = (11 + Math.random() * 9) * Math.sqrt(Math.max(0.6, H / 800));
    parts.push({
      x: left ? -10 : W + 10, y: H * 0.88,
      vx: Math.sin(a) * sp * (left ? 1 : -1), vy: -Math.cos(a) * sp,
      s: 6 + Math.random() * 6, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35,
      c: colors[i % colors.length], round: Math.random() < 0.25, wob: Math.random() * 6.28,
    });
  }
  const DUR = o.ms || 2600;
  let t0 = 0, last = 0;
  const step = (t) => {
    if (!t0) { t0 = t; last = t; }
    const dt = Math.min(2.5, (t - last) / 16.67); last = t;
    const k = (t - t0) / DUR;
    ctx.clearRect(0, 0, W, H);
    const fade = k > 0.72 ? Math.max(0, 1 - (k - 0.72) / 0.28) : 1;
    for (const p of parts) {
      p.vy += 0.34 * dt; p.vx *= Math.pow(0.985, dt); p.vy *= Math.pow(0.992, dt);
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.wob += 0.12 * dt;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s * 0.42, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.s / 2, -p.s * 0.22 * Math.abs(Math.cos(p.wob)) - 1, p.s, p.s * 0.44 * Math.abs(Math.cos(p.wob)) + 2);
      ctx.restore();
    }
    if (k < 1) requestAnimationFrame(step); else cv.remove();
  };
  requestAnimationFrame(step);
}

/* una festa sola per dispositivo: ricorda le chiavi già festeggiate */
function celebrateOnce(store, keys) {
  let seen = [];
  try { seen = JSON.parse(readLS(store, '[]')) || []; } catch (e) { seen = []; }
  const fresh = keys.filter((k) => !seen.includes(k));
  if (fresh.length) writeLS(store, JSON.stringify(seen.concat(fresh).slice(-300)));
  return fresh;
}

/* l'MVP dell'ultima partita del gruppo con il voto chiuso */
function lastMvpMatch(C) {
  let best = null;
  for (const m of C.matches) {
    const mv = m.status === 'played' && C.stats.mvps[m.id];
    if (!mv || !mv.closed || !mv.winners.length) continue;
    if (!best || mStart(m) > mStart(best)) best = m;
  }
  return best;
}
const isLastMvp = (C, pid) => { const m = C.gid && lastMvpMatch(C); return !!(m && C.stats.mvps[m.id].winners.includes(pid)); };

/* ============================================================
   APP: addobbi delle feste
   Conta il giorno del telefono; Pasqua e Carnevale si calcolano anno per anno.
   Un addobbo accanto al titolo delle schede principali (toccandolo riparte l'effetto),
   il campo della scheda Campo addobbato e, una volta al giorno, gli auguri con un effetto breve.
   Con "Riduci movimento" niente effetti; si spengono in Impostazioni.
   ============================================================ */
const Feste = (() => {
  /* Pasqua nel calendario gregoriano (algoritmo di Meeus, Jones e Butcher) */
  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const n = h + l - 7 * m + 114;
    return new Date(y, Math.floor(n / 31) - 1, (n % 31) + 1);
  }
  const dayAt = (d, plus) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + (plus || 0)).getTime();
  const F = {
    halloween: { k: 'halloween', name: 'Halloween', art: 'zucca', hi: 'Buon Halloween!', fx: 'bats' },
    inverno: { k: 'inverno', name: 'Neve', art: 'neve', fx: 'snow' },
    natale: { k: 'natale', name: 'Natale', art: 'albero', hi: 'Buon Natale!', fx: 'sleigh' },
    capodanno: { k: 'capodanno', name: 'Capodanno', art: 'fuochi', hi: 'Buon anno!', fx: 'fireworks' },
    befana: { k: 'befana', name: 'Befana', art: 'calza', hi: 'L\'Epifania tutte le feste porta via!', fx: 'candies' },
    carnevale: { k: 'carnevale', name: 'Carnevale', art: 'maschera', hi: 'A Carnevale ogni scherzo vale!', fx: 'confetti' },
    valentino: { k: 'valentino', name: 'San Valentino', art: 'cuore', hi: 'Buon San Valentino!', fx: 'hearts' },
    pasqua: { k: 'pasqua', name: 'Pasqua', art: 'uovo', hi: 'Buona Pasqua!', fx: 'eggs' },
    ferragosto: { k: 'ferragosto', name: 'Ferragosto', art: 'sole', hi: 'Buon Ferragosto!', fx: 'balls' },
  };
  const withHi = (f, hi) => Object.assign({}, f, { hi });
  /* la festa di quel giorno (o null) */
  function on(when) {
    const d = when instanceof Date ? when : new Date(when == null ? Date.now() : when);
    const md = (d.getMonth() + 1) * 100 + d.getDate();
    if (md === 1031) return F.halloween;
    if (md === 1224) return withHi(F.natale, 'Buona Vigilia!');
    if (md === 1225) return F.natale;
    if (md === 1226) return withHi(F.natale, 'Buon Santo Stefano!');
    if (md === 1231) return withHi(F.capodanno, 'Buona fine e buon principio!');
    if (md === 101) return F.capodanno;
    if (md === 106) return F.befana;
    if (md >= 1208 || md <= 105) return md === 1208 ? withHi(F.inverno, 'Sul campo è arrivata la neve!') : F.inverno;
    if (md === 214) return F.valentino;
    if (md === 815) return F.ferragosto;
    const t = dayAt(d), E = easter(d.getFullYear());
    if (t === dayAt(E)) return F.pasqua;
    if (t === dayAt(E, 1)) return withHi(F.pasqua, 'Buona Pasquetta!');
    if (t >= dayAt(E, -52) && t <= dayAt(E, -47)) return F.carnevale; /* da giovedì a martedì grasso */
    return null;
  }
  return { on, easter, list: F };
})();

/* tema scuro in uso (anche quello automatico del telefono) */
const darkUI = () => {
  try {
    const c = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    const x = /^#([0-9a-f]{6})$/i.exec(c);
    if (!x) return false;
    const n = parseInt(x[1], 16);
    return ((n >> 16) * 0.299 + ((n >> 8) & 255) * 0.587 + (n & 255) * 0.114) < 128;
  } catch (e) { return false; }
};

/* ---------- i disegni (32×32): accanto al titolo e sul campo ---------- */
const fx2 = (v) => v.toFixed(2);
function flakeD(cx, cy, r) {
  let d = '';
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 2 + (i * Math.PI) / 3;
    d += 'M' + fx2(cx) + ' ' + fx2(cy) + 'L' + fx2(cx + r * Math.cos(a)) + ' ' + fx2(cy - r * Math.sin(a));
    const bx = cx + 0.58 * r * Math.cos(a), by = cy - 0.58 * r * Math.sin(a);
    [0.8, -0.8].forEach((o) => { d += 'M' + fx2(bx) + ' ' + fx2(by) + 'l' + fx2(0.34 * r * Math.cos(a + o)) + ' ' + fx2(-0.34 * r * Math.sin(a + o)); });
  }
  return d;
}
function raysD(cx, cy, r1, r2, n, rot) {
  let d = '';
  for (let i = 0; i < n; i++) {
    const a = (rot || 0) + (i * 2 * Math.PI) / n;
    d += 'M' + fx2(cx + r1 * Math.cos(a)) + ' ' + fx2(cy + r1 * Math.sin(a)) + 'L' + fx2(cx + r2 * Math.cos(a)) + ' ' + fx2(cy + r2 * Math.sin(a));
  }
  return d;
}
/* pipistrello centrato in 0,0, largo 44: un'ala, il corpo, e l'ala specchiata */

const putArt = (k, x, y, s, rot, arg) => html`<g transform=${rot ? 'rotate(' + rot + ' ' + x + ' ' + y + ')' : null}>
  <svg x=${fx2(x - s / 2)} y=${fx2(y - s / 2)} width=${s} height=${s} viewBox="0 0 32 32" overflow="visible">${FESTA_ART[k](arg)}</svg>
</g>`;
const CORNERS = [null, 'translate(100 0) scale(-1 1)', 'translate(0 160) scale(1 -1)', 'translate(100 160) scale(-1 -1)'];
const WEB_D = (() => {
  const A = [0, 0.3927, 0.7854, 1.1781, 1.5708];
  let d = '';
  A.forEach((a) => { d += 'M0 0L' + fx2(17 * Math.cos(a)) + ' ' + fx2(17 * Math.sin(a)); });
  [5, 9.5, 14].forEach((r) => {
    for (let i = 0; i < A.length - 1; i++) {
      const a1 = A[i], a2 = A[i + 1], am = (a1 + a2) / 2;
      d += 'M' + fx2(r * Math.cos(a1)) + ' ' + fx2(r * Math.sin(a1)) + 'Q' + fx2(r * 0.82 * Math.cos(am)) + ' ' + fx2(r * 0.82 * Math.sin(am)) + ' ' + fx2(r * Math.cos(a2)) + ' ' + fx2(r * Math.sin(a2));
    }
  });
  return d;
})();
function pitchSpecks(seed, n, colors, sizes) {
  const rnd = seededRng(seed);
  return Array.from({ length: n }, (_, i) => {
    const x = rnd() * 100, y = rnd() * 160, r = sizes[0] + rnd() * (sizes[1] - sizes[0]), c = colors[i % colors.length];
    return colors.length > 1
      ? html`<rect key=${i} x=${fx2(x)} y=${fx2(y)} width=${fx2(r * 2)} height=${fx2(r * 0.9)} fill=${c} transform=${'rotate(' + Math.round(rnd() * 180) + ' ' + fx2(x) + ' ' + fx2(y) + ')'} opacity=".85" />`
      : html`<circle key=${i} cx=${fx2(x)} cy=${fx2(y)} r=${fx2(r)} fill=${c} opacity=${fx2(0.55 + rnd() * 0.4)} />`;
  });
}

/* ---------- l'effetto breve (sopra tutto, poi sparisce da solo) ---------- */
let festaFxOn = false;
const FESTA_FX = {
  /* pipistrelli che attraversano lo schermo sbattendo le ali */
  bats: {
    ms: 3600,
    init: (W, H) => Array.from({ length: 8 }, (_, i) => {
      const dir = i % 2 ? -1 : 1;
      return { dir, x: dir > 0 ? -50 : W + 50, y0: H * (0.08 + Math.random() * 0.6), v: (W / 400) * (4 + Math.random() * 2.6), s: 0.85 + Math.random() * 0.75, ph: Math.random() * 6.28, delay: Math.random() * 1100 };
    }),
    frame: (ctx, ps, dt, el, W, H, dark) => {
      const wing = new Path2D(BAT_WING), body = new Path2D(BAT_BODY);
      for (const p of ps) {
        if (el < p.delay) continue;
        p.x += p.dir * p.v * dt;
        const y = p.y0 + Math.sin(p.ph + el * 0.004) * 22;
        const flap = 0.2 + 0.8 * Math.cos(p.ph + el * 0.034);
        ctx.save();
        ctx.translate(p.x, y);
        ctx.scale(p.s * 1.25 * p.dir, p.s * 1.25);
        ctx.fillStyle = '#1a1320';
        if (dark) { ctx.strokeStyle = 'rgba(255,160,80,.8)'; ctx.lineWidth = 1.1; }
        for (const side of [1, -1]) {
          ctx.save(); ctx.scale(side, flap);
          ctx.fill(wing); if (dark) ctx.stroke(wing);
          ctx.restore();
        }
        ctx.fill(body); if (dark) ctx.stroke(body);
        ctx.restore();
      }
    },
  },
  /* neve che scende */
  snow: {
    ms: 4200,
    init: (W, H) => Array.from({ length: Math.max(50, Math.min(140, Math.round((W * H) / 9000))) }, () => ({
      x: Math.random() * W, y: -Math.random() * H * 0.7 - 10, r: 1.3 + Math.random() * 2.4, v: (0.9 + Math.random() * 1.4) * Math.max(0.8, H / 800), sw: 0.6 + Math.random() * 1.4, ph: Math.random() * 6.28,
    })),
    frame: (ctx, ps, dt, el, W, H, dark) => {
      ctx.fillStyle = dark ? '#ffffff' : '#7fa9d8';
      for (const p of ps) {
        p.y += p.v * dt;
        const x = p.x + Math.sin(p.ph + el * 0.002) * 14 * p.sw;
        ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
    },
  },
  /* la slitta con le renne, in mezzo alla neve */
  sleigh: {
    ms: 4400,
    init: (W, H) => ({ snow: FESTA_FX.snow.init(W, H).slice(0, 60), sc: Math.min(1.5, Math.max(0.9, W / 340)), trail: [] }),
    frame: (ctx, st, dt, el, W, H, dark, fade) => {
      FESTA_FX.snow.frame(ctx, st.snow, dt, el, W, H, dark);
      const col = dark ? '#f0d9a6' : '#4a3426';
      const k = Math.min(1, el / 3600), sc = st.sc;
      const x = W + 40 * sc - k * (W + 160 * sc), y = H * 0.17 + Math.sin(el * 0.003) * 10;
      if (Math.random() < 0.7) st.trail.push({ x: x + 34 * sc, y: y + 2 * sc, life: 1 });
      ctx.fillStyle = '#f4c430';
      for (const s of st.trail) { s.life -= 0.02 * dt; if (s.life > 0) { ctx.globalAlpha = fade * Math.max(0, s.life); ctx.beginPath(); ctx.arc(s.x, s.y + (1 - s.life) * 10, 1.6, 0, Math.PI * 2); ctx.fill(); } }
      ctx.globalAlpha = fade;
      ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
      ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      /* redini */
      ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(4, -6); ctx.lineTo(-24, -6); ctx.lineTo(-52, -6); ctx.stroke();
      [-30, -58].forEach((rx) => {
        ctx.save(); ctx.translate(rx, 0);
        ctx.beginPath(); ctx.ellipse(0, 0, 11, 5, -0.06, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-8, -2); ctx.lineTo(-12.5, -9); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(-15, -10.5, 4, 2.6, -0.35, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 1.3; ctx.beginPath();
        ctx.moveTo(-13.2, -12.6); ctx.lineTo(-10.6, -18.6); ctx.moveTo(-12, -15.6); ctx.lineTo(-8.6, -16.8); ctx.moveTo(-11.4, -17); ctx.lineTo(-13.4, -20);
        ctx.moveTo(-15.2, -12.8); ctx.lineTo(-15, -19.4); ctx.moveTo(-15.1, -16.6); ctx.lineTo(-18, -18.6);
        ctx.stroke();
        const g = Math.sin(el * 0.02 + rx) * 0.7;
        ctx.lineWidth = 1.9; ctx.beginPath();

function drawPitch(ctx, fonts, X, Y, s, m, D) {
  const W = 100 * s, H = 160 * s;
  ctx.save();
  rrect(ctx, X, Y, W, H, 34); ctx.clip();
  ctx.fillStyle = '#2c8a4b'; ctx.fillRect(X, Y, W, H);
  ctx.fillStyle = '#349a57';
  for (let k = 0; k < 10; k += 2) ctx.fillRect(X, Y + k * 16 * s, W, 16 * s);
  ctx.save();
  ctx.translate(X, Y); ctx.scale(s, s);
  ctx.strokeStyle = 'rgba(255,255,255,0.88)'; ctx.lineWidth = 0.55; ctx.lineJoin = 'round';
  if (typeof Path2D !== 'undefined') PITCH_LINES.forEach((d) => ctx.stroke(new Path2D(d)));
  ctx.beginPath(); ctx.arc(50, 80, 11, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  [[50, 80, 0.8], [50, 16, 0.6], [50, 144, 0.6]].forEach(([x, y, rr]) => { ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill(); });
  ctx.lineWidth = 0.35; ctx.strokeRect(42, 0.4, 16, 2.6); ctx.strokeRect(42, 157, 16, 2.6);
  ctx.restore();
  const vg = ctx.createRadialGradient(X + W / 2, Y + H / 2, W * 0.35, X + W / 2, Y + H / 2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = vg; ctx.fillRect(X, Y, W, H);
  const ca = teamColor(m, 'a') || { hex: '#2f6fdb', ink: '#fff' }, cb = teamColor(m, 'b') || { hex: '#d9483b', ink: '#fff' };
  const put = (pts, c) => pts.forEach((pt) => {
    const x = D.info(pt.id);
    const cx = X + pt.x * s, cy = Y + pt.y * s;
    drawShirt(ctx, cx, cy, 24 * SHIRT_K * s, c.hex);
    const no = jerseyOf(x.p);
    ctx.textAlign = 'center';
    if (no != null) { ctx.fillStyle = c.ink; ctx.font = F(800, 5.6 * s, fonts.disp); ctx.fillText(String(no), cx, cy + 2.4 * s); }
    else if (x.p && x.p.icon) { ctx.fillStyle = '#000'; ctx.font = Math.round(4.6 * s) + 'px ' + EMOJI_FONT; ctx.fillText(x.p.icon, cx, cy + 2.2 * s); }
    else { ctx.fillStyle = c.ink; ctx.font = F(700, 3.7 * s, fonts.body); ctx.fillText(x.guest ? (x.name || '?').slice(0, 1).toUpperCase() : initialsOf(x.p), cx, cy + 1.9 * s); }
    ctx.font = F(700, 3.5 * s, fonts.body);
    ctx.lineWidth = 0.85 * s; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineJoin = 'round';
    const nm = pitchShort(x.name || '');
    ctx.strokeText(nm, cx, cy + 10.6 * s); ctx.fillStyle = '#fff'; ctx.fillText(nm, cx, cy + 10.6 * s);
  });
  put(pitchPlaces(D.B, D.roles, 'b'), cb);
  put(pitchPlaces(D.A, D.roles, 'a'), ca);
  ctx.restore();
}

/* ---------- il risultato dopo la partita ---------- */
function scorerLines(m, C, side) {
  const res = m.result, fin = m.final || {};
  if (!res || !res.ev) return [];
  const team = new Set(side === 'a' ? fin.a || [] : fin.b || []), other = new Set(side === 'a' ? fin.b || [] : fin.a || []);
  const out = [];
  Object.keys(res.ev).forEach((id) => { const e = res.ev[id] || {}; if (team.has(id) && e.g > 0) out.push({ t: nameFor(id, m, C), n: e.g }); });
  out.sort((x, y) => y.n - x.n);
  Object.keys(res.ev).forEach((id) => { const e = res.ev[id] || {}; if (other.has(id) && e.og > 0) out.push({ t: 'aut. ' + nameFor(id, m, C), n: e.og }); });
  return out.map((x) => x.t + (x.n > 1 ? '  ×' + x.n : ''));
}

/* ---------- il foglio con l'anteprima: Condividi e Salva ---------- */
function ShareImageSheet({ title, make, name, onClose }) {
  const C = useContext(Ctx);
  const [st, setSt] = useState({ busy: true });
  useEffect(() => {
    let dead = false, url = null;
    (async () => {
      try {
        const cv = await make();
        const blob = await canvasToBlob(cv);
        if (!blob) throw new Error('blob');
        url = URL.createObjectURL(blob);
        if (!dead) setSt({ busy: false, url, blob });
      } catch (e) { if (!dead) setSt({ busy: false, err: true }); }
    })();
    return () => { dead = true; if (url) URL.revokeObjectURL(url); };
  }, []);
  const fileName = (name || 'algor-bomber') + '.png';
  let file = null;
  try { file = st.blob && typeof File !== 'undefined' ? new File([st.blob], fileName, { type: 'image/png' }) : null; } catch (e) { file = null; }
  let canShare = false;
  try { canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { canShare = false; }
  const share = async () => { try { await navigator.share({ files: [file], title }); } catch (e) { /* annullato da chi condivide */ } };
  const save = () => { const a = document.createElement('a'); a.href = st.url; a.download = fileName; document.body.appendChild(a); a.click(); a.remove(); };
  return html`<${Sheet} title=${title} onClose=${onClose}>
    ${st.busy ? html`<div class="card empty small">Preparo l'immagine…</div>`
      : st.err ? html`<div class="note bad"><${Icon} n="warn" s="16" /><span>Non sono riuscito a preparare l'immagine. Riprova tra poco.</span></div>`
      : html`<img class="share-prev" src=${st.url} alt=${'Anteprima: ' + title} />
        ${C.chatReady && C.chatRows.length > 0 && C.canWrite && html`<button class="btn accent block" onClick=${() => C.openSheet({ k: 'chatPick', blob: st.blob, title })}><${Icon} n="chat" s="16" /> Manda in una chat dell'app</button>`}
        <div class="hs" style="gap:8px">
          ${canShare && html`<button class="btn primary grow" onClick=${share}><${Icon} n="share" s="16" /> Condividi</button>`}
          <button class=${'btn grow' + (canShare ? '' : ' primary')} onClick=${save}><${Icon} n="download" s="16" /> Salva immagine</button>
        </div>
        <div class="tiny faint">Puoi anche tenere premuta l'immagine per salvarla o mandarla.</div>`}
  <//>`;
}

  const valid = first.trim() && last.trim() && role && birthOk && numOk;

    const f = e.target.files && e.target.files[0];

  const base = () => ({
    first: first.trim().slice(0, 24), last: last.trim().slice(0, 28), nick: nick.trim().slice(0, 16),

    num: num.trim() && numOk ? Number(num) : null,

  const doSave = async () => {
    setBusy(true);
    const now = Date.now();

      ? await C.act.saveProfile(Object.assign(base(), { self: Engine.cleanVoci(vals), selfAt: now, selfUnlock: false, injury: null, created: now, updated: now }))

/* ---------- autovalutazione da rifare (solo se l'amministratore l'ha sbloccata) ---------- */
function SelfRateScreen({ forced }) {
  const C = useContext(Ctx);
  const me = C.me;
  const isNew = me && !Engine.hasNewSelf(me);
  const [vals, setVals] = useState(() => Object.assign(defaultVoci(), Engine.cleanVoci(me && (Engine.hasNewSelf(me) ? me.self : Engine.legacyVoci(me.self)))));
  const [busy, setBusy] = useState(false);
  if (!me) return html`<${Page} title="Autovalutazione" onBack=${C.back}><div class="card empty">Crea prima il tuo profilo.</div><//>`;
  if (!me.selfUnlock && !isNew && !C.isAdmin) {
    return html`<${Page} title="Autovalutazione" onBack=${C.back}>
      <div class="note"><${Icon} n="lock" s="16" /><span>La tua autovalutazione è bloccata dal ${fmtTs(numOr(me.selfAt, Date.now()))}. Solo l'amministratore può sbloccarla.</span></div>
    <//>`;
  }
  const ovr = Engine.ovrOf(Engine.areasOf(vals), me.role);
  const doSave = async () => {
    setBusy(true);
    const ok = await C.act.saveSelf(Engine.cleanVoci(vals));
    setBusy(false);
    if (ok) { C.flash('Autovalutazione salvata'); if (!forced) C.back(); }
  };
  const ask = () => C.openSheet({ k: 'confirm', title: 'Confermi l\'autovalutazione?', text: `Con questi valori il tuo punteggio di partenza è ${r0(ovr)}. Dopo il salvataggio non potrai più modificarla.`, label: 'Sì, salva', onYes: doSave });
  return html`<${Page} title=${isNew ? 'Nuova autovalutazione' : 'Rifai l\'autovalutazione'} sub=${isNew ? 'Le stats sono cambiate: ora sono ' + VOCI.length + ' voci da 1 a 99' : me.selfUnlock ? 'L\'amministratore l\'ha sbloccata per te' : 'Come amministratore puoi modificarla'} onBack=${forced ? null : C.back}>
    ${isNew && html`<div class="note ok"><${Icon} n="info" s="16" /><span>Ciao ${dispName(me)}! L'app ora usa ${AREAS.length} aree e ${VOCI.length} voci, da 1 a 99 come su FIFA. Ti chiediamo di rifare l'autovalutazione, una volta sola. Abbiamo già messo i tuoi vecchi valori di attacco, centrocampo e difesa come punto di partenza.</span></div>`}
    <${SelfLockNote} />
    <div class="tiny faint">${SCALE_HINT}</div>
    <${RatingEditor} idp="sr" vals=${vals} setVals=${setVals} role=${me.role} />
    <div class="sticky-act"><button class="btn primary block" disabled=${busy || !C.canWrite} onClick=${ask}>${busy ? 'Salvo…' : 'Salva autovalutazione · ' + r0(ovr)}</button></div>
  <//>`;
}

/* ---------- voci aggiunte dopo (la Scivolata): chi è già iscritto le dà una volta, poi restano bloccate ---------- */
const vociNames = (ks) => ks.map((k) => (VOCI.find((v) => v.k === k) || {}).name).filter(Boolean);
const joinE = (xs) => (xs.length > 1 ? xs.slice(0, -1).join(', ') + ' e ' + xs[xs.length - 1] : xs.join(''));
function NewVociScreen() {
  const C = useContext(Ctx);
  const me = C.me;
  const miss = me ? Engine.missingSelfVoci(me) : [];
  const self = me ? Engine.cleanVoci(me.self) : {};
  const start = Engine.withLate(self);
  const [vals, setVals] = useState(() => Object.fromEntries(miss.map((x) => [x.k, Math.round(start[x.k])])));
  const [busy, setBusy] = useState(false);
  if (!me || !miss.length) return null;
  const merged = Object.assign({}, self, vals);
  const areasNow = Engine.areasOf(merged);
  const areas = AREAS.filter((a) => miss.some((x) => x.area === a.k));
  const one = miss.length === 1 ? miss[0] : null;
  const save = async () => {
    setBusy(true);
    const ok = await C.act.addSelfVoci(Object.assign({}, vals));
    setBusy(false);
    if (ok) C.flash(one ? one.name + ' salvata nella tua autovalutazione' : 'Voci salvate nella tua autovalutazione');
  };
  const ask = () => C.openSheet({
    k: 'confirm', title: 'Confermi?', label: 'Sì, salva',
    text: (one ? `${one.name}: ${vals[one.k]}. ` : '') + 'Dopo il salvataggio non potrai più cambiarla, come il resto della tua autovalutazione.',
    onYes: save,
  });
  return html`<${Page} title=${one ? 'Nuova voce: ' + one.name : 'Nuove voci'} sub="Una volta sola, poi resta bloccata">
    <div class="note ok"><${Icon} n="info" s="16" /><span>Ciao ${dispName(me)}! ${miss.map((x) => 'Nella ' + Engine.AREA_BY[x.area].name + ' ora c\'è anche la voce ' + x.name + '.').join(' ')} Dai il tuo voto, una volta sola: il resto della tua autovalutazione non cambia. Il cursore parte dalla media di ${joinE(vociNames(miss[0].from))}.</span></div>
    <div class="tiny faint">${SCALE_HINT}</div>
    ${areas.map((a) => html`<section key=${a.k} class="card area-card" aria-label=${a.name}>
      <div class="area-h">
        <div class="grow"><h3 class="h3">${a.name}</h3><div class="tiny faint">La tua autovalutazione · media delle ${a.voci.length} voci</div></div>
        <${Ovr} v=${areasNow[a.k]} size="sm" />
      </div>
      ${a.voci.map((x) => (miss.some((y) => y.k === x.k)
        ? html`<${RateSlider} key=${x.k} id=${'nv-' + x.k} name=${x.name} hint=${x.hint} value=${vals[x.k]} onChange=${(v) => setVals((s) => ({ ...s, [x.k]: v }))} />`
        : html`<div key=${x.k} class="vb"><span class="vb-n">${x.name}</span><span class="vb-bar"><i style=${'width:' + (self[x.k] || 0) + '%'}></i></span><span class="vb-v num">${Engine.okv(self[x.k]) ? self[x.k] : '–'}</span></div>`))}
    </section>`)}
    <div class="sticky-act"><button class="btn primary block" disabled=${busy || !C.canWrite} onClick=${ask}>${busy ? 'Salvo…' : one ? 'Salva la ' + one.name.toLowerCase() + ' · ' + vals[one.k] : 'Salva'}</button></div>
  <//>`;
}

/* ---------- valutare un altro giocatore ---------- */
function RateScreen({ id }) {
  const C = useContext(Ctx);
  const p = C.playersById[id], r = C.rated[id];
  const mine = ((C.ratings.find((x) => x.id === C.uid) || {}).r || {})[id];
  const [vals, setVals] = useState(() => {
    const out = {};
    /* nel tuo voto di prima, una voce arrivata dopo parte dalla media delle voci da cui nasce */
    const mv = mine && mine.v ? Engine.withLate(Engine.cleanVoci(mine.v)) : null;
    VOCI.forEach((x) => {
      const pv = mv && mv[x.k];
      out[x.k] = Engine.okv(pv) ? Math.round(pv) : r0(r ? r.voci[x.k] : Engine.VDEF);
    });
    return out;
  });
  const [skip, setSkip] = useState(() => {
    const s = {};
    AREAS.forEach((a) => {
      if (mine && mine.v) s[a.k] = !a.voci.some((x) => Engine.okv(mine.v[x.k]));
      else s[a.k] = a.k === 'por' && !(p && (p.role === 'POR' || p.role2 === 'POR'));
    });
    return s;
  });
  const [busy, setBusy] = useState(false);
  if (!p || !r) return html`<${Page} title="Valutazione" onBack=${C.back}><div class="card empty">Giocatore non trovato.</div><//>`;
  if (id === C.uid) return html`<${Page} title="Valutazione" onBack=${C.back}><div class="card empty">Non puoi valutare te stesso qui: l'autovalutazione si fa una volta sola, all'iscrizione.</div><//>`;
  const out = {};
  AREAS.forEach((a) => { if (!skip[a.k]) a.voci.forEach((x) => { out[x.k] = vals[x.k]; }); });
  const n = Object.keys(out).length;
  const myAreas = Engine.areasOf(out);
  const counted = p.role === 'POR' ? ['por'] : OUT_AREAS;
  const myOvr = counted.every((k) => myAreas[k] != null) ? Engine.ovrOf(myAreas, p.role) : null;
  const save = async () => {
    if (!n || busy) return;
    setBusy(true);
    const ok = await C.act.saveRating(id, out);
    setBusy(false);
    if (ok) { C.flash('Valutazione di ' + dispName(p) + ' salvata'); C.back(); }
  };
  return html`<${Page} title=${'Valuta ' + dispName(p)} sub=${fullName(p)} onBack=${C.back}>
    <div class="card hs-12">
      <${Avatar} p=${p} size=${44} />
      <div class="grow"><div class="row-t"><span class="ell">${dispName(p)}</span><${InjuryMark} inj=${p.injury} /></div><div class="small muted">Punteggio attuale, media di ${plural(r.nPeers + (r.self ? 1 : 0), 'valutazione', 'valutazioni')}</div></div>
      <${RoleChips} role=${p.role} role2=${p.role2} />
      <${Ovr} v=${r.ovr} />
    </div>
    <div class="note"><${Icon} n="info" s="16" /><span>La tua valutazione è pubblica e la puoi cambiare quando vuoi: conta sempre l'ultima. Se un'area non la sai giudicare, saltala.</span></div>
    <div class="tiny faint">${SCALE_HINT}</div>
    <${RatingEditor} idp="rt" vals=${vals} setVals=${setVals} skip=${skip} setSkip=${setSkip} allowSkip role=${p.role} />
    <div class="sticky-act"><button class="btn primary block" disabled=${!n || busy || !C.canWrite} onClick=${save}>${busy ? 'Salvo…' : !n ? 'Valuta almeno un\'area' : (mine ? 'Aggiorna valutazione' : 'Salva valutazione') + (myOvr != null ? ' · ' + r0(myOvr) : '')}</button></div>
  <//>`;
}

/* ---------- infortunio ---------- */
function InjuryEditor() {
  const C = useContext(Ctx);
  const inj = C.me && C.me.injury;
  const [open, setOpen] = useState(false);
  const [level, setLevel] = useState((inj && inj.level) || 'lieve');
  const [zone, setZone] = useState((inj && inj.zone) || '');
  const [note, setNote] = useState((inj && inj.note) || '');
  const [back, setBack] = useState((inj && inj.back) || '');
  const [busy, setBusy] = useState(false);
  const start = () => { setLevel((inj && inj.level) || 'lieve'); setZone((inj && inj.zone) || ''); setNote((inj && inj.note) || ''); setBack((inj && inj.back) || ''); setOpen(true); };
  const save = async () => {
    setBusy(true);
    const ok = await C.act.setInjury({ level, zone: zone || '', note: note.trim().slice(0, 60), back: back || '', since: (inj && inj.since) || Date.now() });
    setBusy(false);
    if (ok) { setOpen(false); C.flash(level === 'grave' ? 'Infortunio grave segnato' : 'Infortunio lieve segnato'); }
  };
  const clear = async () => {
    setBusy(true);
    const ok = await C.act.setInjury(null);
    setBusy(false);
    if (ok) { setOpen(false); C.flash('Bentornato in campo!'); }
  };
  if (open) {
    return html`<div class="card stack">
      <span class="label">Quanto è grave?</span>
      <${Seg} value=${level} onChange=${setLevel} options=${[
        { v: 'lieve', l: html`<span class="hs" style="justify-content:center"><span class="inj lieve"><${Icon} n="bandage" s="16" /></span> Lieve</span>` },
        { v: 'grave', l: html`<span class="hs" style="justify-content:center"><span class="inj grave"><${Icon} n="cross" s="16" fill /></span> Grave</span>` },
      ]} />
      <div class="field"><span class="label">Dove?</span>
        <div class="chips-row" role="group" aria-label="Dove ti sei fatto male">${INJ_ZONES.map((z) => html`<button key=${z.k} type="button" class=${'pick-chip' + (zone === z.k ? ' on' : '')} aria-pressed=${zone === z.k} onClick=${() => setZone(zone === z.k ? '' : z.k)}>${z.l}</button>`)}</div>
      </div>
      <div class="field"><label class="label" for="inj-note">Nota <span class="faint">(facoltativa)</span></label><input id="inj-note" class="input" maxlength="60" placeholder="Es. distorsione, stiramento" value=${note} onInput=${(e) => setNote(e.target.value)} /></div>
      <div class="field"><label class="label" for="inj-back">Rientro previsto <span class="faint">(facoltativo)</span></label><input id="inj-back" class="input" type="date" value=${back} onInput=${(e) => setBack(e.target.value)} /></div>
      <div class="tiny faint">Tutti gli iscritti vedono dove ti sei fatto male, la nota e la data di rientro. L'infortunio resta finché non lo togli tu; quando la data di rientro passa, l'app te lo ricorda. Per fare le squadre conti ${level === 'grave' ? CFG.INJ_BAD : CFG.INJ_LIGHT} punti in meno.</div>
      <div class="hs" style="gap:10px">
        <button class="btn ghost grow" type="button" onClick=${() => setOpen(false)}>Annulla</button>
        <button class="btn primary grow" type="button" disabled=${busy || !C.canWrite} onClick=${save}>${busy ? 'Salvo…' : 'Salva'}</button>
      </div>
    </div>`;
  }
  if (!inj || !inj.level) {
    return html`<div class="card hs-12">
      <span class="inj ok-dot"><${Icon} n="check" s="16" /></span>
      <div class="grow"><div class="row-t">Disponibile</div><div class="small muted">Nessun infortunio segnato.</div></div>
      ${C.canWrite && html`<button class="btn sm" onClick=${start}>Segnala infortunio</button>`}
    </div>`;
  }
  return html`<div class="card stack-8">
    <div class="hs-12">
      <${InjuryMark} inj=${inj} s="22" />
      <div class="grow">
        <div class="row-t">${inj.level === 'grave' ? 'Infortunio grave' : 'Infortunio lieve'}</div>
        <div class="small muted">${injSummary(inj)}</div>
      </div>
    </div>
    ${C.canWrite && html`<div class="hs wrap"><button class="btn sm accent" disabled=${busy} onClick=${clear}>Sono guarito</button><button class="btn sm" onClick=${start}>Modifica</button></div>`}
  </div>`;
}

/* ---------- giocatori: del gruppo o tutti gli iscritti all'app, con i filtri ---------- */
const numOrNull = (v) => { const t = String(v == null ? '' : v).trim(); if (!t) return null; const n = Number(t); return isFinite(n) ? n : null; };
/* stato che resta com'era quando si apre un giocatore e si torna indietro (per questa visita) */
const KEPT = new Map();
function useKept(key, init) {
  const [v, setV] = useState(() => (KEPT.has(key) ? KEPT.get(key) : (typeof init === 'function' ? init() : init)));
  const set = (x) => setV((prev) => { const nv = typeof x === 'function' ? x(prev) : x; KEPT.set(key, nv); return nv; });
  return [v, set];
}
function PlayersScreen() {
  const C = useContext(Ctx);
  const myLoc = (C.me && C.me.loc) || null;
  const K = 'pl.' + (C.gid || '-') + '.';
  const [q, setQ] = useKept(K + 'q', '');
  const [sort, setSort] = useKept(K + 'sort', 'lvl');
  const [scope, setScope] = useKept(K + 'scope', C.gid ? 'group' : 'all');
  const [showF, setShowF] = useKept(K + 'showF', false);
  const [km, setKm] = useKept(K + 'km', 0);
  const [from, setFrom] = useKept(K + 'from', myLoc);
  const [roles, setRoles] = useKept(K + 'roles', []);
  const [ovrMin, setOvrMin] = useKept(K + 'ovrMin', '');
  const [ovrMax, setOvrMax] = useKept(K + 'ovrMax', '');
  const [ageMin, setAgeMin] = useKept(K + 'ageMin', '');
  const [ageMax, setAgeMax] = useKept(K + 'ageMax', '');
  const [healthy, setHealthy] = useKept(K + 'healthy', false);
  const [onlyFriends, setOnlyFriends] = useKept(K + 'onlyFriends', false);
  const all = !C.gid || scope === 'all';
  useEffect(() => { if (all) C.loadGlobal(); }, [all]);
  const R = all ? C.ratedAll : C.rated;
  const base = all ? C.allPlayers : C.players;
  const t = q.trim().toLowerCase();
  const oMin = numOrNull(ovrMin), oMax = numOrNull(ovrMax), aMin = numOrNull(ageMin), aMax = numOrNull(ageMax);
  const zoneOn = km > 0 && !!from;
  const nActive = (zoneOn ? 1 : 0) + (roles.length ? 1 : 0) + (oMin != null || oMax != null ? 1 : 0) + (aMin != null || aMax != null ? 1 : 0) + (healthy ? 1 : 0) + (onlyFriends ? 1 : 0);
  const dist = (p) => (from && p.loc ? kmBetween(from, p.loc) : null);
  const far = (p) => { const d = dist(p); return d == null ? 1e9 : d; };
  const list = base.filter((p) => {
    if (t && !(fullName(p) + ' ' + (p.nick || '')).toLowerCase().includes(t)) return false;
    if (zoneOn) { const d = dist(p); if (d == null || d > km) return false; }
    if (roles.length && !roles.includes(p.role) && !roles.includes(p.role2)) return false;
    const o = r0(R[p.id].ovr);
    if (oMin != null && o < oMin) return false;
    if (oMax != null && o > oMax) return false;
    const a = ageOf(p);
    if ((aMin != null || aMax != null) && a == null) return false;
    if (aMin != null && a < aMin) return false;
    if (aMax != null && a > aMax) return false;
    if (healthy && p.injury && p.injury.level) return false;
    if (onlyFriends && !C.isFriend(p.id)) return false;
    return true;
  }).sort(friendsFirst(C, sort === 'lvl' ? (a, b) => R[b.id].ovr - R[a.id].ovr
    : sort === 'km' ? (a, b) => far(a) - far(b) || R[b.id].ovr - R[a.id].ovr
      : (a, b) => dispName(a).localeCompare(dispName(b), 'it')));
  const injured = base.filter((p) => p.injury && p.injury.level).length;
  const toggleRole = (r) => setRoles(roles.includes(r) ? roles.filter((x) => x !== r) : roles.concat(r));
  const reset = () => { setKm(0); setFrom(myLoc); setRoles([]); setOvrMin(''); setOvrMax(''); setAgeMin(''); setAgeMax(''); setHealthy(false); setOnlyFriends(false); };
  const sub = (p) => {
    if (p.injury && p.injury.level) return injSummary(p.injury);
    const bits = [fullName(p)];
    const d = dist(p);
    if (p.loc) bits.push(zoneOn && d != null ? fmtKm(d) : p.loc.name);
    const a = ageOf(p);
    if (a) bits.push(a + ' anni');
    return bits.join(' · ');
  };
  const SORTS = [{ v: 'lvl', l: 'Per punteggio' }, { v: 'name', l: 'Per nome' }].concat(from ? [{ v: 'km', l: 'Più vicini' }] : []);
  return html`<div class="page">
    <${MainHead} title="Giocatori" />
    ${C.gid && html`<${Seg} value=${scope} onChange=${setScope} options=${[{ v: 'group', l: 'Del gruppo' }, { v: 'all', l: 'Tutti gli iscritti' }]} />`}
    <div class="small muted">${all ? plural(base.length, 'iscritto', 'iscritti') + ' all\'app · stats generali' : plural(base.length, 'membro', 'membri') + ' nel gruppo'}${injured ? ' · ' + plural(injured, 'infortunato', 'infortunati') : ''}</div>
    <div class="stack-8">
      <div class="hs" style="gap:8px">
        <input id="player-search" class="input grow" type="search" placeholder="Cerca per nome o soprannome" value=${q} onInput=${(e) => setQ(e.target.value)} />
        <button class=${'btn' + (nActive ? ' primary' : '')} aria-expanded=${showF} onClick=${() => setShowF(!showF)}><${Icon} n="filter" s="16" /> Filtri${nActive ? ' · ' + nActive : ''}</button>
      </div>
      ${showF && html`<div class="card stack filters">
        <div class="field"><span class="label">Zona</span><${ZoneFilter} km=${km} setKm=${setKm} from=${from} setFrom=${setFrom} idp="pl" /></div>
        <div class="field"><span class="label">Ruolo <span class="faint">(preferito o secondo)</span></span>
          <div class="chips-row">${ROLES.map((r) => html`<button key=${r} type="button" class=${'pick-chip' + (roles.includes(r) ? ' on' : '')} aria-pressed=${roles.includes(r)} onClick=${() => toggleRole(r)}>${ROLE_NAME[r]}</button>`)}</div>
        </div>
        <div class="grid2 keep">
          <div class="field"><span class="label">Punteggio</span>
            <div class="range2"><input id="f-omin" class="input" type="number" inputmode="numeric" min="1" max="99" placeholder="da" aria-label="Punteggio minimo" value=${ovrMin} onInput=${(e) => setOvrMin(e.target.value)} /><span>–</span><input id="f-omax" class="input" type="number" inputmode="numeric" min="1" max="99" placeholder="a" aria-label="Punteggio massimo" value=${ovrMax} onInput=${(e) => setOvrMax(e.target.value)} /></div>
          </div>
          <div class="field"><span class="label">Età</span>
            <div class="range2"><input id="f-amin" class="input" type="number" inputmode="numeric" min="10" max="80" placeholder="da" aria-label="Età minima" value=${ageMin} onInput=${(e) => setAgeMin(e.target.value)} /><span>–</span><input id="f-amax" class="input" type="number" inputmode="numeric" min="10" max="80" placeholder="a" aria-label="Età massima" value=${ageMax} onInput=${(e) => setAgeMax(e.target.value)} /></div>
          </div>
        </div>
        <label class="check"><input type="checkbox" checked=${healthy} onChange=${(e) => setHealthy(e.target.checked)} /><span>Senza infortunati</span></label>
        <label class="check"><input type="checkbox" checked=${onlyFriends} onChange=${(e) => setOnlyFriends(e.target.checked)} /><span>Solo amici</span></label>
        ${(aMin != null || aMax != null) && html`<div class="tiny faint">Con il filtro per età compare solo chi ha messo l'anno di nascita.</div>`}
        ${nActive > 0 && html`<button class="btn ghost sm" onClick=${reset}>Togli tutti i filtri</button>`}
      </div>`}
      <${Seg} value=${sort} onChange=${setSort} options=${SORTS} />
    </div>
    ${list.length ? html`<div class="card pad0 divided">${list.map((p) => html`<button key=${p.id} class="row tap" style="padding:10px 14px" onClick=${() => C.go({ t: 'player', id: p.id, scope: all ? 'all' : 'group' })}>
      <${Avatar} p=${p} size=${40} />
      <span class="row-main"><span class="row-t"><span class="ell">${dispName(p)}</span><${InjuryMark} inj=${p.injury} />${p.id === C.uid && html`<span class="chip ok">Tu</span>`}${C.isFriend(p.id) && html`<${FriendChip} />`}</span><span class=${'row-s ell' + (p.injury && p.injury.level ? ' inj-t' : '')} style="display:block">${sub(p)}</span></span>
      <${RoleChips} role=${p.role} role2=${p.role2} />
      <${Ovr} v=${R[p.id].ovr} />
    </button>`)}</div>` : html`<div class="card empty"><div class="h3">${base.length ? 'Nessun risultato' : 'Ancora nessun giocatore'}</div><div>${base.length ? (nActive ? 'Prova ad allargare i filtri.' : 'Prova con un altro nome.') : 'Quando gli amici creano il profilo compaiono qui.'}</div>${nActive > 0 && html`<button class="btn" onClick=${reset}>Togli i filtri</button>`}</div>`}
  </div>`;
}


/* ============================================================
   APP: partite, squadre, fine partita, MVP
   ============================================================ */
const fmtOf = (m) => FORMATS[m.format] || FORMATS[5];
const myMvpVotes = (C) => (C.mvp.find((x) => x.id === C.uid) || {}).v || {};

function scorersText(m, C, side) {
  const res = m.result, fin = m.final || {};
  if (!res || !res.ev) return { goals: '', assists: '' };
  const team = new Set(side === 'a' ? fin.a || [] : fin.b || []);
  const other = new Set(side === 'a' ? fin.b || [] : fin.a || []);
  const g = [], a = [], og = [];
  for (const id of Object.keys(res.ev)) {
    const e = res.ev[id] || {};
    if (team.has(id)) {
      if (e.g > 0) g.push({ id, n: e.g });
      if (e.a > 0) a.push({ id, n: e.a });
    }
    if (other.has(id) && e.og > 0) og.push({ id, n: e.og });
  }
  const fmt = (arr) => arr.sort((x, y) => y.n - x.n).map((x) => nameFor(x.id, m, C) + (x.n > 1 ? ' ' + x.n : '')).join(', ');
  const goals = [fmt(g), og.length ? og.map((x) => 'aut. ' + nameFor(x.id, m, C) + (x.n > 1 ? ' ' + x.n : '')).join(', ') : ''].filter(Boolean).join(', ');
  return { goals, assists: fmt(a) };
}

/* ---------- partite: elenco ---------- */
function MatchCard({ m }) {
  const C = useContext(Ctx);
  const R = useMemo(() => buildRoster(m, C), [m, C.playersById, C.rated, C.players]);
  const phase = phaseOf(m);
  const mine = m.rsvp && m.rsvp[C.uid];
  const waitPos = R.waitlist.findIndex((x) => x.id === C.uid);
  const inConf = !!R.confirmedById[C.uid];
  const pct = Math.min(100, Math.round((R.confirmed.length / R.cap) * 100));
  const chips = [];
  const mv = C.stats.mvps[m.id];
  if (phase === 'cancelled') chips.push(html`<span class="chip bad">Annullata</span>`);
  else if (phase === 'toclose') chips.push(html`<span class="chip warn">Da chiudere</span>`);
  else if (phase === 'played') {
    if (mv && !mv.closed && (m.final.ids || []).includes(C.uid) && !myMvpVotes(C)[m.id]) chips.push(html`<span class="chip ok"><${Icon} n="trophy" s="14" /> Vota l'MVP</span>`);
    if (!Engine.hasResult(m)) chips.push(html`<span class="chip warn">Manca il risultato</span>`);
    if (mv && mv.winners.length) chips.push(html`<span class="chip"><${Icon} n="trophy" s="14" /> ${joinNames(mv.winners.map((id) => nameFor(id, m, C)))}</span>`);
    if (!chips.length) chips.push(html`<span class="chip">Giocata</span>`);
  } else if (inConf) chips.push(html`<span class="chip ok"><${Icon} n="check" s="14" /> Ci sei</span>`);
  else if (!mine && m.invites && m.invites[C.uid]) chips.push(html`<span class="chip warn"><${Icon} n="heart" s="12" fill /> Sei invitato</span>`);
  else if (waitPos >= 0) chips.push(html`<span class="chip warn">In attesa · n° ${waitPos + 1}</span>`);
  else if (mine && mine.s === 'maybe') chips.push(html`<span class="chip warn">Forse</span>`);
  else if (mine && mine.s === 'out') chips.push(html`<span class="chip">Non ci sei</span>`);
  else chips.push(html`<span class="chip">Da rispondere</span>`);
  if (phase === 'upcoming') {
    if (R.confirmed.length > 0 && R.gk === 0) chips.push(html`<span class="chip warn">Nessun portiere</span>`);
    if (R.waitlist.length > 0) chips.push(html`<span class="chip">${R.waitlist.length} in attesa</span>`);
  }
  const hasRes = phase === 'played' && Engine.hasResult(m);
  const cnt = phase === 'played' ? plural(((m.final && m.final.ids) || []).length, 'giocatore', 'giocatori') : R.confirmed.length + '/' + R.cap;
  return html`<button class=${'card match' + (phase === 'cancelled' ? ' cancelled' : '')} onClick=${() => C.go({ t: 'match', id: m.id })}>
    <div class="m-top">
      <div class="m-when"><span class="m-day">${dayShort(m)}</span><span class="m-time">${m.time || 'ora da definire'}</span></div>
      ${hasRes ? html`<span class="m-score num"><span class="ta-c">${m.result.a}</span><span class="x">–</span><span class="tb-c">${m.result.b}</span></span>` : html`<span class="m-fmt">${m.format} vs ${m.format}</span>`}
    </div>
    <div class="m-field"><${Icon} n="pin" s="16" /><span class="ell">${m.field || 'Campo da definire'}</span></div>
    ${phase !== 'cancelled' && phase !== 'played' && html`<div class="meter"><div class="bar"><i style=${'width:' + pct + '%'}></i></div><span class="cnt">${cnt}</span></div>`}
    <div class="m-foot">${chips}</div>
  </button>`;
}

function TodoCard({ icon, title, text, onClick }) {
  return html`<button class="card todo" style="text-align:left" onClick=${onClick}>
    <div class="hs-12"><${Icon} n=${icon} /><div class="grow"><div class="h3">${title}</div><div class="small muted">${text}</div></div><${Icon} n="chev" /></div>
  </button>`;
}

function HomeScreen() {
  const C = useContext(Ctx);
  const ms = C.matches;
  const by = (arr, dir) => arr.slice().sort((a, b) => dir * (mStart(a) - mStart(b)));
  const upcoming = by(ms.filter((m) => phaseOf(m) === 'upcoming'), 1);
  const toclose = by(ms.filter((m) => phaseOf(m) === 'toclose'), -1);
  const played = by(ms.filter((m) => phaseOf(m) === 'played' && m.final), -1);
  const myV = myMvpVotes(C);
  const iPlayed = (m) => (m.final.ids || []).includes(C.uid);
  const mvpTodo = played.filter((m) => { const mv = C.stats.mvps[m.id]; return mv && !mv.closed && iPlayed(m) && !myV[m.id]; }).slice(0, 3);
  const resTodo = played.filter((m) => !Engine.hasResult(m) && (iPlayed(m) || C.isAdmin) && canEditPlayed(m, C)).slice(0, 3);
  const recent = played.slice(0, 2);
  const polls = ms.filter(pollVisible).sort((a, b) => numOr(b.created, 0) - numOr(a.created, 0));
  const invites = upcoming.filter((m) => m.invites && m.invites[C.uid] && !(m.rsvp && m.rsvp[C.uid] && m.rsvp[C.uid].s)).slice(0, 3);
  const pollTodo = C.me ? polls.filter((m) => pollOpenDays(m).length && !myPollDays(m, C.uid).length).slice(0, 2) : [];

  return html`<div class="page">
    <${MainHead} title="Partite" right=${C.me && html`<button class="icon-btn" style="border:0;background:none" aria-label="Il mio profilo" onClick=${() => C.goTab('me')}><${Avatar} p=${C.me} size=${38} /></button>`} />

    <${OverdueNote} />

    ${(mvpTodo.length > 0 || resTodo.length > 0 || pollTodo.length > 0 || invites.length > 0 || C.badges.requests > 0 || C.badges.friends > 0) && html`<section class="sec">
      <h2 class="h3">Da fare</h2>
      <div class="cards">
        ${invites.map((m) => { const by = C.playersById[m.invites[C.uid].by]; return html`<${TodoCard} key=${'i' + m.id} icon="heart" title=${(by ? dispName(by) + ' ti invita' : 'Sei invitato') + ': ' + dayShort(m).toLowerCase() + (m.time ? ' alle ' + m.time : '')} text=${fmtOf(m).name + ' · ' + (m.field || 'campo da definire') + '. Rispondi se ci sei.'} onClick=${() => C.go({ t: 'match', id: m.id })} />`; })}
        ${C.badges.friends > 0 && html`<${TodoCard} icon="heart" title=${plural(C.badges.friends, 'richiesta', 'richieste') + ' di amicizia'} text="Accetta o rifiuta dalla pagina Amici" onClick=${() => C.go({ t: 'friends' })} />`}
        ${pollTodo.map((m) => html`<${TodoCard} key=${'p' + m.id} icon="calendar" title=${'Quando giochiamo? Partita a ' + m.format} text=${'Segna i giorni in cui sei libero: si gioca il primo che arriva a ' + pollNeed(m)} onClick=${() => C.go({ t: 'match', id: m.id })} />`)}
        ${C.badges.requests > 0 && html`<${TodoCard} icon="users" title=${plural(C.badges.requests, 'richiesta', 'richieste') + ' per entrare nel gruppo'} text="Accetta o rifiuta chi vuole giocare con voi" onClick=${() => C.go({ t: 'group' })} />`}
        ${mvpTodo.map((m) => { const mv = C.stats.mvps[m.id]; return html`<${TodoCard} key=${'v' + m.id} icon="trophy" title=${'Vota l\'MVP di ' + dayShort(m).toLowerCase()} text=${'Si chiude tra ' + fmtLeft(mv.closesAt - Date.now()) + ' · hanno votato ' + mv.nVoted + ' su ' + mv.nEligible} onClick=${() => C.go({ t: 'mvp', id: m.id })} />`; })}
        ${resTodo.map((m) => html`<${TodoCard} key=${'r' + m.id} icon="ball" title=${'Risultato di ' + dayShort(m).toLowerCase()} text="Scrivi il punteggio e, se te li ricordi, marcatori e assist" onClick=${() => C.go({ t: 'result', id: m.id })} />`)}
      </div>
    </section>`}

    ${polls.length > 0 && html`<section class="sec">
      <h2 class="h3">Sondaggi</h2>
      <div class="cards">${polls.map((m) => html`<${PollCard} key=${m.id} m=${m} />`)}</div>
    </section>`}

    <section class="sec">
      <h2 class="h3">In programma</h2>
      ${upcoming.length ? html`<div class="cards">${upcoming.map((m) => html`<${MatchCard} key=${m.id} m=${m} />`)}</div>` : html`<div class="card empty">
        <div class="h3">Nessuna partita in programma</div>
        <div>${C.canWrite ? 'Organizza la prossima: scegli giorno, ora e campo, poi gli altri rispondono qui.' : 'Quando qualcuno ne organizza una la vedrai qui.'}</div>
        ${C.canWrite && C.me && html`<button class="btn primary" onClick=${() => C.openSheet({ k: 'newMatch' })}><${Icon} n="plus" s="16" /> Nuova partita</button>`}
      </div>`}
    </section>

    ${toclose.length > 0 && html`<section class="sec">
      <h2 class="h3">Da chiudere</h2>
      <div class="cards">${toclose.map((m) => html`<${MatchCard} key=${m.id} m=${m} />`)}</div>
    </section>`}

    ${recent.length > 0 && html`<section class="sec">
      <div class="sec-h"><h2 class="h3">Ultime partite</h2><button class="link" onClick=${() => C.goTab('history')}>Storico e classifiche</button></div>
      <div class="cards">${recent.map((m) => html`<${MatchCard} key=${m.id} m=${m} />`)}</div>
    </section>`}
  </div>`;
}

    ${pos != null && html`<span class="pos">${pos}</span>`}
    ${side && html`<span class="side-dot" title=${side === '?' ? 'Squadra da scegliere' : teamName(m, side)}>${side === '?' ? '?' : html`<${Shirt} c=${teamColor(m, side)} s=${18} />`}</span>`}
    <${Avatar} p=${x.guest ? { name: x.name } : x.p} guest=${x.guest} size=${36} />
    <span class="row-main">
      <span class="row-t"><span class="ell">${x.name}</span><${InjuryMark} inj=${x.inj} />${x.guest && html`<span class="chip">Ospite</span>`}</span>
      <span class=${'row-s ell' + (x.inj && x.inj.level ? ' inj-t' : '')} style="display:block">${x.inj && x.inj.level ? injSummary(x.inj) : x.full}</span>
