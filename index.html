function FieldLinks({ m }) {
  const C = useContext(Ctx);
  const f = C.fieldOf(m);
  if (!f && !m.field) return null;
  const copy = async () => { try { await navigator.clipboard.writeText(f.phone); C.flash('Numero copiato'); } catch (e) { C.flash(f.phone); } };
  return html`<div class="stack-8">
    ${f && f.address && html`<div class="small muted" style="padding-left:24px">${f.address}</div>`}
    <div class="hs wrap" style="padding-left:24px">
      ${f && f.phone && html`<a class="btn accent sm" href=${phoneHref(f.phone)}>Chiama ${f.phone.replace('+39 ', '')}</a>`}
      <a class="btn sm" href=${mapsHref(f, m.field)} target="_blank" rel="noopener noreferrer">Apri in Maps</a>
      ${f && f.phone && html`<button type="button" class="link" onClick=${copy}>Copia numero</button>`}
    </div>
  </div>`;
}

const MATCH_TABS = [{ v: 'info', l: 'Dettagli' }, { v: 'teams', l: 'Squadre' }, { v: 'pitch', l: 'Campo' }];
const TEAM_MODE_TEXT = {
  auto: 'Squadre automatiche: le fa l\'app appena la partita è piena',
  pick: 'Squadre scelte dai partecipanti',
};

function MatchScreen({ id }) {
  const C = useContext(Ctx);
  const m = C.matchesById[id];
  const [tab, setTab] = useState('info');
  const R = useMemo(() => (m && m.status !== 'poll' ? buildRoster(m, C) : null), [m, C.playersById, C.rated, C.players]);
  const wxData = useForecast(useMatchPlace(m && m.status !== 'poll' && m.date && phaseOf(m) === 'upcoming' ? m : null));
  if (!m) {
    return html`<${Page} title="Partita" onBack=${C.back}><div class="card empty"><div class="h3">Partita non trovata</div><div>Potrebbe essere stata eliminata.</div></div><//>`;
  }
  if (m.status === 'poll') return html`<${PollScreen} m=${m} />`;
  if (!m.date) return html`<${Page} title="Sondaggio" onBack=${C.back}><div class="card empty"><div class="h3">Sondaggio annullato</div><div>Non si gioca.</div></div><//>`;
  const phase = phaseOf(m);
  const open = phase === 'upcoming';
  const mine = m.rsvp && m.rsvp[C.uid];
  const mineS = mine && mine.s;
  const canAct = C.canWrite && !!C.me;
  const waitPos = R.waitlist.findIndex((x) => x.id === C.uid);
  const fmt = fmtOf(m);
  const pick = m.teamMode === 'pick';
  const D = lineupData(m, C, R);
  const hasLineup = D.A.length + D.B.length > 0;
  const wx = open ? wxFor(wxData, m.date, m.time) : null;

  const respond = (s, side) => {
    if (!C.canWrite) { C.flash('Hai accesso in sola lettura'); return; }
    if (!C.me) { C.flash('Crea prima il tuo profilo', 'err'); return; }
    if (mineS === s && side === undefined) return;
    const inj = C.me.injury;
    const doIt = () => C.act.setRsvp(m.id, C.uid, s, side);
    if (s === 'in' && inj && inj.level) {
      C.openSheet({
        k: 'confirm', title: 'Sei segnato come infortunato',
        text: `Hai un infortunio ${inj.level === 'grave' ? 'grave' : 'lieve'} (${injSummary(inj)}). Ti iscrivi lo stesso? Per fare le squadre conterai ${inj.level === 'grave' ? CFG.INJ_BAD : CFG.INJ_LIGHT} punti in meno.`,
        label: 'Sì, ci sono', onYes: doIt,
      });
      return;
    }
    doIt();
  };
  const closeMatch = async () => {
    const fin = snapshotFinal(m, R, C.aff);
    const ok = await C.act.markPlayed(m.id, fin);
    if (ok) { C.flash('Partita chiusa: il voto MVP è aperto per 24 ore'); C.go({ t: 'result', id: m.id }); }
  };

  const notes = [];
  if (open) {
    if (R.confirmed.length > 0 && R.gk === 0) notes.push({ c: 'warn', t: 'Nessun portiere tra i confermati: l\'app metterà in porta chi ha la Porta migliore.' });
    else if (R.gk === 1 && R.confirmed.length >= 4) notes.push({ c: '', t: 'C\'è un solo portiere: nell\'altra squadra andrà in porta un giocatore di movimento.' });
    if (R.confirmed.length < R.cap) notes.push({ c: '', t: `Mancano ${plural(R.cap - R.confirmed.length, 'giocatore', 'giocatori')} per completare la partita.` });
  }
  const tabs = phase === 'cancelled' ? null : html`<${Seg} cls="mtabs" value=${tab} onChange=${setTab} options=${MATCH_TABS} />`;
  const colorsRow = m.colors && html`<div class="hs wrap" style="gap:10px">
    <${TeamTag} m=${m} side="a" /><span class="faint">contro</span><${TeamTag} m=${m} side="b" />
    ${canOrganize(m, C) && phase !== 'cancelled' && html`<button class="link" onClick=${() => C.openSheet({ k: 'colors', mid: m.id })}>Cambia colori</button>`}
  </div>`;

  let body;
  if (tab === 'teams' && phase !== 'cancelled') {
    body = html`<${TeamsTab} m=${m} R=${R} D=${D} />`;
  } else if (tab === 'pitch' && phase !== 'cancelled') {
    body = hasLineup ? html`<${PitchView} m=${m} D=${D} wx=${wx} />` : html`<div class="card empty"><div class="h3">Ancora nessuno schieramento</div><div>${D.T && D.T.source === 'waiting' ? `Lo schieramento compare appena l'app fa le squadre: mancano ${plural(D.T.missing, 'giocatore', 'giocatori')}.` : pick ? 'Compare appena i giocatori scelgono la loro squadra.' : 'Compare quando ci sono le squadre.'}</div></div>`;
  } else if (phase === 'played') {
    body = html`<${PlayedSections} m=${m} /><${PollResults} m=${m} />`;
  } else {
    body = html`
      <div class="card stack-8">
        <div class="hs"><${Icon} n="clock" s="16" /><b class="num">${m.time || 'Ora da definire'}</b><span class="muted">· ${fmt.name}, ${m.format} vs ${m.format}</span></div>
        <div class="hs"><${Icon} n="pin" s="16" /><span>${m.field || 'Campo da definire'}</span></div>
        <${FieldLinks} m=${m} />
        ${wx && html`<div class="hs"><${WxBadge} w=${wx} long /><span class="tiny faint">${wx.at ? 'alle ' + wx.at : 'nella giornata'} · <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></span></div>`}
        ${m.note && html`<div class="small muted">${m.note}</div>`}
        ${m.teamMode && html`<div class="hs"><${Icon} n="users" s="16" /><span class="small">${TEAM_MODE_TEXT[m.teamMode]}</span></div>`}
        ${colorsRow}
        ${m.poll && m.poll.closed && html`<div class="tiny faint">Giorno scelto con il sondaggio${m.poll.closed.how === 'auto' ? ': ha raggiunto per primo ' + plural(pollNeed(m), 'giocatore', 'giocatori') : ''}.</div>`}
        ${m.by && C.playersById[m.by] && html`<div class="tiny faint">Organizza ${dispName(C.playersById[m.by])}</div>`}
      </div>

      ${open && html`<section class="card">
        <div class="label" style="margin-bottom:8px">La tua risposta</div>
        ${pick ? html`<${PickRsvp} m=${m} R=${R} onIn=${(side) => respond('in', side)} />
          <div style="margin-top:8px"><${Seg} cls="rsvp" value=${mineS === 'maybe' || mineS === 'out' ? mineS : null} onChange=${(s) => respond(s)} options=${[{ v: 'maybe', l: 'Forse', cls: 'maybe' }, { v: 'out', l: 'Non ci sono', cls: 'out' }]} /></div>`
        : html`<${Seg} cls="rsvp" value=${mineS} onChange=${(s) => respond(s)} options=${[{ v: 'in', l: 'Ci sono', cls: 'in' }, { v: 'maybe', l: 'Forse', cls: 'maybe' }, { v: 'out', l: 'Non ci sono', cls: 'out' }]} />`}
        ${mineS === 'in' && waitPos >= 0 && html`<div class="note warn" style="margin-top:12px"><${Icon} n="clock" s="16" /><span>Sei in lista d'attesa al n° ${waitPos + 1}: se qualcuno si ritira entri tu.</span></div>`}
        ${mineS === 'in' && waitPos < 0 && html`<div class="tiny faint" style="margin-top:10px">Il ruolo te lo assegna l'app${pick ? ' dentro la tua squadra' : ' quando fa le squadre'}, partendo dai tuoi ruoli preferiti.</div>`}
        ${!C.me && C.canWrite && html`<div class="note" style="margin-top:12px">Crea prima il tuo profilo dalla scheda Profilo per rispondere.</div>`}
        ${!mineS && m.invites && m.invites[C.uid] && html`<div class="note ok" style="margin-top:12px"><${Icon} n="heart" s="16" /><span>${C.playersById[m.invites[C.uid].by] ? dispName(C.playersById[m.invites[C.uid].by]) : 'Un amico'} ti ha invitato a questa partita.</span></div>`}
      </section>`}

      ${(open || phase === 'toclose') && html`<section class="sec">
        <div class="sec-h"><h2 class="h3">Giocatori</h2><span class=${'chip num ' + (R.confirmed.length >= R.cap ? 'ok' : '')}>${R.confirmed.length}/${R.cap}</span></div>
        ${notes.map((n) => html`<div class=${'note ' + n.c}><${Icon} n=${n.c === 'warn' ? 'warn' : 'info'} s="16" /><span>${n.t}</span></div>`)}
        <div class="card pad0 divided">
          ${R.confirmed.length ? R.confirmed.map((x) => html`<${MemberRow} key=${x.id} x=${x} side=${pick ? x.side || '?' : null} m=${m} onTap=${() => C.openSheet({ k: 'member', mid: m.id, id: x.id })} />`) : html`<div class="empty small">Nessuno si è ancora iscritto.</div>`}
        </div>
        ${R.waitlist.length > 0 && html`<div class="stack-8">
          <div class="sec-h"><h3 class="h3" style="font-size:15px">Lista d'attesa</h3><span class="chip warn num">${R.waitlist.length}</span></div>
          <div class="card pad0 divided">${R.waitlist.map((x, i) => html`<${MemberRow} key=${x.id} x=${x} pos=${i + 1} onTap=${() => C.openSheet({ k: 'member', mid: m.id, id: x.id })} />`)}</div>
        </div>`}
        ${R.maybe.length > 0 && html`<div class="stack-8">
          <div class="sec-h"><h3 class="h3" style="font-size:15px">Forse</h3><span class="chip num">${R.maybe.length}</span></div>
          <div class="card pad0 divided">${R.maybe.map((x) => html`<${MemberRow} key=${x.id} x=${x} onTap=${() => C.openSheet({ k: 'member', mid: m.id, id: x.id })} />`)}</div>
        </div>`}
        <div class="small muted">
          ${R.out.length > 0 && html`<div>Non vengono: ${R.out.map((x) => x.name).join(', ')}.</div>`}
          ${R.noReply > 0 && html`<div>Senza risposta: ${plural(R.noReply, 'giocatore', 'giocatori')}.</div>`}
        </div>
        ${canAct && open && html`<div class="hs wrap">
          <button class="btn sm" onClick=${() => C.openSheet({ k: 'addPlayer', mid: m.id })}><${Icon} n="plus" s="16" /> Aggiungi giocatore</button>
          <button class="btn sm" onClick=${() => C.openSheet({ k: 'guest', mid: m.id })}><${Icon} n="plus" s="16" /> Aggiungi ospite</button>
          <button class="btn sm" onClick=${() => C.openSheet({ k: 'invite', mid: m.id })}><${Icon} n="heart" s="16" /> Invita amici</button>
        </div>`}
      </section>`}

      ${(open || phase === 'toclose') && html`<button class="card" style="text-align:left" onClick=${() => setTab('teams')}>
        <div class="hs-12"><${Icon} n="shuffle" /><div class="grow"><div class="h3">Squadre e ruoli</div><div class="small muted">${hasLineup ? `${teamName(m, 'a')} ${D.A.length} · ${teamName(m, 'b')} ${D.B.length}: guarda il confronto e lo schieramento.` : D.T && D.T.source === 'waiting' ? `Le fa l'app appena la partita è piena: mancano ${plural(D.T.missing, 'giocatore', 'giocatori')}.` : pick ? 'Ognuno sceglie la sua squadra quando si iscrive.' : 'Ancora da fare.'}</div></div><${Icon} n="chev" /></div>
      </button>`}

      ${(open || phase === 'toclose') && canAct && html`<button class="btn ghost block" disabled=${R.confirmed.length < 2}
        onClick=${() => C.openSheet({ k: 'confirm', title: 'Partita finita?', text: `Le squadre di adesso diventano quelle definitive (potrai correggerle insieme al risultato). Si apre il voto MVP per i ${R.confirmed.filter((x) => !x.guest).length} iscritti che hanno giocato: resta aperto 24 ore.`, label: 'Sì, chiudi la partita', onYes: closeMatch })}>
        <${Icon} n="check" s="16" /> Partita finita: chiudi e scrivi il risultato
      </button>`}

      <${PollResults} m=${m} />
    `;
  }

  return html`<${Page} title=${dayLong(m)} sub=${(m.time || 'Ora da definire') + ' · ' + (m.field || 'Campo da definire')} onBack=${C.back}
      right=${canAct && html`<button class="icon-btn" aria-label="Altre azioni" onClick=${() => C.openSheet({ k: 'matchMenu', id: m.id })}><${Icon} n="dots" fill /></button>`}>
    ${phase === 'cancelled' && html`<div class="note bad"><${Icon} n="warn" s="16" /><span>Questa partita è stata annullata.</span></div>`}
    ${phase === 'toclose' && tab === 'info' && html`<div class="note warn"><${Icon} n="clock" s="16" /><span>La partita è passata. Chiudila per scrivere il risultato e aprire il voto MVP, oppure annullala dal menu.</span></div>`}
    ${tabs}
    ${body}
  <//>`;
}

/* ---------- scheda Squadre: confronto + modifica ---------- */
function TeamsTab({ m, R, D }) {
  const C = useContext(Ctx);
  const [editing, setEditing] = useState(false);
  const phase = phaseOf(m);
  const live = phase === 'upcoming' || phase === 'toclose';
  const T = D.T;
  const legacy = !m.teamMode;
  const hasLineup = D.A.length + D.B.length > 0;
  const makeTeams = (extra) => {
    const r = Engine.suggestTeams(R.confirmed.map((x) => x.part), { mode: 'bal', format: m.format, aff: C.aff });
    if (r) C.act.saveTeams(m.id, r.a, r.b, r.roles, extra);
  };
  if (phase === 'played') {
    return hasLineup ? html`<${TeamsVersus} m=${m} D=${D} />` : html`<div class="card small muted">Nessuna squadra era stata salvata per questa partita.</div>`;
  }
  /* di nuovo automatiche: se la partita è piena l'app le rifà subito, altrimenti appena si riempie */
  const backToAuto = () => {
    if (R.confirmed.length >= R.cap) {
      const sig = rosterSig(R);
      const r = Engine.suggestTeams(R.confirmed.map((x) => x.part), { mode: 'exact', format: m.format, rng: seededRng(m.id + '|' + sig), aff: C.aff });
      if (r) { C.act.saveTeams(m.id, r.a, r.b, r.roles, { auto: true, manual: false, sig }); setEditing(false); return; }
    }
    C.act.saveTeams(m.id, [], [], {}, { manual: false, auto: false, sig: '' });
    setEditing(false);
  };
  return html`<div class="stack">
    ${m.colors && html`<div class="hs wrap" style="justify-content:space-between">
      <span class="small muted">${TEAM_MODE_TEXT[m.teamMode] || 'Squadre'}</span>
      ${canOrganize(m, C) && html`<button class="btn sm" onClick=${() => C.openSheet({ k: 'colors', mid: m.id })}><${Shirt} c=${teamColor(m, 'a')} s=${16} /><${Shirt} c=${teamColor(m, 'b')} s=${16} /> Colori</button>`}
    </div>`}
    ${T && T.source === 'waiting' && html`<div class="card stack">
      <div class="hs-12"><${Icon} n="shuffle" /><div class="grow"><div class="h3">Le squadre le fa l'app</div><div class="small muted">Appena la partita è piena l'app divide i giocatori in due squadre il più possibile alla pari e assegna i ruoli. Se poi qualcuno si ritira o entra, le rifà da sola. Mancano ${plural(T.missing, 'giocatore', 'giocatori')}.</div></div></div>
      ${live && C.canWrite && R.confirmed.length >= 4 && html`<button class="btn" onClick=${() => makeTeams({ manual: true, auto: false })}>Falle ora con chi c'è (poi restano fatte a mano)</button>`}
    </div>`}
    ${T && T.source === 'manual' && html`<div class="note"><${Icon} n="edit" s="16" /><span class="grow">Squadre cambiate a mano: l'app non le rifà più da sola.</span>${live && C.canWrite && html`<button class="btn sm" onClick=${backToAuto}>Torna automatiche</button>`}</div>`}
    ${T && T.source === 'pick' && T.free.length > 0 && html`<div class="note warn"><${Icon} n="info" s="16" /><span>Devono ancora scegliere la squadra: ${T.free.map((i) => R.byId[i].name).join(', ')}.</span></div>`}
    ${hasLineup && html`<${TeamsVersus} m=${m} D=${D} />`}
    ${live && (legacy || (T && T.source !== 'waiting')) && (hasLineup || legacy) && C.canWrite && html`<button class="btn block" onClick=${() => setEditing(!editing)}><${Icon} n=${editing ? 'x' : 'edit'} s="16" /> ${editing ? 'Chiudi la modifica' : m.teamMode === 'pick' ? 'Ruoli e spostamenti' : 'Modifica squadre e ruoli'}</button>`}
    ${live && legacy && !hasLineup && html`<div class="card stack">
      <div class="muted">L'app divide i ${R.confirmed.length} giocatori confermati in due squadre il più possibile alla pari e assegna i ruoli, scegliendo per ogni squadra il modulo che le va meglio. Poi potrai rimescolare, scambiare giocatori o cambiare ruoli a mano.</div>
      <button class="btn primary" disabled=${R.confirmed.length < 4 || !C.canWrite} onClick=${() => makeTeams()}><${Icon} n="shuffle" s="16" /> Crea squadre equilibrate</button>
      ${R.confirmed.length < 4 && html`<div class="tiny faint">Servono almeno 4 giocatori confermati.</div>`}
    </div>`}
    ${editing && live && html`<${TeamBoard} m=${m} R=${R} T=${T} />`}
  </div>`;
}

/* ---------- partita giocata ---------- */
function PlayedSections({ m }) {
  const C = useContext(Ctx);
  const fin = m.final || { a: [], b: [], ids: [] };
  const finIds = fin.ids || [];
  const iPlayed = finIds.includes(C.uid);
  const canEdit = canEditPlayed(m, C);
  const hasRes = Engine.hasResult(m);
  const mv = C.stats.mvps[m.id] || Engine.mvpResult(m, C.mvp, Date.now());
  const myVote = myMvpVotes(C)[m.id];
  const myRatings = (C.ratings.find((x) => x.id === C.uid) || {}).r || {};
  const others = finIds.filter((x) => x !== C.uid && C.playersById[x]);
  const ratedN = others.filter((x) => myRatings[x] && numOr(myRatings[x].t, 0) >= numOr(m.playedAt, 0)).length;
  const sA = scorersText(m, C, 'a'), sB = scorersText(m, C, 'b');
  const lastBy = hasRes && m.result.by && C.playersById[m.result.by];
  const pred = fin.pred;
  const [showVotes, setShowVotes] = useState(false);
  /* coriandoli la prima volta che su questo telefono si vede l'MVP appena uscito */
  useEffect(() => {
    if (!mv.closed || !mv.winners.length || Date.now() - numOr(mv.closesAt, 0) > 7 * 86400000) return undefined;
    if (!celebrateOnce('sc-cf-mvp', [(C.gid || '') + ':' + m.id]).length) return undefined;
    const t = setTimeout(() => fireConfetti(), 350);
    return () => clearTimeout(t);
  }, [mv.closed]);

  return html`
    <div class="card stack">
      ${hasRes ? html`
        <div class="score">
          <div class="score-side a"><${TeamTag} m=${m} side="a" /><span class="score-n num">${m.result.a}</span></div>
          <span class="score-dash">–</span>
          <div class="score-side b"><span class="score-n num">${m.result.b}</span><${TeamTag} m=${m} side="b" /></div>
        </div>
        ${(sA.goals || sB.goals || sA.assists || sB.assists) && html`<div class="scorers">
          <div><div>${sA.goals || 'Marcatori non inseriti'}</div>${sA.assists && html`<div class="faint">Assist: ${sA.assists}</div>`}</div>
          <div><div>${sB.goals || 'Marcatori non inseriti'}</div>${sB.assists && html`<div class="faint">Assist: ${sB.assists}</div>`}</div>
        </div>`}
        <div class="tiny faint">${fmtOf(m).name} · ${m.field || 'Campo da definire'}${lastBy ? ' · ultima modifica di ' + dispName(lastBy) + ' il ' + fmtTs(m.result.t) : ''}</div>
      ` : html`
        <div class="hs-12"><${Icon} n="ball" /><div class="grow"><div class="h3">Manca il risultato</div><div class="small muted">${canEdit ? 'Scrivilo tu: marcatori e assist sono facoltativi.' : 'Ormai può inserirlo solo l\'amministratore.'}</div></div></div>
      `}
      ${hasRes && html`<button class="btn" onClick=${() => openResultShare(C, m, mv)}><${Icon} n="share" s="16" /> Condividi il risultato</button>`}
      ${canEdit && html`<button class=${'btn ' + (hasRes ? '' : 'primary')} onClick=${() => C.go({ t: 'result', id: m.id })}><${Icon} n=${hasRes ? 'edit' : 'plus'} s="16" /> ${hasRes ? 'Correggi risultato e marcatori' : 'Inserisci il risultato'}</button>`}
      ${!canEdit && hasRes && !C.isAdmin && html`<div class="tiny faint"><${Icon} n="lock" s="14" /> Dopo l'inizio della partita successiva le correzioni le fa solo l'amministratore.</div>`}
    </div>

    ${pred && html`<div class="card pred">
      <div class="pred-n num">${pred.balance}<small>%</small></div>
      <div class="grow small"><b>Equilibrio previsto dall'app.</b> ${hasRes ? (Math.abs(m.result.a - m.result.b) <= 2 ? 'Finita con ' + plural(Math.abs(m.result.a - m.result.b), 'gol', 'gol') + ' di scarto: previsione centrata.' : 'Finita con ' + Math.abs(m.result.a - m.result.b) + ' gol di scarto: più sbilanciata del previsto.') : 'Il confronto con il risultato compare appena qualcuno lo inserisce.'}</div>
    </div>`}

    <section class="sec">
      <div class="sec-h"><h2 class="h3">MVP</h2>${!mv.closed && html`<span class="chip">Si chiude tra ${fmtLeft(mv.closesAt - Date.now())}</span>`}</div>
      ${mv.closed ? (mv.winners.length ? html`<div class="stack">
          ${mv.winners.map((pid) => { const p = C.playersById[pid], r = C.rated[pid]; return p && r && html`<button key=${pid} class="plain" onClick=${() => C.go({ t: 'player', id: pid })} aria-label=${'Scheda di ' + dispName(p)}>
            <${PlayerCard} p=${p} r=${r} mvp noZoom sub=${(mv.winners.length > 1 ? 'MVP a pari merito' : 'MVP della partita') + ' · ' + plural(mv.counts[pid], 'voto', 'voti')} />
          </button>`; })}
          <button class="link" style="align-self:flex-start" onClick=${() => setShowVotes(!showVotes)}>${showVotes ? 'Nascondi i voti' : 'Chi ha votato chi (' + mv.nVoted + ')'}</button>
          ${showVotes && html`<div class="card pad0 divided">${mv.votes.map((v) => html`<div key=${v.voter} class="row" style="padding:9px 14px">
            <${Avatar} p=${C.playersById[v.voter]} size=${28} /><span class="row-main"><span class="row-t ell">${nameFor(v.voter, m, C)}</span></span>
            <span class="small muted">ha votato</span><span class="row-t">${nameFor(v.target, m, C)}</span></div>`)}</div>`}
        </div>` : html`<div class="card small muted">Nessuno ha votato l'MVP di questa partita.</div>`)
      : html`<div class=${'card stack-8' + (iPlayed && !myVote ? ' todo' : '')}>
          <div class="hs-12">
            <${Icon} n="trophy" />
            <div class="grow">
              <div class="h3">${iPlayed ? (myVote ? 'Hai votato ' + nameFor(myVote, m, C) : 'Vota il migliore in campo') : 'Votazione in corso'}</div>
              <div class="small muted">Hanno votato ${mv.nVoted} su ${mv.nEligible}. Il risultato si vede alla chiusura.</div>
            </div>
            ${iPlayed && C.canWrite && html`<button class=${'btn sm ' + (myVote ? '' : 'primary')} onClick=${() => C.go({ t: 'mvp', id: m.id })}>${myVote ? 'Cambia' : 'Vota'}</button>`}
          </div>
        </div>`}
    </section>

    ${iPlayed && C.canWrite && others.length > 0 && html`<section class="sec">
      <h2 class="h3">Valuta i compagni</h2>
      <button class="card" style="text-align:left" onClick=${() => C.go({ t: 'rateMatch', id: m.id })}>
        <div class="hs-12"><${Icon} n="star" /><div class="grow"><div class="h3">${ratedN === 0 ? 'Aggiorna le valutazioni' : 'Valutati ' + ratedN + ' su ' + others.length}</div><div class="small muted">Dopo una partita è il momento giusto per aggiornare le stats di chi hai visto giocare.</div></div><${Icon} n="chev" /></div>
      </button>
    </section>`}

    <section class="sec">
      <h2 class="h3">Squadre</h2>
      ${(fin.a || []).length + (fin.b || []).length > 0 ? html`<${FinalTeams} m=${m} />` : html`<div class="small muted">Nessuna squadra era stata salvata: puoi indicarle quando inserisci il risultato.</div>`}
    </section>`;
}

const ROLE_ORDER = { POR: 0, DIF: 1, CEN: 2, ATT: 3 };
function FinalTeams({ m }) {
  const C = useContext(Ctx);
  const fin = m.final || {};
  const roles = fin.roles || {};
  const ev = (m.result && m.result.ev) || {};
  const col = (t, ids) => {
    const rc = [0, 0, 0, 0];
    ids.forEach((id) => { const r = roles[id]; if (ROLES.includes(r)) rc[ROLE_ORDER[r]]++; });
    const sorted = ids.slice().sort((a, b) => numOr(ROLE_ORDER[roles[a]], 9) - numOr(ROLE_ORDER[roles[b]], 9));
    return html`<div class=${'team ' + t}>
      <div class="team-h"><h4><${TeamTag} m=${m} side=${t} /></h4><span class="cnt">${Engine.moduleLabel(rc) || plural(ids.length, 'giocatore', 'giocatori')}</span></div>
      ${sorted.map((id) => {
        const p = C.playersById[id], e = ev[id] || {};
        const bits = [e.g ? e.g + (e.g === 1 ? ' gol' : ' gol') : '', e.a ? e.a + ' ass.' : '', e.og ? e.og + ' aut.' : ''].filter(Boolean).join(' · ');
        return html`<button key=${id} class="prow" onClick=${() => p && C.go({ t: 'player', id })}>
          ${roles[id] ? html`<${RoleChip} role=${roles[id]} />` : html`<span class="role">–</span>`}
          <${Avatar} p=${p || { name: nameFor(id, m, C) }} guest=${!p} size=${30} />
          <span class="row-main"><span class="row-t ell">${nameFor(id, m, C)}</span></span>
          ${bits && html`<span class="ga">${bits}</span>`}
        </button>`;
      })}
      <div style="height:6px"></div>
    </div>`;
  };
  return html`<div class="teams">${col('a', fin.a || [])}${col('b', fin.b || [])}</div>`;
}

/* ---------- squadre: scheda interattiva con ruoli ---------- */
function TeamBoard({ m, R, T }) {
  const C = useContext(Ctx);
  const [sel, setSel] = useState(null);
  const [mode, setMode] = useState('bal');
  const [sug, setSug] = useState(null);
  const [over, setOver] = useState(null);
  const pick = m.teamMode === 'pick';
  const canEdit = C.canWrite;
  /* con le squadre scelte, spostare qualcuno lo fa solo chi organizza */
  const canMove = canEdit && (!pick || canOrganize(m, C));
  const fmt = m.format;
  const A = T.a, B = T.b, free = T.free, roles = T.roles;
  const P = (i) => R.confirmedById[i];
  const part = (i) => P(i).part;
  const ev = Engine.evaluate(A.map(part), B.map(part), roles, C.aff);
  const whereOf = (i) => (A.includes(i) ? 'a' : B.includes(i) ? 'b' : 'f');

  const save = (a, b, r) => {
    setSug(null);
    if (!canEdit) { C.flash('Hai accesso in sola lettura'); return; }
    if (pick) {
      /* le squadre scelte cambiano spostando le persone; i ruoli si salvano a parte */
      const want = {};
      a.forEach((i) => { want[i] = 'a'; }); b.forEach((i) => { want[i] = 'b'; });
      Object.keys(want).forEach((i) => {
        const x = P(i);
        if (x && x.side !== want[i]) { if (x.guest) C.act.setGuestSide(m.id, i, want[i]); else C.act.setSide(m.id, i, want[i]); }
      });
      C.act.saveRoles(m.id, r);
      return;
    }
    C.act.saveTeams(m.id, a, b, r, m.teamMode === 'auto' ? { manual: true, auto: false } : undefined);
  };
  /* dopo uno scambio o uno spostamento l'app riassegna i ruoli di entrambe le squadre */
  const relineup = (a, b) => Object.assign({}, Engine.bestLineup(a.map(part), fmt).roles, Engine.bestLineup(b.map(part), fmt).roles);
  const swap = (x, y) => {
    const L = { a: A.slice(), b: B.slice() };
    const wx = whereOf(x), wy = whereOf(y);
    if (wx !== 'f') L[wx] = L[wx].map((v) => (v === x ? y : v));
    if (wy !== 'f') L[wy] = L[wy].map((v) => (v === y ? x : v));
    if (wx === 'f' && wy !== 'f') L[wy] = L[wy].filter((v) => v !== y).concat(x);
    save(L.a, L.b, relineup(L.a, L.b));
  };
  const moveTo = (i, t) => {
    if (!P(i) || whereOf(i) === t) return;
    const a = A.filter((v) => v !== i), b = B.filter((v) => v !== i);
    (t === 'a' ? a : b).push(i);
    save(a, b, relineup(a, b)); setSel(null);
  };
  const setRole = (i, r) => { if (pick) C.act.saveRoles(m.id, Object.assign({}, roles, { [i]: r })); else save(A, B, Object.assign({}, roles, { [i]: r })); };
  const tap = (i) => {
    if (sel == null) { setSel(i); return; }
    if (sel === i) { setSel(null); return; }
    if (whereOf(sel) === whereOf(i) || !canMove) { setSel(i); return; }
    swap(sel, i); setSel(null);
  };
  const dropOn = (d, i) => { if (canMove && P(d) && whereOf(d) !== whereOf(i)) { swap(d, i); setSel(null); } };

  const shuffle = () => {
    const r = Engine.suggestTeams(R.confirmed.map((x) => x.part), { mode, format: fmt, current: { a: A, b: B }, aff: C.aff });
    if (r) { setSel(null); save(r.a, r.b, r.roles); }
  };
  const suggest = () => {
    if (free.length) { C.flash('Prima metti tutti i giocatori in una squadra'); return; }
    setSug(Engine.bestSwap(A.map(part), B.map(part), roles, fmt, C.aff) || 'none');
  };
  const reset = () => C.openSheet({ k: 'confirm', title: 'Azzerare le squadre?', text: 'Squadre e ruoli salvati vengono cancellati. Potrai crearne di nuovi subito dopo.', label: 'Azzera', danger: true, onYes: () => { setSel(null); save([], [], {}); } });

  const PRow = (i) => {
    const x = P(i), isSel = sel === i;
    const cand = canMove && sel != null && sel !== i && whereOf(sel) !== whereOf(i);
    const r = roles[i];
    const v = r ? Engine.valueIn(x.part, r) : x.ovr;
    const out = r && r !== 'POR' && Engine.roleMalus(x.part, r);
    const inGoal = r === 'POR' && x.part.pref !== 'POR';
    return html`<div key=${i} class=${'prow' + (isSel ? ' sel' : '') + (cand ? ' cand' : '')} role="button" tabindex="0" draggable=${canMove}
      onDragStart=${(e) => { e.dataTransfer.setData('text/plain', i); e.dataTransfer.effectAllowed = 'move'; }}
      onDragOver=${(e) => e.preventDefault()}
      onDrop=${(e) => { e.preventDefault(); e.stopPropagation(); setOver(null); dropOn(e.dataTransfer.getData('text/plain'), i); }}
      onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(i); } }}
      onClick=${() => tap(i)}>
      ${r ? html`<${RoleChip} role=${r} />` : html`<span class="role">–</span>`}
      <${Avatar} p=${x.guest ? { name: x.name } : x.p} guest=${x.guest} size=${30} />
      <span class="row-main"><span class="row-t"><span class="ell">${x.name}</span><${InjuryMark} inj=${x.inj} s="14" />${x.guest && html`<span class="chip">Ospite</span>`}</span></span>
      ${out ? html`<span class="malus" title="Fuori ruolo">−${out}</span>` : inGoal ? html`<span class="malus" title="Giocatore di movimento in porta: conta la sua Porta">porta</span>` : null}
      <span class="lvl" style="font-size:16px">${r0(v)}</span>
      ${cand && html`<span class="swp-ic"><${Icon} n="swap" s="16" /></span>`}
    </div>`;
  };

  const Col = (t) => {
    const list = (t === 'a' ? A : B).slice().sort((x, y) => numOr(ROLE_ORDER[roles[x]], 9) - numOr(ROLE_ORDER[roles[y]], 9));
    const e = t === 'a' ? ev.a : ev.b;
    return html`<div class=${'team ' + t + (over === t ? ' over' : '')}
      onDragOver=${(ev2) => { ev2.preventDefault(); setOver(t); }} onDragLeave=${() => setOver(null)}
      onDrop=${(ev2) => { ev2.preventDefault(); setOver(null); if (canMove) moveTo(ev2.dataTransfer.getData('text/plain'), t); }}>
      <div class="team-h">
        <h4><${TeamTag} m=${m} side=${t} /></h4>
        ${list.length > 0 && html`<span class="mod">${e.label}</span>`}
        <span class="cnt">${list.length} · ${r0(e.mean)}</span>
      </div>
      ${list.length > 0 && e.rc[0] === 0 && html`<div class="team-warn">Nessuno in porta</div>`}
      ${e.rc[0] > 1 && html`<div class="team-warn">${e.rc[0]} giocatori in porta</div>`}
      ${list.map(PRow)}
      ${canMove && sel != null && whereOf(sel) !== t && P(sel) && html`<button class="drop hot" onClick=${() => moveTo(sel, t)}>Sposta ${P(sel).name} qui</button>`}
      ${list.length === 0 && sel == null && html`<div class="small faint" style="padding:12px 14px">Nessun giocatore</div>`}
      <div style="height:6px"></div>
    </div>`;
  };

  const selX = sel != null && P(sel);
  return html`<div class="stack">
    ${canEdit && !pick && html`<div class="tools">
      <${Seg} value=${mode} onChange=${setMode} options=${[{ v: 'exact', l: 'Preciso' }, { v: 'bal', l: 'Bilanciato' }, { v: 'mix', l: 'Vario' }]} />
      <button class="btn primary" onClick=${shuffle}><${Icon} n="shuffle" s="16" /> Mischia</button>
      <button class="btn" onClick=${suggest}><${Icon} n="spark" s="16" /> Migliora</button>
    </div>`}
    ${m.teamMode === 'auto' && canEdit && html`<div class="tiny faint">Se cambi le squadre a mano, l'app smette di rifarle da sola quando qualcuno entra o esce.</div>`}

    ${sug && sug !== 'none' && html`<div class="sug">
      <div class="swp"><b>${P(sug.a).name}</b><${TeamTag} m=${m} side="a" /><${Icon} n="swap" s="16" /><${TeamTag} m=${m} side="b" /><b>${P(sug.b).name}</b></div>
      <div class="small">${sug.after.balance > sug.before.balance ? `Con questo scambio l'equilibrio passa dal ${sug.before.balance}% al ${sug.after.balance}%.` : 'Questo scambio mette più giocatori nel loro ruolo.'} I ruoli vengono riassegnati.</div>
      <div class="hs"><button class="btn accent sm" onClick=${() => { save(A.map((v) => (v === sug.a ? sug.b : v)), B.map((v) => (v === sug.b ? sug.a : v)), sug.roles); setSel(null); }}>Applica scambio</button><button class="btn sm ghost" onClick=${() => setSug(null)}>Chiudi</button></div>

    ${sug === 'none' && html`<div class="note ok"><${Icon} n="check" s="16" /><span>Con un solo scambio non si fa meglio: le squadre sono già ben bilanciate.</span></div>`}

    ${Math.abs(A.length - B.length) > 1 && html`<div class="note warn"><${Icon} n="warn" s="16" /><span>Le squadre hanno numeri diversi: ${A.length} contro ${B.length}.</span></div>`}
    ${Math.abs(A.length - B.length) === 1 && html`<div class="note"><${Icon} n="info" s="16" /><span>Una squadra ha un giocatore in meno: il confronto è sul valore medio. Con un ospite in più si pareggia.</span></div>`}
    ${free.length > 0 && html`<div class="note warn"><${Icon} n="info" s="16" /><span>${pick ? (free.length === 1 ? 'Un giocatore deve ancora scegliere la squadra' : free.length + ' giocatori devono ancora scegliere la squadra') : 'La lista è cambiata: ' + (free.length === 1 ? 'un giocatore non è ancora in una squadra' : free.length + ' giocatori non sono ancora in una squadra')}.</span></div>`}

    ${canEdit && selX && whereOf(sel) !== 'f' && html`<div class="card selbar stack-8">
      <div class="hs"><span class="row-t grow"><span class="ell">${selX.name}</span></span><button class="link" onClick=${() => setSel(null)}>Fatto</button></div>
      <span class="label">Ruolo in questa partita</span>
      <${RolePills} small value=${roles[sel]} onChange=${(r) => setRole(sel, r)} />
      <div class="tiny faint">${canMove ? 'Oppure tocca un giocatore dell\'altra squadra per scambiarli. ' : ''}Valore nel ruolo scelto: ${r0(Engine.valueIn(selX.part, roles[sel] || selX.part.pref))}.</div>
    </div>`}
    ${canEdit && !selX && html`<div class="tiny faint">${canMove ? 'Tocca un giocatore per cambiargli ruolo, poi uno dell\'altra squadra per scambiarli. Su computer puoi anche trascinarli.' : 'Tocca un giocatore per cambiargli ruolo. Le squadre le scelgono i giocatori; spostarli lo può fare chi organizza.'}</div>`}

    <div class="teams">${Col('a')}${Col('b')}</div>

    ${free.length > 0 && html`<div class="tray">
      <span class="eyebrow">${pick ? 'Senza squadra' : 'Da assegnare'}</span>
      ${free.map(PRow)}
    </div>`}

    ${canEdit && !pick && html`<div class="hs" style="justify-content:flex-end"><button class="link" style="color:var(--ink-2)" onClick=${reset}>Azzera squadre</button></div>`}
  </div>`;
}

/* ---------- risultato, marcatori, assist, autogol ---------- */
function initResult(m) {
  const fin = (m && m.final) || {};
  const res = (m && m.result) || {};
  const all = [...new Set([...(fin.a || []), ...(fin.b || []), ...(fin.ids || []), ...Object.keys(fin.gn || {})])];
  const ev = {}, side = {};
  all.forEach((id) => {
    const e = (res.ev && res.ev[id]) || {};
    ev[id] = { g: numOr(e.g, 0), a: numOr(e.a, 0), og: numOr(e.og, 0) };
    side[id] = (fin.a || []).includes(id) ? 'a' : (fin.b || []).includes(id) ? 'b' : '';
  });
  const teamsOk = (fin.a || []).length > 0 && (fin.b || []).length > 0;
  return { ga: numOr(res.a, 0), gb: numOr(res.b, 0), ev, side, all, editTeams: !teamsOk || all.some((id) => !side[id]) };
}

function ResultScreen({ id }) {
  const C = useContext(Ctx);
  const m = C.matchesById[id];
  const [st, setSt] = useState(() => initResult(m));
  const [busy, setBusy] = useState(false);
  if (!m || m.status !== 'played') return html`<${Page} title="Risultato" onBack=${C.back}><div class="card empty">La partita non è ancora chiusa.</div><//>`;
  if (!canEditPlayed(m, C)) return html`<${Page} title="Risultato" onBack=${C.back}><div class="note"><${Icon} n="lock" s="16" /><span>La partita successiva è già iniziata: ora il risultato lo può correggere solo l'amministratore.</span></div><//>`;

  const { ev, side, all } = st;
  const setEv = (pid, k, v) => setSt((s) => ({ ...s, ev: { ...s.ev, [pid]: { ...s.ev[pid], [k]: v } } }));
  const setSide = (pid, t) => setSt((s) => ({ ...s, side: { ...s.side, [pid]: t } }));
  const sum = (t, k) => all.filter((i) => side[i] === t).reduce((n, i) => n + ev[i][k], 0);
  const assignedA = sum('a', 'g') + sum('b', 'og'), assignedB = sum('b', 'g') + sum('a', 'og');
  const errs = [];
  const nA = teamName(m, 'a'), nB = teamName(m, 'b');
  if (assignedA > st.ga) errs.push(`${nA}: hai assegnato ${assignedA} gol, ma il risultato ne dice ${st.ga}.`);
  if (assignedB > st.gb) errs.push(`${nB}: hai assegnato ${assignedB} gol, ma il risultato ne dice ${st.gb}.`);
  if (sum('a', 'a') > sum('a', 'g')) errs.push(nA + ': ci sono più assist che gol dei suoi giocatori.');
  if (sum('b', 'a') > sum('b', 'g')) errs.push(nB + ': ci sono più assist che gol dei suoi giocatori.');
  const noSide = all.filter((i) => !side[i]);
  if (noSide.length) errs.push(noSide.length === 1 ? 'Un giocatore non è in nessuna squadra.' : noSide.length + ' giocatori non sono in nessuna squadra.');
  const lost = all.filter((i) => !side[i] && (ev[i].g || ev[i].a || ev[i].og));

  const save = async () => {
    if (errs.length || busy) return;
    setBusy(true);
    const evOut = {};
    all.forEach((i) => { evOut[i] = { g: ev[i].g, a: ev[i].a, og: ev[i].og }; });
    const result = { a: st.ga, b: st.gb, ev: evOut, by: C.uid, t: Date.now() };
    const fin = m.final || {};
    const A = all.filter((i) => side[i] === 'a'), B = all.filter((i) => side[i] === 'b');
    let finPatch = null;
    if (A.join() !== (fin.a || []).join() || B.join() !== (fin.b || []).join()) {
      const pa = A.map((i) => partFor(i, m, C)), pb = B.map((i) => partFor(i, m, C));
      const roles = Object.assign({}, Engine.bestLineup(pa, m.format).roles, Engine.bestLineup(pb, m.format).roles);
      const e = Engine.evaluate(pa, pb, roles, C.aff);
      finPatch = { a: A, b: B, roles, pred: { balance: e.balance, va: e.a.mean, vb: e.b.mean } };
    }
    const ok = await C.act.saveResult(m.id, result, finPatch);
    setBusy(false);
    if (ok) { C.flash('Risultato salvato'); C.back(); }
  };

  const Row = (pid) => {
    const p = C.playersById[pid];
    const e = ev[pid];
    return html`<div key=${pid} class="res-row">
      <div class="hs-12">
        <${Avatar} p=${p || { name: nameFor(pid, m, C) }} guest=${!p} size=${32} />
        <span class="row-main"><span class="row-t"><span class="ell">${nameFor(pid, m, C)}</span>${!p && html`<span class="chip">Ospite</span>`}</span></span>
        ${st.editTeams && html`<div class="seg mini-seg" role="group" aria-label=${'Squadra di ' + nameFor(pid, m, C)}>
          <button type="button" class=${side[pid] === 'a' ? 'on ta-on' : ''} aria-pressed=${side[pid] === 'a'} aria-label=${teamName(m, 'a')} title=${teamName(m, 'a')} onClick=${() => setSide(pid, 'a')}>${m.colors ? html`<${Shirt} c=${teamColor(m, 'a')} s=${16} />` : 'A'}</button>
          <button type="button" class=${side[pid] === 'b' ? 'on tb-on' : ''} aria-pressed=${side[pid] === 'b'} aria-label=${teamName(m, 'b')} title=${teamName(m, 'b')} onClick=${() => setSide(pid, 'b')}>${m.colors ? html`<${Shirt} c=${teamColor(m, 'b')} s=${16} />` : 'B'}</button>
        </div>`}
      </div>
      <div class="res-ctrs">
        <${Counter} label="Gol" value=${e.g} onChange=${(v) => setEv(pid, 'g', v)} />
        <${Counter} label="Assist" value=${e.a} onChange=${(v) => setEv(pid, 'a', v)} />
        <${Counter} label="Autogol" value=${e.og} onChange=${(v) => setEv(pid, 'og', v)} />
      </div>
    </div>`;
  };
  const group = (t, title) => {
    const ids = all.filter((i) => side[i] === t);
    if (!ids.length) return null;
    const assigned = t === 'a' ? assignedA : t === 'b' ? assignedB : 0;
    const goals = t === 'a' ? st.ga : st.gb;
    return html`<section class="sec" key=${'g' + t}>
      <div class="sec-h"><h2 class="h3">${title}</h2>${t && html`<span class=${'chip num ' + (assigned > goals ? 'bad' : assigned === goals ? 'ok' : '')}>${assigned} di ${goals} gol assegnati</span>`}</div>
      <div class="card pad0">${ids.map(Row)}</div>
    </section>`;
  };

  return html`<${Page} title="Risultato" sub=${dayLong(m) + ' · ' + m.format + ' vs ' + m.format} onBack=${C.back}>
    <div class="card stack">
      <div class="score-in">
        <div class="side"><${TeamTag} m=${m} side="a" /><span class="big num">${st.ga}</span>
          <div class="hs"><button type="button" class="step" aria-label=${teamName(m, 'a') + ': un gol in meno'} disabled=${st.ga <= 0} onClick=${() => setSt((s) => ({ ...s, ga: Math.max(0, s.ga - 1) }))}><${Icon} n="minus" s="16" /></button><button type="button" class="step" aria-label=${teamName(m, 'a') + ': un gol in più'} onClick=${() => setSt((s) => ({ ...s, ga: Math.min(60, s.ga + 1) }))}><${Icon} n="plus" s="16" /></button></div>
        </div>
        <span class="score-dash">–</span>
        <div class="side"><${TeamTag} m=${m} side="b" /><span class="big num">${st.gb}</span>
          <div class="hs"><button type="button" class="step" aria-label=${teamName(m, 'b') + ': un gol in meno'} disabled=${st.gb <= 0} onClick=${() => setSt((s) => ({ ...s, gb: Math.max(0, s.gb - 1) }))}><${Icon} n="minus" s="16" /></button><button type="button" class="step" aria-label=${teamName(m, 'b') + ': un gol in più'} onClick=${() => setSt((s) => ({ ...s, gb: Math.min(60, s.gb + 1) }))}><${Icon} n="plus" s="16" /></button></div>
        </div>
      </div>
      <div class="tiny faint">Marcatori, assist e autogol sono facoltativi: se non te li ricordi tutti, salva lo stesso. Un autogol conta per la squadra avversaria.</div>
    </div>

    <label class="hs" style="gap:10px;cursor:pointer"><input id="rs-teams" type="checkbox" checked=${st.editTeams} onChange=${(e) => setSt((s) => ({ ...s, editTeams: e.target.checked }))} style="width:18px;height:18px;accent-color:var(--accent)" /><span>Correggi le squadre (se qualcuno ha cambiato lato)</span></label>

    ${group('a', teamName(m, 'a'))}
    ${group('b', teamName(m, 'b'))}
    ${group('', 'Senza squadra')}
    ${lost.length > 0 && html`<div class="note warn"><${Icon} n="warn" s="16" /><span>Chi non è in una squadra non può avere gol o assist.</span></div>`}

    ${errs.length > 0 && html`<div class="note bad"><${Icon} n="warn" s="16" /><span>${errs.join(' ')}</span></div>`}
    <div class="sticky-act"><button class="btn primary block" disabled=${!!errs.length || busy || !C.canWrite} onClick=${save}>${busy ? 'Salvo…' : 'Salva risultato ' + st.ga + '–' + st.gb}</button></div>
  <//>`;
}

/* ---------- voto MVP ---------- */
function MvpScreen({ id }) {
  const C = useContext(Ctx);
  const m = C.matchesById[id];
  const prev = myMvpVotes(C)[id];
  const [sel, setSel] = useState(prev || null);
  const [busy, setBusy] = useState(false);
  if (!m || !m.final) return html`<${Page} title="MVP" onBack=${C.back}><div class="card empty">Partita non trovata.</div><//>`;
  const mv = Engine.mvpResult(m, C.mvp, Date.now());
  const fin = m.final;
  const iPlayed = (fin.ids || []).includes(C.uid);
  const ev = (m.result && m.result.ev) || {};
  const cands = (fin.ids || []).filter((x) => x !== C.uid && C.playersById[x]);
  const inA = (x) => (fin.a || []).includes(x), inB = (x) => (fin.b || []).includes(x);
  const groups = [
    { t: teamName(m, 'a'), l: cands.filter(inA), c: 'ta' },
    { t: teamName(m, 'b'), l: cands.filter(inB), c: 'tb' },
    { t: 'Altri', l: cands.filter((x) => !inA(x) && !inB(x)), c: '' },
  ];
  const save = async () => {
    if (!sel || busy) return;
    setBusy(true);
    const ok = await C.act.saveMvp(id, sel);
    setBusy(false);
    if (ok) {
      C.flash('Voto MVP salvato');
      C.back();
      C.openSheet({
        k: 'confirm', title: 'Valuti i giocatori della partita?',
        text: 'Le tue valutazioni aggiornano le stats dei compagni. Puoi farlo anche più tardi, dalla pagina della partita.',
        label: 'Valuta adesso', cancelLabel: 'Più tardi', onYes: () => C.go({ t: 'rateMatch', id }),
      });
    }
  };
  return html`<${Page} title="Vota l'MVP" sub=${dayLong(m) + ' · ' + m.format + ' vs ' + m.format} onBack=${C.back}>
    ${!iPlayed && html`<div class="note warn"><${Icon} n="warn" s="16" /><span>Votano solo i giocatori iscritti che hanno giocato questa partita.</span></div>`}
    ${mv.closed ? html`<div class="note"><${Icon} n="lock" s="16" /><span>La votazione è chiusa.</span></div>`
      : html`<div class="note"><${Icon} n="info" s="16" /><span>Un voto a testa, per un giocatore di qualsiasi squadra. Puoi cambiarlo fino alla chiusura, tra ${fmtLeft(mv.closesAt - Date.now())}. L'MVP è un premio: non cambia le stats.</span></div>`}
    ${groups.map((g) => g.l.length > 0 && html`<section class="sec" key=${g.t}>
      <h2 class="h3">${g.t}</h2>
      <div class="card pad0" role="radiogroup" aria-label=${g.t}>${g.l.map((pid) => {
        const p = C.playersById[pid], e = ev[pid] || {}, on = sel === pid;
        const bits = [e.g && plural(e.g, 'gol', 'gol'), e.a && plural(e.a, 'assist', 'assist')].filter(Boolean).join(' · ');
        return html`<button key=${pid} type="button" role="radio" aria-checked=${on} class=${'pick' + (on ? ' on' : '')} disabled=${mv.closed || !iPlayed} onClick=${() => setSel(pid)}>
          <span class="dot">${on && html`<${Icon} n="check" s="14" />`}</span>
          <${Avatar} p=${p} size=${34} />
          <span class="row-main"><span class="row-t"><span class="ell">${dispName(p)}</span><${InjuryMark} inj=${p.injury} s="14" /></span><span class="row-s">${bits || ((fin.roles && fin.roles[pid]) ? ROLE_NAME[fin.roles[pid]] : '')}</span></span>
          ${fin.roles && fin.roles[pid] && html`<${RoleChip} role=${fin.roles[pid]} />`}
        </button>`;
      })}</div>
    </section>`)}
    ${iPlayed && !mv.closed && html`<div class="sticky-act"><button class="btn primary block" disabled=${!sel || busy || !C.canWrite || sel === prev} onClick=${save}>${busy ? 'Salvo…' : !sel ? 'Scegli il migliore in campo' : sel === prev ? 'Hai già votato ' + dispName(C.playersById[sel]) : 'Vota ' + dispName(C.playersById[sel])}</button></div>`}
  <//>`;
}

/* ---------- valutare i compagni dopo la partita ---------- */
function MatchRateScreen({ id }) {
  const C = useContext(Ctx);
  const m = C.matchesById[id];
  if (!m || !m.final) return html`<${Page} title="Valuta i compagni" onBack=${C.back}><div class="card empty">Partita non trovata.</div><//>`;
  const myRatings = (C.ratings.find((x) => x.id === C.uid) || {}).r || {};
  const after = numOr(m.playedAt, 0);
  const ids = (m.final.ids || []).filter((x) => x !== C.uid && C.playersById[x]);
  const done = ids.filter((x) => myRatings[x] && numOr(myRatings[x].t, 0) >= after).length;
  return html`<${Page} title="Valuta i compagni" sub=${dayLong(m)} onBack=${C.back}>
    <div class="note"><${Icon} n="info" s="16" /><span>Le stats di ognuno sono la media delle valutazioni ricevute. Aggiorna quelle di chi hai visto giocare: puoi fermarti quando vuoi e riprendere più tardi da qui o dal loro profilo.</span></div>
    <div class="sec-h"><h2 class="h3">Giocatori della partita</h2><span class=${'chip num ' + (done === ids.length ? 'ok' : '')}>${done}/${ids.length}</span></div>
    <div class="card pad0 divided">${ids.map((pid) => {
      const p = C.playersById[pid], mr = myRatings[pid];
      const fresh = mr && numOr(mr.t, 0) >= after;
      return html`<button key=${pid} class="row tap" style="padding:10px 14px" onClick=${() => C.go({ t: 'rate', id: pid })}>
        <${Avatar} p=${p} size=${36} />
        <span class="row-main"><span class="row-t"><span class="ell">${dispName(p)}</span><${InjuryMark} inj=${p.injury} s="14" /></span><span class="row-s">${fresh ? 'Aggiornata ora' : mr ? 'Ultima valutazione: ' + fmtTs(numOr(mr.t, 0)) : 'Mai valutato da te'}</span></span>
        ${fresh ? html`<span class="chip ok"><${Icon} n="check" s="14" /> Fatto</span>` : html`<span class="chip">Valuta</span>`}
        <${Icon} n="chev" s="16" />
      </button>`;
    })}</div>
    <button class="btn ghost block" onClick=${C.back}>${done === ids.length ? 'Fatto' : 'Continuo più tardi'}</button>
  <//>`;
}

function readLS(k, d) { try { const v = window.localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
function writeLS(k, v) { try { if (v == null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); } catch (e) { /* archivio non disponibile */ } }
function applyTheme(t) {
  const el = document.documentElement;
  if (t === 'dark' || t === 'light') el.setAttribute('data-theme', t); else el.removeAttribute('data-theme');
}
const memberKey = (gid, uid) => gid + '~' + uid;
const fmtClock = (ts) => { const d = new Date(ts); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
function fmtDay(ts) {
  const d = new Date(ts); d.setHours(0, 0, 0, 0);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const k = Math.round((t - d) / 86400000);
  if (k === 0) return 'Oggi';
  if (k === 1) return 'Ieri';
  return `${cap1(DOW_FULL[d.getDay()])} ${d.getDate()} ${MON_FULL[d.getMonth()]}`;
}

/* ---------- gruppi: i miei, cerca, crea ---------- */
function GroupsScreen({ main }) {
  const C = useContext(Ctx);
  const { list: comuni } = useComuni();
  const myLoc = (C.me && C.me.loc) || null;
  const [q, setQ] = useState('');
  const [name, setName] = useState('');
  const [place, setPlace] = useState(myLoc);
  const [km, setKm] = useState(0);
  const [from, setFrom] = useState(myLoc);
  const [busy, setBusy] = useState(false);
  const status = (gid) => { const m = C.memberById[memberKey(gid, C.uid)]; return m ? m.status : null; };
  const t = q.trim().toLowerCase();
  const zoneOn = km > 0 && !!from;
  const dist = (g) => (from ? kmBetween(from, groupLoc(g)) : null);
  const far = (g) => { const d = dist(g); return d == null ? 1e9 : d; };
  const all = C.groups.slice().sort(from
    ? (a, b) => far(a) - far(b) || (a.name || '').localeCompare(b.name || '', 'it')
    : (a, b) => (a.city || '').localeCompare(b.city || '', 'it') || (a.name || '').localeCompare(b.name || '', 'it'));
  const found = all.filter((g) => {
    if (t && !((g.name || '') + ' ' + (g.city || '')).toLowerCase().includes(t)) return false;
    if (zoneOn) { const d = dist(g); if (d == null || d > km) return false; }
    return true;
  });
  const where = (g) => { const d = dist(g); return (g.city || '') + (d != null ? ' · ' + fmtKm(d) : ''); };
  const pending = all.filter((g) => status(g.id) === 'pending');
  const ask = async (g) => { setBusy(true); const r = await C.act.rpc('request_join', { p_gid: g.id }); setBusy(false); if (r.ok) C.flash(r.data === 'active' ? 'Sei già nel gruppo' : 'Richiesta inviata agli amministratori di ' + g.name); };
  const cancel = (g) => C.openSheet({ k: 'confirm', title: 'Annullare la richiesta?', text: `La richiesta per entrare in ${g.name} viene ritirata.`, label: 'Annulla richiesta', danger: true, onYes: async () => { if ((await C.act.rpc('leave_group', { p_gid: g.id })).ok) C.flash('Richiesta annullata'); } });
  const create = async (e) => {
    e.preventDefault();
    if (busy || name.trim().length < 2 || !place) return;
    setBusy(true);
    let r = await C.act.rpc('create_group', { p_name: name.trim(), p_city: place.name, p_loc: place }, { quiet: true });
    /* database non ancora aggiornato: crea il gruppo con la sola città */
    if (!r.ok) r = await C.act.rpc('create_group', { p_name: name.trim(), p_city: place.name });
    setBusy(false);
    if (r.ok) { setName(''); C.flash('Gruppo creato: ora sei il suo amministratore'); C.switchGroup(r.data, true); }
  };
  const body = html`
    ${main && html`<div class="note ok"><${Icon} n="info" s="16" /><span>Per giocare entra in un gruppo della tua città: chiedi di entrare e un amministratore del gruppo ti accetta. Oppure crea un gruppo nuovo, e ne sarai tu l'amministratore.</span></div>`}
    ${C.myGroups.length > 0 && html`<section class="sec"><h2 class="h3">I tuoi gruppi</h2>
      <div class="card pad0 divided">${C.myGroups.map((g) => html`<button key=${g.id} class="row tap" style="padding:12px 14px" onClick=${() => C.switchGroup(g.id, true)}>
        <span class="g-ic"><${Icon} n="pitch" s="18" /></span>
        <span class="row-main"><span class="row-t ell">${g.name}</span><span class="row-s">${g.city} · ${plural(numOr(g.n, 0), 'membro', 'membri')}</span></span>
        ${g.id === C.gid ? html`<span class="chip ok">Attuale</span>` : html`<span class="chip">Apri</span>`}
      </button>`)}</div></section>`}
    ${pending.length > 0 && html`<section class="sec"><h2 class="h3">Richieste in attesa</h2>
      <div class="card pad0 divided">${pending.map((g) => html`<div key=${g.id} class="row" style="padding:12px 14px">
        <span class="g-ic"><${Icon} n="clock" s="18" /></span>
        <span class="row-main"><span class="row-t ell">${g.name}</span><span class="row-s">${g.city} · aspetta che un amministratore ti accetti</span></span>
        <button class="btn sm ghost" onClick=${() => cancel(g)}>Annulla</button>
      </div>`)}</div></section>`}
    <section class="sec"><h2 class="h3">Cerca un gruppo</h2>
      <input id="group-search" class="input" type="search" placeholder="Nome del gruppo o città" value=${q} onInput=${(e) => setQ(e.target.value)} />
      <${ZoneFilter} km=${km} setKm=${setKm} from=${from} setFrom=${setFrom} idp="gs" />
      ${!comuni && from && html`<div class="tiny faint">Calcolo le distanze…</div>`}
      ${found.length ? html`<div class="card pad0 divided">${found.map((g) => { const st = status(g.id); return html`<div key=${g.id} class="row" style="padding:12px 14px">
        <span class="g-ic"><${Icon} n="pin" s="18" /></span>
        <span class="row-main"><span class="row-t ell">${g.name}</span><span class="row-s">${where(g)} · ${plural(numOr(g.n, 0), 'membro', 'membri')}</span></span>
        ${st === 'active' ? html`<span class="chip ok">Ci sei</span>` : st === 'pending' ? html`<span class="chip warn">In attesa</span>`
          : C.canWrite && C.me && html`<button class="btn sm primary" disabled=${busy} onClick=${() => ask(g)}>Chiedi di entrare</button>`}
      </div>`; })}</div>` : html`<div class="card empty small">${!C.groups.length ? 'Ancora nessun gruppo: crea il primo.' : zoneOn ? 'Nessun gruppo entro ' + km + ' km: prova ad allargare la distanza.' : 'Nessun gruppo con questo nome o città.'}</div>`}
    </section>
    ${C.canWrite && C.me && html`<section class="sec"><h2 class="h3">Crea un gruppo</h2>
      <form class="card stack" onSubmit=${create}>
        <div class="field"><label class="label" for="ng-name">Nome</label><input id="ng-name" class="input" maxlength="40" placeholder="Es. Calcetto del martedì" value=${name} onInput=${(e) => setName(e.target.value)} /></div>
        <div class="field"><label class="label" for="ng-city">Città</label><${ComunePicker} id="ng-city" value=${place} onChange=${setPlace} placeholder="Es. La Spezia" /></div>
        <div class="tiny faint">Chi crea il gruppo ne è l'amministratore: accetta le richieste di ingresso e può nominare altri amministratori.</div>
        <button class="btn primary" type="submit" disabled=${busy || name.trim().length < 2 || !place}>Crea il gruppo</button>
      </form>
    </section>`}`;
  if (main) {
    return html`<div class="page">
      <${MainHead} title="Gruppi" />
      ${body}
      ${window.SC_SIGNOUT && !C.demo && html`<button class="btn ghost block" onClick=${window.SC_SIGNOUT}>Esci dall'account</button>`}
      ${C.demo && html`<button class="btn danger block" onClick=${C.exitDemo}>Esci dalla demo</button>`}
    </div>`;
  }
  return html`<${Page} title="Gruppi" onBack=${C.back}>${body}<//>`;
}

/* ============================================================
   APP: messaggi in stile WhatsApp — chat del gruppo e chat private (compagni di gruppo e amici),
   foto, GIF e sticker (KLIPY), emoji, vocali, risposte, reazioni, modifica ed eliminazione,
   spunte di lettura, "sta scrivendo…", @menzioni, notifiche sul telefono
   ============================================================ */

/* una chat è g_xxx (il gruppo) oppure d_{uid1}_{uid2} (privata, i due codici in ordine) */
const isDm = (id) => typeof id === 'string' && id.startsWith('d_');
const dmId = (a, b) => 'd_' + (a < b ? a + '_' + b : b + '_' + a);
const dmUsers = (id) => (isDm(id) ? id.slice(2).split('_') : []);
const dmOther = (id, me) => { const u = dmUsers(id); return u[0] === me ? u[1] : u[0]; };
const chatPath = (id) => 'g/' + id + '/chat';
const readsPath = (id) => 'g/' + id + '/reads';
const QUICK_RX = ['👍', '❤️', '😂', '😮', '😢', '🙏'];
const EDIT_MS = 15 * 60000;
const MAX_PHOTOS = 10;
const VOICE_MAX_MS = 5 * 60000;
const touchUI = () => { try { return window.matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } };
const vibrate = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* niente vibrazione */ } };

function fmtDur(ms) {
  const s = Math.max(0, Math.round((Number(ms) || 0) / 1000));
  return Math.floor(s / 60) + ':' + pad2(s % 60);
}
/* ora nell'elenco delle chat: oggi l'ora, poi Ieri, il giorno della settimana, la data */
function fmtListTime(ts) {
  if (!ts) return '';
  const d = new Date(ts); d.setHours(0, 0, 0, 0);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const k = Math.round((t - d) / 86400000);

/* testo del messaggio: *grassetto*, _corsivo_, ~barrato~, link e @menzioni */
const LINK_RE = /\b((?:https?:\/\/|www\.)[^\s<>]+[^\s<>.,;:!?)\]}'"»])/gi;
const FMT_RE = /(^|[\s(«"'])([*_~])(\S(?:[^\n]*?\S)?)\2(?=$|[\s).,!?:;»"'])/g;
function fmtInline(s, key) {
  const out = [];
  let i = 0, m;
  FMT_RE.lastIndex = 0;
  while ((m = FMT_RE.exec(s))) {
    const at = m.index + m[1].length;
    if (at > i) out.push(s.slice(i, at));
    const tag = m[2] === '*' ? 'b' : m[2] === '_' ? 'i' : 's';
    out.push(h(tag, { key: key + 'f' + at }, m[3]));
    i = at + m[3].length + 2;
    FMT_RE.lastIndex = i;
  }
  if (i < s.length) out.push(s.slice(i));
  return out;
}
function richText(text, ment, C, onMention) {
  const s = String(text || '');
  const names = (Array.isArray(ment) ? ment : []).map((u) => ({ u, n: '@' + dispName(C.playersById[u]) })).filter((x) => x.n.length > 1).sort((a, b) => b.n.length - a.n.length);
  const withMentions = (seg, key) => {
    if (!names.length) return fmtInline(seg, key);
    const out = [];
    let rest = seg, k = 0;
    while (rest) {
      let best = null;
      for (const x of names) { const j = rest.indexOf(x.n); if (j >= 0 && (!best || j < best.j)) best = { j, x }; }
      if (!best) { out.push(...fmtInline(rest, key + 'm' + k)); break; }
      if (best.j) out.push(...fmtInline(rest.slice(0, best.j), key + 'm' + k));
      const u = best.x.u;
      out.push(html`<button type="button" key=${key + 'u' + k} class="mention" onClick=${(e) => { e.stopPropagation(); onMention && onMention(u); }}>${best.x.n}</button>`);
      rest = rest.slice(best.j + best.x.n.length);
      k++;
    }
    return out;
  };
  const out = [];
  let i = 0, m, k = 0;
  LINK_RE.lastIndex = 0;
  while ((m = LINK_RE.exec(s))) {
    if (m.index > i) out.push(...withMentions(s.slice(i, m.index), 't' + k));
    const href = /^www\./i.test(m[1]) ? 'https://' + m[1] : m[1];
    out.push(html`<a key=${'l' + k} href=${href} target="_blank" rel="noopener noreferrer" onClick=${(e) => e.stopPropagation()}>${m[1]}</a>`);
    i = m.index + m[1].length;
    k++;
  }
  if (i < s.length) out.push(...withMentions(s.slice(i), 't' + k));
  return out;
}

/* ---------- foto: ridotte sul telefono prima dell'invio ---------- */
async function decodeImage(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* vecchio browser: uso un'immagine */ }
  const url = URL.createObjectURL(file);
  try {
    return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  } finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}
const imgW = (im) => im.naturalWidth || im.width;
const imgH = (im) => im.naturalHeight || im.height;
function tinyThumb(im) {
  const W = imgW(im), H = imgH(im), s = 24 / Math.max(W, H, 1);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(W * s)); c.height = Math.max(1, Math.round(H * s));
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.55);
}
async function prepImage(file) {
  const im = await decodeImage(file);
  const W = imgW(im), H = imgH(im);
  if (!W || !H) throw new Error('immagine');
  const thumb = tinyThumb(im);
  /* le GIF restano come sono, altrimenti si fermano */
  if (file.type === 'image/gif') {
    if (file.size > 8 * 1024 * 1024) throw { code: 'big', message: 'GIF troppo grande: al massimo 8 MB.' };
    return { blob: file, w: W, h: H, mime: 'image/gif', ext: 'gif', thumb, k: 'gif' };
  }
  const s = Math.min(1, 1600 / Math.max(W, H));
  const w = Math.max(1, Math.round(W * s)), hh = Math.max(1, Math.round(H * s));
  const c = document.createElement('canvas');
  c.width = w; c.height = hh;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, hh);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(im, 0, 0, w, hh);
  const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
  if (!blob) throw new Error('foto');
  return { blob, w, h: hh, mime: 'image/jpeg', ext: 'jpg', thumb, k: 'img' };
}

/* ---------- file della chat: scaricati una volta e tenuti sul telefono ---------- */
const MEDIA_CACHE = 'ab-chat-media-v1';
const MediaCache = (() => {
  const mem = new Map(), inflight = new Map();
  const key = (p) => location.origin + '/__chat-media/' + encodeURIComponent(p);
  /* sul telefono restano gli ultimi 400 file (circa 100 MB): i più vecchi, se servono, si riscaricano */
  let puts = 0;
  const trim = async () => {
    try { const c = await caches.open(MEDIA_CACHE); const ks = await c.keys(); for (let i = 0; i < ks.length - 400; i++) await c.delete(ks[i]); } catch (e) { /* niente */ }
  };
  const keep = async (p, blob) => {
    try {
      const c = await caches.open(MEDIA_CACHE);
      await c.put(key(p), new Response(blob, { headers: { 'Content-Type': blob.type || 'application/octet-stream' } }));
      if (puts++ % 25 === 0) trim();
    } catch (e) { /* senza cache: si riscarica */ }
  };
  return {
    has: (p) => mem.has(p),
    peek: (p) => mem.get(p) || null,
    put(p, blob) { if (!p || !blob) return; if (!mem.has(p)) mem.set(p, URL.createObjectURL(blob)); keep(p, blob); },
    url(db, p) {
      if (!p) return Promise.reject(new Error('file'));
      if (mem.has(p)) return Promise.resolve(mem.get(p));
      if (inflight.has(p)) return inflight.get(p);
      const pr = (async () => {
        let blob = null;
        try { const c = await caches.open(MEDIA_CACHE); const r = await c.match(key(p)); if (r) blob = await r.blob(); } catch (e) { /* cache non disponibile */ }
        if (!blob) {
          if (!db || !db.storage) throw new Error('spazio');
          blob = await db.storage.download(p);
          keep(p, blob);
        }
        const u = URL.createObjectURL(blob);
        mem.set(p, u);
        return u;
      })();
      inflight.set(p, pr);
      pr.then(() => inflight.delete(p), () => inflight.delete(p));
      return pr;
    },
    async forget(paths) {
      for (const p of paths || []) {
        const u = mem.get(p); if (u) { mem.delete(p); try { URL.revokeObjectURL(u); } catch (e) { /* già liberato */ } }
        try { const c = await caches.open(MEDIA_CACHE); await c.delete(key(p)); } catch (e) { /* niente */ }
      }
    },
  };
})();
function useMediaUrl(path, local) {
  const C = useContext(Ctx);
  const [st, setSt] = useState(() => ({ url: local || (path && MediaCache.peek(path)) || null, err: false }));
  useEffect(() => {
    if (local) { setSt({ url: local, err: false }); return; }
    if (!path) return;
    let dead = false;
    const now = MediaCache.peek(path);
    if (now) { setSt({ url: now, err: false }); return; }
    MediaCache.url(C.be && C.be.db, path).then((u) => { if (!dead) setSt({ url: u, err: false }); }, () => { if (!dead) setSt({ url: null, err: true }); });
    return () => { dead = true; };
  }, [path, local]);
  return st;
}
/* carica quando il fumetto si avvicina allo schermo */
function useNearScreen(ref, root) {
  const [on, setOn] = useState(false);
  useEffect(() => {
    if (on || !ref.current) return;
    if (typeof IntersectionObserver === 'undefined') { setOn(true); return; }
    const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { setOn(true); io.disconnect(); } }, { root: root || null, rootMargin: '600px 0px' });
    io.observe(ref.current);
    return () => io.disconnect();
  }, [on]);
  return on;
}

/* ---------- GIF e sticker da KLIPY (serve la chiave in config.js: klipyKey) ---------- */
const Klipy = (() => {
  let noLocale = false;
  const key = () => String((window.SC_CONFIG && window.SC_CONFIG.klipyKey) || '').trim();
  const cid = () => {
    let v = readLS('sc-klipy-id', '');
    if (!/^[a-z0-9]{8,24}$/.test(v)) { v = uid8() + uid8(); writeLS('sc-klipy-id', v); }
    return v;
  };
  const fileOf = (x, size, kinds) => { const f = (x.file && x.file[size]) || {}; for (const k of kinds) if (f[k] && f[k].url) return f[k]; return null; };
  const parse = (x, kind) => {
    if (!x || x.type === 'ad' || !x.file) return null;
    const prev = fileOf(x, 'sm', ['webp', 'gif', 'png']) || fileOf(x, 'xs', ['webp', 'gif', 'png']) || fileOf(x, 'md', ['webp', 'gif', 'png']);
    const main = fileOf(x, 'md', kind === 'stickers' ? ['webp', 'png', 'gif'] : ['webp', 'gif']) || prev;
    const mp4 = kind === 'stickers' ? null : fileOf(x, 'md', ['mp4']);
    if (!prev || !main) return null;
    return { id: String(x.slug || x.id || ''), title: x.title || '', prev: prev.url, pw: prev.width || 1, ph: prev.height || 1, u: main.url, w: main.width || prev.width || 1, h: main.height || prev.height || 1, v: mp4 ? mp4.url : null };
  };
  return {
    on: () => !!key(),
    async list(kind, q, page) {
      const k = key();
      if (!k) throw { code: 'nokey' };
      const go = async (withLocale) => {
        const u = new URL('https://api.klipy.com/api/v1/' + encodeURIComponent(k) + '/' + kind + '/' + (q ? 'search' : 'trending'));
        if (q) u.searchParams.set('q', q);
        u.searchParams.set('page', String(page || 1));
        u.searchParams.set('per_page', '24');
        u.searchParams.set('customer_id', cid());
        u.searchParams.set('content_filter', 'medium');
        if (withLocale) u.searchParams.set('locale', 'it');
        const res = await fetch(u.toString());
        if (!res.ok) throw { code: 'http', status: res.status };
        const j = await res.json();
        if (!j || !j.result) throw { code: 'result' };
        return j.data || {};
      };
      let d;
      try { d = await go(!noLocale); } catch (e) { if (noLocale) throw e; noLocale = true; d = await go(false); }
      return { items: (d.data || []).map((x) => parse(x, kind)).filter(Boolean), more: !!d.has_next };
    },
    /* KLIPY chiede di segnalare cosa si manda: migliora le ricerche */
    share(kind, slug, q) {
      const k = key();
      if (!k || !slug) return;
      try {
        fetch('https://api.klipy.com/api/v1/' + encodeURIComponent(k) + '/' + kind + '/share/' + encodeURIComponent(slug), {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: q || '', customer_id: cid() }),
        }).catch(() => {});
      } catch (e) { /* non importa */ }
    },
  };
})();

/* ---------- invio: si vede subito, con l'avanzamento, e si può riprovare ---------- */
const Outbox = (() => {
  const items = new Map(); /* chat -> Map(id -> voce) */
  const subs = new Set();
  const emit = () => subs.forEach((f) => { try { f(); } catch (e) { /* schermata chiusa */ } });
  const of = (chat) => { if (!items.has(chat)) items.set(chat, new Map()); return items.get(chat); };
  return {
    list: (chat) => Array.from((items.get(chat) || new Map()).values()),
    get: (chat, id) => (items.get(chat) || new Map()).get(id),
    set(chat, id, v) { of(chat).set(id, Object.assign({}, of(chat).get(id) || {}, v)); emit(); },
    drop(chat, id) { const m = items.get(chat); if (m && m.delete(id)) emit(); },
    subscribe(f) { subs.add(f); return () => subs.delete(f); },
  };
})();
function useOutbox(chat) {
  const [, setT] = useState(0);
  useEffect(() => Outbox.subscribe(() => setT((x) => x + 1)), []);
  return Outbox.list(chat);
}
const newMsgId = (uid) => uid + '~' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fileStem = (id) => String(id).split('~')[1] || uid8();

/* le azioni della chat sul database */
function chatActions(C) {
  const db = C.be.db;
  const fail = (e) => { C.flash((e && e.message) || errText(e), 'err'); return false; };
  const rpc = async (fn, args) => { try { return { ok: true, data: await db.rpc(fn, args) }; } catch (e) { fail(e); return { ok: false, err: e }; } };
  const refreshDoc = (path) => { try { if (db.refreshDoc) db.refreshDoc(path); } catch (e) { /* arriva col tempo reale */ } };
  const writeMsg = async (chat, id, data) => {
    const path = chatPath(chat) + '/' + id;
    await db.doc(path).set(data);
    return path;
  };
  /* manda un messaggio: testo, risposta, menzioni, foto, vocale, GIF */
  const send = async (chat, draft) => {
    const id = draft.id || newMsgId(C.uid);
    const t = Date.now();
    const base = { by: C.uid, t };
    if (draft.text && draft.text.trim()) base.text = draft.text.trim().slice(0, 4000);
    if (draft.re) base.re = draft.re;
    if (draft.ment && draft.ment.length) base.ment = draft.ment.slice(0, 30);
    if (draft.gif) base.gif = draft.gif;
    const local = Object.assign({ id, local: true }, base);
    if (draft.photos) local.media = draft.photos.map((p) => ({ k: p.k, w: p.w, h: p.h, b: p.thumb, local: p.url }));
    if (draft.voice) local.voice = { d: draft.voice.d, w: draft.voice.wave, local: draft.voice.url };
    Outbox.set(chat, id, { id, msg: local, status: 'sending', progress: 0, draft: Object.assign({}, draft, { id }) });
    try {
      if (draft.photos && draft.photos.length) {
        const media = [];
        const total = draft.photos.reduce((s, p) => s + p.blob.size, 0) || 1;
        let done = 0;
        for (let i = 0; i < draft.photos.length; i++) {
          const p = draft.photos[i];
          const path = chat + '/' + C.uid + '/' + fileStem(id) + '-' + i + '.' + p.ext;
          if (!p.uploaded) {
            await db.storage.upload(path, p.blob, { contentType: p.mime, onProgress: (x) => Outbox.set(chat, id, { progress: Math.min(0.99, (done + x * p.blob.size) / total) }) });
            p.uploaded = true;
            MediaCache.put(path, p.blob);
          }
          done += p.blob.size;
          media.push({ k: p.k, p: path, w: p.w, h: p.h, s: p.blob.size, b: p.thumb });
        }
        base.media = media;
      }
      if (draft.voice) {
        const v = draft.voice, path = chat + '/' + C.uid + '/' + fileStem(id) + '.' + v.ext;
        if (!v.uploaded) {
          await db.storage.upload(path, v.blob, { contentType: v.mime, onProgress: (x) => Outbox.set(chat, id, { progress: Math.min(0.99, x) }) });
          v.uploaded = true;
          MediaCache.put(path, v.blob);
        }
        base.voice = { p: path, d: Math.round(v.d), w: v.wave, s: v.blob.size, mime: v.mime };
      }
      await writeMsg(chat, id, base);
      Outbox.set(chat, id, { status: 'sent', progress: 1 });
      /* tolgo la copia locale appena arriva quella vera (o comunque dopo poco) */
      setTimeout(() => Outbox.drop(chat, id), 4000);
      return id;
    } catch (e) {
      Outbox.set(chat, id, { status: 'failed', err: (e && e.message) || '' });
      if (e && e.code === 'unavailable' && /database/i.test(e.message || '')) C.flash(e.message, 'err');
      else if (e && e.message && e.code !== 'unavailable') C.flash(e.message, 'err');
      return null;
    }
  };
  /* inoltra un messaggio in un'altra chat: testo, GIF, foto e vocali (i file si copiano nella chat nuova) */
  const forward = async (target, m) => {
    const id = newMsgId(C.uid), stem = fileStem(id);
    const data = { by: C.uid, t: Date.now(), fwd: 1 };
    const extOf = (p, d) => { const e = String(p || '').split('.').pop(); return /^[a-z0-9]{2,5}$/i.test(e) ? e : d; };
    if (m.text) data.text = String(m.text).slice(0, 4000);
    if (m.gif) data.gif = m.gif;
    if (Array.isArray(m.media) && m.media.length) {
      data.media = [];
      for (let i = 0; i < m.media.length; i++) {
        const it = m.media[i], to = target + '/' + C.uid + '/' + stem + '-' + i + '.' + extOf(it.p, 'jpg');
        await db.storage.copy(it.p, to);
        data.media.push({ k: it.k, p: to, w: it.w, h: it.h, s: it.s, b: it.b });
      }
    }
    if (m.voice && m.voice.p) {
      const to = target + '/' + C.uid + '/' + stem + '.' + extOf(m.voice.p, 'webm');
      await db.storage.copy(m.voice.p, to);
      data.voice = { p: to, d: m.voice.d, w: m.voice.w, s: m.voice.s, mime: m.voice.mime };
    }
    await writeMsg(target, id, data);
    return id;
  };
  return {
    send, forward,
    retry: (chat, id) => { const o = Outbox.get(chat, id); if (o && o.draft) send(chat, o.draft); },
    discard: (chat, id) => Outbox.drop(chat, id),
    react: async (path, e) => { const r = await rpc('chat_react', { p_path: path, p_emoji: e || '' }); if (r.ok) refreshDoc(path); return r.ok; },
    edit: async (path, text) => { const r = await rpc('chat_edit', { p_path: path, p_text: text }); if (r.ok) refreshDoc(path); return r.ok; },
    delAll: async (path) => {
      const r = await rpc('chat_delete', { p_path: path });
      if (!r.ok) return false;
      refreshDoc(path);
      const files = Array.isArray(r.data) ? r.data.filter(Boolean) : [];
      if (files.length && db.storage) { try { await db.storage.remove(files); } catch (e) { /* restano nello spazio: li toglie l'amministratore */ } MediaCache.forget(files); }
      return true;
    },
    seen: (marks) => { if (!marks.length || !db.rpc) return Promise.resolve(); return db.rpc('chat_seen', { p_marks: marks }).catch(() => {}); },
    mute: async (chat, on) => (await rpc('chat_mute', { p_chat: chat, p_on: !!on })).ok,
  };
}
