</script>
<script>
/* ============================================================
   MOTORE: stats, punteggio, valore in partita, squadre e ruoli
   Funzioni pure, senza dipendenze dal DOM.
   ============================================================ */
const Engine = (() => {
  const ROLES = ['POR', 'DIF', 'CEN', 'ATT'];
  const OUT_ROLES = ['DIF', 'CEN', 'ATT'];
  const ROLE_NAME = { POR: 'Portiere', DIF: 'Difensore', CEN: 'Centrocampista', ATT: 'Attaccante' };
  const FORMATS = {
    5: { cap: 10, name: 'Calcio a 5' },
    7: { cap: 14, name: 'Calcio a 7' },
    8: { cap: 16, name: 'Calcio a 8' },
  };

  /* Le 5 aree e le loro voci. Ogni area è la media delle sue voci. */
  const AREAS = [
    { k: 'att', code: 'ATT', name: 'Attacco', voci: [
      { k: 'tir', name: 'Tiro', hint: 'forza e precisione' },
      { k: 'dri', name: 'Dribbling', hint: 'saltare l\'uomo' },
      { k: 'pat', name: 'Posizionamento', hint: 'smarcarsi, farsi trovare' },
    ] },
    { k: 'cen', code: 'CEN', name: 'Centrocampo', voci: [
      { k: 'pas', name: 'Passaggio', hint: 'precisione' },
      { k: 'vis', name: 'Visione di gioco', hint: 'scegliere la giocata giusta' },
      { k: 'pce', name: 'Posizionamento', hint: 'occupare gli spazi, dare una linea di passaggio' },
    ] },
    { k: 'dif', code: 'DIF', name: 'Difesa', voci: [
      { k: 'con', name: 'Contrasto', hint: 'vincere i duelli' },
      /* aggiunta dopo: nei voti che non ce l'hanno vale la media di Contrasto e Posizionamento */
      { k: 'sci', name: 'Scivolata', hint: 'intervenire in tempo, senza fallo', from: ['con', 'pdi'] },
      { k: 'pdi', name: 'Posizionamento', hint: 'stare al posto giusto, coprire' },
    ] },
    { k: 'gen', code: 'GEN', name: 'Generale', voci: [
      { k: 'vel', name: 'Velocità', hint: 'scatto' },
      { k: 'res', name: 'Resistenza', hint: 'tenere il ritmo fino alla fine' },
      { k: 'ele', name: 'Elevazione', hint: 'salto e colpo di testa' },
      { k: 'cpz', name: 'Calci piazzati', hint: 'punizioni, rigori, angoli' },
    ] },
    { k: 'por', code: 'POR', name: 'Porta', voci: [
      { k: 'rif', name: 'Riflessi', hint: 'parate da vicino' },
      { k: 'usc', name: 'Uscite', hint: 'uno contro uno, palle alte' },
      { k: 'tuf', name: 'Tuffo', hint: 'arrivare sui tiri angolati' },
      { k: 'lan', name: 'Lanci', hint: 'rinvii e rimesse in gioco' },
    ] },
  ];
  const AREA_BY = Object.fromEntries(AREAS.map((a) => [a.k, a]));
  const OUT_AREAS = ['att', 'cen', 'dif', 'gen'];
  const VOCI = AREAS.flatMap((a) => a.voci.map((v) => ({ k: v.k, name: v.name, hint: v.hint, area: a.k, from: v.from || null })));
  /* le voci aggiunte dopo l'inizio, che le valutazioni già date non hanno */
  const LATE_VOCI = VOCI.filter((x) => x.from);
  const VMIN = 1, VMAX = 99, VDEF = 60;

  /* Riferimenti della scala 1–99 (45 alle prime armi, 65 nella media, 75 forte, 85 top, 90+ fuoriclasse) */
  const SCALE = [
    { min: 90, label: 'fuoriclasse' },
    { min: 80, label: 'top del gruppo' },
    { min: 70, label: 'forte' },
    { min: 55, label: 'nella media' },
    { min: -Infinity, label: 'alle prime armi' },
  ];
  const scaleLabel = (v) => SCALE.find((s) => v >= s.min).label;
  const tierOf = (v) => (v >= 75 ? 'gold' : v >= 65 ? 'silver' : 'bronze');
  const TIER_NAME = { gold: 'Oro', silver: 'Argento', bronze: 'Bronzo' };

  /* Parametri del valore in partita */
  const CFG = { MALUS_NEAR: 3, MALUS_FAR: 6, INJ_LIGHT: 5, INJ_BAD: 10, MVP_HOURS: 24 };

  /* Moduli: [portiere, difensori, centrocampisti, attaccanti]. 1-2-1-2-1 a 7 coincide con 1-2-3-1. */
  const MODULES = {
    5: [[1, 1, 2, 1], [1, 2, 1, 1], [1, 2, 0, 2]],
    7: [[1, 2, 3, 1], [1, 3, 1, 2], [1, 3, 2, 1]],
    8: [[1, 3, 3, 1], [1, 2, 3, 2], [1, 3, 2, 2], [1, 2, 4, 1]],
  };

  /* Parametri del bilanciamento */
  const SKILL_W = 0.25; // peso dello squilibrio area per area
  const LOSS_W = 0.35;  // quanto l'app evita di mettere gente fuori ruolo
  const BAL_SCALE = 8;  // differenza di valore medio che porta l'equilibrio a 0%

  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  const okv = (v) => typeof v === 'number' && isFinite(v);
  const sum = (a) => a.reduce((s, x) => s + x, 0);
  const mean = (a) => (a.length ? sum(a) / a.length : 0);

  function matchTime(m) {
    if (!m) return 0;
    /* senza ora (partita nata da un sondaggio) si conta la sera, alle 21 */
    const t = new Date((m.date || '1970-01-01') + 'T' + (m.time || '21:00')).getTime();
    return isFinite(t) ? t : 0;
  }

  /* ---------- STATS ---------- */
  function cleanVoci(v) {
    const out = {};
    if (!v || typeof v !== 'object') return out;
    for (const x of VOCI) if (okv(v[x.k])) out[x.k] = clamp(Math.round(v[x.k]), VMIN, VMAX);
    return out;
  }
  /* valutazioni del vecchio formato (attacco, centrocampo, difesa da 1 a 10): ogni voce dell'area prende il valore x10 */
  function legacyVoci(e) {
    if (!e || !okv(e.a) || !okv(e.m) || !okv(e.d)) return null;
    const out = {};
    const map = { att: e.a, cen: e.m, dif: e.d };
    for (const a of AREAS) if (map[a.k] != null) a.voci.forEach((x) => { out[x.k] = clamp(Math.round(map[a.k] * 10), VMIN, VMAX); });
    return out;
  }
  /* true se il giocatore ha già l'autovalutazione nel formato a voci (non quello vecchio da 1 a 10) */
  const hasNewSelf = (p) => !!p && Object.keys(cleanVoci(p.self)).length > 0;
  /* una voce aggiunta dopo, in un voto che non ce l'ha, vale la media delle voci da cui parte:
     così l'area resta identica finché qualcuno non la vota davvero */
  function withLate(v) {
    let out = v;
    for (const x of LATE_VOCI) {
      if (okv(v[x.k])) continue;
      const b = x.from.map((k) => v[k]).filter(okv);
      if (!b.length) continue;
      if (out === v) out = Object.assign({}, v);
      out[x.k] = mean(b);
    }
    return out;
  }
  /* le voci aggiunte dopo che mancano nell'autovalutazione (va data una volta, poi resta bloccata) */
  const missingSelfVoci = (p) => {
    if (!hasNewSelf(p)) return [];
    const s = cleanVoci(p.self);
    return LATE_VOCI.filter((x) => !okv(s[x.k]) && x.from.some((k) => okv(s[k])));
  };

  /* media delle voci presenti per ogni area (null se l'area non ha voci) */
  function areasOf(voci) {
    const out = {};
    for (const a of AREAS) {
      const vs = a.voci.map((x) => voci[x.k]).filter(okv);
      out[a.k] = vs.length ? mean(vs) : null;
    }
    return out;
  }
  const outfieldOf = (areas) => mean(OUT_AREAS.map((k) => num(areas[k], VDEF)));
  const ovrOf = (areas, role) => (role === 'POR' ? num(areas.por, VDEF) : outfieldOf(areas));

  /* Voce = media di tutte le valutazioni ricevute (autovalutazione compresa).
     Area = media delle sue voci. Punteggio = media delle 4 aree di movimento, o la sola Porta per i portieri. */
  function computeRatings(players, ratingDocs) {
    const peerBy = {};
    for (const doc of ratingDocs || []) {
      const r = (doc && doc.r) || {};
      for (const target of Object.keys(r)) {
        if (target === doc.id) continue;
        const e = r[target] || {};
        const v = cleanVoci(e.v || legacyVoci(e));
        if (!Object.keys(v).length) continue;
        (peerBy[target] = peerBy[target] || []).push({ voter: doc.id, v, t: num(e.t, 0) });
      }
    }
    const out = {};
    for (const p of players || []) {
      const self = cleanVoci(p.self);
      const hasSelf = Object.keys(self).length > 0;
      const peers = peerBy[p.id] || [];
      /* nei conti, le voci aggiunte dopo prendono il valore di partenza; nei singoli voti restano come sono stati dati */
      const selfC = withLate(self);
      const peersC = peers.map((pr) => withLate(pr.v));
      const voci = {}, counts = {};
      for (const x of VOCI) {
        const arr = [];
        if (okv(selfC[x.k])) arr.push(selfC[x.k]);
        for (const v of peersC) if (okv(v[x.k])) arr.push(v[x.k]);
        voci[x.k] = arr.length ? mean(arr) : VDEF;
        counts[x.k] = arr.length;
      }
      const areas = areasOf(voci);
      const selfAreas = hasSelf ? areasOf(selfC) : null;
      out[p.id] = {
        voci, counts, areas,
        outfield: outfieldOf(areas), porta: num(areas.por, VDEF),
        ovr: ovrOf(areas, p.role), gk: p.role === 'POR',
        self: hasSelf ? self : null, selfAreas,
        selfOvr: selfAreas ? ovrOf(selfAreas, p.role) : null,
        peers, nPeers: peers.length,
      };
    }
    return out;
  }

  /* ---------- VALORE IN PARTITA ---------- */
  function partOf(id, areas, pref, sec, inj) {
    const a = {};
    for (const k of [...OUT_AREAS, 'por']) a[k] = num(areas && areas[k], VDEF);
    const p = ROLES.includes(pref) ? pref : 'CEN';
    return {
      id, areas: a, outfield: mean(OUT_AREAS.map((k) => a[k])), porta: a.por,
      pref: p, sec: ROLES.includes(sec) && sec !== p ? sec : '',
      inj: inj && (inj.level === 'lieve' || inj.level === 'grave') ? inj.level : '',
    };
  }
  const RIDX = { DIF: 0, CEN: 1, ATT: 2 };
  /* malus fuori ruolo tra ruoli di movimento: 0 nel proprio ruolo o nel secondo, -3 vicino, -6 lontano */
  function roleMalus(part, role) {
    if (role === 'POR') return 0;
    const own = [part.pref, part.sec].filter((r) => r && r !== 'POR');
    if (!own.length) return 0;
    let best = Infinity;
    for (const r of own) {
      const d = Math.abs(RIDX[r] - RIDX[role]);
      best = Math.min(best, d === 0 ? 0 : d === 1 ? CFG.MALUS_NEAR : CFG.MALUS_FAR);
    }
    return best;
  }
  const injMalus = (part) => (part.inj === 'grave' ? CFG.INJ_BAD : part.inj === 'lieve' ? CFG.INJ_LIGHT : 0);
  /* in porta conta la Porta; fuori conta la media delle aree di movimento meno l'eventuale malus */
  function valueIn(part, role) {
    const base = role === 'POR' ? part.porta : part.outfield - roleMalus(part, role);
    return base - injMalus(part);
  }
  const natural = (part) => valueIn(part, part.pref);

  /* ---------- MODULI E RUOLI ---------- */
  function shrink(mod, n) {
    const m = mod.slice();
    let tot = m[0] + m[1] + m[2] + m[3];
    while (tot > n) {
      let best = -1;
      for (const i of [2, 1, 3]) if (m[i] > 0 && (best < 0 || m[i] > m[best])) best = i;
      if (best < 0) best = 0;
      m[best]--; tot--;
    }
    while (tot < n) { m[2]++; tot++; }
    return m;
  }
  /* i moduli del formato, adattati al numero di giocatori della squadra */
  function modulesFor(format, n) {
    const base = MODULES[format] || MODULES[5];
    const seen = new Set(), out = [];
    for (const md of base) {
      const m = shrink(md, n);
      const k = m.join();
      if (!seen.has(k)) { seen.add(k); out.push(m); }
    }
    return out;
  }
  function moduleLabel(rc) {
    if (!rc[0]) return rc.slice(1).filter((x) => x > 0).join('-');
    return rc.filter((x, i) => i === 0 || x > 0).join('-');
  }

  /* assegnazione migliore dei ruoli per un modulo dato (programmazione dinamica sui posti) */
  function assignRoles(parts, mod) {
    const n = parts.length;
    const [P, D, C, A] = mod;
    if (P + D + C + A !== n) return null;
    const V = parts.map((x) => [valueIn(x, 'POR'), valueIn(x, 'DIF'), valueIn(x, 'CEN'), valueIn(x, 'ATT')]);
    const S2 = D + 1, S3 = C + 1, NS = (P + 1) * S2 * S3;
    const idx = (p, d, c) => (p * S2 + d) * S3 + c;
    let best = new Float64Array(NS).fill(-Infinity);
    best[0] = 0;
    const choice = [];
    for (let i = 0; i < n; i++) {
      const nb = new Float64Array(NS).fill(-Infinity);
      const ch = new Int8Array(NS).fill(-1);
      const vi = V[i];
      for (let p = 0; p <= P; p++) for (let d = 0; d <= D; d++) for (let c = 0; c <= C; c++) {
        const s = idx(p, d, c), cur = best[s];
        if (cur === -Infinity) continue;
        const a = i - p - d - c;
        if (a < 0 || a > A) continue;
        if (p < P) { const t = idx(p + 1, d, c), v = cur + vi[0]; if (v > nb[t]) { nb[t] = v; ch[t] = 0; } }
        if (d < D) { const t = idx(p, d + 1, c), v = cur + vi[1]; if (v > nb[t]) { nb[t] = v; ch[t] = 1; } }
        if (c < C) { const t = idx(p, d, c + 1), v = cur + vi[2]; if (v > nb[t]) { nb[t] = v; ch[t] = 2; } }
        if (a < A) { const v = cur + vi[3]; if (v > nb[s]) { nb[s] = v; ch[s] = 3; } }
      }
      best = nb;
      choice.push(ch);
    }
    const fin = idx(P, D, C);
    if (best[fin] === -Infinity) return null;
    const roles = new Array(n);
    let p = P, d = D, c = C;
    for (let i = n - 1; i >= 0; i--) {
      const r = choice[i][idx(p, d, c)];
      roles[i] = ROLES[r];
      if (r === 0) p--; else if (r === 1) d--; else if (r === 2) c--;
    }
    return { total: best[fin], roles };
  }

  /* la formazione migliore per una squadra: sceglie il modulo e i ruoli che le danno più valore */
  function bestLineup(parts, format) {
    const n = parts.length;
    if (!n) return { mod: [0, 0, 0, 0], roles: {}, total: 0 };
    let best = null;
    for (const mod of modulesFor(format, n)) {
      const r = assignRoles(parts, mod);
      if (r && (!best || r.total > best.total + 1e-9)) best = { mod, total: r.total, list: r.roles };
    }
    const roles = {};
    parts.forEach((p, i) => { roles[p.id] = best.list[i]; });
    return { mod: best.mod, roles, total: best.total };
  }

  /* ---------- AFFINITÀ ----------
     Due giocatori nella stessa squadra: vittoria +1, pareggio +1/2, le sconfitte non tolgono niente.
     Il livello va da 0 a 100 e cresce sempre più piano (circa 28 dopo 10 partite positive, 57 dopo 25).
     La squadra prende fino a +3 punti di valore medio, in base all'affinità media tra tutte le coppie di compagni. */
  const AFF_K = 30, AFF_BONUS = 3;
  const affLevel = (p) => 100 * (1 - Math.exp(-p / AFF_K));
  function affinityFrom(matches) {
    const pts = {}, wins = {}, draws = {};
    const key = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
    for (const m of matches || []) {
      if (!m || m.status !== 'played' || !m.final || !hasResult(m)) continue;
      const ra = m.result.a, rb = m.result.b;
      const gn = m.final.gn || {};
      const sides = [[m.final.a || [], ra > rb ? 1 : ra === rb ? 0.5 : 0], [m.final.b || [], rb > ra ? 1 : ra === rb ? 0.5 : 0]];
      for (const [ids, w] of sides) {
        if (!w) continue;
        const pl = ids.filter((id) => !gn[id] && !(m.guests && m.guests[id]));
        for (let i = 0; i < pl.length; i++) for (let j = i + 1; j < pl.length; j++) {
          const k = key(pl[i], pl[j]);
          pts[k] = (pts[k] || 0) + w;
          if (w === 1) wins[k] = (wins[k] || 0) + 1; else draws[k] = (draws[k] || 0) + 1;
        }
      }
    }
    return {
      get: (a, b) => (a === b ? 0 : affLevel(pts[key(a, b)] || 0)),
      points: (a, b) => pts[key(a, b)] || 0,
      record: (a, b) => ({ w: wins[key(a, b)] || 0, d: draws[key(a, b)] || 0 }),
      top: (uid, n) => Object.keys(pts).map((k) => k.split('|')).filter((ab) => ab.includes(uid))
        .map((ab) => { const o = ab[0] === uid ? ab[1] : ab[0]; const k = key(ab[0], ab[1]); return { id: o, p: pts[k], v: affLevel(pts[k]), w: wins[k] || 0, d: draws[k] || 0 }; })
        .sort((x, y) => y.v - x.v).slice(0, n || 5),
    };
  }
  function affBonusOf(ids, aff) {
    if (!aff || ids.length < 2) return 0;
    let s = 0, c = 0;
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) { s += aff.get(ids[i], ids[j]); c++; }
    return c ? (AFF_BONUS * s) / c / 100 : 0;
  }

  /* ---------- VALUTAZIONE DELLE SQUADRE ---------- */
  function evalTeam(parts, roles, aff) {
    const rc = [0, 0, 0, 0];
    const vals = {};
    const outs = [];
    let total = 0, loss = 0, gkVal = null;
    for (const x of parts) {
      const r = ROLES.includes(roles[x.id]) ? roles[x.id] : x.pref;
      rc[ROLES.indexOf(r)]++;
      const v = valueIn(x, r);
      vals[x.id] = v;
      total += v;
      loss += natural(x) - v;
      if (r === 'POR') gkVal = gkVal == null ? v : Math.max(gkVal, v);
      else outs.push(x);
    }
    const n = parts.length;
    const areas = {};
    for (const k of OUT_AREAS) areas[k] = outs.length ? mean(outs.map((x) => x.areas[k])) : 0;
    const affB = affBonusOf(parts.map((x) => x.id), aff);
    return { n, rc, total, base: n ? total / n : 0, aff: affB, mean: n ? total / n + affB : 0, loss, areas, gkVal, vals, label: moduleLabel(rc) };
  }

  function balanceLabel(b) {
    if (b >= 95) return 'Equilibrio perfetto';
    if (b >= 85) return 'Molto equilibrate';
    if (b >= 70) return 'Abbastanza equilibrate';
    return 'Da bilanciare';
  }

  /* confronto sulla MEDIA per giocatore: con numeri dispari le squadre restano confrontabili */
  function compareTeams(ea, eb) {
    const areaGap = mean(OUT_AREAS.map((k) => Math.abs(ea.areas[k] - eb.areas[k])));
    const coreAvg = Math.abs(ea.mean - eb.mean) + SKILL_W * areaGap;
    const lossAvg = (ea.loss + eb.loss) / Math.max(1, ea.n + eb.n);
    const balance = ea.n && eb.n ? Math.round(100 * clamp(1 - coreAvg / BAL_SCALE, 0, 1)) : 0;
    return { coreAvg, lossAvg, cost: coreAvg + LOSS_W * lossAvg, balance, label: balanceLabel(balance) };
  }

  function evaluate(partsA, partsB, roles, aff) {
    const a = evalTeam(partsA, roles || {}, aff), b = evalTeam(partsB, roles || {}, aff);
    return Object.assign({ a, b }, compareTeams(a, b));
  }

  /* stima veloce di una squadra, usata per scremare tutte le divisioni possibili */
  function quickTeam(idx, P, format, M) {
    let tot = 0;
    const gks = [], outs = [];
    const cnt = [0, 0, 0];
    for (const i of idx) {
      const x = P[i];
      tot += x.nat;
      if (x.pref === 'POR') gks.push(x);
      else { outs.push(x); cnt[RIDX[x.pref]]++; }
    }
    let loss = 0;
    if (!gks.length) {
      let m = Infinity, who = null;
      for (const x of outs) if (x.conv < m) { m = x.conv; who = x; }
      if (who) { loss += m; cnt[RIDX[who.pref]]--; }
    } else if (gks.length > 1) {
      const s = gks.slice().sort((x, y) => y.porta - x.porta);
      for (let k = 1; k < s.length; k++) loss += s[k].gkOut;
    }
    const n = idx.length;
    let mis = Infinity;
    for (const md of modulesFor(format, n)) {
      let over = 0;
      for (let r = 0; r < 3; r++) over += Math.max(0, cnt[r] - md[r + 1]);
      mis = Math.min(mis, over);
    }
    loss += (isFinite(mis) ? mis : 0) * CFG.MALUS_NEAR;
    const src = outs.length ? outs : idx.map((i) => P[i]);
    const areas = {};
    for (const k of OUT_AREAS) areas[k] = mean(src.map((x) => x.areas[k]));
    let affB = 0;
    if (M && idx.length > 1) {
      let s = 0, c = 0;
      for (let a = 0; a < idx.length; a++) for (let b = a + 1; b < idx.length; b++) { s += M[idx[a]][idx[b]]; c++; }
      affB = (AFF_BONUS * s) / c / 100;
    }
    return { n, mean: n ? (tot - loss) / n + affB : 0, loss, areas };
  }

  function exactSplit(P, mask, format, aff) {
    const X = [], Y = [];
    P.forEach((p, i) => ((mask >> i) & 1 ? X : Y).push(p));
    const lx = bestLineup(X, format), ly = bestLineup(Y, format);
    const roles = Object.assign({}, lx.roles, ly.roles);
    const c = compareTeams(evalTeam(X, roles, aff), evalTeam(Y, roles, aff));
    return { mask, cost: c.cost, roles, x: X.map((p) => p.id), y: Y.map((p) => p.id) };
  }

  function keyOfCurrent(parts, cur) {
    const n = parts.length, small = Math.floor(n / 2);
    const A = new Set(cur.a), B = new Set(cur.b);
    let side = null;
    if (n % 2 === 0) side = A.has(parts[0].id) ? A : B.has(parts[0].id) ? B : null;
    else side = cur.a.length === small ? A : cur.b.length === small ? B : null;
    if (!side) return null;
    let mask = 0, cnt = 0;
    parts.forEach((p, i) => { if (side.has(p.id)) { mask |= 1 << i; cnt++; } });
    return cnt === small ? mask : null;
  }

  /* Squadre e ruoli insieme. mode: 'exact' = la migliore, 'bal' = tra le migliori, 'mix' = più varietà */
  function suggestTeams(parts, opts) {
    const o = opts || {};
    const mode = o.mode || 'bal';
    const rng = o.rng || Math.random;
    const format = o.format || 5;
    const n = parts.length;
    if (n < 2) return null;
    if (n > 20) throw new Error('Troppi giocatori per la ricerca completa');
    const P = parts.map((x) => {
      const nat = natural(x);
      let bestOut = -Infinity;
      for (const r of OUT_ROLES) bestOut = Math.max(bestOut, valueIn(x, r));
      return Object.assign({}, x, { nat, conv: nat - valueIn(x, 'POR'), gkOut: nat - bestOut });
    });
    const aff = o.aff || null;
    const M = aff ? P.map((x) => P.map((y) => aff.get(x.id, y.id))) : null;
    const small = Math.floor(n / 2), forceFirst = n % 2 === 0;
    const cands = [];
    const pick = [];
    const rec = (i) => {
      if (pick.length === small) {
        const inX = new Set(pick);
        const Y = [];
        for (let k = 0; k < n; k++) if (!inX.has(k)) Y.push(k);
        const c = compareTeams(quickTeam(pick, P, format, M), quickTeam(Y, P, format, M));
        let mask = 0;
        for (const k of pick) mask |= 1 << k;
        cands.push({ mask, q: c.cost + rng() * 1e-7 });
        return;
      }
      if (n - i < small - pick.length) return;
      pick.push(i); rec(i + 1); pick.pop();
      if (!(forceFirst && i === 0)) rec(i + 1);
    };
    rec(0);
    cands.sort((x, y) => x.q - y.q);
    const top = cands.slice(0, 120).map((c) => exactSplit(P, c.mask, format, aff));
    top.forEach((r) => { r.k = r.cost + rng() * 1e-7; });
    top.sort((x, y) => x.k - y.k);
    const best = top[0].cost;
    const K = mode === 'exact' ? 40 : mode === 'mix' ? 60 : 14;
    const tol = mode === 'exact' ? 1e-6 : mode === 'mix' ? 1.0 : 0.4;
    let pool = top.filter((r) => r.cost <= best + tol).slice(0, K);
    if (o.current) {
      const key = keyOfCurrent(parts, o.current);
      if (key !== null) { const f = pool.filter((r) => r.mask !== key); if (f.length) pool = f; }
    }
    const r = pool[Math.floor(rng() * pool.length)];
    return rng() < 0.5 ? { a: r.x, b: r.y, roles: r.roles } : { a: r.y, b: r.x, roles: r.roles };
  }

  /* il singolo scambio tra le due squadre che migliora di più (i ruoli vengono riassegnati) */
  function bestSwap(partsA, partsB, roles, format, aff) {
    if (!partsA.length || !partsB.length) return null;
    const base = evaluate(partsA, partsB, roles, aff);
    const la0 = bestLineup(partsA, format), lb0 = bestLineup(partsB, format);
    const base2 = evaluate(partsA, partsB, Object.assign({}, la0.roles, lb0.roles), aff);
    const bar = Math.min(base.cost, base2.cost) - 1e-6;
    let best = null;
    for (let i = 0; i < partsA.length; i++) {
      for (let j = 0; j < partsB.length; j++) {
        const A2 = partsA.slice(), B2 = partsB.slice();
        const t = A2[i]; A2[i] = B2[j]; B2[j] = t;
        const la = bestLineup(A2, format), lb = bestLineup(B2, format);
        const r2 = Object.assign({}, la.roles, lb.roles);
        const e = evaluate(A2, B2, r2, aff);
        if (e.cost < bar && (!best || e.cost < best.after.cost)) best = { a: partsA[i].id, b: partsB[j].id, before: base, after: e, roles: r2 };
      }
    }
    return best;
  }

  /* ---------- DOPO LA PARTITA ---------- */
  /* MVP: votano i partecipanti iscritti, un voto a testa, non per se stessi.
     Si chiude 24 ore dopo la chiusura della partita, o prima se hanno votato tutti. */
  function mvpResult(m, mvpDocs, now) {
    const fin = (m && m.final) || {};
    const ids = fin.ids || [];
    const set = new Set(ids);
    const votes = [];
    for (const d of mvpDocs || []) {
      if (!set.has(d.id)) continue;
      const t = d.v && d.v[m.id];
      if (typeof t !== 'string' || !set.has(t) || t === d.id) continue;
      votes.push({ voter: d.id, target: t });
    }
    const closesAt = num(m && m.playedAt, 0) + CFG.MVP_HOURS * 3600000;
    const closed = now >= closesAt || (ids.length > 1 && votes.length >= ids.length);
    const counts = {};
    votes.forEach((v) => { counts[v.target] = (counts[v.target] || 0) + 1; });
    const max = Math.max(0, ...Object.values(counts));
    const winners = closed && max > 0 ? Object.keys(counts).filter((k) => counts[k] === max) : [];
    return { votes, counts, max, winners, closed, closesAt, nVoted: votes.length, nEligible: ids.length };
  }

  const hasResult = (m) => !!(m && m.result && okv(m.result.a) && okv(m.result.b));

  /* presenze, vittorie, gol, assist, autogol e MVP di ogni giocatore */
  function matchStats(players, matches, mvpDocs, now) {
    const st = {};
    const pset = new Set((players || []).map((p) => p.id));
    for (const id of pset) st[id] = { pres: 0, w: 0, d: 0, l: 0, g: 0, a: 0, og: 0, mvp: 0, games: [] };
    const played = (matches || []).filter((m) => m.status === 'played' && m.final).sort((x, y) => matchTime(y) - matchTime(x));
    const mvps = {};
    for (const m of played) {
      const fin = m.final, res = m.result;
      const A = new Set(fin.a || []), B = new Set(fin.b || []);
      const ok = hasResult(m);
      const mv = mvpResult(m, mvpDocs, now);
      mvps[m.id] = mv;
      for (const id of fin.ids || []) {
        if (!pset.has(id)) continue;
        const s = st[id];
        s.pres++;
        let out = null;
        if (ok && (A.has(id) || B.has(id))) {
          const my = A.has(id) ? res.a : res.b, th = A.has(id) ? res.b : res.a;
          out = my > th ? 'w' : my < th ? 'l' : 'd';
          s[out]++;
        }
        const ev = (res && res.ev && res.ev[id]) || {};
        const g = Math.max(0, num(ev.g, 0)), a = Math.max(0, num(ev.a, 0)), og = Math.max(0, num(ev.og, 0));
        s.g += g; s.a += a; s.og += og;
        const isMvp = mv.winners.includes(id);
        if (isMvp) s.mvp++;
        s.games.push({ mid: m.id, out, g, a, og, mvp: isMvp, side: A.has(id) ? 'a' : B.has(id) ? 'b' : '' });
      }
    }
    return { byPlayer: st, mvps };
  }

  /* quanto ci prende il bilanciamento: equilibrio previsto contro risultato reale */
  function accuracy(matches) {
    const rows = (matches || []).filter((m) => m.status === 'played' && hasResult(m) && m.final && m.final.pred && okv(m.final.pred.va) && okv(m.final.pred.vb));
    if (!rows.length) return null;
    const diffs = rows.map((m) => Math.abs(m.result.a - m.result.b));
    let favN = 0, favW = 0, favD = 0;
    rows.forEach((m) => {
      const dv = m.final.pred.va - m.final.pred.vb;
      if (Math.abs(dv) < 1) return;
      favN++;
      const ga = m.result.a, gb = m.result.b;
      if (ga === gb) favD++;
      else if ((ga > gb) === (dv > 0)) favW++;
    });
    return {
      n: rows.length, avgDiff: mean(diffs), close: diffs.filter((d) => d <= 2).length,
      favN, favW, favD, avgBal: mean(rows.map((m) => num(m.final.pred.balance, 0))),
    };
  }

  return {
    ROLES, OUT_ROLES, ROLE_NAME, FORMATS, AREAS, AREA_BY, OUT_AREAS, VOCI, VMIN, VMAX, VDEF,
    SCALE, scaleLabel, tierOf, TIER_NAME, CFG, MODULES,
    clamp, mean, num, okv, matchTime,

      v.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * (180 + 40 * Math.sin(t * 3)) * t) * 9000 * env), true);
      if (i % Math.floor(n / 40) === 0) wave.push(Math.round(5 + env * 22));
    }
    return { blob: new Blob([buf], { type: 'audio/wav' }), wave: wave.slice(0, 40) };
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

const INJ_ZONES = [
  { k: 'ginocchio', l: 'Ginocchio' }, { k: 'caviglia', l: 'Caviglia' }, { k: 'piede', l: 'Piede' },
  { k: 'coscia', l: 'Coscia / polpaccio' }, { k: 'schiena', l: 'Schiena' }, { k: 'spalla', l: 'Spalla' },
  { k: 'braccio', l: 'Braccio / mano' }, { k: 'altro', l: 'Altro' },
];
const injZoneName = (k) => { const z = INJ_ZONES.find((x) => x.k === k); return z ? z.l : ''; };
/* riassunto in una riga: "Ginocchio · distorsione · rientro 12 nov" */
function injSummary(inj) {
  if (!inj || !inj.level) return '';
  const bits = [injZoneName(inj.zone) || (inj.level === 'grave' ? 'Infortunio grave' : 'Infortunio lieve')];
  if (inj.note) bits.push(inj.note);
  bits.push(inj.back ? 'rientro ' + fmtYmd(inj.back) : 'rientro da definire');
  return bits.join(' · ');
}
/* l'infortunio spiegato per intero: lo vedono tutti nella scheda del giocatore */
function InjuryCard({ inj, mine }) {
  if (!inj || !inj.level) return null;
  const grave = inj.level === 'grave';
  const zone = injZoneName(inj.zone);
  const when = inj.back
    ? (injOverdue(inj) ? 'Il rientro era previsto il ' + fmtYmd(inj.back) + '.' : 'Rientro previsto il ' + fmtYmd(inj.back) + '.')

  return html`<div class=${'note ' + (grave ? 'bad' : 'warn')}>
    <${InjuryMark} inj=${inj} s="18" />
    <span><b>${grave ? 'Infortunio grave' : 'Infortunio lieve'}${zone ? ': ' + zone.toLowerCase() : ''}</b>${inj.note ? ' (' + inj.note + ')' : ''}. ${when}${mine ? '' : ' Per le squadre conta ' + (grave ? CFG.INJ_BAD : CFG.INJ_LIGHT) + ' punti in meno.'}</span>

}

/* pentagono delle 5 aree, con l'autovalutazione tratteggiata */
function Radar5({ vals, self }) {
  const cx = 150, cy = 122, R = 84;
  const keys = AREAS.map((a) => a.k);
  const ang = (i) => ((-90 + i * 72) * Math.PI) / 180;
  const pt = (i, v) => [cx + (R * v * Math.cos(ang(i))) / 99, cy + (R * v * Math.sin(ang(i))) / 99];
  const poly = (o) => keys.map((k, i) => pt(i, Engine.num(o[k], Engine.VDEF)).map((n) => n.toFixed(1)).join(',')).join(' ');
  const ring = (v) => keys.map((k, i) => pt(i, v).map((n) => n.toFixed(1)).join(',')).join(' ');
  const lab = (i) => {
    const [x, y] = pt(i, 99);
    const dx = x - cx;
    return { x: x + (dx > 8 ? 10 : dx < -8 ? -10 : 0), y: y + (y < cy - 40 ? -22 : 8), anchor: dx > 8 ? 'start' : dx < -8 ? 'end' : 'middle' };
  };
  return html`<svg class="radar" viewBox="0 0 300 236" role="img" aria-label=${AREAS.map((a) => a.name + ' ' + r0(vals[a.k])).join(', ')}>
    <polygon class="rd-grid" points=${ring(99)} />
    <polygon class="rd-grid" points=${ring(66)} />
    <polygon class="rd-grid" points=${ring(33)} />
    ${keys.map((k, i) => { const [x, y] = pt(i, 99); return html`<line key=${k} class="rd-axis" x1=${cx} y1=${cy} x2=${x} y2=${y} />`; })}
    ${self && html`<polygon class="rd-self" points=${poly(self)} />`}
    <polygon class="rd-now" points=${poly(vals)} />
    ${keys.map((k, i) => { const [x, y] = pt(i, vals[k]); return html`<circle key=${k} class="rd-dot" cx=${x} cy=${y} r="3.5" />`; })}
    ${AREAS.map((a, i) => { const l = lab(i); return html`<g key=${a.k}>
      <text class="rd-t" x=${l.x} y=${l.y} text-anchor=${l.anchor}>${a.code}</text>
      <text class="rd-v" x=${l.x} y=${l.y + 16} text-anchor=${l.anchor}>${r0(vals[a.k])}</text>
    </g>`; })}
  </svg>`;
}

/* foto profilo: ritaglio quadrato 160px, JPEG leggero */
async function fileToAvatar(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const S = 320, c = document.createElement('canvas');
    c.width = c.height = S;
    const m = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
    return c.toDataURL('image/jpeg', 0.8);
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- partecipanti: valori per il bilanciamento ---------- */
function playerPart(pid, C) {
  const p = C.playersById[pid], rt = C.rated[pid];
  return Engine.partOf(pid, rt ? rt.areas : null, p ? p.role : 'CEN', p ? p.role2 : '', p && p.injury);
}
function guestPart(gid, g) {
  let v = (g && g.v) || null;
  if (!v && g && Engine.okv(g.a) && Engine.okv(g.m) && Engine.okv(g.d)) {
    /* ospite del vecchio formato (1-10) */
    v = { att: g.a * 10, cen: g.m * 10, dif: g.d * 10, gen: ((g.a + g.m + g.d) / 3) * 10, por: 40 };
  }
  return Engine.partOf(gid, v, (g && g.role) || 'CEN', '', null);
}
function partFor(id, m, C) {
  if (m && m.guests && m.guests[id]) return guestPart(id, m.guests[id]);
  return playerPart(id, C);
}
function nameFor(id, m, C) {
  const p = C.playersById[id];
  if (p) return dispName(p);
  const g = m && m.guests && m.guests[id];
  if (g && g.name) return g.name;
  const gn = m && m.final && m.final.gn && m.final.gn[id];
  return gn || 'Ex giocatore';
}

/* ---------- elenco della partita: confermati, lista d'attesa, forse ---------- */
function buildRoster(m, C) {
  const cap = (FORMATS[m.format] || FORMATS[5]).cap;
  const members = [];
  for (const pid of Object.keys(m.rsvp || {})) {
    const r = m.rsvp[pid];
    if (!r || !r.s) continue;
    const p = C.playersById[pid], rt = C.rated[pid];
    const part = playerPart(pid, C);
    members.push({
      id: pid, guest: false, s: r.s, t: numOr(r.t, 0), side: r.side === 'a' || r.side === 'b' ? r.side : '', role: part.pref, role2: part.sec, p,
      name: p ? dispName(p) : 'Ex giocatore', full: fullName(p), ovr: rt ? rt.ovr : Engine.VDEF, inj: p && p.injury, part,
    });
  }
  for (const gid of Object.keys(m.guests || {})) {
    const g = m.guests[gid];
    if (!g || g.gone) continue;
    const part = guestPart(gid, g);
    members.push({
      id: gid, guest: true, s: 'in', t: numOr(g.t, 0), side: g.side === 'a' || g.side === 'b' ? g.side : '', role: part.pref, role2: '', g, name: g.name || 'Ospite', full: 'Ospite',
      ovr: part.pref === 'POR' ? part.porta : part.outfield, inj: null, part,
    });
  }
  const byT = (x, y) => x.t - y.t;
  const ins = members.filter((x) => x.s === 'in').sort(byT);
  const confirmed = ins.slice(0, cap), waitlist = ins.slice(cap);
  const byId = {}, confirmedById = {};
  members.forEach((x) => { byId[x.id] = x; });
  confirmed.forEach((x) => { confirmedById[x.id] = x; });
  const replied = new Set(Object.keys(m.rsvp || {}).filter((k) => m.rsvp[k] && m.rsvp[k].s));
  return {
    cap, confirmed, waitlist, byId, confirmedById,
    maybe: members.filter((x) => x.s === 'maybe').sort(byT),
    out: members.filter((x) => x.s === 'out'),
    gk: confirmed.filter((x) => x.role === 'POR').length,
    noReply: C.players.filter((p) => !replied.has(p.id)).length,
  };
}

/* le squadre definitive al momento della chiusura, con ruoli e previsione dell'app */
function snapshotFinal(m, R, aff) {
  const inIds = new Set(R.confirmed.map((x) => x.id));
  const T = m.teamMode ? teamsOf(m, R) : null;
  const A = T ? T.a : ((m.teams && m.teams.a) || []).filter((i) => inIds.has(i));
  const B = T ? T.b : ((m.teams && m.teams.b) || []).filter((i) => inIds.has(i));
  const roles = Object.assign({}, (m.teams && m.teams.roles) || {}, T ? T.roles : {});
  const pa = A.map((i) => R.byId[i].part), pb = B.map((i) => R.byId[i].part);
  if (A.some((i) => !ROLES.includes(roles[i]))) Object.assign(roles, Engine.bestLineup(pa, m.format).roles);
  if (B.some((i) => !ROLES.includes(roles[i]))) Object.assign(roles, Engine.bestLineup(pb, m.format).roles);
  const keep = {};
  [...A, ...B].forEach((i) => { keep[i] = roles[i]; });
  const gn = {};
  R.confirmed.filter((x) => x.guest).forEach((x) => { gn[x.id] = x.name; });
  const ev = A.length && B.length ? Engine.evaluate(pa, pb, keep, aff) : null;
  return {
    a: A, b: B, ids: R.confirmed.filter((x) => !x.guest).map((x) => x.id), roles: keep, gn,
    pred: ev ? { balance: ev.balance, va: ev.a.mean, vb: ev.b.mean } : null,
  };
}

/* ---------- scritture sul database (una alla volta per documento) ---------- */
function errText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Spazio dati esaurito: non si possono aggiungere altri dati.';
  if (c === 'resource_exhausted') return 'Troppe operazioni ravvicinate, riprova tra un attimo.';
  if (c === 'unavailable') return 'Connessione assente, riprova.';
  return 'Salvataggio non riuscito. Se succede sempre, potresti avere accesso in sola lettura.';
}

function makeActions(be, notify, dataRef, onDenied, gidRef) {
  const queues = new Map();
  const overlays = {};
  /* opts.probe: il primo salvataggio dell'iscrizione; se il database lo rifiuta (invalid_argument)
     chi guarda ha solo il permesso di lettura e l'app passa alla sola lettura per questa visita */
  const run = (path, fn, opts) => {
    const prev = queues.get(path) || Promise.resolve();
    const p = prev.then(fn);
    queues.set(path, p.catch(() => {}));
    return p.then(() => true, (e) => {
      if (opts && opts.probe && e && e.code === 'invalid_argument' && onDenied) {
        onDenied();
        notify('Non puoi iscriverti: hai accesso in sola lettura.', 'err');
      } else notify((e && e.message) || errText(e), 'err');
      return false;
    });
  };
  const doc = (p) => be.db.doc(p);
  /* documenti del gruppo attuale: g/{gruppo}/... */
  const G = () => 'g/' + gidRef.current + '/';
  const ov = () => (overlays[gidRef.current] = overlays[gidRef.current] || { r: {}, mvp: {} });
  const upd = (mid, patch) => { const path = G() + 'matches/' + mid; return run(path, () => doc(path).update(patch)); };
  const updP = (pid, patch) => run('players/' + pid, () => doc('players/' + pid).update(patch));
  const mine = (col) => (dataRef.current[col] || []).find((x) => x.id === be.uid) || {};
  const rpc = async (fn, args, opts) => {
    if (!be.db.rpc) { if (!(opts && opts.quiet)) notify('Non disponibile in questa versione.', 'err'); return { ok: false }; }
    try { return { ok: true, data: await be.db.rpc(fn, args) }; }
    catch (e) { if (!(opts && opts.quiet)) notify((e && e.message) || errText(e), 'err'); return { ok: false, err: e }; }
  };
  return {
    saveProfile: (p) => run('players/' + be.uid, () => doc('players/' + be.uid).set(p), { probe: true }),
    updateProfile: (patch) => updP(be.uid, Object.assign({}, patch, { updated: Date.now() })),
    saveSelf: (vals) => updP(be.uid, { self: vals, selfAt: Date.now(), selfUnlock: false, updated: Date.now() }),
    /* aggiunge all'autovalutazione solo le voci nuove (l'unione tiene tutte le altre com'erano) */
    addSelfVoci: (vals) => updP(be.uid, { self: vals, selfLateAt: Date.now(), updated: Date.now() }),
    setInjury: (inj) => updP(be.uid, { injury: inj, updated: Date.now() }),
    unlockSelf: (pid) => updP(pid, { selfUnlock: true }),
    saveField: (id, f) => run('fields/' + id, () => doc('fields/' + id).set(f)),
    createMatch: (m, id) => { const path = G() + 'matches/' + id; return run(path, () => doc(path).set(m)); },
    updateMatch: upd,
    deleteMatch: (mid) => { const path = G() + 'matches/' + mid; return run(path, () => doc(path).delete()); },
    setRsvp: (mid, pid, s, side) => upd(mid, { rsvp: { [pid]: Object.assign({ s, t: Date.now() }, side !== undefined ? { side } : {}) } }),
    /* cambiare squadra non fa perdere il posto in lista */
    setSide: (mid, pid, side) => upd(mid, { rsvp: { [pid]: { side } } }),
    setGuestSide: (mid, gsid, side) => upd(mid, { guests: { [gsid]: { side } } }),
    addGuest: (mid, gsid, g) => upd(mid, { guests: { [gsid]: g } }),
    removeGuest: (mid, gsid) => upd(mid, { guests: { [gsid]: { gone: true } } }),
    saveTeams: (mid, a, b, roles, extra) => upd(mid, { teams: Object.assign({ a, b, roles, t: Date.now(), by: be.uid }, extra || {}) }),
    saveRoles: (mid, roles) => upd(mid, { teams: { roles, t: Date.now(), by: be.uid } }),
    markPlayed: (mid, fin) => upd(mid, { status: 'played', playedAt: Date.now(), final: fin }),
    saveResult: (mid, result, finPatch) => upd(mid, finPatch ? { result, final: finPatch } : { result }),
    setStatus: (mid, status) => upd(mid, { status }),
    saveRating: (target, v) => { const path = G() + 'ratings/' + be.uid; return run(path, () => {
      const o = ov(); o.r[target] = { v, t: Date.now() };
      return doc(path).set({ r: Object.assign({}, mine('ratings').r || {}, o.r) });
    }); },
    saveMvp: (mid, target) => { const path = G() + 'mvp/' + be.uid; return run(path, () => {
      const o = ov(); o.mvp[mid] = target;
      return doc(path).set({ v: Object.assign({}, mine('mvp').v || {}, o.mvp) });
    }); },
    /* help: messaggi agli sviluppatori */
    sendHelp: (topic, text) => {
      const id = be.uid + '~' + Date.now().toString(36);
      return run('help/' + id, () => doc('help/' + id).set({ by: be.uid, topic, text, t: Date.now(), status: 'open', replies: [] }));
    },
    answerHelp: (id, replies, status) => run('help/' + id, () => doc('help/' + id).update({ replies, status })),
    /* invito di un amico a una partita: lo vede tra le cose da fare */
    inviteToMatch: (mid, pid) => upd(mid, { invites: { [pid]: { by: be.uid, t: Date.now() } } }),
    /* amicizie (funzioni del database) */
    friendRequest: (pid) => rpc('friend_request', { p_uid: pid }),
    friendRespond: (pid, yes) => rpc('friend_respond', { p_uid: pid, p_accept: !!yes }),
    friendRemove: (pid) => rpc('friend_remove', { p_uid: pid }),
    /* sondaggio sul giorno (funzioni del database: il voto che fa arrivare al numero crea la partita) */
    pollVote: (mid, days) => rpc('poll_vote', { p_gid: gidRef.current, p_mid: mid, p_days: days }),
    pollClose: (mid, day) => rpc('poll_close', { p_gid: gidRef.current, p_mid: mid, p_day: day }),
    /* gruppi ed eliminazioni (funzioni del database) */
    rpc,
  };
}


/* ============================================================
   APP: comuni italiani (elenco ISTAT con le coordinate), distanze, scelta del comune.
   La posizione delle persone non viene mai chiesta: conta solo il comune che scelgono.
   ============================================================ */
let COMUNI = null;
let comuniP = null;
const normTxt = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\u2019`]/g, '\'').toLowerCase().trim();

function loadComuni() {
  if (COMUNI) return Promise.resolve(COMUNI);
  if (!comuniP) {
    comuniP = fetch('comuni.json')
      .then((r) => { if (!r.ok) throw new Error('comuni'); return r.json(); })
      .then((j) => {
        COMUNI = (j.c || []).map(([name, prov, lat, lng]) => ({ name, prov, lat, lng, k: normTxt(name) }));
        return COMUNI;
      })
      .catch((e) => { comuniP = null; throw e; });
  }
  return comuniP;
}
function useComuni() {
  const [list, setList] = useState(COMUNI);
  const [err, setErr] = useState(false);
  useEffect(() => { if (!list) loadComuni().then(setList, () => setErr(true)); }, []);
  return { list, err };
}
/* carica l'elenco solo se serve davvero (per esempio per trovare il comune di un gruppo vecchio) */
function useComuniIf(on) {
  const [list, setList] = useState(COMUNI);
  useEffect(() => { if (on && !COMUNI) loadComuni().then(setList, () => {}); }, [on]);
  return list;
}
function searchComuni(list, q, n) {
  const max = n || 8;
  const t = normTxt(q);
  if (!list || t.length < 2) return [];
  const exact = [], starts = [], inside = [];
  for (const c of list) {
    if (c.k === t) exact.push(c);
    else if (c.k.startsWith(t)) { if (starts.length < max) starts.push(c); }
    else if (inside.length < max && c.k.includes(t)) inside.push(c);
  }
  return exact.concat(starts, inside).slice(0, max);
}
/* il comune di un gruppo: quello salvato, oppure (gruppi creati prima) quello col nome della città, se è uno solo */
function lookupCity(name) {
  if (!COMUNI || !name) return null;
  const t = normTxt(name);
  const m = COMUNI.filter((c) => c.k === t);
  return m.length === 1 ? { name: m[0].name, prov: m[0].prov, lat: m[0].lat, lng: m[0].lng } : null;
}
const groupLoc = (g) => (g && g.loc && isFinite(g.loc.lat) ? g.loc : g ? lookupCity(g.city) : null);
const placeLabel = (loc) => (loc && loc.name ? loc.name + (loc.prov ? ' (' + loc.prov + ')' : '') : '');

function kmBetween(a, b) {
  if (!a || !b || !isFinite(a.lat) || !isFinite(a.lng) || !isFinite(b.lat) || !isFinite(b.lng)) return null;
  const rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(x)));
}
const fmtKm = (k) => (k == null ? '' : k < 1 ? 'stesso comune' : k < 10 ? (Math.round(k * 10) / 10).toString().replace('.', ',') + ' km' : Math.round(k) + ' km');

/* età dall'anno di nascita */
const THIS_YEAR = new Date().getFullYear();
const BIRTH_MIN = THIS_YEAR - 80, BIRTH_MAX = THIS_YEAR - 10;
const okBirth = (y) => Number.isInteger(y) && y >= BIRTH_MIN && y <= BIRTH_MAX;
const ageOf = (p) => (p && okBirth(Number(p.birthYear)) ? THIS_YEAR - Number(p.birthYear) : null);

/* scelta del comune: si scrive il nome e si tocca quello giusto */

  const choose = (c) => { onChange({ name: c.name, prov: c.prov, lat: c.lat, lng: c.lng }); setQ(''); setOpen(false); };
  if (value && !open) {

      <button type="button" class="btn sm ghost" onClick=${() => { setQ(''); setOpen(true); }}>Cambia</button>
      ${clearable !== false && html`<button type="button" class="icon-btn sm" aria-label="Togli il comune" onClick=${() => { onChange(null); setOpen(true); }}><${Icon} n="x" s="14" /></button>`}
    </div>`;
  }
  return html`<div class="place-pick stack-8">
    <div class="hs" style="gap:8px">
      <input id=${id} class="input grow" type="search" autocomplete="off" enterkeyhint="search" placeholder=${placeholder || 'Scrivi il nome del comune'} value=${q}
        onInput=${(e) => setQ(e.target.value)}

      ${value && html`<button type="button" class="btn sm ghost" onClick=${() => setOpen(false)}>Annulla</button>`}
    </div>
    ${err && html`<div class="tiny bad-t">Non riesco a caricare l'elenco dei comuni: controlla la connessione e riprova.</div>`}
    ${!list && !err && q.trim().length >= 2 && html`<div class="tiny faint">Carico l'elenco dei comuni…</div>`}
    ${res.length > 0 && html`<div class="card pad0 divided place-list">${res.map((c) => html`<button type="button" key=${c.name + '-' + c.prov} class="row tap" style="padding:10px 14px" onClick=${() => choose(c)}>
      <span class="grow ell">${c.name}</span><span class="chip">${c.prov}</span>
    </button>`)}</div>`}
    ${list && q.trim().length >= 2 && !res.length && html`<div class="tiny faint">Nessun comune con questo nome.</div>`}
  </div>`;
}

/* ---------- squadre automatiche: sempre le stesse a parità di iscritti ---------- */
function seededRng(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  let a = h >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rosterSig = (R) => R.confirmed.map((x) => x.id).sort().join(',');

/* le squadre da mostrare: scelte dai partecipanti, automatiche (solo a partita piena) o fatte a mano */
function teamsOf(m, R) {
  const t = m.teams || {};
  const inConf = (i) => !!R.confirmedById[i];
  let a, b, source;
  if (m.teamMode === 'pick') {
    a = R.confirmed.filter((x) => x.side === 'a').map((x) => x.id);
    b = R.confirmed.filter((x) => x.side === 'b').map((x) => x.id);
    source = 'pick';
  } else if (m.teamMode === 'auto' && !t.manual) {
    const fresh = t.auto && t.sig === rosterSig(R) && R.confirmed.length >= R.cap;
    if (!fresh) return { a: [], b: [], roles: {}, free: [], source: 'waiting', missing: Math.max(0, R.cap - R.confirmed.length) };
    a = (t.a || []).filter(inConf); b = (t.b || []).filter(inConf);
    source = 'auto';
  } else {
    a = (t.a || []).filter(inConf); b = (t.b || []).filter(inConf);
    source = m.teamMode === 'auto' ? 'manual' : 'saved';
  }
  const placed = new Set([...a, ...b]);
  const free = R.confirmed.filter((x) => !placed.has(x.id)).map((x) => x.id);
  const saved = t.roles || {};
  const roles = {};
  const fill = (ids) => {
    if (!ids.length) return;
    const best = ids.some((i) => !ROLES.includes(saved[i])) ? Engine.bestLineup(ids.map((i) => R.byId[i].part), m.format).roles : {};
    ids.forEach((i) => { roles[i] = ROLES.includes(saved[i]) ? saved[i] : best[i]; });
  };
  fill(a); fill(b);
  return { a, b, roles, free, source, missing: 0 };
}

/* partite a squadre automatiche piene ma senza squadre aggiornate: le fa l'app */
function autoTeamsTodo(C) {
  const out = [];
  for (const m of C.matches) {
    if (m.teamMode !== 'auto' || phaseOf(m) !== 'upcoming' || (m.teams && m.teams.manual)) continue;
    const R = buildRoster(m, C);
    if (R.confirmed.length < R.cap) continue;
    const sig = rosterSig(R);
    if (m.teams && m.teams.auto && m.teams.sig === sig) continue;
    const r = Engine.suggestTeams(R.confirmed.map((x) => x.part), { mode: 'exact', format: m.format, rng: seededRng(m.id + '|' + sig), aff: C.aff });
    if (r) out.push({ mid: m.id, a: r.a, b: r.b, roles: r.roles, sig });
  }
  return out;
}

/* pronostico dell'app dalla differenza di valore medio (3 punti di differenza = circa 73%) */
const winProb = (ma, mb) => 1 / (1 + Math.exp(-(ma - mb) / 3));

/* dati per confronto e campo: partita da giocare (dalle squadre attuali) o giocata (dalle definitive) */
function lineupData(m, C, R) {
  if (m.status === 'played') {
    const fin = m.final || {};
    const A = fin.a || [], B = fin.b || [], roles = fin.roles || {};
    const info = (id) => {
      const p = C.playersById[id];
      const part = m.guests && m.guests[id] ? guestPart(id, m.guests[id]) : playerPart(id, C);
      return { id, p, guest: !p, name: nameFor(id, m, C), part, inj: p && p.injury };
    };
    return { A, B, roles, info, final: true };
  }
  const T = teamsOf(m, R);
  return { A: T.a, B: T.b, roles: T.roles, info: (id) => R.byId[id], T, final: false };
}

/* ---------- scheda "Squadre": il confronto come nell'app di calcetto ---------- */
function TeamsVersus({ m, D }) {
  const C = useContext(Ctx);
  const { A, B, roles, info } = D;
  if (!A.length && !B.length) return null;
  const pa = A.map((i) => info(i).part), pb = B.map((i) => info(i).part);
  const ev = Engine.evaluate(pa, pb, roles, C.aff);
  const pA = A.length && B.length ? Math.round(winProb(ev.a.mean, ev.b.mean) * 100) : null;
  const showAff = ev.a.aff >= 0.05 || ev.b.aff >= 0.05;
  const rows = [
    ...OUT_AREAS.map((k) => ({ l: Engine.AREA_BY[k].name, a: ev.a.areas[k], b: ev.b.areas[k] })),
    { l: 'In porta', a: ev.a.gkVal || 0, b: ev.b.gkVal || 0 },
  ];
  const share = (r) => (r.a + r.b > 0 ? (r.a / (r.a + r.b)) * 100 : 50);
  const sortIds = (ids) => ids.slice().sort((x, y) => numOr(ROLE_ORDER[roles[x]], 9) - numOr(ROLE_ORDER[roles[y]], 9));
  const Player = (id) => {
    const x = info(id), r = roles[id];
    const v = r ? Engine.valueIn(x.part, r) : natOf(x.part);
    const mal = r && r !== 'POR' ? Engine.roleMalus(x.part, r) : 0;

const PITCH_ROWS = { POR: 0, DIF: 1, CEN: 2, ATT: 3 };
/* righe dal portiere all'attacco (campo 100×160): la prima squadra in basso, la seconda in alto */
const PITCH_Y = { a: [146, 127, 108, 90], b: [13, 32, 51, 69] };
function pitchPlaces(ids, roles, side) {
  const ys = PITCH_Y[side];
  const byRow = [[], [], [], []];
  ids.forEach((id) => { const r = PITCH_ROWS[roles[id]]; byRow[r == null ? 2 : r].push(id); });
  const out = [];
  byRow.forEach((row, ri) => {
    const n = row.length, gap = Math.min(23, 86 / Math.max(1, n));
    row.forEach((id, k) => out.push({ id, x: 50 + (k - (n - 1) / 2) * gap, y: ys[ri] }));
  });
  return out;
}

const pollDays = (m) => ((m.poll && m.poll.days) || []).slice().sort();
const pollVotes = (m) => (m.poll && m.poll.votes) || {};
const pollNeed = (m) => numOr(m.poll && m.poll.need, (FORMATS[m.format] || FORMATS[5]).cap);
const pollVoters = (m, day) => { const v = pollVotes(m); return Object.keys(v).filter((u) => v[u] && v[u][day]).sort((x, y) => v[x][day] - v[y][day]); };
const todayYmd = () => toYmd(new Date());
const pollOpenDays = (m) => pollDays(m).filter((d) => d >= todayYmd());
const myPollDays = (m, uid) => Object.keys((pollVotes(m)[uid]) || {});
const ymdLabel = (s, long) => {
  const d = new Date(s + 'T12:00:00');
  if (long === 'mid') return `${cap1(DOW_FULL[d.getDay()])} ${d.getDate()} ${MON[d.getMonth()]}`;
  return long ? `${cap1(DOW_FULL[d.getDay()])} ${d.getDate()} ${MON_FULL[d.getMonth()]}` : `${cap1(DOW[d.getDay()])} ${d.getDate()} ${MON[d.getMonth()]}`;
};
/* i sondaggi restano in vista fino al giorno dopo l'ultimo giorno proposto */
const pollVisible = (m) => { const y = new Date(); y.setDate(y.getDate() - 1); return m.status === 'poll' && pollDays(m).some((d) => d >= toYmd(y)); };
const pollLeader = (m) => {
  let best = null;
  pollOpenDays(m).forEach((d) => { const n = pollVoters(m, d).length; if (!best || n > best.n) best = { d, n }; });

};

/* quando è stato dato un voto: oggi, ieri o il giorno, con l'ora */
function fmtVoteTime(ts) {
  if (!ts) return '';
  const d = new Date(ts), a = new Date(ts), b = new Date();
  a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0);
  const k = Math.round((b - a) / 86400000);
  const day = k === 0 ? 'oggi' : k === 1 ? 'ieri' : (DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]).toLowerCase();
  return day + ' alle ' + fmtClock(ts);
}

function PollCloseSheet({ mid, onClose }) {
  const C = useContext(Ctx);
  const m = C.matchesById[mid];
  const lead = m && pollLeader(m);
  const [day, setDay] = useState(lead ? lead.d : null);
  const [busy, setBusy] = useState(false);
  if (!m || m.status !== 'poll') return null;
  const need = pollNeed(m);
  const go = async () => {
    if (!day || busy) return;
    setBusy(true);
    const r = await C.act.pollClose(mid, day);
    setBusy(false);
    if (r.ok) { onClose(); C.flash('Si gioca ' + ymdLabel(day, true).toLowerCase()); }
  };
  return html`<${Sheet} title="Chiudi il sondaggio" onClose=${onClose}>
    <div class="small muted">La partita nasce sul giorno che scegli, con chi l'ha votato. Gli altri possono iscriversi dopo.</div>
    <div class="card pad0 divided">${pollOpenDays(m).map((d) => { const n = pollVoters(m, d).length; return html`<label key=${d} class="row tap" style="padding:12px 14px;cursor:pointer">
      <input type="radio" name="pc-day" checked=${day === d} onChange=${() => setDay(d)} style="width:18px;height:18px;accent-color:var(--accent)" />
      <span class="row-main"><span class="row-t">${ymdLabel(d, true)}</span><span class="row-s">${n >= need ? 'Squadre piene' : 'Mancano ' + plural(need - n, 'giocatore', 'giocatori')}</span></span>
      <span class="chip num">${n}/${need}</span>
    </label>`; })}</div>
    <button class="btn primary block" disabled=${!day || busy} onClick=${go}>${busy ? 'Chiudo…' : 'Si gioca questo giorno'}</button>
  <//>`;
}

/* ---------- squadre scelte dai partecipanti: la risposta è la squadra ---------- */
function PickRsvp({ m, R, onIn }) {
  const C = useContext(Ctx);
  const mine = m.rsvp && m.rsvp[C.uid];
  const meIn = mine && mine.s === 'in';
  const mySide = meIn ? mine.side || '' : '';
  const cnt = (side) => R.confirmed.filter((x) => x.side === side).length;
  const full = (side) => cnt(side) >= m.format && mySide !== side;
  const choose = (side) => {
    if (!C.canWrite || !C.me) { C.flash(C.me ? 'Hai accesso in sola lettura' : 'Crea prima il tuo profilo', 'err'); return; }
    if (mySide === side) return;
    if (meIn) C.act.setSide(m.id, C.uid, side);
    else onIn(side);
  };
  const btn = (side) => html`<button type="button" class=${'pick-side ' + side + (mySide === side ? ' on' : '')} disabled=${full(side)} aria-pressed=${mySide === side} onClick=${() => choose(side)}>
    <${Shirt} c=${teamColor(m, side)} s=${22} />
    <span class="grow" style="text-align:left"><b>${mySide === side ? 'Giochi con i ' : 'Gioco con i '}${teamName(m, side)}</b><span class="tiny muted" style="display:block">${full(side) ? 'Al completo' : cnt(side) + '/' + m.format}</span></span>
    ${mySide === side && html`<${Icon} n="check" s="18" />`}
  </button>`;
  return html`<div class="stack-8">
    ${btn('a')}${btn('b')}
    ${meIn && !mySide && html`<div class="note warn"><${Icon} n="info" s="16" /><span>Ci sei: ora scegli la tua squadra.</span></div>`}
  </div>`;
}

/* stato dell'amicizia con un'altra persona: 'friend', 'sent' (l'ho chiesta io), 'received', oppure null */
function friendsIndex(docs, uid) {
  const by = {};
  for (const f of docs || []) {
    const ab = String(f.id || '').split('~');
    if (ab.length !== 2 || !uid || !ab.includes(uid)) continue;
    const other = ab[0] === uid ? ab[1] : ab[0];
    by[other] = f.status === 'active' ? 'friend' : f.by === uid ? 'sent' : 'received';
  }
  return by;
}
/* gli amici prima degli altri, a parità di tutto il resto */
const friendsFirst = (C, cmp) => (a, b) => (C.isFriend(b.id) - C.isFriend(a.id)) || cmp(a, b);

  return html`<span class="chip friend" title="Amico"><${Icon} n="heart" s="12" fill /> Amico</span>`;
}

/* invitare amici a una partita: chi è nel gruppo lo trova tra le cose da fare */
function InviteSheet({ mid, onClose }) {
  const C = useContext(Ctx);
  const [busy, setBusy] = useState(null);
  const m = C.matchesById[mid];
  if (!m) return null;
  const canAdd = !!C.gid && (C.isGroupAdmin || C.isAdmin);
  const list = Object.keys(C.friendOf).filter((id) => C.friendOf[id] === 'friend' && C.playersById[id])
    .sort((a, b) => (C.isInGroup(b) - C.isInGroup(a)) || dispName(C.playersById[a]).localeCompare(dispName(C.playersById[b]), 'it'));
  const invite = async (id, add) => {
    setBusy(id);
    if (add) { const r = await C.act.rpc('add_member', { p_gid: C.gid, p_uid: id }); if (!r.ok) { setBusy(null); return; } }
    const ok = await C.act.inviteToMatch(mid, id);
    setBusy(null);
    if (ok) C.flash('Invito mandato a ' + dispName(C.playersById[id]));
  };
  return html`<${Sheet} title="Invita amici" onClose=${onClose}>
    <div class="small muted">Chi inviti trova la partita tra le cose da fare, appena apre l'app, e risponde da lì.</div>
    ${list.length ? html`<div class="card pad0 divided">${list.map((id) => {
      const p = C.playersById[id], r = m.rsvp && m.rsvp[id], inv = m.invites && m.invites[id];
      const member = C.isInGroup(id);
      let right;
      if (r && r.s === 'in') right = html`<span class="chip ok">Iscritto</span>`;
      else if (r && r.s) right = html`<span class="chip">${r.s === 'out' ? 'Non viene' : 'Forse'}</span>`;
      else if (inv) right = html`<span class="chip warn">Invitato</span>`;
      else if (member) right = html`<button class="btn sm primary" disabled=${busy === id} onClick=${() => invite(id, false)}>Invita</button>`;
      else if (canAdd) right = html`<button class="btn sm" disabled=${busy === id} onClick=${() => invite(id, true)}>Aggiungi e invita</button>`;
      else right = html`<span class="chip">Non è nel gruppo</span>`;
      return html`<div key=${id} class="row" style="padding:10px 14px">
        <${Avatar} p=${p} size=${36} />
        <span class="row-main"><span class="row-t"><span class="ell">${dispName(p)}</span><${InjuryMark} inj=${p.injury} /></span><span class="row-s ell" style="display:block">${member ? fullName(p) : 'Non è in ' + (C.group ? C.group.name : 'questo gruppo')}</span></span>
        ${right}
      </div>`;
    })}</div>` : html`<div class="card empty small">Non hai ancora amici sull'app. Aggiungili dalla loro scheda giocatore.</div>`}
    ${!canAdd && list.some((id) => !C.isInGroup(id)) && html`<div class="tiny faint">Chi non è nel gruppo lo può aggiungere un amministratore del gruppo; poi potrai invitarlo.</div>`}
  <//>`;
}

  /* 'intro' mentre entra, 'done' a fine animazione, 'skip' se la si tocca prima */
  const [phase, setPhase] = useState(fx.enter ? 'intro' : 'done');
  useEffect(() => {
    const k = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', k);
    const prev = document.body.style.overflow;

    const t = fx.enter ? setTimeout(() => setPhase((ph) => (ph === 'intro' ? 'done' : ph)), 1750) : 0;

  }, []);
  if (!p || !r) return null;

  const gk = p.role === 'POR';
  const photo = photoOf(p);
  const age = ageOf(p);
  const sub = [C.gid && !all && C.group ? C.group.name : 'Stats generali', p.loc && p.loc.name, age && age + ' anni'].filter(Boolean).join(' · ');
  const nick = (dispName(p) || '').toUpperCase();
  const tag = fx.up ? 'Punteggio salito: ' + fx.up.from + ' → ' + fx.up.to : fx.mvp ? 'MVP dell\'ultima partita' : '';
  const tap = (e) => { e.stopPropagation(); if (phase === 'intro') { setPhase('skip'); return; } setFlip(!flip); };
  const mine = pid === C.uid;
  const uid = String(pid).replace(/[^a-zA-Z0-9]/g, '');
  return html`<div class=${'fifa-ov' + (fx.enter ? ' enter' : '')} role="dialog" aria-modal="true" aria-label=${'Card di ' + dispName(p)} onClick=${onClose}>
    ${fx.special && html`<div class=${'fifa-rays ' + tier + (phase === 'skip' ? ' skip' : '')} aria-hidden="true"><i></i></div>`}
    ${fx.enter && phase === 'intro' && html`<div class=${'fifa-flash ' + tier} aria-hidden="true"></div>`}
    <button class="fifa-x" aria-label="Chiudi" onClick=${onClose}><${Icon} n="x" /></button>
    <div class=${'fifa-flip' + (flip ? ' on' : '') + (fx.enter ? ' enter' : '') + (phase === 'skip' ? ' skip' : '')} onClick=${tap} role="button" tabindex="0" aria-label="Gira la card"
      onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(e); } }}>
      <div class=${'fifa ' + tier + ' front'}>
        <${CardFrame} tier=${tier} uid=${'f' + uid} />
        ${fx.mvp && html`<span class="fifa-mvp rv" style="--d:1.3s"><${Icon} n="trophy" s="13" /> MVP</span>`}
        <div class="fifa-top rv" style="--d:0.98s">

          <div class="fifa-ph">${photo ? html`<img src=${photo} alt="" />` : html`<span class="fifa-ic">${p.icon || initialsOf(p)}</span>`}</div>
        </div>

        <div class="fifa-full rv" style="--d:1.14s">${fullName(p)}</div>
        <div class="fifa-stats rv" style="--d:1.22s">
          ${AREAS.map((a) => { const counts = gk ? a.k === 'por' : a.k !== 'por'; return html`<div key=${a.k} class=${'fs' + (counts ? '' : ' dim')}><b class="num">${r0(r.areas[a.k])}</b><span>${a.code}</span></div>`; })}
        </div>

      </div>
      <div class=${'fifa ' + tier + ' back'}>
        <${CardFrame} tier=${tier} uid=${'b' + uid} noShine />
        ${phase !== 'intro' && html`<div class="fifa-bh"><b class="num">${r0(r.ovr)}</b><span>${nick}</span></div>
        <div class="fifa-voci">
          ${AREAS.map((a) => html`<div key=${a.k} class=${'fv' + ((gk ? a.k === 'por' : a.k !== 'por') ? '' : ' dim')}>
            <div class="fv-h"><span>${a.name}</span><b class="num">${r0(r.areas[a.k])}</b></div>
            ${a.voci.map((x) => html`<div key=${x.k} class="fv-r"><span>${x.name}</span><b class="num">${r0(r.voci[x.k])}</b></div>`)}

        </div>

      </div>
    </div>

    ${mine && html`<button class="fifa-share" onClick=${(e) => { e.stopPropagation(); openCardShare(C, p, r, all, tier); }}><${Icon} n="share" s="16" /> Condividi la tua card</button>`}
    <div class="fifa-hint">${phase === 'intro' ? 'Tocca la card per saltare l\'animazione' : 'Tocca la card per girarla · tocca fuori per chiudere'}</div>
  </div>`;
}


/* ============================================================
   APP: meteo previsto per i giorni delle partite (Open-Meteo, gratuito, fino a 16 giorni)
   Posizione: il campo scelto, altrimenti il comune del gruppo. Mai la posizione delle persone.
   ============================================================ */
const WX_TTL = 3 * 3600000;
const wxMem = {};
const wxKey = (loc) => loc.lat.toFixed(2) + ',' + loc.lng.toFixed(2);
function loadForecast(loc) {
  const k = wxKey(loc);
  const hit = wxMem[k];
  if (hit && Date.now() - hit.t < WX_TTL) return hit.p;
  try {
    const raw = window.localStorage.getItem('sc-wx-' + k);
    if (raw) { const o = JSON.parse(raw); if (o && Date.now() - o.t < WX_TTL && o.d) { wxMem[k] = { t: o.t, p: Promise.resolve(o.d) }; return wxMem[k].p; } }
  } catch (e) { /* archivio non disponibile */ }
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat.toFixed(3) + '&longitude=' + loc.lng.toFixed(3)
    + '&hourly=weather_code,temperature_2m,precipitation_probability'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
    + '&timezone=Europe%2FRome&forecast_days=16';
  const p = fetch(url).then((r) => { if (!r.ok) throw new Error('meteo'); return r.json(); }).then((d) => {
    try { window.localStorage.setItem('sc-wx-' + k, JSON.stringify({ t: Date.now(), d })); } catch (e) { /* pazienza */ }
    return d;
  });
  wxMem[k] = { t: Date.now(), p };
  p.catch(() => { delete wxMem[k]; });
  return p;
}
/* il meteo di un giorno: all'ora della partita se c'è, altrimenti quello della giornata */
function wxFor(d, ymd, time) {
  if (!d || !ymd) return null;
  if (time && d.hourly && Array.isArray(d.hourly.time)) {
    const hh = String(time).slice(0, 2);
    const i = d.hourly.time.indexOf(ymd + 'T' + hh + ':00');
    if (i >= 0 && d.hourly.weather_code[i] != null) {
      return { code: d.hourly.weather_code[i], temp: d.hourly.temperature_2m[i], pop: d.hourly.precipitation_probability ? d.hourly.precipitation_probability[i] : null, at: hh + ':00' };
    }
  }
  if (d.daily && Array.isArray(d.daily.time)) {
    const i = d.daily.time.indexOf(ymd);
    if (i >= 0 && d.daily.weather_code[i] != null) {
      return { code: d.daily.weather_code[i], temp: d.daily.temperature_2m_max[i], tmin: d.daily.temperature_2m_min[i], pop: d.daily.precipitation_probability_max ? d.daily.precipitation_probability_max[i] : null, at: null };
    }
  }
  return null;
}
/* codici WMO: icona e parola */
function wxInfo(code) {
  const c = Number(code);
  if (c === 0) return { i: '☀️', l: 'Sereno' };
  if (c === 1) return { i: '🌤️', l: 'Quasi sereno' };
  if (c === 2) return { i: '⛅', l: 'Poco nuvoloso' };
  if (c === 3) return { i: '☁️', l: 'Nuvoloso' };
  if (c === 45 || c === 48) return { i: '🌫️', l: 'Nebbia' };
  if (c >= 51 && c <= 57) return { i: '🌦️', l: 'Pioviggine' };
  if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return { i: '🌧️', l: c === 65 || c === 82 ? 'Pioggia forte' : 'Pioggia' };
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return { i: '❄️', l: 'Neve' };
  if (c >= 95) return { i: '⛈️', l: 'Temporale' };
  return { i: '🌡️', l: 'Meteo' };
}
/* dove si gioca: il campo (se ha le coordinate), altrimenti il comune del gruppo */
function matchPlace(m, C) {
  const f = m && C.fieldOf(m);
  if (f && isFinite(f.lat) && isFinite(f.lng)) return { lat: f.lat, lng: f.lng, name: f.name };
  const g = groupLoc(C.group);
  return g ? { lat: g.lat, lng: g.lng, name: g.name } : null;
}
function useMatchPlace(m) {
  const C = useContext(Ctx);
  const f = m && C.fieldOf(m);
  const hasField = !!(f && isFinite(f.lat) && isFinite(f.lng));
  const g = C.group;
  useComuniIf(!!(m && !hasField && g && !(g.loc && isFinite(g.loc.lat))));
  return m ? matchPlace(m, C) : null;
}
function useForecast(loc) {
  const [d, setD] = useState(null);
  const k = loc ? wxKey(loc) : '';
  useEffect(() => {
    let dead = false;
    if (!loc) { setD(null); return undefined; }
    loadForecast(loc).then((x) => { if (!dead) setD(x); }, () => { if (!dead) setD(null); });
    return () => { dead = true; };
  }, [k]);
  return d;
}
function WxBadge({ w, long }) {
  if (!w) return null;
  const info = wxInfo(w.code);
  const t = Math.round(w.temp);
  const title = info.l + ', ' + t + '°' + (w.pop != null ? ', pioggia ' + w.pop + '%' : '') + (w.at ? ' alle ' + w.at : ' (giornata)');
  return html`<span class="wx" title=${title} aria-label=${'Meteo previsto: ' + title}>
    <span class="wx-i" aria-hidden="true">${info.i}</span><span class="num">${t}°</span>${w.pop != null && w.pop >= 20 && html`<span class="wx-p num">${w.pop}%</span>`}${long && html`<span class="wx-l">${info.l.toLowerCase()}</span>`}
  </span>`;
}
function WxCredit() {
  return html`<div class="tiny faint">Meteo previsto da <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>, fino a 16 giorni prima.</div>`;
}

/* ============================================================
   APP: traguardi (stemmi) del giocatore. Chiunque vede i traguardi di chiunque dal suo profilo.
   - Vista "Nel gruppo": dalle partite del gruppo aperto, calcolati qui.
   - Vista "Generali" (e sempre per chi non è nel tuo gruppo): da tutte le sue partite, in tutti i suoi
     gruppi. Li prepara il database (funzione player_career) con i soli dati di quella persona,
     senza dire chi sono i compagni né quali sono i gruppi.
   ============================================================ */

/* le partite giocate da un giocatore nel gruppo aperto, dalla più vecchia: risultato, gol, assist, porta, MVP */
function playerTimeline(uid, C) {
  return C.matches
    .filter((m) => m.status === 'played' && m.final && (m.final.ids || []).includes(uid))
    .sort((x, y) => mStart(x) - mStart(y))
    .map((m) => {
      const fin = m.final;
      const side = (fin.a || []).includes(uid) ? 'a' : (fin.b || []).includes(uid) ? 'b' : null;
      const res = Engine.hasResult(m) ? m.result : null;
      const e = (res && res.ev && res.ev[uid]) || {};
      let out = null, conceded = null;
      if (res && side) {
        const my = side === 'a' ? res.a : res.b, ot = side === 'a' ? res.b : res.a;
        out = my > ot ? 'w' : my === ot ? 'd' : 'l';
        conceded = ot;
      }
      const mv = C.stats.mvps[m.id];
      return {
        date: m.date, out, conceded,
        g: numOr(e.g, 0), a: numOr(e.a, 0), og: numOr(e.og, 0),
        gk: !!(fin.roles && fin.roles[uid] === 'POR'),
        mvp: !!(mv && mv.closed && mv.winners.includes(uid)),
      };
    });
}

/* le stesse partite in tutta la carriera, come le prepara il database (vedi aggiornamento-traguardi.sql) */
const nn = (v) => (typeof v === 'number' && isFinite(v) ? v : Number(v) || 0);
function careerTimeline(d) {
  const now = Date.now();
  return ((d && d.matches) || []).map((x) => {
    const closed = now >= nn(x.pa) + CFG.MVP_HOURS * 3600000 || (nn(x.ne) > 1 && nn(x.nv) >= nn(x.ne));
    return {
      date: x.d, time: x.t, out: x.out || null, conceded: x.conc == null ? null : nn(x.conc),
      g: nn(x.g), a: nn(x.a), og: nn(x.og), gk: !!x.gk,
      mvp: closed && nn(x.mx) > 0 && nn(x.my) === nn(x.mx),
    };
  }).sort((p, q) => Engine.matchTime({ date: p.date, time: p.time }) - Engine.matchTime({ date: q.date, time: q.time }));
}
/* la stessa cosa calcolata qui dai documenti (per la demo e per le prove): deve dare quello che dà il database */
function careerFromDocs(uid, matches, mvDocs) {
  const out = [], pairs = {}, org = [];
  const has = (o, k) => !!o && typeof o === 'object' && Object.prototype.hasOwnProperty.call(o, k);
  for (const mm of matches || []) {
    const m = mm.data || {};
    if (m.status !== 'played') continue;
    if (m.by === uid) org.push({ d: m.date || '', t: m.time || '21:00' });
    const fin = m.final;
    if (!fin || !Array.isArray(fin.ids) || !fin.ids.includes(uid)) continue;
    const side = Array.isArray(fin.a) && fin.a.includes(uid) ? 'a' : Array.isArray(fin.b) && fin.b.includes(uid) ? 'b' : null;
    const res = m.result || {};
    const hasRes = typeof res.a === 'number' && typeof res.b === 'number';
    let o = null, conc = null;
    if (hasRes && side) { const my = side === 'a' ? res.a : res.b, ot = side === 'a' ? res.b : res.a; o = my > ot ? 'w' : my === ot ? 'd' : 'l'; conc = ot; }
    const e = (res.ev && res.ev[uid]) || {};
    const ids = new Set(fin.ids);
    const counts = {};
    let nv = 0;
    for (const v of mvDocs || []) {
      if (v.gid !== mm.gid || !ids.has(v.id)) continue;
      const t = v.data && v.data.v && v.data.v[mm.id];
      if (typeof t !== 'string' || !ids.has(t) || t === v.id) continue;
      counts[t] = (counts[t] || 0) + 1; nv++;
    }
    out.push({
      d: m.date, t: m.time, out: o, conc, g: numOr(e.g, 0), a: numOr(e.a, 0), og: numOr(e.og, 0),
      gk: !!(fin.roles && fin.roles[uid] === 'POR'), my: counts[uid] || 0, mx: Math.max(0, ...Object.values(counts)), nv, ne: fin.ids.length,
      pa: typeof m.playedAt === 'number' ? m.playedAt : 0,
    });
    if (hasRes && side) {
      const w = side === 'a' ? (res.a > res.b ? 1 : res.a === res.b ? 0.5 : 0) : (res.b > res.a ? 1 : res.a === res.b ? 0.5 : 0);
      for (const t of fin[side] || []) {
        if (t === uid || has(fin.gn, t) || has(m.guests, t)) continue;
        const k = mm.gid + '|' + t;
        pairs[k] = (pairs[k] || 0) + w;
      }
    }
  }
  org.sort((x, y) => (x.d + x.t < y.d + y.t ? -1 : x.d + x.t > y.d + y.t ? 1 : 0));
  return { matches: out, aff: Math.max(0, ...Object.values(pairs)), org: org.map((x) => x.d) };
}

/* un traguardo: { done, at (giorno), cur, max } */
const firstWhere = (tl, pred) => { const x = tl.find(pred); return { done: !!x, at: x ? x.date : null }; };
const reach = (tl, val, n) => {
  let s = 0;
  for (const x of tl) { s += val(x); if (s >= n) return { done: true, at: x.date, cur: n, max: n }; }
  return { done: false, at: null, cur: s, max: n };
};
const streak = (tl, pred, n) => {
  let run = 0, best = 0;
  for (const x of tl) {
    if (!x.out) continue; /* senza risultato la partita non conta */
    run = pred(x) ? run + 1 : 0;
    best = Math.max(best, run);
    if (run >= n) return { done: true, at: x.date, cur: n, max: n };
  }
  return { done: false, at: null, cur: best, max: n };
};

/* la carriera dal database, tenuta un minuto per non richiederla a ogni pagina */
const careerCache = new Map();
function loadCareer(C, pid) {
  const hit = careerCache.get(pid);
  if (hit && hit.p) return hit.p;
  if (hit && hit.r && Date.now() - hit.t < 60000) return Promise.resolve(hit.r);
  const p = C.act.rpc('player_career', { p_uid: pid }, { quiet: true }).then((r) => {
    const v = r.ok ? { ok: true, d: r.data || { matches: [] } } : { ok: false, missing: !!(r.err && (r.err.code === 'unavailable' || r.err.code === 'PGRST202')) };
    careerCache.set(pid, { t: Date.now(), r: v });
    return v;
  });
  careerCache.set(pid, { t: Date.now(), p });
  return p;
}
function useCareer(pid) {
  const C = useContext(Ctx);
  const [st, setSt] = useState(() => { const hit = pid && careerCache.get(pid); return hit && hit.r ? hit.r : null; });
  useEffect(() => {
    if (!pid) return undefined;
    let dead = false;
    loadCareer(C, pid).then((v) => { if (!dead) setSt(v); });
    return () => { dead = true; };
  }, [pid, C.matches]);
  return pid ? st : null;
}
/* i traguardi da mostrare: del gruppo o di tutte le partite (se il database non è aggiornato, quelli del gruppo per i compagni) */
function useBadges(pid, scope) {
  const C = useContext(Ctx);
  const all = scope === 'all' || !C.gid;
  const st = useCareer(all ? pid : null);
  const mine = pid === C.uid;
  const groupView = (note) => ({ list: badgesOf(pid, C), ready: true, scope: 'group', where: C.group ? 'Nelle partite di ' + C.group.name : '', note });
  if (!all) return groupView();
  if (!st) return { list: null, ready: false, scope: 'all' };
  if (!st.ok) {
    if (st.missing && C.gid && C.isInGroup(pid)) return groupView('Per ora solo quelli di questo gruppo: quelli di tutte le partite arrivano con il prossimo aggiornamento del database.');
    return { list: null, ready: true, scope: 'all', err: st.missing ? 'missing' : 'err' };
  }
  return { list: careerBadges(pid, st.d, C), ready: true, scope: 'all', where: mine ? 'In tutte le tue partite, in tutti i tuoi gruppi' : 'In tutte le sue partite, in tutti i suoi gruppi' };
}
