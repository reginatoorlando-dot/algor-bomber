/* pentagono delle 5 aree, con l'autovalutazione tratteggiata */
function Radar5({ vals, self }) {
  const cx = 150, cy = 122, R = 84;
  const keys = AREAS.map((a) => a.k);
  const ang = (i) => ((-90 + i * 72) * Math.PI) / 180;
  const pt = (i, v) => [cx + (R * v * Math.cos(ang(i))) / 99, cy + (R * v * Math.sin(ang(i))) / 99];
  const poly = (o) => keys.map((k, i) => pt(i, Engine.num(o[k], Engine.VDEF)).map((n) => n.toFixed(1)).join(',')).join(' ');
  const ring = (v) => keys.map((k, i) => pt(i, v).map((n) => n.toFixed(1)).join(',')).join(' ');
  const lab = (i) => {
    const [x, y] = pt(i, 99);
    const dx = x - cx;
    return { x: x + (dx > 8 ? 10 : dx < -8 ? -10 : 0), y: y + (y < cy - 40 ? -22 : 8), anchor: dx > 8 ? 'start' : dx < -8 ? 'end' : 'middle' };
  };
  return html`<svg class="radar" viewBox="0 0 300 236" role="img" aria-label=${AREAS.map((a) => a.name + ' ' + r0(vals[a.k])).join(', ')}>
    <polygon class="rd-grid" points=${ring(99)} />
    <polygon class="rd-grid" points=${ring(66)} />
    <polygon class="rd-grid" points=${ring(33)} />
    ${keys.map((k, i) => { const [x, y] = pt(i, 99); return html`<line key=${k} class="rd-axis" x1=${cx} y1=${cy} x2=${x} y2=${y} />`; })}
    ${self && html`<polygon class="rd-self" points=${poly(self)} />`}
    <polygon class="rd-now" points=${poly(vals)} />
    ${keys.map((k, i) => { const [x, y] = pt(i, vals[k]); return html`<circle key=${k} class="rd-dot" cx=${x} cy=${y} r="3.5" />`; })}
    ${AREAS.map((a, i) => { const l = lab(i); return html`<g key=${a.k}>
      <text class="rd-t" x=${l.x} y=${l.y} text-anchor=${l.anchor}>${a.code}</text>
      <text class="rd-v" x=${l.x} y=${l.y + 16} text-anchor=${l.anchor}>${r0(vals[a.k])}</text>
    </g>`; })}
  </svg>`;
}

/* foto profilo: ritaglio quadrato 160px, JPEG leggero */
async function fileToAvatar(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const S = 320, c = document.createElement('canvas');
    c.width = c.height = S;
    const m = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
    return c.toDataURL('image/jpeg', 0.8);
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- partecipanti: valori per il bilanciamento ---------- */
function playerPart(pid, C) {
  const p = C.playersById[pid], rt = C.rated[pid];
  return Engine.partOf(pid, rt ? rt.areas : null, p ? p.role : 'CEN', p ? p.role2 : '', p && p.injury);
}
function guestPart(gid, g) {
  let v = (g && g.v) || null;
  if (!v && g && Engine.okv(g.a) && Engine.okv(g.m) && Engine.okv(g.d)) {
    /* ospite del vecchio formato (1-10) */
    v = { att: g.a * 10, cen: g.m * 10, dif: g.d * 10, gen: ((g.a + g.m + g.d) / 3) * 10, por: 40 };
  }
  return Engine.partOf(gid, v, (g && g.role) || 'CEN', '', null);
}
function partFor(id, m, C) {
  if (m && m.guests && m.guests[id]) return guestPart(id, m.guests[id]);
  return playerPart(id, C);
}
function nameFor(id, m, C) {
  const p = C.playersById[id];
  if (p) return dispName(p);
  const g = m && m.guests && m.guests[id];
  if (g && g.name) return g.name;
  const gn = m && m.final && m.final.gn && m.final.gn[id];
  return gn || 'Ex giocatore';
}

/* ---------- elenco della partita: confermati, lista d'attesa, forse ---------- */
function buildRoster(m, C) {
  const cap = (FORMATS[m.format] || FORMATS[5]).cap;
  const members = [];
  for (const pid of Object.keys(m.rsvp || {})) {
    const r = m.rsvp[pid];
    if (!r || !r.s) continue;
    const p = C.playersById[pid], rt = C.rated[pid];
    const part = playerPart(pid, C);
    members.push({
      id: pid, guest: false, s: r.s, t: numOr(r.t, 0), role: part.pref, role2: part.sec, p,
      name: p ? dispName(p) : 'Ex giocatore', full: fullName(p), ovr: rt ? rt.ovr : Engine.VDEF, inj: p && p.injury, part,
    });
  }
  for (const gid of Object.keys(m.guests || {})) {
    const g = m.guests[gid];
    if (!g || g.gone) continue;
    const part = guestPart(gid, g);
    members.push({
      id: gid, guest: true, s: 'in', t: numOr(g.t, 0), role: part.pref, role2: '', g, name: g.name || 'Ospite', full: 'Ospite',
      ovr: part.pref === 'POR' ? part.porta : part.outfield, inj: null, part,
    });
  }
  const byT = (x, y) => x.t - y.t;
  const ins = members.filter((x) => x.s === 'in').sort(byT);
  const confirmed = ins.slice(0, cap), waitlist = ins.slice(cap);
  const byId = {}, confirmedById = {};
  members.forEach((x) => { byId[x.id] = x; });
  confirmed.forEach((x) => { confirmedById[x.id] = x; });
  const replied = new Set(Object.keys(m.rsvp || {}).filter((k) => m.rsvp[k] && m.rsvp[k].s));
  return {
    cap, confirmed, waitlist, byId, confirmedById,
    maybe: members.filter((x) => x.s === 'maybe').sort(byT),
    out: members.filter((x) => x.s === 'out'),
    gk: confirmed.filter((x) => x.role === 'POR').length,
    noReply: C.players.filter((p) => !replied.has(p.id)).length,
  };
}

/* le squadre definitive al momento della chiusura, con ruoli e previsione dell'app */
function snapshotFinal(m, R) {
  const inIds = new Set(R.confirmed.map((x) => x.id));
  const A = ((m.teams && m.teams.a) || []).filter((i) => inIds.has(i));
  const B = ((m.teams && m.teams.b) || []).filter((i) => inIds.has(i));
  const roles = Object.assign({}, (m.teams && m.teams.roles) || {});
  const pa = A.map((i) => R.byId[i].part), pb = B.map((i) => R.byId[i].part);
  if (A.some((i) => !ROLES.includes(roles[i]))) Object.assign(roles, Engine.bestLineup(pa, m.format).roles);
  if (B.some((i) => !ROLES.includes(roles[i]))) Object.assign(roles, Engine.bestLineup(pb, m.format).roles);
  const keep = {};
  [...A, ...B].forEach((i) => { keep[i] = roles[i]; });
  const gn = {};
  R.confirmed.filter((x) => x.guest).forEach((x) => { gn[x.id] = x.name; });
  const ev = A.length && B.length ? Engine.evaluate(pa, pb, keep) : null;
  return {
    a: A, b: B, ids: R.confirmed.filter((x) => !x.guest).map((x) => x.id), roles: keep, gn,
    pred: ev ? { balance: ev.balance, va: ev.a.mean, vb: ev.b.mean } : null,
  };
}

/* ---------- scritture sul database (una alla volta per documento) ---------- */
function errText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Spazio dati esaurito: non si possono aggiungere altri dati.';
  if (c === 'resource_exhausted') return 'Troppe operazioni ravvicinate, riprova tra un attimo.';
  if (c === 'unavailable') return 'Connessione assente, riprova.';
  return 'Salvataggio non riuscito. Se succede sempre, potresti avere accesso in sola lettura.';
}

function makeActions(be, notify, dataRef, onDenied, gidRef) {
  const queues = new Map();
  const overlays = {};
  /* opts.probe: il primo salvataggio dell'iscrizione; se il database lo rifiuta (invalid_argument)
     chi guarda ha solo il permesso di lettura e l'app passa alla sola lettura per questa visita */
  const run = (path, fn, opts) => {
    const prev = queues.get(path) || Promise.resolve();
    const p = prev.then(fn);
    queues.set(path, p.catch(() => {}));
    return p.then(() => true, (e) => {
      if (opts && opts.probe && e && e.code === 'invalid_argument' && onDenied) {
        onDenied();
        notify('Non puoi iscriverti: hai accesso in sola lettura.', 'err');
      } else notify((e && e.message) || errText(e), 'err');
      return false;
    });
  };
  const doc = (p) => be.db.doc(p);
  /* documenti del gruppo attuale: g/{gruppo}/... */
  const G = () => 'g/' + gidRef.current + '/';
  const ov = () => (overlays[gidRef.current] = overlays[gidRef.current] || { r: {}, mvp: {} });
  const upd = (mid, patch) => { const path = G() + 'matches/' + mid; return run(path, () => doc(path).update(patch)); };
  const updP = (pid, patch) => run('players/' + pid, () => doc('players/' + pid).update(patch));
  const mine = (col) => (dataRef.current[col] || []).find((x) => x.id === be.uid) || {};
  const rpc = async (fn, args) => {
    if (!be.db.rpc) { notify('Non disponibile in questa versione.', 'err'); return { ok: false }; }
    try { return { ok: true, data: await be.db.rpc(fn, args) }; }
    catch (e) { notify((e && e.message) || errText(e), 'err'); return { ok: false }; }
  };
  return {
    saveProfile: (p) => run('players/' + be.uid, () => doc('players/' + be.uid).set(p), { probe: true }),
    updateProfile: (patch) => updP(be.uid, Object.assign({}, patch, { updated: Date.now() })),
    saveSelf: (vals) => updP(be.uid, { self: vals, selfAt: Date.now(), selfUnlock: false, updated: Date.now() }),
    setInjury: (inj) => updP(be.uid, { injury: inj, updated: Date.now() }),
    unlockSelf: (pid) => updP(pid, { selfUnlock: true }),
    saveField: (id, f) => run('fields/' + id, () => doc('fields/' + id).set(f)),
    createMatch: (m, id) => { const path = G() + 'matches/' + id; return run(path, () => doc(path).set(m)); },
    updateMatch: upd,
    deleteMatch: (mid) => { const path = G() + 'matches/' + mid; return run(path, () => doc(path).delete()); },
    setRsvp: (mid, pid, s) => upd(mid, { rsvp: { [pid]: { s, t: Date.now() } } }),
    addGuest: (mid, gsid, g) => upd(mid, { guests: { [gsid]: g } }),
    removeGuest: (mid, gsid) => upd(mid, { guests: { [gsid]: { gone: true } } }),
    saveTeams: (mid, a, b, roles) => upd(mid, { teams: { a, b, roles, t: Date.now(), by: be.uid } }),
    markPlayed: (mid, fin) => upd(mid, { status: 'played', playedAt: Date.now(), final: fin }),
    saveResult: (mid, result, finPatch) => upd(mid, finPatch ? { result, final: finPatch } : { result }),
    setStatus: (mid, status) => upd(mid, { status }),
    saveRating: (target, v) => { const path = G() + 'ratings/' + be.uid; return run(path, () => {
      const o = ov(); o.r[target] = { v, t: Date.now() };
      return doc(path).set({ r: Object.assign({}, mine('ratings').r || {}, o.r) });
    }); },
    saveMvp: (mid, target) => { const path = G() + 'mvp/' + be.uid; return run(path, () => {
      const o = ov(); o.mvp[mid] = target;
      return doc(path).set({ v: Object.assign({}, mine('mvp').v || {}, o.mvp) });
    }); },
    /* chat del gruppo */
    sendChat: (text) => {
      const id = be.uid + '~' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const path = G() + 'chat/' + id;
      return run(path, () => doc(path).set({ by: be.uid, text, t: Date.now() }));
    },
    deleteChat: (id) => { const path = G() + 'chat/' + id; return run(path, () => doc(path).delete()); },
    /* help: messaggi agli sviluppatori */
    sendHelp: (topic, text) => {
      const id = be.uid + '~' + Date.now().toString(36);
      return run('help/' + id, () => doc('help/' + id).set({ by: be.uid, topic, text, t: Date.now(), status: 'open', replies: [] }));
    },
    answerHelp: (id, replies, status) => run('help/' + id, () => doc('help/' + id).update({ replies, status })),
    /* gruppi ed eliminazioni (funzioni del database) */
    rpc,
  };
}

    try { setPhoto(await fileToAvatar(f)); } catch (err) { C.flash('Non riesco a leggere la foto', 'err'); }

    icon, photo, role, role2: role2 && role2 !== role ? role2 : '',
  });
  const doSave = async () => {
    setBusy(true);
    const now = Date.now();
    const ok = create
      ? await C.act.saveProfile(Object.assign(base(), { self: Engine.cleanVoci(vals), selfAt: now, selfUnlock: false, injury: null, created: now, updated: now }))
      : await C.act.updateProfile(base());

    if (ok) { C.flash(create ? (C.gid ? 'Benvenuto nel gruppo!' : 'Profilo creato! Ora entra in un gruppo') : 'Profilo aggiornato'); if (onSaved) onSaved(); }

/* ---------- autovalutazione da rifare (solo se l'amministratore l'ha sbloccata) ---------- */
function SelfRateScreen({ forced }) {
  const C = useContext(Ctx);
  const me = C.me;
  const isNew = me && !Engine.hasNewSelf(me);
  const [vals, setVals] = useState(() => Object.assign(defaultVoci(), Engine.cleanVoci(me && (Engine.hasNewSelf(me) ? me.self : Engine.legacyVoci(me.self)))));
  const [busy, setBusy] = useState(false);
  if (!me) return html`<${Page} title="Autovalutazione" onBack=${C.back}><div class="card empty">Crea prima il tuo profilo.</div><//>`;
  if (!me.selfUnlock && !isNew && !C.isAdmin) {
    return html`<${Page} title="Autovalutazione" onBack=${C.back}>
      <div class="note"><${Icon} n="lock" s="16" /><span>La tua autovalutazione è bloccata dal ${fmtTs(numOr(me.selfAt, Date.now()))}. Solo l'amministratore può sbloccarla.</span></div>
    <//>`;
  }
  const ovr = Engine.ovrOf(Engine.areasOf(vals), me.role);
  const doSave = async () => {
    setBusy(true);
    const ok = await C.act.saveSelf(Engine.cleanVoci(vals));
    setBusy(false);
    if (ok) { C.flash('Autovalutazione salvata'); if (!forced) C.back(); }
  };
  const ask = () => C.openSheet({ k: 'confirm', title: 'Confermi l\'autovalutazione?', text: `Con questi valori il tuo punteggio di partenza è ${r0(ovr)}. Dopo il salvataggio non potrai più modificarla.`, label: 'Sì, salva', onYes: doSave });
  return html`<${Page} title=${isNew ? 'Nuova autovalutazione' : 'Rifai l\'autovalutazione'} sub=${isNew ? 'Le stats sono cambiate: ora sono 16 voci da 1 a 99' : me.selfUnlock ? 'L\'amministratore l\'ha sbloccata per te' : 'Come amministratore puoi modificarla'} onBack=${forced ? null : C.back}>
    ${isNew && html`<div class="note ok"><${Icon} n="info" s="16" /><span>Ciao ${dispName(me)}! L'app ora usa 5 aree e 16 voci, da 1 a 99 come su FIFA. Ti chiediamo di rifare l'autovalutazione, una volta sola. Abbiamo già messo i tuoi vecchi valori di attacco, centrocampo e difesa come punto di partenza.</span></div>`}
    <${SelfLockNote} />
    <div class="tiny faint">${SCALE_HINT}</div>
    <${RatingEditor} idp="sr" vals=${vals} setVals=${setVals} role=${me.role} />
    <div class="sticky-act"><button class="btn primary block" disabled=${busy || !C.canWrite} onClick=${ask}>${busy ? 'Salvo…' : 'Salva autovalutazione · ' + r0(ovr)}</button></div>
  <//>`;
}

/* ---------- valutare un altro giocatore ---------- */
function RateScreen({ id }) {
  const C = useContext(Ctx);
  const p = C.playersById[id], r = C.rated[id];
  const mine = ((C.ratings.find((x) => x.id === C.uid) || {}).r || {})[id];
  const [vals, setVals] = useState(() => {
    const out = {};
    VOCI.forEach((x) => {
      const pv = mine && mine.v && mine.v[x.k];
      out[x.k] = Engine.okv(pv) ? pv : r0(r ? r.voci[x.k] : Engine.VDEF);
    });
    return out;
  });
  const [skip, setSkip] = useState(() => {
    const s = {};
    AREAS.forEach((a) => {
      if (mine && mine.v) s[a.k] = !a.voci.some((x) => Engine.okv(mine.v[x.k]));
      else s[a.k] = a.k === 'por' && !(p && (p.role === 'POR' || p.role2 === 'POR'));
    });
    return s;
  });
  const [busy, setBusy] = useState(false);
  if (!p || !r) return html`<${Page} title="Valutazione" onBack=${C.back}><div class="card empty">Giocatore non trovato.</div><//>`;
  if (id === C.uid) return html`<${Page} title="Valutazione" onBack=${C.back}><div class="card empty">Non puoi valutare te stesso qui: l'autovalutazione si fa una volta sola, all'iscrizione.</div><//>`;
  const out = {};
  AREAS.forEach((a) => { if (!skip[a.k]) a.voci.forEach((x) => { out[x.k] = vals[x.k]; }); });
  const n = Object.keys(out).length;
  const myAreas = Engine.areasOf(out);
  const counted = p.role === 'POR' ? ['por'] : OUT_AREAS;
  const myOvr = counted.every((k) => myAreas[k] != null) ? Engine.ovrOf(myAreas, p.role) : null;
  const save = async () => {
    if (!n || busy) return;
    setBusy(true);
    const ok = await C.act.saveRating(id, out);
    setBusy(false);
    if (ok) { C.flash('Valutazione di ' + dispName(p) + ' salvata'); C.back(); }
  };
  return html`<${Page} title=${'Valuta ' + dispName(p)} sub=${fullName(p)} onBack=${C.back}>
    <div class="card hs-12">
      <${Avatar} p=${p} size=${44} />
      <div class="grow"><div class="row-t"><span class="ell">${dispName(p)}</span><${InjuryMark} inj=${p.injury} /></div><div class="small muted">Punteggio attuale, media di ${plural(r.nPeers + (r.self ? 1 : 0), 'valutazione', 'valutazioni')}</div></div>
      <${RoleChips} role=${p.role} role2=${p.role2} />
      <${Ovr} v=${r.ovr} />
    </div>
    <div class="note"><${Icon} n="info" s="16" /><span>La tua valutazione è pubblica e la puoi cambiare quando vuoi: conta sempre l'ultima. Se un'area non la sai giudicare, saltala.</span></div>
    <div class="tiny faint">${SCALE_HINT}</div>
    <${RatingEditor} idp="rt" vals=${vals} setVals=${setVals} skip=${skip} setSkip=${setSkip} allowSkip role=${p.role} />
    <div class="sticky-act"><button class="btn primary block" disabled=${!n || busy || !C.canWrite} onClick=${save}>${busy ? 'Salvo…' : !n ? 'Valuta almeno un\'area' : (mine ? 'Aggiorna valutazione' : 'Salva valutazione') + (myOvr != null ? ' · ' + r0(myOvr) : '')}</button></div>
  <//>`;
}

/* ---------- infortunio ---------- */
function InjuryEditor() {
  const C = useContext(Ctx);
  const inj = C.me && C.me.injury;
  const [open, setOpen] = useState(false);
  const [level, setLevel] = useState((inj && inj.level) || 'lieve');
  const [note, setNote] = useState((inj && inj.note) || '');
  const [back, setBack] = useState((inj && inj.back) || '');
  const [busy, setBusy] = useState(false);
  const start = () => { setLevel((inj && inj.level) || 'lieve'); setNote((inj && inj.note) || ''); setBack((inj && inj.back) || ''); setOpen(true); };
  const save = async () => {
    setBusy(true);
    const ok = await C.act.setInjury({ level, note: note.trim().slice(0, 60), back: back || '', since: (inj && inj.since) || Date.now() });
    setBusy(false);
    if (ok) { setOpen(false); C.flash(level === 'grave' ? 'Infortunio grave segnato' : 'Infortunio lieve segnato'); }
  };
  const clear = async () => {
    setBusy(true);
    const ok = await C.act.setInjury(null);
    setBusy(false);
    if (ok) { setOpen(false); C.flash('Bentornato in campo!'); }
  };
  if (open) {
    return html`<div class="card stack">
      <span class="label">Quanto è grave?</span>
      <${Seg} value=${level} onChange=${setLevel} options=${[
        { v: 'lieve', l: html`<span class="hs" style="justify-content:center"><span class="inj lieve"><${Icon} n="bandage" s="16" /></span> Lieve</span>` },
        { v: 'grave', l: html`<span class="hs" style="justify-content:center"><span class="inj grave"><${Icon} n="cross" s="16" fill /></span> Grave</span>` },
      ]} />
      <div class="field"><label class="label" for="inj-note">Nota <span class="faint">(facoltativa)</span></label><input id="inj-note" class="input" maxlength="60" placeholder="Es. caviglia, stiramento" value=${note} onInput=${(e) => setNote(e.target.value)} /></div>
      <div class="field"><label class="label" for="inj-back">Rientro previsto <span class="faint">(facoltativo)</span></label><input id="inj-back" class="input" type="date" value=${back} onInput=${(e) => setBack(e.target.value)} /></div>
      <div class="tiny faint">L'infortunio resta finché non lo togli tu. Quando la data di rientro passa, l'app te lo ricorda. Per fare le squadre conti ${level === 'grave' ? CFG.INJ_BAD : CFG.INJ_LIGHT} punti in meno.</div>
      <div class="hs" style="gap:10px">
        <button class="btn ghost grow" type="button" onClick=${() => setOpen(false)}>Annulla</button>
        <button class="btn primary grow" type="button" disabled=${busy || !C.canWrite} onClick=${save}>${busy ? 'Salvo…' : 'Salva'}</button>
      </div>
    </div>`;
  }
  if (!inj || !inj.level) {
    return html`<div class="card hs-12">
      <span class="inj ok-dot"><${Icon} n="check" s="16" /></span>
      <div class="grow"><div class="row-t">Disponibile</div><div class="small muted">Nessun infortunio segnato.</div></div>
      ${C.canWrite && html`<button class="btn sm" onClick=${start}>Segnala infortunio</button>`}
    </div>`;
  }
  return html`<div class="card stack-8">
    <div class="hs-12">
      <${InjuryMark} inj=${inj} s="22" />
      <div class="grow">
        <div class="row-t">${inj.level === 'grave' ? 'Infortunio grave' : 'Infortunio lieve'}</div>
        <div class="small muted">${[inj.note, inj.back ? 'rientro previsto ' + fmtYmd(inj.back) : 'senza data di rientro'].filter(Boolean).join(' · ')}</div>
      </div>
    </div>
    ${C.canWrite && html`<div class="hs wrap"><button class="btn sm accent" disabled=${busy} onClick=${clear}>Sono guarito</button><button class="btn sm" onClick=${start}>Modifica</button></div>`}
  </div>`;
}

/* avviso a chi ha ancora l'infortunio dopo la data di rientro */
function OverdueNote() {
  const C = useContext(Ctx);

  const clear = async () => { if (await C.act.setInjury(null)) C.flash('Bentornato in campo!'); };
  return html`<div class="note warn">
    <${InjuryMark} inj=${inj} />
    <div class="grow stack-8">

}

function ReceivedList({ p, r }) {
  const C = useContext(Ctx);
  const rows = r.peers.slice().sort((a, b) => b.t - a.t);

  if (!rows.length) return html`<div class="card small muted">Nessuna valutazione ancora.</div>`;
  return html`<div class="card pad0 divided">${rows.map((x) => {
    const vp = C.playersById[x.voter];
    return html`<button key=${x.voter + (x.self ? '-s' : '')} class="row tap" style="padding:10px 14px" onClick=${() => C.openSheet({ k: 'ratingDetail', pid: p.id, voter: x.voter, self: !!x.self })}>

      <span class="row-main"><span class="row-t ell">${x.self ? 'Autovalutazione' : vp ? dispName(vp) : 'Ex giocatore'}</span><span class="row-s">${x.t ? fmtTs(x.t) : ''}</span></span>
      <${MiniAreas} v=${x.v} />
    </button>`;
  })}</div>`;
}

function RecentGames({ s }) {
  const C = useContext(Ctx);
  const games = ((s && s.games) || []).slice(0, 6);
  if (!games.length) return html`<div class="card small muted">Nessuna partita giocata per ora.</div>`;
  const OUT = { w: ['V', 'ok', 'vinta'], d: ['P', '', 'pareggiata'], l: ['S', 'bad', 'persa'] };
  return html`<div class="card pad0 divided">${games.map((x) => {
    const m = C.matchesById[x.mid];
    const o = OUT[x.out];
    const res = m && Engine.hasResult(m) ? (x.side === 'b' ? m.result.b + '–' + m.result.a : m.result.a + '–' + m.result.b) : '';
    const bits = [x.g && plural(x.g, 'gol', 'gol'), x.a && plural(x.a, 'assist', 'assist'), x.og && plural(x.og, 'autogol', 'autogol')].filter(Boolean);
    return html`<button key=${x.mid} class="row tap" style="padding:10px 14px" onClick=${() => m && C.go({ t: 'match', id: x.mid })}>
      <span class=${'res-chip ' + (o ? o[1] : 'none')} title=${o ? 'Partita ' + o[2] : 'Risultato non inserito'}>${o ? o[0] : '–'}</span>

    </button>`;
  })}</div>`;
}

const fmtOf = (m) => FORMATS[m.format] || FORMATS[5];
const myMvpVotes = (C) => (C.mvp.find((x) => x.id === C.uid) || {}).v || {};

function scorersText(m, C, side) {
  const res = m.result, fin = m.final || {};
  if (!res || !res.ev) return { goals: '', assists: '' };
  const team = new Set(side === 'a' ? fin.a || [] : fin.b || []);
  const other = new Set(side === 'a' ? fin.b || [] : fin.a || []);
  const g = [], a = [], og = [];
  for (const id of Object.keys(res.ev)) {
    const e = res.ev[id] || {};
    if (team.has(id)) {
      if (e.g > 0) g.push({ id, n: e.g });
      if (e.a > 0) a.push({ id, n: e.a });
    }
    if (other.has(id) && e.og > 0) og.push({ id, n: e.og });
  }
  const fmt = (arr) => arr.sort((x, y) => y.n - x.n).map((x) => nameFor(x.id, m, C) + (x.n > 1 ? ' ' + x.n : '')).join(', ');
  const goals = [fmt(g), og.length ? og.map((x) => 'aut. ' + nameFor(x.id, m, C) + (x.n > 1 ? ' ' + x.n : '')).join(', ') : ''].filter(Boolean).join(', ');
  return { goals, assists: fmt(a) };
}

/* ---------- partite: elenco ---------- */
function MatchCard({ m }) {
  const C = useContext(Ctx);
  const R = useMemo(() => buildRoster(m, C), [m, C.playersById, C.rated, C.players]);
  const phase = phaseOf(m);
  const mine = m.rsvp && m.rsvp[C.uid];
  const waitPos = R.waitlist.findIndex((x) => x.id === C.uid);
  const inConf = !!R.confirmedById[C.uid];
  const pct = Math.min(100, Math.round((R.confirmed.length / R.cap) * 100));
  const chips = [];
  const mv = C.stats.mvps[m.id];
  if (phase === 'cancelled') chips.push(html`<span class="chip bad">Annullata</span>`);
  else if (phase === 'toclose') chips.push(html`<span class="chip warn">Da chiudere</span>`);
  else if (phase === 'played') {
    if (mv && !mv.closed && (m.final.ids || []).includes(C.uid) && !myMvpVotes(C)[m.id]) chips.push(html`<span class="chip ok"><${Icon} n="trophy" s="14" /> Vota l'MVP</span>`);
    if (!Engine.hasResult(m)) chips.push(html`<span class="chip warn">Manca il risultato</span>`);
    if (mv && mv.winners.length) chips.push(html`<span class="chip"><${Icon} n="trophy" s="14" /> ${joinNames(mv.winners.map((id) => nameFor(id, m, C)))}</span>`);
    if (!chips.length) chips.push(html`<span class="chip">Giocata</span>`);
  } else if (inConf) chips.push(html`<span class="chip ok"><${Icon} n="check" s="14" /> Ci sei</span>`);
  else if (waitPos >= 0) chips.push(html`<span class="chip warn">In attesa · n° ${waitPos + 1}</span>`);
  else if (mine && mine.s === 'maybe') chips.push(html`<span class="chip warn">Forse</span>`);
  else if (mine && mine.s === 'out') chips.push(html`<span class="chip">Non ci sei</span>`);
  else chips.push(html`<span class="chip">Da rispondere</span>`);
  if (phase === 'upcoming') {
    if (R.confirmed.length > 0 && R.gk === 0) chips.push(html`<span class="chip warn">Nessun portiere</span>`);
    if (R.waitlist.length > 0) chips.push(html`<span class="chip">${R.waitlist.length} in attesa</span>`);
  }
  const hasRes = phase === 'played' && Engine.hasResult(m);
  const cnt = phase === 'played' ? plural(((m.final && m.final.ids) || []).length, 'giocatore', 'giocatori') : R.confirmed.length + '/' + R.cap;
  return html`<button class=${'card match' + (phase === 'cancelled' ? ' cancelled' : '')} onClick=${() => C.go({ t: 'match', id: m.id })}>
    <div class="m-top">
      <div class="m-when"><span class="m-day">${dayShort(m)}</span><span class="m-time">${m.time}</span></div>
      ${hasRes ? html`<span class="m-score num"><span class="ta-c">${m.result.a}</span><span class="x">–</span><span class="tb-c">${m.result.b}</span></span>` : html`<span class="m-fmt">${m.format} vs ${m.format}</span>`}
    </div>
    <div class="m-field"><${Icon} n="pin" s="16" /><span class="ell">${m.field || 'Campo da definire'}</span></div>
    ${phase !== 'cancelled' && phase !== 'played' && html`<div class="meter"><div class="bar"><i style=${'width:' + pct + '%'}></i></div><span class="cnt">${cnt}</span></div>`}
    <div class="m-foot">${chips}</div>
  </button>`;
}

/* ---------- partita giocata ---------- */
function PlayedSections({ m }) {
  const C = useContext(Ctx);
  const fin = m.final || { a: [], b: [], ids: [] };
  const finIds = fin.ids || [];
  const iPlayed = finIds.includes(C.uid);
  const canEdit = canEditPlayed(m, C);
  const hasRes = Engine.hasResult(m);
  const mv = C.stats.mvps[m.id] || Engine.mvpResult(m, C.mvp, Date.now());
  const myVote = myMvpVotes(C)[m.id];
  const myRatings = (C.ratings.find((x) => x.id === C.uid) || {}).r || {};
  const others = finIds.filter((x) => x !== C.uid && C.playersById[x]);
  const ratedN = others.filter((x) => myRatings[x] && numOr(myRatings[x].t, 0) >= numOr(m.playedAt, 0)).length;
  const sA = scorersText(m, C, 'a'), sB = scorersText(m, C, 'b');
  const lastBy = hasRes && m.result.by && C.playersById[m.result.by];
  const pred = fin.pred;
  const [showVotes, setShowVotes] = useState(false);

  return html`
    <div class="card stack">
      ${hasRes ? html`
        <div class="score">
          <div class="score-side a"><span class="chip ta">Squadra A</span><span class="score-n num">${m.result.a}</span></div>
          <span class="score-dash">–</span>
          <div class="score-side b"><span class="score-n num">${m.result.b}</span><span class="chip tb">Squadra B</span></div>
        </div>
        ${(sA.goals || sB.goals || sA.assists || sB.assists) && html`<div class="scorers">
          <div><div>${sA.goals || 'Marcatori non inseriti'}</div>${sA.assists && html`<div class="faint">Assist: ${sA.assists}</div>`}</div>
          <div><div>${sB.goals || 'Marcatori non inseriti'}</div>${sB.assists && html`<div class="faint">Assist: ${sB.assists}</div>`}</div>
        </div>`}
        <div class="tiny faint">${fmtOf(m).name} · ${m.field || 'Campo da definire'}${lastBy ? ' · ultima modifica di ' + dispName(lastBy) + ' il ' + fmtTs(m.result.t) : ''}</div>
      ` : html`
        <div class="hs-12"><${Icon} n="ball" /><div class="grow"><div class="h3">Manca il risultato</div><div class="small muted">${canEdit ? 'Scrivilo tu: marcatori e assist sono facoltativi.' : 'Ormai può inserirlo solo l\'amministratore.'}</div></div></div>
      `}
      ${canEdit && html`<button class=${'btn ' + (hasRes ? '' : 'primary')} onClick=${() => C.go({ t: 'result', id: m.id })}><${Icon} n=${hasRes ? 'edit' : 'plus'} s="16" /> ${hasRes ? 'Correggi risultato e marcatori' : 'Inserisci il risultato'}</button>`}
      ${!canEdit && hasRes && !C.isAdmin && html`<div class="tiny faint"><${Icon} n="lock" s="14" /> Dopo l'inizio della partita successiva le correzioni le fa solo l'amministratore.</div>`}
    </div>

    ${pred && html`<div class="card pred">
      <div class="pred-n num">${pred.balance}<small>%</small></div>
      <div class="grow small"><b>Equilibrio previsto dall'app.</b> ${hasRes ? (Math.abs(m.result.a - m.result.b) <= 2 ? 'Finita con ' + plural(Math.abs(m.result.a - m.result.b), 'gol', 'gol') + ' di scarto: previsione centrata.' : 'Finita con ' + Math.abs(m.result.a - m.result.b) + ' gol di scarto: più sbilanciata del previsto.') : 'Il confronto con il risultato compare appena qualcuno lo inserisce.'}</div>
    </div>`}

    <section class="sec">
      <div class="sec-h"><h2 class="h3">MVP</h2>${!mv.closed && html`<span class="chip">Si chiude tra ${fmtLeft(mv.closesAt - Date.now())}</span>`}</div>
      ${mv.closed ? (mv.winners.length ? html`<div class="stack">
          ${mv.winners.map((pid) => { const p = C.playersById[pid], r = C.rated[pid]; return p && r && html`<button key=${pid} class="plain" onClick=${() => C.go({ t: 'player', id: pid })} aria-label=${'Scheda di ' + dispName(p)}>
            <${PlayerCard} p=${p} r=${r} mvp noZoom sub=${(mv.winners.length > 1 ? 'MVP a pari merito' : 'MVP della partita') + ' · ' + plural(mv.counts[pid], 'voto', 'voti')} />
          </button>`; })}
          <button class="link" style="align-self:flex-start" onClick=${() => setShowVotes(!showVotes)}>${showVotes ? 'Nascondi i voti' : 'Chi ha votato chi (' + mv.nVoted + ')'}</button>
          ${showVotes && html`<div class="card pad0 divided">${mv.votes.map((v) => html`<div key=${v.voter} class="row" style="padding:9px 14px">
            <${Avatar} p=${C.playersById[v.voter]} size=${28} /><span class="row-main"><span class="row-t ell">${nameFor(v.voter, m, C)}</span></span>
            <span class="small muted">ha votato</span><span class="row-t">${nameFor(v.target, m, C)}</span></div>`)}</div>`}
        </div>` : html`<div class="card small muted">Nessuno ha votato l'MVP di questa partita.</div>`)
      : html`<div class=${'card stack-8' + (iPlayed && !myVote ? ' todo' : '')}>
          <div class="hs-12">
            <${Icon} n="trophy" />
            <div class="grow">
              <div class="h3">${iPlayed ? (myVote ? 'Hai votato ' + nameFor(myVote, m, C) : 'Vota il migliore in campo') : 'Votazione in corso'}</div>
              <div class="small muted">Hanno votato ${mv.nVoted} su ${mv.nEligible}. Il risultato si vede alla chiusura.</div>
            </div>
            ${iPlayed && C.canWrite && html`<button class=${'btn sm ' + (myVote ? '' : 'primary')} onClick=${() => C.go({ t: 'mvp', id: m.id })}>${myVote ? 'Cambia' : 'Vota'}</button>`}
          </div>
        </div>`}
    </section>

    ${iPlayed && C.canWrite && others.length > 0 && html`<section class="sec">
      <h2 class="h3">Valuta i compagni</h2>
      <button class="card" style="text-align:left" onClick=${() => C.go({ t: 'rateMatch', id: m.id })}>
        <div class="hs-12"><${Icon} n="star" /><div class="grow"><div class="h3">${ratedN === 0 ? 'Aggiorna le valutazioni' : 'Valutati ' + ratedN + ' su ' + others.length}</div><div class="small muted">Dopo una partita è il momento giusto per aggiornare le stats di chi hai visto giocare.</div></div><${Icon} n="chev" /></div>
      </button>
    </section>`}

    <section class="sec">
      <h2 class="h3">Squadre</h2>
      ${(fin.a || []).length + (fin.b || []).length > 0 ? html`<${FinalTeams} m=${m} />` : html`<div class="small muted">Nessuna squadra era stata salvata: puoi indicarle quando inserisci il risultato.</div>`}
    </section>`;
}

const ROLE_ORDER = { POR: 0, DIF: 1, CEN: 2, ATT: 3 };
function FinalTeams({ m }) {
  const C = useContext(Ctx);
  const fin = m.final || {};
  const roles = fin.roles || {};
  const ev = (m.result && m.result.ev) || {};
  const col = (t, ids) => {
    const rc = [0, 0, 0, 0];
    ids.forEach((id) => { const r = roles[id]; if (ROLES.includes(r)) rc[ROLE_ORDER[r]]++; });
    const sorted = ids.slice().sort((a, b) => numOr(ROLE_ORDER[roles[a]], 9) - numOr(ROLE_ORDER[roles[b]], 9));
    return html`<div class=${'team ' + t}>
      <div class="team-h"><h4>Squadra ${t.toUpperCase()}</h4><span class="cnt">${Engine.moduleLabel(rc) || plural(ids.length, 'giocatore', 'giocatori')}</span></div>
      ${sorted.map((id) => {
        const p = C.playersById[id], e = ev[id] || {};
        const bits = [e.g ? e.g + (e.g === 1 ? ' gol' : ' gol') : '', e.a ? e.a + ' ass.' : '', e.og ? e.og + ' aut.' : ''].filter(Boolean).join(' · ');
        return html`<button key=${id} class="prow" onClick=${() => p && C.go({ t: 'player', id })}>
          ${roles[id] ? html`<${RoleChip} role=${roles[id]} />` : html`<span class="role">–</span>`}
          <${Avatar} p=${p || { name: nameFor(id, m, C) }} guest=${!p} size=${30} />
          <span class="row-main"><span class="row-t ell">${nameFor(id, m, C)}</span></span>
          ${bits && html`<span class="ga">${bits}</span>`}
        </button>`;
      })}
      <div style="height:6px"></div>
    </div>`;
  };
  return html`<div class="teams">${col('a', fin.a || [])}${col('b', fin.b || [])}</div>`;
}

/* ---------- squadre: scheda interattiva con ruoli ---------- */
function TeamBoard({ m, R }) {
  const C = useContext(Ctx);
  const [sel, setSel] = useState(null);
  const [mode, setMode] = useState('bal');
  const [sug, setSug] = useState(null);
  const [over, setOver] = useState(null);
  const canEdit = C.canWrite;
  const fmt = m.format;

  const clean = (ids) => (ids || []).filter((i) => R.confirmedById[i]);
  const A = clean(m.teams && m.teams.a), B = clean(m.teams && m.teams.b);
  const placed = new Set([...A, ...B]);
  const free = R.confirmed.filter((x) => !placed.has(x.id)).map((x) => x.id);
  const P = (i) => R.confirmedById[i];
  const part = (i) => P(i).part;
  const saved = (m.teams && m.teams.roles) || {};
  const roles = useMemo(() => {
    const out = {};
    const fill = (ids) => {
      const missing = ids.some((i) => !ROLES.includes(saved[i]));
      const best = missing ? Engine.bestLineup(ids.map(part), fmt).roles : {};
      ids.forEach((i) => { out[i] = ROLES.includes(saved[i]) ? saved[i] : best[i]; });
    };
    fill(A); fill(B);
    return out;
  }, [m.teams, R]);
  const ev = Engine.evaluate(A.map(part), B.map(part), roles);
  const whereOf = (i) => (A.includes(i) ? 'a' : B.includes(i) ? 'b' : 'f');

  const save = (a, b, r) => { setSug(null); if (canEdit) C.act.saveTeams(m.id, a, b, r); else C.flash('Hai accesso in sola lettura'); };
  /* dopo uno scambio o uno spostamento l'app riassegna i ruoli di entrambe le squadre */
  const relineup = (a, b) => Object.assign({}, Engine.bestLineup(a.map(part), fmt).roles, Engine.bestLineup(b.map(part), fmt).roles);
  const swap = (x, y) => {
    const L = { a: A.slice(), b: B.slice() };
    const wx = whereOf(x), wy = whereOf(y);
    if (wx !== 'f') L[wx] = L[wx].map((v) => (v === x ? y : v));
    if (wy !== 'f') L[wy] = L[wy].map((v) => (v === y ? x : v));
    save(L.a, L.b, relineup(L.a, L.b));
  };
  const moveTo = (i, t) => {
    if (!P(i) || whereOf(i) === t) return;
    const a = A.filter((v) => v !== i), b = B.filter((v) => v !== i);
    (t === 'a' ? a : b).push(i);
    save(a, b, relineup(a, b)); setSel(null);
  };
  const setRole = (i, r) => { save(A, B, Object.assign({}, roles, { [i]: r })); };
  const tap = (i) => {
    if (sel == null) { setSel(i); return; }
    if (sel === i) { setSel(null); return; }
    if (whereOf(sel) === whereOf(i)) { setSel(i); return; }
    swap(sel, i); setSel(null);
  };
  const dropOn = (d, i) => { if (P(d) && whereOf(d) !== whereOf(i)) { swap(d, i); setSel(null); } };

  const shuffle = () => {
    const r = Engine.suggestTeams(R.confirmed.map((x) => x.part), { mode, format: fmt, current: { a: A, b: B } });
    if (r) { setSel(null); save(r.a, r.b, r.roles); }
  };
  const suggest = () => {
    if (free.length) { C.flash('Prima metti tutti i giocatori in una squadra'); return; }
    setSug(Engine.bestSwap(A.map(part), B.map(part), roles, fmt) || 'none');
  };
  const reset = () => C.openSheet({ k: 'confirm', title: 'Azzerare le squadre?', text: 'Squadre e ruoli salvati vengono cancellati. Potrai crearne di nuovi subito dopo.', label: 'Azzera', danger: true, onYes: () => { setSel(null); save([], [], {}); } });

  const full = A.length > 0 && B.length > 0;
  const rows = [
    { l: 'Valore medio', a: ev.a.mean, b: ev.b.mean },
    ...OUT_AREAS.map((k) => ({ l: Engine.AREA_BY[k].name, a: ev.a.areas[k], b: ev.b.areas[k] })),
    { l: 'In porta', a: ev.a.gkVal || 0, b: ev.b.gkVal || 0 },
  ];
  const share = (r) => (r.a + r.b > 0 ? (r.a / (r.a + r.b)) * 100 : 50);

  const PRow = (i) => {
    const x = P(i), isSel = sel === i;
    const cand = sel != null && sel !== i && whereOf(sel) !== whereOf(i);
    const r = roles[i];
    const v = r ? Engine.valueIn(x.part, r) : x.ovr;
    const out = r && r !== 'POR' && Engine.roleMalus(x.part, r);
    const inGoal = r === 'POR' && x.part.pref !== 'POR';
    return html`<div key=${i} class=${'prow' + (isSel ? ' sel' : '') + (cand ? ' cand' : '')} role="button" tabindex="0" draggable=${canEdit}
      onDragStart=${(e) => { e.dataTransfer.setData('text/plain', i); e.dataTransfer.effectAllowed = 'move'; }}
      onDragOver=${(e) => e.preventDefault()}
      onDrop=${(e) => { e.preventDefault(); e.stopPropagation(); setOver(null); dropOn(e.dataTransfer.getData('text/plain'), i); }}
      onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(i); } }}
      onClick=${() => tap(i)}>
      ${r ? html`<${RoleChip} role=${r} />` : html`<span class="role">–</span>`}
      <${Avatar} p=${x.guest ? { name: x.name } : x.p} guest=${x.guest} size=${30} />
      <span class="row-main"><span class="row-t"><span class="ell">${x.name}</span><${InjuryMark} inj=${x.inj} s="14" />${x.guest && html`<span class="chip">Ospite</span>`}</span></span>
      ${out ? html`<span class="malus" title="Fuori ruolo">−${out}</span>` : inGoal ? html`<span class="malus" title="Giocatore di movimento in porta: conta la sua Porta">porta</span>` : null}
      <span class="lvl" style="font-size:16px">${r0(v)}</span>
      ${cand && html`<span class="swp-ic"><${Icon} n="swap" s="16" /></span>`}
    </div>`;
  };

  const Col = (t) => {
    const list = (t === 'a' ? A : B).slice().sort((x, y) => numOr(ROLE_ORDER[roles[x]], 9) - numOr(ROLE_ORDER[roles[y]], 9));
    const e = t === 'a' ? ev.a : ev.b;
    return html`<div class=${'team ' + t + (over === t ? ' over' : '')}
      onDragOver=${(ev2) => { ev2.preventDefault(); setOver(t); }} onDragLeave=${() => setOver(null)}
      onDrop=${(ev2) => { ev2.preventDefault(); setOver(null); moveTo(ev2.dataTransfer.getData('text/plain'), t); }}>
      <div class="team-h">
        <h4>Squadra ${t.toUpperCase()}</h4>
        ${list.length > 0 && html`<span class="mod">${e.label}</span>`}
        <span class="cnt">${list.length} · ${r0(e.mean)}</span>
      </div>
      ${list.length > 0 && e.rc[0] === 0 && html`<div class="team-warn">Nessuno in porta</div>`}
      ${e.rc[0] > 1 && html`<div class="team-warn">${e.rc[0]} giocatori in porta</div>`}
      ${list.map(PRow)}
      ${sel != null && whereOf(sel) !== t && P(sel) && html`<button class="drop hot" onClick=${() => moveTo(sel, t)}>Sposta ${P(sel).name} qui</button>`}
      ${list.length === 0 && sel == null && html`<div class="small faint" style="padding:12px 14px">Nessun giocatore</div>`}
      <div style="height:6px"></div>
    </div>`;
  };

  const selX = sel != null && P(sel);
  return html`<div class="stack">
    <div class="card bal">
      ${full ? html`<div class="bal-top">
          <div class="bal-num num">${ev.balance}<small>%</small></div>
          <div class="bal-lab">${ev.label}<div class="small muted" style="font-weight:400">Differenza di valore medio: ${f1(Math.abs(ev.a.mean - ev.b.mean))}</div></div>
        </div>
        <div class="tug">
          <div class="hs" style="justify-content:space-between"><span class="chip ta">Squadra A</span><span class="chip tb">Squadra B</span></div>
          ${rows.map((r) => html`<div key=${r.l} class="tug-row">
            <span class="tl">${r.l}</span>
            <span class="tug-v a num">${r0(r.a)}</span>
            <div class="tug-bar"><i style=${'width:' + share(r) + '%'}></i></div>
            <span class="tug-v b num">${r0(r.b)}</span>
          </div>`)}
        </div>` : html`<div class="muted">Metti almeno un giocatore per squadra per vedere l'equilibrio.</div>`}
    </div>

    ${canEdit && html`<div class="tools">
      <${Seg} value=${mode} onChange=${setMode} options=${[{ v: 'exact', l: 'Preciso' }, { v: 'bal', l: 'Bilanciato' }, { v: 'mix', l: 'Vario' }]} />
      <button class="btn primary" onClick=${shuffle}><${Icon} n="shuffle" s="16" /> Mischia</button>
      <button class="btn" onClick=${suggest}><${Icon} n="spark" s="16" /> Migliora</button>
    </div>`}

    ${sug && sug !== 'none' && html`<div class="sug">
      <div class="swp"><b>${P(sug.a).name}</b><span class="chip ta">A</span><${Icon} n="swap" s="16" /><span class="chip tb">B</span><b>${P(sug.b).name}</b></div>
      <div class="small">${sug.after.balance > sug.before.balance ? `Con questo scambio l'equilibrio passa dal ${sug.before.balance}% al ${sug.after.balance}%.` : 'Questo scambio mette più giocatori nel loro ruolo.'} I ruoli vengono riassegnati.</div>
      <div class="hs"><button class="btn accent sm" onClick=${() => { save(A.map((v) => (v === sug.a ? sug.b : v)), B.map((v) => (v === sug.b ? sug.a : v)), sug.roles); setSel(null); }}>Applica scambio</button><button class="btn sm ghost" onClick=${() => setSug(null)}>Chiudi</button></div>
    </div>`}
    ${sug === 'none' && html`<div class="note ok"><${Icon} n="check" s="16" /><span>Con un solo scambio non si fa meglio: le squadre sono già ben bilanciate.</span></div>`}

    ${Math.abs(A.length - B.length) > 1 && html`<div class="note warn"><${Icon} n="warn" s="16" /><span>Le squadre hanno numeri diversi: ${A.length} contro ${B.length}.</span></div>`}
    ${Math.abs(A.length - B.length) === 1 && html`<div class="note"><${Icon} n="info" s="16" /><span>Una squadra ha un giocatore in meno: il confronto è sul valore medio. Con un ospite in più si pareggia.</span></div>`}
    ${free.length > 0 && html`<div class="note warn"><${Icon} n="info" s="16" /><span>La lista è cambiata: ${free.length === 1 ? 'un giocatore non è ancora in una squadra' : free.length + ' giocatori non sono ancora in una squadra'}.</span></div>`}

    ${canEdit && selX && whereOf(sel) !== 'f' && html`<div class="card selbar stack-8">
      <div class="hs"><span class="row-t grow"><span class="ell">${selX.name}</span></span><button class="link" onClick=${() => setSel(null)}>Fatto</button></div>
      <span class="label">Ruolo in questa partita</span>
      <${RolePills} small value=${roles[sel]} onChange=${(r) => setRole(sel, r)} />
      <div class="tiny faint">Oppure tocca un giocatore dell'altra squadra per scambiarli. Valore nel ruolo scelto: ${r0(Engine.valueIn(selX.part, roles[sel] || selX.part.pref))}.</div>
    </div>`}
    ${canEdit && !selX && html`<div class="tiny faint">Tocca un giocatore per cambiargli ruolo, poi uno dell'altra squadra per scambiarli. Su computer puoi anche trascinarli. Accanto al nome c'è il valore nel ruolo assegnato.</div>`}

    <div class="teams">${Col('a')}${Col('b')}</div>

    ${free.length > 0 && html`<div class="tray">
      <span class="eyebrow">Da assegnare</span>
      ${free.map(PRow)}
    </div>`}

    ${canEdit && html`<div class="hs" style="justify-content:flex-end"><button class="link" style="color:var(--ink-2)" onClick=${reset}>Azzera squadre</button></div>`}
  </div>`;
}

/* ---------- risultato, marcatori, assist, autogol ---------- */
function initResult(m) {
  const fin = (m && m.final) || {};
  const res = (m && m.result) || {};
  const all = [...new Set([...(fin.a || []), ...(fin.b || []), ...(fin.ids || []), ...Object.keys(fin.gn || {})])];
  const ev = {}, side = {};
  all.forEach((id) => {
    const e = (res.ev && res.ev[id]) || {};
    ev[id] = { g: numOr(e.g, 0), a: numOr(e.a, 0), og: numOr(e.og, 0) };
    side[id] = (fin.a || []).includes(id) ? 'a' : (fin.b || []).includes(id) ? 'b' : '';
  });
  const teamsOk = (fin.a || []).length > 0 && (fin.b || []).length > 0;
  return { ga: numOr(res.a, 0), gb: numOr(res.b, 0), ev, side, all, editTeams: !teamsOk || all.some((id) => !side[id]) };
}

function ResultScreen({ id }) {
  const C = useContext(Ctx);
  const m = C.matchesById[id];
  const [st, setSt] = useState(() => initResult(m));
  const [busy, setBusy] = useState(false);
  if (!m || m.status !== 'played') return html`<${Page} title="Risultato" onBack=${C.back}><div class="card empty">La partita non è ancora chiusa.</div><//>`;
  if (!canEditPlayed(m, C)) return html`<${Page} title="Risultato" onBack=${C.back}><div class="note"><${Icon} n="lock" s="16" /><span>La partita successiva è già iniziata: ora il risultato lo può correggere solo l'amministratore.</span></div><//>`;

  const { ev, side, all } = st;
  const setEv = (pid, k, v) => setSt((s) => ({ ...s, ev: { ...s.ev, [pid]: { ...s.ev[pid], [k]: v } } }));
  const setSide = (pid, t) => setSt((s) => ({ ...s, side: { ...s.side, [pid]: t } }));
  const sum = (t, k) => all.filter((i) => side[i] === t).reduce((n, i) => n + ev[i][k], 0);
  const assignedA = sum('a', 'g') + sum('b', 'og'), assignedB = sum('b', 'g') + sum('a', 'og');
  const errs = [];
  if (assignedA > st.ga) errs.push(`Squadra A: hai assegnato ${assignedA} gol, ma il risultato ne dice ${st.ga}.`);
  if (assignedB > st.gb) errs.push(`Squadra B: hai assegnato ${assignedB} gol, ma il risultato ne dice ${st.gb}.`);
  if (sum('a', 'a') > sum('a', 'g')) errs.push('Squadra A: ci sono più assist che gol dei suoi giocatori.');
  if (sum('b', 'a') > sum('b', 'g')) errs.push('Squadra B: ci sono più assist che gol dei suoi giocatori.');
  const noSide = all.filter((i) => !side[i]);
  if (noSide.length) errs.push(noSide.length === 1 ? 'Un giocatore non è in nessuna squadra.' : noSide.length + ' giocatori non sono in nessuna squadra.');
  const lost = all.filter((i) => !side[i] && (ev[i].g || ev[i].a || ev[i].og));

  const save = async () => {
    if (errs.length || busy) return;
    setBusy(true);
    const evOut = {};
    all.forEach((i) => { evOut[i] = { g: ev[i].g, a: ev[i].a, og: ev[i].og }; });
    const result = { a: st.ga, b: st.gb, ev: evOut, by: C.uid, t: Date.now() };
    const fin = m.final || {};
    const A = all.filter((i) => side[i] === 'a'), B = all.filter((i) => side[i] === 'b');
    let finPatch = null;
    if (A.join() !== (fin.a || []).join() || B.join() !== (fin.b || []).join()) {
      const pa = A.map((i) => partFor(i, m, C)), pb = B.map((i) => partFor(i, m, C));
      const roles = Object.assign({}, Engine.bestLineup(pa, m.format).roles, Engine.bestLineup(pb, m.format).roles);
      const e = Engine.evaluate(pa, pb, roles);
      finPatch = { a: A, b: B, roles, pred: { balance: e.balance, va: e.a.mean, vb: e.b.mean } };
    }
    const ok = await C.act.saveResult(m.id, result, finPatch);
    setBusy(false);
    if (ok) { C.flash('Risultato salvato'); C.back(); }
  };

  const Row = (pid) => {
    const p = C.playersById[pid];
    const e = ev[pid];
    return html`<div key=${pid} class="res-row">
      <div class="hs-12">
        <${Avatar} p=${p || { name: nameFor(pid, m, C) }} guest=${!p} size=${32} />
        <span class="row-main"><span class="row-t"><span class="ell">${nameFor(pid, m, C)}</span>${!p && html`<span class="chip">Ospite</span>`}</span></span>
        ${st.editTeams && html`<div class="seg mini-seg" role="group" aria-label=${'Squadra di ' + nameFor(pid, m, C)}>
          <button type="button" class=${side[pid] === 'a' ? 'on ta-on' : ''} aria-pressed=${side[pid] === 'a'} onClick=${() => setSide(pid, 'a')}>A</button>
          <button type="button" class=${side[pid] === 'b' ? 'on tb-on' : ''} aria-pressed=${side[pid] === 'b'} onClick=${() => setSide(pid, 'b')}>B</button>
        </div>`}
      </div>
      <div class="res-ctrs">
        <${Counter} label="Gol" value=${e.g} onChange=${(v) => setEv(pid, 'g', v)} />
        <${Counter} label="Assist" value=${e.a} onChange=${(v) => setEv(pid, 'a', v)} />
        <${Counter} label="Autogol" value=${e.og} onChange=${(v) => setEv(pid, 'og', v)} />
      </div>
    </div>`;
  };
  const group = (t, title) => {
    const ids = all.filter((i) => side[i] === t);
    if (!ids.length) return null;
    const assigned = t === 'a' ? assignedA : t === 'b' ? assignedB : 0;
    const goals = t === 'a' ? st.ga : st.gb;
    return html`<section class="sec" key=${'g' + t}>
      <div class="sec-h"><h2 class="h3">${title}</h2>${t && html`<span class=${'chip num ' + (assigned > goals ? 'bad' : assigned === goals ? 'ok' : '')}>${assigned} di ${goals} gol assegnati</span>`}</div>
      <div class="card pad0">${ids.map(Row)}</div>
    </section>`;
  };

  return html`<${Page} title="Risultato" sub=${dayLong(m) + ' · ' + m.format + ' vs ' + m.format} onBack=${C.back}>
    <div class="card stack">
      <div class="score-in">
        <div class="side"><span class="chip ta">Squadra A</span><span class="big num">${st.ga}</span>
          <div class="hs"><button type="button" class="step" aria-label="Squadra A: un gol in meno" disabled=${st.ga <= 0} onClick=${() => setSt((s) => ({ ...s, ga: Math.max(0, s.ga - 1) }))}><${Icon} n="minus" s="16" /></button><button type="button" class="step" aria-label="Squadra A: un gol in più" onClick=${() => setSt((s) => ({ ...s, ga: Math.min(60, s.ga + 1) }))}><${Icon} n="plus" s="16" /></button></div>
        </div>
        <span class="score-dash">–</span>
        <div class="side"><span class="chip tb">Squadra B</span><span class="big num">${st.gb}</span>
          <div class="hs"><button type="button" class="step" aria-label="Squadra B: un gol in meno" disabled=${st.gb <= 0} onClick=${() => setSt((s) => ({ ...s, gb: Math.max(0, s.gb - 1) }))}><${Icon} n="minus" s="16" /></button><button type="button" class="step" aria-label="Squadra B: un gol in più" onClick=${() => setSt((s) => ({ ...s, gb: Math.min(60, s.gb + 1) }))}><${Icon} n="plus" s="16" /></button></div>
        </div>
      </div>
      <div class="tiny faint">Marcatori, assist e autogol sono facoltativi: se non te li ricordi tutti, salva lo stesso. Un autogol conta per la squadra avversaria.</div>
    </div>

    <label class="hs" style="gap:10px;cursor:pointer"><input id="rs-teams" type="checkbox" checked=${st.editTeams} onChange=${(e) => setSt((s) => ({ ...s, editTeams: e.target.checked }))} style="width:18px;height:18px;accent-color:var(--accent)" /><span>Correggi le squadre (se qualcuno ha cambiato lato)</span></label>

    ${group('a', 'Squadra A')}
    ${group('b', 'Squadra B')}
    ${group('', 'Senza squadra')}
    ${lost.length > 0 && html`<div class="note warn"><${Icon} n="warn" s="16" /><span>Chi non è in una squadra non può avere gol o assist.</span></div>`}

    ${errs.length > 0 && html`<div class="note bad"><${Icon} n="warn" s="16" /><span>${errs.join(' ')}</span></div>`}
    <div class="sticky-act"><button class="btn primary block" disabled=${!!errs.length || busy || !C.canWrite} onClick=${save}>${busy ? 'Salvo…' : 'Salva risultato ' + st.ga + '–' + st.gb}</button></div>
  <//>`;
}

/* ---------- voto MVP ---------- */
function MvpScreen({ id }) {
  const C = useContext(Ctx);
  const m = C.matchesById[id];
  const prev = myMvpVotes(C)[id];
  const [sel, setSel] = useState(prev || null);
  const [busy, setBusy] = useState(false);
  if (!m || !m.final) return html`<${Page} title="MVP" onBack=${C.back}><div class="card empty">Partita non trovata.</div><//>`;
  const mv = Engine.mvpResult(m, C.mvp, Date.now());
  const fin = m.final;
  const iPlayed = (fin.ids || []).includes(C.uid);
  const ev = (m.result && m.result.ev) || {};
  const cands = (fin.ids || []).filter((x) => x !== C.uid && C.playersById[x]);
  const inA = (x) => (fin.a || []).includes(x), inB = (x) => (fin.b || []).includes(x);
  const groups = [
    { t: 'Squadra A', l: cands.filter(inA), c: 'ta' },
    { t: 'Squadra B', l: cands.filter(inB), c: 'tb' },
    { t: 'Altri', l: cands.filter((x) => !inA(x) && !inB(x)), c: '' },
  ];
  const save = async () => {
    if (!sel || busy) return;
    setBusy(true);
    const ok = await C.act.saveMvp(id, sel);
    setBusy(false);
    if (ok) {
      C.flash('Voto MVP salvato');
      C.back();
      C.openSheet({
        k: 'confirm', title: 'Valuti i giocatori della partita?',
        text: 'Le tue valutazioni aggiornano le stats dei compagni. Puoi farlo anche più tardi, dalla pagina della partita.',
        label: 'Valuta adesso', cancelLabel: 'Più tardi', onYes: () => C.go({ t: 'rateMatch', id }),
      });
    }
  };
  return html`<${Page} title="Vota l'MVP" sub=${dayLong(m) + ' · ' + m.format + ' vs ' + m.format} onBack=${C.back}>
    ${!iPlayed && html`<div class="note warn"><${Icon} n="warn" s="16" /><span>Votano solo i giocatori iscritti che hanno giocato questa partita.</span></div>`}
    ${mv.closed ? html`<div class="note"><${Icon} n="lock" s="16" /><span>La votazione è chiusa.</span></div>`
      : html`<div class="note"><${Icon} n="info" s="16" /><span>Un voto a testa, per un giocatore di qualsiasi squadra. Puoi cambiarlo fino alla chiusura, tra ${fmtLeft(mv.closesAt - Date.now())}. L'MVP è un premio: non cambia le stats.</span></div>`}
    ${groups.map((g) => g.l.length > 0 && html`<section class="sec" key=${g.t}>
      <h2 class="h3">${g.t}</h2>
      <div class="card pad0" role="radiogroup" aria-label=${g.t}>${g.l.map((pid) => {
        const p = C.playersById[pid], e = ev[pid] || {}, on = sel === pid;
        const bits = [e.g && plural(e.g, 'gol', 'gol'), e.a && plural(e.a, 'assist', 'assist')].filter(Boolean).join(' · ');
        return html`<button key=${pid} type="button" role="radio" aria-checked=${on} class=${'pick' + (on ? ' on' : '')} disabled=${mv.closed || !iPlayed} onClick=${() => setSel(pid)}>
          <span class="dot">${on && html`<${Icon} n="check" s="14" />`}</span>
          <${Avatar} p=${p} size=${34} />
          <span class="row-main"><span class="row-t"><span class="ell">${dispName(p)}</span><${InjuryMark} inj=${p.injury} s="14" /></span><span class="row-s">${bits || ((fin.roles && fin.roles[pid]) ? ROLE_NAME[fin.roles[pid]] : '')}</span></span>
          ${fin.roles && fin.roles[pid] && html`<${RoleChip} role=${fin.roles[pid]} />`}
        </button>`;
      })}</div>
    </section>`)}
    ${iPlayed && !mv.closed && html`<div class="sticky-act"><button class="btn primary block" disabled=${!sel || busy || !C.canWrite || sel === prev} onClick=${save}>${busy ? 'Salvo…' : !sel ? 'Scegli il migliore in campo' : sel === prev ? 'Hai già votato ' + dispName(C.playersById[sel]) : 'Vota ' + dispName(C.playersById[sel])}</button></div>`}
  <//>`;
}

/* ---------- valutare i compagni dopo la partita ---------- */
function MatchRateScreen({ id }) {
  const C = useContext(Ctx);
  const m = C.matchesById[id];
  if (!m || !m.final) return html`<${Page} title="Valuta i compagni" onBack=${C.back}><div class="card empty">Partita non trovata.</div><//>`;
  const myRatings = (C.ratings.find((x) => x.id === C.uid) || {}).r || {};
  const after = numOr(m.playedAt, 0);
  const ids = (m.final.ids || []).filter((x) => x !== C.uid && C.playersById[x]);
  const done = ids.filter((x) => myRatings[x] && numOr(myRatings[x].t, 0) >= after).length;
  return html`<${Page} title="Valuta i compagni" sub=${dayLong(m)} onBack=${C.back}>
    <div class="note"><${Icon} n="info" s="16" /><span>Le stats di ognuno sono la media delle valutazioni ricevute. Aggiorna quelle di chi hai visto giocare: puoi fermarti quando vuoi e riprendere più tardi da qui o dal loro profilo.</span></div>
    <div class="sec-h"><h2 class="h3">Giocatori della partita</h2><span class=${'chip num ' + (done === ids.length ? 'ok' : '')}>${done}/${ids.length}</span></div>
    <div class="card pad0 divided">${ids.map((pid) => {
      const p = C.playersById[pid], mr = myRatings[pid];
      const fresh = mr && numOr(mr.t, 0) >= after;
      return html`<button key=${pid} class="row tap" style="padding:10px 14px" onClick=${() => C.go({ t: 'rate', id: pid })}>
        <${Avatar} p=${p} size=${36} />
        <span class="row-main"><span class="row-t"><span class="ell">${dispName(p)}</span><${InjuryMark} inj=${p.injury} s="14" /></span><span class="row-s">${fresh ? 'Aggiornata ora' : mr ? 'Ultima valutazione: ' + fmtTs(numOr(mr.t, 0)) : 'Mai valutato da te'}</span></span>
        ${fresh ? html`<span class="chip ok"><${Icon} n="check" s="14" /> Fatto</span>` : html`<span class="chip">Valuta</span>`}
        <${Icon} n="chev" s="16" />
      </button>`;
    })}</div>
    <button class="btn ghost block" onClick=${C.back}>${done === ids.length ? 'Fatto' : 'Continuo più tardi'}</button>
  <//>`;
}

function readLS(k, d) { try { const v = window.localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
function writeLS(k, v) { try { if (v == null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); } catch (e) { /* archivio non disponibile */ } }
function applyTheme(t) {
  const el = document.documentElement;
  if (t === 'dark' || t === 'light') el.setAttribute('data-theme', t); else el.removeAttribute('data-theme');
}
const memberKey = (gid, uid) => gid + '~' + uid;
const fmtClock = (ts) => { const d = new Date(ts); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
function fmtDay(ts) {
  const d = new Date(ts); d.setHours(0, 0, 0, 0);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const k = Math.round((t - d) / 86400000);
  if (k === 0) return 'Oggi';
  if (k === 1) return 'Ieri';
  return `${cap1(DOW_FULL[d.getDay()])} ${d.getDate()} ${MON_FULL[d.getMonth()]}`;
}

/* ---------- gruppi: i miei, cerca, crea ---------- */
function GroupsScreen({ main }) {
  const C = useContext(Ctx);
  const [q, setQ] = useState('');
  const [name, setName] = useState('');
  const [city, setCity] = useState('');
  const [busy, setBusy] = useState(false);
  const status = (gid) => { const m = C.memberById[memberKey(gid, C.uid)]; return m ? m.status : null; };
  const t = q.trim().toLowerCase();
  const all = C.groups.slice().sort((a, b) => (a.city || '').localeCompare(b.city || '', 'it') || (a.name || '').localeCompare(b.name || '', 'it'));
  const found = all.filter((g) => !t || ((g.name || '') + ' ' + (g.city || '')).toLowerCase().includes(t));
  const pending = all.filter((g) => status(g.id) === 'pending');
  const ask = async (g) => { setBusy(true); const r = await C.act.rpc('request_join', { p_gid: g.id }); setBusy(false); if (r.ok) C.flash(r.data === 'active' ? 'Sei già nel gruppo' : 'Richiesta inviata agli amministratori di ' + g.name); };
  const cancel = (g) => C.openSheet({ k: 'confirm', title: 'Annullare la richiesta?', text: `La richiesta per entrare in ${g.name} viene ritirata.`, label: 'Annulla richiesta', danger: true, onYes: async () => { if ((await C.act.rpc('leave_group', { p_gid: g.id })).ok) C.flash('Richiesta annullata'); } });
  const create = async (e) => {
    e.preventDefault();
    if (busy || name.trim().length < 2 || city.trim().length < 2) return;
    setBusy(true);
    const r = await C.act.rpc('create_group', { p_name: name.trim(), p_city: city.trim() });
    setBusy(false);
    if (r.ok) { setName(''); setCity(''); C.flash('Gruppo creato: ora sei il suo amministratore'); C.switchGroup(r.data, true); }
  };
  const body = html`
    ${main && html`<div class="note ok"><${Icon} n="info" s="16" /><span>Per giocare entra in un gruppo della tua città: chiedi di entrare e un amministratore del gruppo ti accetta. Oppure crea un gruppo nuovo, e ne sarai tu l'amministratore.</span></div>`}
    ${C.myGroups.length > 0 && html`<section class="sec"><h2 class="h3">I tuoi gruppi</h2>
      <div class="card pad0 divided">${C.myGroups.map((g) => html`<button key=${g.id} class="row tap" style="padding:12px 14px" onClick=${() => C.switchGroup(g.id, true)}>
        <span class="g-ic"><${Icon} n="pitch" s="18" /></span>
        <span class="row-main"><span class="row-t ell">${g.name}</span><span class="row-s">${g.city} · ${plural(numOr(g.n, 0), 'membro', 'membri')}</span></span>
        ${g.id === C.gid ? html`<span class="chip ok">Attuale</span>` : html`<span class="chip">Apri</span>`}
      </button>`)}</div></section>`}
    ${pending.length > 0 && html`<section class="sec"><h2 class="h3">Richieste in attesa</h2>
      <div class="card pad0 divided">${pending.map((g) => html`<div key=${g.id} class="row" style="padding:12px 14px">
        <span class="g-ic"><${Icon} n="clock" s="18" /></span>
        <span class="row-main"><span class="row-t ell">${g.name}</span><span class="row-s">${g.city} · aspetta che un amministratore ti accetti</span></span>
        <button class="btn sm ghost" onClick=${() => cancel(g)}>Annulla</button>
      </div>`)}</div></section>`}
    <section class="sec"><h2 class="h3">Cerca un gruppo</h2>
      <input id="group-search" class="input" type="search" placeholder="Nome del gruppo o città" value=${q} onInput=${(e) => setQ(e.target.value)} />
      ${found.length ? html`<div class="card pad0 divided">${found.map((g) => { const st = status(g.id); return html`<div key=${g.id} class="row" style="padding:12px 14px">
        <span class="g-ic"><${Icon} n="pin" s="18" /></span>
        <span class="row-main"><span class="row-t ell">${g.name}</span><span class="row-s">${g.city} · ${plural(numOr(g.n, 0), 'membro', 'membri')}</span></span>
        ${st === 'active' ? html`<span class="chip ok">Ci sei</span>` : st === 'pending' ? html`<span class="chip warn">In attesa</span>`
          : C.canWrite && C.me && html`<button class="btn sm primary" disabled=${busy} onClick=${() => ask(g)}>Chiedi di entrare</button>`}
      </div>`; })}</div>` : html`<div class="card empty small">${C.groups.length ? 'Nessun gruppo con questo nome o città.' : 'Ancora nessun gruppo: crea il primo.'}</div>`}
    </section>
    ${C.canWrite && C.me && html`<section class="sec"><h2 class="h3">Crea un gruppo</h2>
      <form class="card stack" onSubmit=${create}>
        <div class="grid2 keep">
          <div class="field"><label class="label" for="ng-name">Nome</label><input id="ng-name" class="input" maxlength="40" placeholder="Es. Calcetto del martedì" value=${name} onInput=${(e) => setName(e.target.value)} /></div>
          <div class="field"><label class="label" for="ng-city">Città</label><input id="ng-city" class="input" maxlength="40" placeholder="Es. La Spezia" value=${city} onInput=${(e) => setCity(e.target.value)} /></div>

      </form>
    </section>`}`;
  if (main) {
    return html`<div class="page">
      <${MainHead} title="Gruppi" />
      ${body}
      ${window.SC_SIGNOUT && !C.demo && html`<button class="btn ghost block" onClick=${window.SC_SIGNOUT}>Esci dall'account</button>`}
      ${C.demo && html`<button class="btn danger block" onClick=${C.exitDemo}>Esci dalla demo</button>`}
    </div>`;
  }
  return html`<${Page} title="Gruppi" onBack=${C.back}>${body}<//>`;

/* ---------- messaggi: la chat del gruppo ---------- */
function ChatScreen() {
  const C = useContext(Ctx);
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const [sel, setSel] = useState(null);
  const endRef = useRef(null);
  const msgs = C.chat.slice().sort((a, b) => a.t - b.t);
  const lastT = msgs.length ? msgs[msgs.length - 1].t : 0;
  useEffect(() => { C.markRead(lastT); }, [lastT]);
  useEffect(() => { window.scrollTo(0, document.documentElement.scrollHeight); }, [msgs.length]);
  const send = async () => {
    const t = text.trim();
    if (!t || busy) return;
    setBusy(true);
    const ok = await C.act.sendChat(t.slice(0, 1000));
    setBusy(false);
    if (ok) setText('');
  };
  const del = (m) => C.openSheet({ k: 'confirm', title: 'Eliminare il messaggio?', danger: true, label: 'Elimina', text: 'Il messaggio sparisce per tutti.', onYes: async () => { if (await C.act.deleteChat(m.id)) C.flash('Messaggio eliminato'); } });
  let lastDay = '';
  return html`<div class="page chat-page">
    <${MainHead} title="Messaggi" />
    ${msgs.length === 0 ? html`<div class="card empty"><div class="h3">Nessun messaggio</div><div>Scrivi il primo messaggio al gruppo: lo leggono tutti i membri.</div></div>` : html`<div class="chat">
      ${msgs.map((m, i) => {
        const day = fmtDay(m.t);
        const sep = day !== lastDay ? (lastDay = day, html`<div class="chat-day" key=${'d' + m.id}>${day}</div>`) : null;
        const mine = m.by === C.uid;
        const p = C.playersById[m.by];
        const prev = msgs[i - 1];
        const cont = prev && prev.by === m.by && !sep && m.t - prev.t < 10 * 60000;
        const canDel = mine || C.isAdmin;
        return html`${sep}<div key=${m.id} class=${'msg' + (mine ? ' mine' : '') + (cont ? ' cont' : '')}>
          ${!mine && html`<span class="msg-av">${!cont && html`<${Avatar} p=${p || { id: m.by }} size=${30} />`}</span>`}
          <button type="button" class="bubble" onClick=${() => canDel && setSel(sel === m.id ? null : m.id)} aria-label=${(p ? dispName(p) : 'Ex giocatore') + ', ' + fmtClock(m.t) + ': ' + m.text}>
            ${!mine && !cont && html`<span class="msg-name">${p ? dispName(p) : 'Ex giocatore'}</span>`}
            <span class="msg-text">${m.text}</span>
            <span class="msg-time">${fmtClock(m.t)}</span>
          </button>
          ${sel === m.id && canDel && html`<button class="link msg-del" onClick=${() => { setSel(null); del(m); }}>Elimina</button>`}
        </div>`;
      })}
      <div ref=${endRef}></div>
    </div>`}
    ${C.canWrite && html`<form class="chat-input" onSubmit=${(e) => { e.preventDefault(); send(); }}>
      <textarea id="chat-text" class="input" rows="1" maxlength="1000" placeholder=${'Scrivi a ' + (C.group ? C.group.name : 'il gruppo')} value=${text}
        onInput=${(e) => { setText(e.target.value); e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; }}
        onKeyDown=${(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}></textarea>
      <button class="btn primary send" type="submit" aria-label="Invia" disabled=${!text.trim() || busy}><${Icon} n="send" /></button>
    </form>`}
  </div>`;
}

function HelpCard({ h, admin }) {
  const C = useContext(Ctx);
  const [reply, setReply] = useState('');
  const [busy, setBusy] = useState(false);
  const p = C.playersById[h.by];
  const replies = Array.isArray(h.replies) ? h.replies : [];
  const answer = async (status) => {
    setBusy(true);
    const next = reply.trim() ? replies.concat([{ by: C.uid, text: reply.trim().slice(0, 1500), t: Date.now() }]) : replies;
    const ok = await C.act.answerHelp(h.id, next, status);
    setBusy(false);
    if (ok) { setReply(''); C.flash(status === 'done' ? 'Segnato come risolto' : 'Risposta inviata'); }
  };
  return html`<div class="card stack-8">
    <div class="hs">
      ${admin && html`<${Avatar} p=${p || { id: h.by }} size=${28} />`}
      <span class="row-t grow"><span class="ell">${admin ? (p ? dispName(p) + ' · ' : '') + (h.topic || 'Help') : h.topic || 'Help'}</span></span>
      <span class=${'chip ' + (h.status === 'done' ? 'ok' : 'warn')}>${h.status === 'done' ? 'Risolto' : 'Aperto'}</span>
    </div>
    <div class="small">${h.text}</div>
    <div class="tiny faint">${fmtTs(h.t)}${admin && p ? ' · ' + fullName(p) : ''}</div>
    ${replies.map((r, i) => { const rp = C.playersById[r.by]; return html`<div key=${i} class="reply"><b>${rp ? dispName(rp) : 'Sviluppatori'}:</b> ${r.text}<div class="tiny faint">${fmtTs(r.t)}</div></div>`; })}
    ${admin && html`<div class="stack-8">
      <textarea class="input" id=${'hr-' + h.id} rows="2" maxlength="1500" placeholder="Rispondi" value=${reply} onInput=${(e) => setReply(e.target.value)}></textarea>
      <div class="hs wrap">
        <button class="btn sm primary" disabled=${busy || !reply.trim()} onClick=${() => answer(h.status === 'done' ? 'done' : 'open')}>Rispondi</button>

      </div>
    </div>`}
  </div>`;
}

    mv && mv.winners.length ? 'MVP ' + joinNames(mv.winners.map((id) => nameFor(id, m, C))) : mv && !mv.closed ? 'MVP: votazione in corso' : '',
    m.final && m.final.pred ? 'previsto ' + m.final.pred.balance + '%' : '',

function Leaderboard() {
  const C = useContext(Ctx);
  const [k, setK] = useState('g');
  const met = METRICS.find((x) => x.k === k);
  const rows = C.players
    .map((p) => ({ p, s: C.stats.byPlayer[p.id] }))
    .filter((x) => x.s && x.s[k] > 0)
    .sort((x, y) => y.s[k] - x.s[k] || x.s.pres - y.s.pres || dispName(x.p).localeCompare(dispName(y.p), 'it'));
  let pos = 0, prev = null;
  return html`<div class="stack">
    <div class="seg-scroll"><${Seg} value=${k} onChange=${setK} options=${METRICS.map((x) => ({ v: x.k, l: x.l }))} /></div>
    ${rows.length ? html`<div class="card pad0">${rows.map((x, i) => {
      if (x.s[k] !== prev) { pos = i + 1; prev = x.s[k]; }
      const sub = k === 'pres'
        ? `vinte ${x.s.w}, pari ${x.s.d}, perse ${x.s.l}`
        : `in ${plural(x.s.pres, 'presenza', 'presenze')}${(k === 'g' || k === 'a') && x.s.pres ? ' · ' + f1(x.s[k] / x.s.pres) + ' a partita' : ''}`;
      return html`<button key=${x.p.id} class="lead" onClick=${() => C.go({ t: 'player', id: x.p.id })}>
        <span class=${'lead-pos' + (pos <= 3 ? ' p' + pos : '')}>${pos}</span>
        <${Avatar} p=${x.p} size=${36} />
        <span class="row-main"><span class="row-t"><span class="ell">${dispName(x.p)}</span><${InjuryMark} inj=${x.p.injury} s="14" />${x.p.id === C.uid && html`<span class="chip ok">Tu</span>`}</span><span class="row-s">${sub}</span></span>
        <span class="lead-v num">${x.s[k]}</span>

    <div class="tiny faint">Contano le partite chiuse. Gol, assist e autogol solo dove sono stati inseriti; l'MVP quando la votazione è chiusa.</div>

function MatchFormSheet({ editId, onClose }) {
  const C = useContext(Ctx);
  const ex = editId ? C.matchesById[editId] : null;
  const recent = C.matches.slice().sort((a, b) => numOr(b.created, 0) - numOr(a.created, 0));
  const lastM = recent[0];
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  const [date, setDate] = useState(ex ? ex.date : toYmd(tomorrow));
  const [time, setTime] = useState(ex ? ex.time : (lastM && lastM.time) || '21:00');
  const [field, setField] = useState(ex ? ex.field || '' : (lastM && lastM.field) || '');
  const [fid, setFid] = useState(ex ? ex.fid || '' : (lastM && lastM.fid) || '');
  const [adding, setAdding] = useState(false);
  const [nf, setNf] = useState({ name: '', zone: 'La Spezia', address: '', phone: '' });
  const [format, setFormat] = useState(ex ? ex.format : (lastM && lastM.format) || 7);
  const [note, setNote] = useState(ex ? ex.note || '' : '');
  const [join, setJoin] = useState(true);
  const [busy, setBusy] = useState(false);
  const known = new Set(C.allFields.map((f) => f.name.toLowerCase()));
  const fields = [...new Set(recent.map((m) => m.field).filter((n) => n && !known.has(n.toLowerCase())))].slice(0, 4);
  const zones = [...FIELD_ZONES, ...new Set(C.allFields.map((f) => f.zone).filter((z) => z && !FIELD_ZONES.includes(z)))].filter((z) => C.allFields.some((f) => f.zone === z));
  const valid = date && time;
  const pick = (f) => { setField(f.name); setFid(f.id); };
  const addField = async () => {
    if (!nf.name.trim() || busy) return;
    const id = 'f_' + uid8();
    const rec = { name: nf.name.trim().slice(0, 60), zone: (nf.zone || '').trim().slice(0, 30) || 'Altro', area: '', address: nf.address.trim().slice(0, 100), phone: nf.phone.trim().slice(0, 25), by: C.uid, created: Date.now() };
    if (await C.act.saveField(id, rec)) { setField(rec.name); setFid(id); setAdding(false); setNf({ name: '', zone: nf.zone, address: '', phone: '' }); C.flash('Campo aggiunto per tutto il gruppo'); }
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!valid || busy) return;
    setBusy(true);
    if (ex) {
      const ok = await C.act.updateMatch(ex.id, { date, time, field: field.trim(), fid: fid || '', format, note: note.trim() });
      setBusy(false);
      if (ok) { C.flash('Partita aggiornata'); onClose(); }
    } else {
      const mid = 'm_' + uid8();
      const doc = {
        date, time, field: field.trim(), ...(fid ? { fid } : {}), format, note: note.trim(), status: 'open', by: C.uid, created: Date.now(),
        rsvp: join && C.me ? { [C.uid]: { s: 'in', t: Date.now() } } : {}, guests: {}, teams: { a: [], b: [], roles: {} },
      };
      const ok = await C.act.createMatch(doc, mid);
      setBusy(false);
      if (ok) { onClose(); C.go({ t: 'match', id: mid }); C.flash('Partita creata'); }
    }
  };

  return html`<${Sheet} title=${ex ? 'Modifica partita' : 'Nuova partita'} onClose=${onClose}>
    <form class="stack" onSubmit=${submit}>
      <div class="grid2 keep">
        <div class="field"><label class="label" for="mf-date">Giorno</label><input id="mf-date" class="input" type="date" value=${date} onInput=${(e) => setDate(e.target.value)} /></div>
        <div class="field"><label class="label" for="mf-time">Ora</label><input id="mf-time" class="input" type="time" value=${time} onInput=${(e) => setTime(e.target.value)} /></div>
      </div>
      <div class="field">
        <label class="label" for="mf-field">Campo</label>
        <input id="mf-field" class="input" value=${field} maxlength="60" placeholder="Scegli un campo o scrivi il nome" onInput=${(e) => { setField(e.target.value); setFid(''); }} />
        ${zones.map((z) => html`<div key=${z} class="fz"><div class="tiny faint fz-t">${z}</div><div class="hs wrap">${C.allFields.filter((f) => f.zone === z).map((f) => html`<button key=${f.id} type="button" class=${'chip' + (f.id === fid ? ' ok' : '')} style="border:0;cursor:pointer" onClick=${() => pick(f)}>${f.name.replace(/^(Centro Sportivo|Campo) /, '')}</button>`)}</div></div>`)}
        ${fields.length > 0 && html`<div class="fz-t tiny faint" style="margin-top:4px">USATI DI RECENTE</div><div class="hs wrap">${fields.map((f) => html`<button key=${f} type="button" class=${'chip' + (f === field && !fid ? ' ok' : '')} style="border:0;cursor:pointer" onClick=${() => { setField(f); setFid(''); }}>${f}</button>`)}</div>`}
        <button type="button" class="link" style="align-self:flex-start" onClick=${() => setAdding(!adding)}>${adding ? 'Annulla' : '+ Aggiungi un campo alla lista'}</button>
        ${adding && html`<div class="card stack-8">
          <input class="input" id="nf-name" aria-label="Nome del campo" placeholder="Nome del campo" maxlength="60" value=${nf.name} onInput=${(e) => setNf({ ...nf, name: e.target.value })} />
          <input class="input" id="nf-zone" aria-label="Zona" list="zone-list" placeholder="Zona (es. La Spezia, Sarzana)" maxlength="30" value=${nf.zone} onInput=${(e) => setNf({ ...nf, zone: e.target.value })} />
          <datalist id="zone-list">${zones.map((z) => html`<option key=${z} value=${z}></option>`)}</datalist>
          <input class="input" id="nf-address" aria-label="Indirizzo" placeholder="Indirizzo (facoltativo)" maxlength="100" value=${nf.address} onInput=${(e) => setNf({ ...nf, address: e.target.value })} />
          <input class="input" id="nf-phone" aria-label="Telefono" type="tel" placeholder="Telefono (facoltativo)" maxlength="25" value=${nf.phone} onInput=${(e) => setNf({ ...nf, phone: e.target.value })} />
          <button type="button" class="btn accent sm" disabled=${!nf.name.trim()} onClick=${addField}>Salva campo per tutti</button>
        </div>`}
      </div>
      <div class="field">
        <span class="label">Formato</span>
        <${Seg} value=${format} onChange=${setFormat} options=${[{ v: 5, l: 'Calcio a 5' }, { v: 7, l: 'Calcio a 7' }, { v: 8, l: 'Calcio a 8' }]} />
        <div class="tiny faint">${FORMATS[format].cap} giocatori: ${format} contro ${format}. Moduli: ${Engine.MODULES[format].map((x) => Engine.moduleLabel(x)).join(', ')}. Gli iscritti oltre il numero finiscono in lista d'attesa.</div>
      </div>
      <div class="field"><label class="label" for="mf-note">Nota <span class="faint">(facoltativa)</span></label><textarea id="mf-note" class="input" rows="2" maxlength="200" placeholder="Es. portate maglia chiara e scura" value=${note} onInput=${(e) => setNote(e.target.value)}></textarea></div>
      ${!ex && C.me && html`<label class="hs" style="gap:10px;cursor:pointer"><input id="mf-join" type="checkbox" checked=${join} onChange=${(e) => setJoin(e.target.checked)} style="width:18px;height:18px;accent-color:var(--accent)" /><span>Ci sono anch'io</span></label>`}
      <button class="btn primary block" type="submit" disabled=${!valid || busy}>${busy ? 'Salvo…' : ex ? 'Salva modifiche' : 'Crea partita'}</button>
    </form>
  <//>`;
}

function MatchMenuSheet({ id, onClose }) {
  const C = useContext(Ctx);

  if (!m) return null;
  const phase = phaseOf(m);
  const editPlayed = phase === 'played' && canEditPlayed(m, C);
  const item = (icon, label, fn, cls) => html`<button class=${'btn block ' + (cls || '')} style="justify-content:flex-start" onClick=${fn}><${Icon} n=${icon} s="16" /> ${label}</button>`;
  return html`<${Sheet} title="Partita" onClose=${onClose}>
    <div class="stack-8">
      ${(phase === 'upcoming' || phase === 'toclose') && item('edit', 'Modifica giorno, ora e campo', () => C.openSheet({ k: 'editMatch', id }))}
      ${(phase === 'upcoming' || phase === 'toclose') && item('x', 'Annulla la partita', () => C.openSheet({ k: 'confirm', title: 'Annullare la partita?', text: 'Resterà nello storico come annullata e nessuno potrà più rispondere.', label: 'Annulla partita', danger: true, onYes: () => C.act.setStatus(id, 'cancelled') }), 'danger')}
      ${phase === 'cancelled' && item('check', 'Riapri la partita', () => { C.act.setStatus(id, 'open'); onClose(); })}
